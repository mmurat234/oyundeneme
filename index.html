<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miho'nun Yumurta Toplama Oyunu</title>
<style>
  body {
    margin: 0;
    background: #1e2a38;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: sans-serif;
    color: #fff;
    touch-action: none;
  }
  h1 { font-size: 20px; margin: 10px 0; }
  canvas {
    background: linear-gradient(#8fd3ff, #e6f7ff);
    border-radius: 8px;
    max-width: 100vw;
  }
  p { font-size: 14px; opacity: 0.8; }
</style>
</head>
<body>
<h1>🧺 Miho'nun Yumurta Toplama Oyunu</h1>
<canvas id="oyun" width="480" height="640"></canvas>
<p>A / D veya ← / → ile hareket et. Dokunmatik ekranda parmağını kaydır. Boşluk: yeniden başla.</p>

<script>
const canvas = document.getElementById("oyun");
const ctx = canvas.getContext("2d");
const W = canvas.width;
const H = canvas.height;

// Yumurta türleri (Egg.cs ile aynı puanlar)
const TURLER = {
  normal:   { renk: "#ffffff", puan: 10 },
  altin:    { renk: "#ffd700", puan: 25 },
  ozel:     { renk: "#ff8000", puan: 50 },
  gokkusagi:{ renk: "#ff00ff", puan: 100 }
};

let oyuncu, yumurtalar, skor, seviye, seviyedeToplanan, gerekenSayi;
let can, uretimAraligi, uretimSayaci, oyunBitti, tuslar = {};

function baslat() {
  oyuncu = { x: W / 2 - 40, y: H - 50, g: 80, y2: 24, hiz: 360 };
  yumurtalar = [];
  skor = 0;
  seviye = 1;
  seviyedeToplanan = 0;
  gerekenSayi = 5;
  can = 3;
  uretimAraligi = 1.5;
  uretimSayaci = 0;
  oyunBitti = false;
}

function turSec() {
  const r = Math.random();
  if (seviye >= 4 && r < 0.2) return "gokkusagi";
  if (seviye >= 3 && r < 0.25) return "ozel";
  if (seviye >= 2 && r < 0.3) return "altin";
  return "normal";
}

function yumurtaUret() {
  yumurtalar.push({
    x: 20 + Math.random() * (W - 40),
    y: -20,
    r: 14,
    tur: turSec(),
    hiz: 120 + seviye * 25
  });
}

function puanEkle(p) {
  skor += p;
  seviyedeToplanan++;
  if (seviyedeToplanan >= gerekenSayi) {
    seviye++;
    seviyedeToplanan = 0;
    gerekenSayi += 2;
    uretimAraligi = Math.max(uretimAraligi - 0.15, 0.3);
  }
}

function guncelle(dt) {
  if (oyunBitti) return;

  // Hareket
  let yon = 0;
  if (tuslar["a"] || tuslar["arrowleft"]) yon = -1;
  if (tuslar["d"] || tuslar["arrowright"]) yon = 1;
  oyuncu.x += yon * oyuncu.hiz * dt;
  oyuncu.x = Math.max(0, Math.min(W - oyuncu.g, oyuncu.x));

  // Yumurta üretimi
  uretimSayaci -= dt;
  if (uretimSayaci <= 0) {
    yumurtaUret();
    uretimSayaci = uretimAraligi;
  }

  // Yumurtaları hareket ettir, çarpışma kontrol et
  for (let i = yumurtalar.length - 1; i >= 0; i--) {
    const e = yumurtalar[i];
    e.y += e.hiz * dt;

    const sepeteDustu =
      e.y + e.r >= oyuncu.y &&
      e.y - e.r <= oyuncu.y + oyuncu.y2 &&
      e.x >= oyuncu.x && e.x <= oyuncu.x + oyuncu.g;

    if (sepeteDustu) {
      puanEkle(TURLER[e.tur].puan);
      yumurtalar.splice(i, 1);
    } else if (e.y - e.r > H) {
      yumurtalar.splice(i, 1);
      can--;
      if (can <= 0) oyunBitti = true;
    }
  }
}

function ciz() {
  ctx.clearRect(0, 0, W, H);

  // Zemin
  ctx.fillStyle = "#6bbf59";
  ctx.fillRect(0, H - 20, W, 20);

  // Yumurtalar (oval)
  for (const e of yumurtalar) {
    ctx.fillStyle = TURLER[e.tur].renk;
    ctx.strokeStyle = "#555";
    ctx.beginPath();
    ctx.ellipse(e.x, e.y, e.r * 0.8, e.r, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }

  // Sepet (Miho)
  ctx.fillStyle = "#a0522d";
  ctx.fillRect(oyuncu.x, oyuncu.y, oyuncu.g, oyuncu.y2);
  ctx.strokeStyle = "#5c2e0e";
  ctx.lineWidth = 2;
  for (let k = 10; k < oyuncu.g; k += 14) {
    ctx.beginPath();
    ctx.moveTo(oyuncu.x + k, oyuncu.y);
    ctx.lineTo(oyuncu.x + k, oyuncu.y + oyuncu.y2);
    ctx.stroke();
  }
  ctx.lineWidth = 1;

  // Arayüz
  ctx.fillStyle = "#1e2a38";
  ctx.font = "bold 18px sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("Skor: " + skor, 10, 26);
  ctx.fillText("Seviye: " + seviye + " (" + seviyedeToplanan + "/" + gerekenSayi + ")", 10, 50);
  ctx.textAlign = "right";
  ctx.fillText("Can: " + "❤️".repeat(can), W - 10, 26);

  if (oyunBitti) {
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.font = "bold 36px sans-serif";
    ctx.fillText("OYUN BİTTİ", W / 2, H / 2 - 20);
    ctx.font = "20px sans-serif";
    ctx.fillText("Skor: " + skor + "  •  Seviye: " + seviye, W / 2, H / 2 + 15);
    ctx.fillText("Yeniden başlamak için Boşluk / dokun", W / 2, H / 2 + 50);
  }
}

// Kontroller
document.addEventListener("keydown", e => {
  tuslar[e.key.toLowerCase()] = true;
  if (e.code === "Space") {
    e.preventDefault();
    if (oyunBitti) baslat();
  }
});
document.addEventListener("keyup", e => { tuslar[e.key.toLowerCase()] = false; });

// Dokunmatik / fare ile sürükleme
function isaretciyeGit(clientX) {
  const rect = canvas.getBoundingClientRect();
  const x = (clientX - rect.left) * (W / rect.width);
  oyuncu.x = Math.max(0, Math.min(W - oyuncu.g, x - oyuncu.g / 2));
}
canvas.addEventListener("pointerdown", e => {
  if (oyunBitti) { baslat(); return; }
  isaretciyeGit(e.clientX);
});
canvas.addEventListener("pointermove", e => {
  if (e.buttons || e.pointerType === "touch") isaretciyeGit(e.clientX);
});

// Oyun döngüsü
let sonZaman = performance.now();
function dongu(simdi) {
  const dt = Math.min((simdi - sonZaman) / 1000, 0.05);
  sonZaman = simdi;
  guncelle(dt);
  ciz();
  requestAnimationFrame(dongu);
}

baslat();
requestAnimationFrame(dongu);
</script>
</body>
</html>
