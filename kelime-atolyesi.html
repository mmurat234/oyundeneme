<title>YÖKDİL Kelime Atölyesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root {
    --zemin: #edf0f5;
    --yuzey: #ffffff;
    --yuzey2: #f4f6fa;
    --murekkep: #182031;
    --soluk: #5a6378;
    --cizgi: #d8dde7;
    --vurgu: #2945c4;
    --vurgu-yazi: #ffffff;
    --vurgu-acik: #e5eafb;
    --amber: #b7791f;
    --amber-acik: #fbf0da;
    --dogru: #1c7f52;
    --dogru-acik: #dff3e8;
    --yanlis: #b83a33;
    --yanlis-acik: #f8e1df;
    --golge: 0 1px 2px rgba(24, 32, 49, .06), 0 10px 28px rgba(24, 32, 49, .07);
    --serif: "Newsreader", Georgia, "Noto Serif", serif;
    --sans: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "Roboto Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --zemin: #0f121a; --yuzey: #171b26; --yuzey2: #1d2230; --murekkep: #e8ebf3; --soluk: #9aa2b8;
      --cizgi: #2b3142; --vurgu: #8ea2ff; --vurgu-yazi: #0e1330; --vurgu-acik: #232b4b;
      --amber: #f0bd5e; --amber-acik: #3a2e17; --dogru: #5fd39a; --dogru-acik: #16332a;
      --yanlis: #ff8a80; --yanlis-acik: #3b1e1e; --golge: 0 1px 2px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --zemin: #0f121a; --yuzey: #171b26; --yuzey2: #1d2230; --murekkep: #e8ebf3; --soluk: #9aa2b8;
    --cizgi: #2b3142; --vurgu: #8ea2ff; --vurgu-yazi: #0e1330; --vurgu-acik: #232b4b;
    --amber: #f0bd5e; --amber-acik: #3a2e17; --dogru: #5fd39a; --dogru-acik: #16332a;
    --yanlis: #ff8a80; --yanlis-acik: #3b1e1e; --golge: 0 1px 2px rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--zemin);
    color: var(--murekkep);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--vurgu); outline-offset: 2px; }

  .ust {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: color-mix(in srgb, var(--zemin) 88%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--cizgi);
  }
  .ust-ic { max-width: 760px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  .marka { font-family: var(--serif); font-weight: 600; font-size: 20px; line-height: 1.1; }
  .marka small { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--soluk); font-weight: 500; }
  .ust .seri { margin-left: auto; display: flex; align-items: center; gap: 6px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--amber); background: var(--amber-acik); padding: 4px 10px; border-radius: 99px; font-size: 14px; }
  .ikon-btn { border: 1px solid var(--cizgi); background: var(--yuzey); border-radius: 10px; width: 38px; height: 38px; cursor: pointer; display: grid; place-items: center; }
  .ikon-btn svg { width: 18px; height: 18px; }

  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 110px; display: flex; flex-direction: column; gap: 16px; }

  .alt-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    background: var(--yuzey); border-top: 1px solid var(--cizgi);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .alt-bar nav { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
  .alt-bar button {
    border: 0; background: transparent; cursor: pointer; padding: 9px 4px 10px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 12px; font-weight: 600; color: var(--soluk);
  }
  .alt-bar button svg { width: 22px; height: 22px; }
  .alt-bar button[aria-current="page"] { color: var(--vurgu); }

  .kart { background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 16px; box-shadow: var(--golge); padding: 22px; }
  @media (max-width: 480px) { .kart { padding: 18px; } }
  .etiket { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--soluk); }
  h2 { font-family: var(--serif); font-weight: 600; font-size: 24px; line-height: 1.2; margin: 0; text-wrap: balance; }
  .ikincil { color: var(--soluk); font-size: 14px; margin: 0; }

  .btn {
    font-weight: 700; font-size: 15px; border-radius: 12px; padding: 12px 18px; cursor: pointer;
    border: 1px solid var(--cizgi); background: var(--yuzey); color: var(--murekkep);
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn.ana { background: var(--vurgu); color: var(--vurgu-yazi); border-color: var(--vurgu); }
  .btn.genis { width: 100%; }
  .btn:disabled { opacity: .5; cursor: default; }
  .satir { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  /* Bugün */
  .hero { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; }
  .halka { position: relative; width: 112px; height: 112px; }
  .halka svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .halka .ortasi { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.1; }
  .halka .ortasi b { font-size: 26px; font-variant-numeric: tabular-nums; }
  .halka .ortasi span { font-size: 11px; color: var(--soluk); }
  .sayilar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--cizgi); border: 1px solid var(--cizgi); border-radius: 14px; overflow: hidden; }
  .sayilar div { background: var(--yuzey); padding: 14px 12px; }
  .sayilar b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .sayilar span { font-size: 12px; color: var(--soluk); }
  .ilerleme-cubuk { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--yuzey2); }
  .ilerleme-cubuk i { display: block; height: 100%; }
  .aciklama { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--soluk); margin-top: 8px; }
  .aciklama span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; background: var(--r); }
  .hafta { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 96px; margin-top: 12px; }
  .hafta div { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
  .hafta i { display: block; width: 100%; max-width: 28px; border-radius: 6px 6px 2px 2px; background: var(--vurgu); min-height: 3px; }
  .hafta i.bos { background: var(--cizgi); }
  .hafta span { font-size: 11px; color: var(--soluk); font-variant-numeric: tabular-nums; }
  .cipler { display: flex; flex-wrap: wrap; gap: 6px; }
  .cip { border: 1px solid var(--cizgi); background: var(--yuzey2); border-radius: 99px; padding: 5px 11px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .cip[aria-pressed="true"] { background: var(--vurgu); color: var(--vurgu-yazi); border-color: var(--vurgu); }

  /* Kelime kartı */
  .madde-bas { display: flex; align-items: flex-start; gap: 10px; }
  .kelime { font-family: var(--serif); font-weight: 600; font-size: clamp(36px, 10vw, 52px); line-height: 1; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .madde-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .rozet { font-family: var(--mono); font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 99px; background: var(--vurgu-acik); color: var(--vurgu); }
  .rozet.amber { background: var(--amber-acik); color: var(--amber); }
  .rozet.yesil { background: var(--dogru-acik); color: var(--dogru); }
  .madde-bas .araclar { margin-left: auto; display: flex; gap: 6px; }
  .yildiz[aria-pressed="true"] svg { fill: var(--amber); stroke: var(--amber); }
  .bolumler { display: grid; gap: 16px; margin-top: 20px; }
  .bolumler p { margin: 4px 0 0; }
  .tr { font-size: 18px; font-weight: 700; }
  .tanim { font-family: var(--serif); font-size: 19px; line-height: 1.4; }
  .ornek { font-family: var(--serif); font-style: italic; font-size: 18px; line-height: 1.45; border-left: 3px solid var(--vurgu); padding-left: 12px; }
  .ornek b { font-style: normal; color: var(--vurgu); }
  .aile { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .aile span { background: var(--yuzey2); border: 1px solid var(--cizgi); border-radius: 8px; padding: 3px 9px; font-size: 14px; }
  .aile span em { font-style: normal; color: var(--soluk); font-size: 12px; margin-left: 4px; }
  .gizli { position: relative; }
  .perde {
    position: absolute; inset: -4px; border-radius: 12px; cursor: pointer;
    background: var(--yuzey2); border: 1px dashed var(--cizgi);
    display: grid; place-items: center; color: var(--soluk); font-weight: 600; font-size: 14px;
  }
  .puanla { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 22px; }
  .puanla .btn { flex-direction: column; gap: 0; padding: 10px 6px; }
  .puanla .btn small { font-weight: 500; font-size: 11px; opacity: .8; }
  .puanla .tekrar { color: var(--yanlis); }
  .puanla .zor { color: var(--amber); }
  .oturum-ust { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .cubuk { height: 5px; background: var(--yuzey2); border-radius: 5px; overflow: hidden; margin-top: 8px; }
  .cubuk span { display: block; height: 100%; background: var(--vurgu); transition: width .3s; }
  .ai-ornekler { margin-top: 8px; display: grid; gap: 6px; }
  .ai-ornekler p { font-family: var(--serif); font-style: italic; font-size: 16px; margin: 0; }
  .ai-ornekler p b { font-style: normal; color: var(--vurgu); }

  /* Test */
  .mod-liste { display: grid; gap: 10px; }
  .mod {
    text-align: left; border: 1px solid var(--cizgi); background: var(--yuzey); border-radius: 14px; padding: 14px 16px; cursor: pointer;
    display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center;
  }
  .mod[aria-pressed="true"] { border-color: var(--vurgu); box-shadow: 0 0 0 1px var(--vurgu); }
  .mod b { font-size: 15px; }
  .mod span { font-size: 13px; color: var(--soluk); grid-column: 1; }
  .mod i { grid-row: 1 / span 2; grid-column: 2; font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--vurgu); }
  .soru { font-family: var(--serif); font-size: 21px; line-height: 1.45; margin: 16px 0 18px; }
  .soru .bosluk { display: inline-block; min-width: 88px; border-bottom: 2px solid var(--vurgu); }
  .soru .anahtar { font-weight: 600; font-style: normal; color: var(--vurgu); }
  .secenekler { display: grid; gap: 8px; }
  .secenek {
    text-align: left; font-size: 16px; font-weight: 500; padding: 12px 14px; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--cizgi); background: var(--yuzey2); display: flex; gap: 12px; align-items: baseline;
  }
  .secenek .harf { font-family: var(--mono); font-size: 12px; color: var(--soluk); min-width: 14px; }
  .secenek:hover:not(:disabled) { border-color: var(--vurgu); }
  .secenek:disabled { cursor: default; }
  .secenek.dogru { background: var(--dogru-acik); border-color: var(--dogru); color: var(--dogru); }
  .secenek.yanlis { background: var(--yanlis-acik); border-color: var(--yanlis); color: var(--yanlis); }
  .geri { margin-top: 14px; font-size: 14px; }
  .skor { font-family: var(--serif); font-size: 64px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }

  /* Derinleş */
  .merdiven { display: grid; gap: 10px; margin-top: 12px; }
  .basamak { display: grid; grid-template-columns: 28px 1fr 44px; gap: 4px 12px; align-items: center; }
  .basamak .no { grid-row: 1 / span 2; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-size: 12px; background: var(--yuzey2); border: 1px solid var(--cizgi); color: var(--soluk); }
  .basamak.dolu .no { background: var(--vurgu); border-color: var(--vurgu); color: var(--vurgu-yazi); }
  .basamak .ad { font-size: 14px; font-weight: 700; line-height: 1.2; }
  .basamak .ad span { font-weight: 500; color: var(--soluk); font-size: 12px; margin-left: 6px; }
  .basamak .say { grid-row: 1 / span 2; grid-column: 3; text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
  .basamak .bar { height: 6px; border-radius: 6px; background: var(--yuzey2); overflow: hidden; }
  .basamak .bar i { display: block; height: 100%; background: var(--vurgu); border-radius: 6px; }
  .parcalar { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; margin-top: 8px; }
  .parca { border: 1px solid var(--cizgi); background: var(--yuzey2); border-radius: 10px; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; }
  .parca b { font-family: var(--serif); font-size: 21px; font-weight: 600; color: var(--vurgu); line-height: 1.1; }
  .parca span { font-size: 12px; color: var(--soluk); max-width: 160px; }
  .parca-arti { align-self: center; color: var(--soluk); font-weight: 700; }
  .imge { font-family: var(--serif); font-style: italic; font-size: clamp(20px, 5.4vw, 25px); line-height: 1.35; text-wrap: balance; margin: 0; }
  .hikaye { font-family: var(--serif); font-size: 18px; line-height: 1.62; margin: 0; }
  .kutu-not { font-size: 14px; border-radius: 10px; padding: 10px 12px; background: var(--yuzey2); border: 1px solid var(--cizgi); }
  .kutu-not.uyari { background: var(--amber-acik); border-color: transparent; color: var(--murekkep); }
  .kutu-not > b:first-child { display: block; font-size: 11px; font-family: var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--soluk); margin-bottom: 2px; font-weight: 500; }
  .adimlar { display: flex; gap: 6px; margin-top: 8px; }
  .adimlar i { flex: 1; height: 4px; border-radius: 4px; background: var(--cizgi); }
  .adimlar i.tam { background: var(--vurgu); }
  textarea { width: 100%; min-height: 110px; font: inherit; font-size: 16px; line-height: 1.5; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--cizgi); background: var(--yuzey); color: var(--murekkep); resize: vertical; }
  .kontrol { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; padding: 6px 0; cursor: pointer; }
  .kontrol input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--vurgu); }
  .senin { font-family: var(--serif); font-size: 18px; line-height: 1.5; margin: 4px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--vurgu-acik); }
  .senin b { color: var(--vurgu); }
  .kok-izgara { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
  .kok-btn { text-align: left; border: 1px solid var(--cizgi); background: var(--yuzey2); border-radius: 12px; padding: 10px 12px; cursor: pointer; display: grid; gap: 2px; }
  .kok-btn b { font-family: var(--serif); font-size: 18px; font-weight: 600; }
  .kok-btn span { font-size: 12px; color: var(--soluk); }
  .gunun { display: grid; gap: 10px; }
  .gunun .kelime { font-size: clamp(32px, 9vw, 44px); }
  .seviye-rozet { font-family: var(--mono); font-size: 11px; padding: 3px 8px; border-radius: 99px; background: var(--vurgu-acik); color: var(--vurgu); white-space: nowrap; }

  /* Sözlük */
  .ara { width: 100%; font-size: 16px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--cizgi); background: var(--yuzey); color: var(--murekkep); }
  .liste { list-style: none; margin: 0; padding: 0; border: 1px solid var(--cizgi); border-radius: 14px; overflow: hidden; background: var(--cizgi); display: grid; gap: 1px; }
  .liste li button { width: 100%; text-align: left; border: 0; background: var(--yuzey); padding: 12px 14px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 0 10px; align-items: center; }
  .liste li b { font-family: var(--serif); font-size: 19px; font-weight: 600; }
  .liste li .alt { grid-column: 1; font-size: 14px; color: var(--soluk); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .liste li .sag { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 6px; align-items: center; }
  .nokta { width: 10px; height: 10px; border-radius: 50%; background: var(--cizgi); }
  .nokta.ogren { background: var(--amber); }
  .nokta.kalici { background: var(--dogru); }

  /* Alt sayfa */
  .perde-arka { position: fixed; inset: 0; background: rgba(10, 14, 24, .45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
  .sayfa { background: var(--zemin); width: 100%; max-width: 760px; max-height: 92vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 12px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
  .sayfa .tutamak { width: 40px; height: 4px; border-radius: 4px; background: var(--cizgi); margin: 0 auto 12px; }
  .ayar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--cizgi); }
  .ayar:last-child { border-bottom: 0; }
  select { font: inherit; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--cizgi); background: var(--yuzey); color: var(--murekkep); }
  .kaynak { font-size: 13px; color: var(--soluk); line-height: 1.6; }
  .kaynak p { margin: 0 0 8px; }
  .bos-durum { text-align: center; padding: 28px 12px; color: var(--soluk); }
  .toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--murekkep); color: var(--zemin); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; z-index: 30; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<main id="alan"></main>

<footer class="alt-bar">
  <nav aria-label="Bölümler">
    <button type="button" data-git="bugun" aria-current="page">

<script>
const KELIMELER = [{"w":"analyse","pos":"v","sub":1,"tr":"çözümlemek, analiz etmek","def":"to examine something in detail in order to understand it","ex":"The researchers [analysed] survey data from 2,000 households.","syn":["examine","scrutinise","study"],"fam":["analysis (n)","analyst (n)","analytical (adj)","analytically (adv)","US: analyze"],"col":["analyse data","analyse the causes of"],"ko":{"kok":"lyein","kok_anlam":"gevşetmek, çözmek","dil":"Yunanca","parca":[["ana-","baştan sona, geri"],["ly-","çözmek (lyein)"],["-sis","eylem ismi eki (analysis)"]],"yol":"Yunanca analysis → Fransızca analyser → İngilizce","imge":"Sıkıca bağlanmış bir düğümü ilmek ilmek çözmek.","hikaye":"Yunanca analysis, bir bütünü çözüp parçalarına ayırmak demektir. Düğüm çözülünce her ilmek tek tek görünür hale gelir. Akademik metinde analyse, bir veriyi ya da olguyu bileşenlerine ayırarak incelemektir. Karşıtı synthesis ise parçaları bir araya koymaktır.","tr_bag":"Türkçedeki 'analiz' ve 'analist' aynı Yunanca analysis sözcüğünden gelir.","tuzak":"İngiliz yazımı analyse, Amerikan yazımı analyze'dır; isim analysis, çoğulu analyses olur.","emin":"yüksek"}},{"w":"approach","pos":"n","sub":1,"tr":"yaklaşım, yöntem","def":"a way of dealing with a problem or of thinking about something","ex":"A comparative [approach] reveals how welfare systems differ across Europe.","syn":["method","strategy","perspective"],"fam":["approach (v)","approachable (adj)"],"col":["adopt an approach","a new approach to"],"ko":{"kok":"prope","kok_anlam":"yakın","dil":"Latince","parca":[["ap- (ad-)","-e doğru"],["proach","yakın"]],"yol":"Geç Latince appropiare → Eski Fransızca aprochier → İngilizce","imge":"Bir şeye adım adım yakınlaşan biri.","hikaye":"Geç Latince appropiare, 'yakına gelmek' demektir. Bir soruna nereden ve nasıl yaklaştığınız, onu ele alış biçiminizi belirler. Akademik metinde approach bu yüzden 'yaklaşım, yöntem' anlamı taşır. Türkçedeki 'yaklaşım' sözcüğü de aynı imgeyi kullanır.","tr_bag":null,"tuzak":"Fiil olarak edatsız kullanılır (approach the problem); isim olarak 'to' alır (an approach to the problem).","emin":"yüksek"}},{"w":"assess","pos":"v","sub":1,"tr":"değerlendirmek, ölçmek","def":"to judge the nature, quality or value of something","ex":"The study [assesses] the impact of migration on local wages.","syn":["evaluate","appraise","gauge"],"fam":["assessment (n)","assessor (n)","assessable (adj)"],"col":["assess the impact of","assess the extent to which"],"ko":{"kok":"sedere","kok_anlam":"oturmak","dil":"Latince","parca":[["as- (ad-)","yanına"],["sess","oturmak"]],"yol":"Latince assidere → Ortaçağ Latincesi assessare → Eski Fransızca → İngilizce","imge":"Yargıcın yanında oturup ona yardım eden bir danışman.","hikaye":"Latince assidere, 'yanına oturmak' demektir; assessor da yargıcın yanında oturan yardımcıydı. Bu yardımcının işi durumu tartıp değer biçmekti. Buradan vergi ya da ceza miktarını belirleme anlamı çıktı. Bugün assess, bir şeyin niteliğini ya da değerini değerlendirmektir.","tr_bag":null,"tuzak":"Assess (değerlendirmek) ile access (erişim, erişmek) yazım ve söylenişte sık karıştırılır.","emin":"yüksek"}},{"w":"assume","pos":"v","sub":1,"tr":"varsaymak; (görev) üstlenmek","def":"to accept something as true without proof; to take on a role or responsibility","ex":"Classical economists [assumed] that individuals act rationally.","syn":["presume","suppose","take on"],"fam":["assumption (n)","assumed (adj)"],"col":["it is assumed that","assume responsibility for"],"ko":{"kok":"sumere","kok_anlam":"almak","dil":"Latince","parca":[["as- (ad-)","-e, üzerine"],["sume","almak"]],"yol":"Latince assumere → İngilizce","imge":"Bir yükü alıp kendi omzuna koymak.","hikaye":"Latince assumere, 'üzerine almak, kendine almak' demektir. Bir görevi ya da sorumluluğu üzerine almak üstlenmektir. Bir düşünceyi kanıt beklemeden kabul edip 'almak' ise varsaymaktır. Akademik metinde en sık bu ikinci anlamı görürsünüz: 'It is assumed that...'.","tr_bag":null,"tuzak":"Assume office/responsibility/power kalıplarında anlam 'varsaymak' değil 'üstlenmek, ele geçirmek'tir.","emin":"yüksek"}},{"w":"authority","pos":"n","sub":1,"tr":"otorite, yetki; yetkili makam","def":"the power to make decisions or give orders; an official body with that power","ex":"Local [authorities] are responsible for primary education.","syn":["power","control","jurisdiction"],"fam":["authorise (v)","authoritative (adj)","authoritarian (adj)"],"col":["local authorities","have the authority to"],"ko":{"kok":"augere","kok_anlam":"artırmak, büyütmek","dil":"Latince","parca":[["auctor","artıran, kurucu, yazar"],["-ity","isim eki (-lık)"]],"yol":"Latince auctoritas → Eski Fransızca autorité → İngilizce","imge":"Bir şeyi kuran, büyüten ve ona adını veren kişi.","hikaye":"Latince auctor, bir şeyi var eden ya da büyüten kişi, yani kurucu ya da yazardır. Auctoritas, böyle birinin sözüne duyulan güven ve ağırlıktır. Söze duyulan güven zamanla karar verme gücüne dönüşür. Bugün authority hem 'yetki' hem de bu yetkiyi kullanan makam anlamındadır.","tr_bag":"Türkçedeki 'otorite' aynı Latince auctoritas sözcüğünden gelir.","tuzak":"Çoğul the authorities genellikle 'yetkililer, yetkili makamlar' anlamındadır, 'otoriteler' diye çevrilmez.","emin":"yüksek"}},{"w":"benefit","pos":"n","sub":1,"tr":"yarar, fayda; (sosyal) yardım","def":"an advantage or profit gained from something; money given by the state to those in need","ex":"The economic [benefits] of trade are not shared equally.","syn":["advantage","gain","profit"],"fam":["benefit (v)","beneficial (adj)","beneficiary (n)"],"col":["social benefits","benefit from"],"ko":{"kok":"facere","kok_anlam":"yapmak","dil":"Latince","parca":[["bene","iyi"],["fit (factum)","yapılmış"]],"yol":"Latince benefactum → Eski Fransızca → İngilizce","imge":"Birine iyi bir şey yapılması, bir iyilik.","hikaye":"Latince benefactum, 'iyi yapılmış şey, iyilik' demektir. Size yapılan iyilik size yarar sağlar. Bugün benefit genel olarak 'yarar, fayda' anlamında kullanılır. Sosyal politika metinlerinde ise devletin ihtiyaç sahiplerine yaptığı parasal yardımı da anlatır.","tr_bag":null,"tuzak":"Fiil iki yapıda kullanılır: The policy benefits the poor (yarar sağlar) ama The poor benefit from the policy (yararlanır).","emin":"yüksek"}},{"w":"concept","pos":"n","sub":1,"tr":"kavram","def":"an abstract idea or general notion","ex":"The [concept] of social capital was popularised by Putnam.","syn":["notion","idea","construct"],"fam":["conceptual (adj)","conceptualise (v)","conception (n)"],"col":["the concept of","a key concept"],"ko":{"kok":"capere","kok_anlam":"almak, tutmak","dil":"Latince","parca":[["con-","birlikte, tamamen"],["cept","almak"]],"yol":"Latince conceptum → İngilizce","imge":"Bir şeyi avucun içine alıp sıkıca tutmak.","hikaye":"Latince concipere, 'içine almak' demektir. Zihnin bir düşünceyi içine alması, onu kavramasıdır. Conceptum bu şekilde zihinde oluşan genel düşünceyi anlatır. Türkçedeki 'kavram' da 'kavramak' fiilinden gelir ve aynı imgeyi taşır.","tr_bag":"Türkçedeki 'konsept' bu sözcükten alınmıştır.","tuzak":"Türkçede 'konsept' çoğu zaman 'tema, tarz' anlamında kullanılır; akademik concept ise 'kavram'dır.","emin":"yüksek"}},{"w":"consist","pos":"v","sub":1,"tr":"oluşmak (of); ibaret olmak (in)","def":"to be made up of particular parts; to have something as its main feature","ex":"The sample [consisted] of 450 university students.","syn":["comprise","be composed of","contain"],"fam":["consistent (adj)","consistency (n)","consistently (adv)"],"col":["consist of","consist in"],"ko":{"kok":"sistere","kok_anlam":"durmak","dil":"Latince","parca":[["con-","birlikte"],["sist","durmak"]],"yol":"Latince consistere → İngilizce","imge":"Parçaların yan yana, birlikte durması.","hikaye":"Latince consistere, 'birlikte durmak, sabit durmak' demektir. Bir bütün, onu oluşturan parçalar birlikte durduğu için vardır. Consist of bu yüzden 'şunlardan oluşmak' anlamı taşır. Consist in ise bir şeyin özünün neye dayandığını anlatır.","tr_bag":null,"tuzak":"Consist edilgen kullanılmaz: 'is consisted of' yanlıştır, doğrusu 'consists of'tur.","emin":"yüksek"}},{"w":"constitute","pos":"v","sub":1,"tr":"oluşturmak, teşkil etmek","def":"to be the parts or elements that form something; to amount to","ex":"Women [constitute] nearly half of the labour force.","syn":["make up","form","represent"],"fam":["constitution (n)","constitutional (adj)","constituent (n)"],"col":["constitute a threat","constitute the majority"],"ko":{"kok":"statuere","kok_anlam":"dikmek, yerleştirmek","dil":"Latince","parca":[["con-","birlikte"],["stitut","dikmek, kurmak"],["-e","fiil sonu"]],"yol":"Latince constituere → İngilizce","imge":"Parçaları bir araya getirip ayakta duran bir yapı kurmak.","hikaye":"Latince constituere, 'birlikte yerine koymak, kurmak' demektir. Parçalar yerine konunca bir bütün ortaya çıkar. Bu yüzden constitute, parçaların bir bütünü oluşturmasını ya da bir şeyin başka bir şey sayılmasını anlatır. Aynı kökten constitution hem 'anayasa' hem 'bünye' demektir.","tr_bag":null,"tuzak":"Yön ters çevrilmemeli: parçalar bütünü oluşturur (Women constitute half the workforce), bütün ise parçalardan oluşur (consists of).","emin":"yüksek"}},{"w":"context","pos":"n","sub":1,"tr":"bağlam","def":"the circumstances or setting in which an event or idea exists","ex":"These findings must be interpreted in their historical [context].","syn":["setting","background","circumstances"],"fam":["contextual (adj)","contextualise (v)"],"col":["in the context of","social context"],"ko":{"kok":"texere","kok_anlam":"dokumak","dil":"Latince","parca":[["con-","birlikte"],["text","dokumak"]],"yol":"Latince contextus → İngilizce","imge":"Birbirine dokunmuş iplikler.","hikaye":"Latince contexere, 'birlikte dokumak' demektir. Bir sözcük, çevresindeki sözcüklerle birlikte dokunmuş bir kumaşın parçasıdır. Onu kumaştan koparırsanız anlamı eksik kalır. Akademik metinde context, bir olayın ya da düşüncenin içinde yer aldığı koşullar bütünüdür.","tr_bag":"Türkçedeki 'tekstil' de aynı texere 'dokumak' kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"contract","pos":"n","sub":1,"tr":"sözleşme","def":"a formal, legally binding agreement between two or more parties","ex":"Many young workers are employed on short-term [contracts].","syn":["agreement","deal","treaty"],"fam":["contract (v: daralmak, küçülmek)","contractual (adj)","contractor (n)"],"col":["sign a contract","breach of contract"],"ko":{"kok":"trahere","kok_anlam":"çekmek","dil":"Latince","parca":[["con-","birlikte"],["tract","çekmek"]],"yol":"Latince contractus → Eski Fransızca → İngilizce","imge":"İki tarafı birbirine doğru çeken bir bağ.","hikaye":"Latince contrahere, 'bir araya çekmek' demektir. Contractus, iki tarafı karşılıklı yükümlülüklerle birbirine bağlayan anlaşmadır. Fiil olarak contract, 'büzülmek, daralmak' anlamını da korur. Hukuk ve ekonomi metinlerinde ise isim olarak 'sözleşme'dir.","tr_bag":"Türkçedeki 'kontrat' bu sözcükten, 'traktör' de aynı trahere 'çekmek' kökünden gelir.","tuzak":"Fiil olarak contract 'daralmak' ve 'hastalık kapmak' (contract a disease) anlamlarına da gelir.","emin":"yüksek"}},{"w":"define","pos":"v","sub":1,"tr":"tanımlamak","def":"to state or explain the exact meaning or nature of something","ex":"Poverty can be [defined] in absolute or relative terms.","syn":["specify","describe","characterise"],"fam":["definition (n)","definite (adj)","definitive (adj)"],"col":["be defined as","clearly defined"],"ko":{"kok":"finire","kok_anlam":"sınırlamak, bitirmek","dil":"Latince","parca":[["de-","tamamen"],["fine (finis)","sınır, son"]],"yol":"Latince definire → Eski Fransızca → İngilizce","imge":"Bir tarlanın çevresine sınır taşları dikmek.","hikaye":"Latince definire, 'sınırlarını belirlemek' demektir; finis 'sınır, son' anlamındadır. Bir kavramı tanımlamak, nerede başlayıp nerede bittiğini göstermektir. Akademik metinde define, bir terimin kapsamını açıkça çizmek için kullanılır. Aynı kökten finite 'sınırlı', infinite 'sınırsız' demektir.","tr_bag":"Türkçedeki 'final' da aynı finis 'son' kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"derive","pos":"v","sub":1,"tr":"türemek, kaynaklanmak; elde etmek","def":"to obtain something from a source; to originate from","ex":"Much of the region's income is [derived] from tourism.","syn":["obtain","stem from","originate"],"fam":["derivation (n)","derivative (n, adj)"],"col":["derive from","be derived from"],"ko":{"kok":"rivus","kok_anlam":"dere, akarsu","dil":"Latince","parca":[["de-","-den, ayrılarak"],["rive","dere, akarsu"]],"yol":"Latince derivare → Eski Fransızca deriver → İngilizce","imge":"Bir ırmaktan ark açıp suyunu başka bir yere akıtmak.","hikaye":"Latince derivare, suyu bir kaynaktan başka yöne çevirmek demektir. Su, geldiği ırmaktan beslenir. Bir düşünce ya da sözcük de bir kaynaktan 'akıp' gelir. Bugün derive, bir kaynaktan elde etmek ya da ondan kaynaklanmak anlamındadır.","tr_bag":null,"tuzak":"İki yapı karıştırılır: derive X from Y 'Y'den X elde etmek', derive from ise 'kaynaklanmak' demektir.","emin":"yüksek"}},{"w":"distribute","pos":"v","sub":1,"tr":"dağıtmak, paylaştırmak","def":"to share or spread something among people or over an area","ex":"Wealth is unevenly [distributed] in most societies.","syn":["allocate","share out","disperse"],"fam":["distribution (n)","distributor (n)","distributive (adj)"],"col":["distribute resources","evenly distributed"],"ko":{"kok":"tribuere","kok_anlam":"vermek, paylaştırmak","dil":"Latince","parca":[["dis-","ayrı ayrı, dağınık"],["tribut","vermek"],["-e","fiil sonu"]],"yol":"Latince distribuere → İngilizce","imge":"Bir şeyi parçalara ayırıp her birini ayrı birine vermek.","hikaye":"Latince distribuere, 'ayrı ayrı vermek, paylaştırmak' demektir. Bir bütün bölünüp farklı kişilere verildiğinde dağıtılmış olur. Sosyal bilimlerde distribution, gelir ya da kaynakların toplumda nasıl paylaşıldığını anlatır. Aynı kökten contribute 'katkıda bulunmak', attribute 'bir şeye yormak' demektir.","tr_bag":"Türkçedeki 'distribütör' bu sözcükten alınmıştır.","tuzak":null,"emin":"yüksek"}},{"w":"economy","pos":"n","sub":1,"tr":"ekonomi; tasarruf","def":"the system by which a country's money and goods are produced and used","ex":"The informal [economy] employs millions of people.","syn":["financial system","market"],"fam":["economic (adj)","economical (adj: tutumlu)","economist (n)"],"col":["a market economy","economy of scale"],"ko":{"kok":"oikos","kok_anlam":"ev","dil":"Yunanca","parca":[["oikos","ev"],["nomos (nemein)","yönetmek, düzenlemek"]],"yol":"Yunanca oikonomia → Latince oeconomia → Fransızca économie → İngilizce","imge":"Bir evin gelirini ve giderini düzenleyen ev yöneticisi.","hikaye":"Yunanca oikonomia, 'ev yönetimi' demektir. Evin kaynaklarını idareli kullanmak, zamanla bir ülkenin kaynaklarını yönetmeye genişledi. Bugün economy bir ülkenin üretim ve tüketim düzenini anlatır. 'Tasarruf' anlamı ise eski ev yönetimi fikrini korur.","tr_bag":"Türkçedeki 'ekonomi' ve 'ekonomik' aynı Yunanca oikonomia sözcüğünden gelir.","tuzak":"Economy (ekonomi), economics (iktisat bilimi), economic (ekonomiyle ilgili) ve economical (tutumlu, idareli) farklı sözcüklerdir.","emin":"yüksek"}},{"w":"environment","pos":"n","sub":1,"tr":"çevre, ortam","def":"the surroundings or conditions in which people live or work; the natural world","ex":"Children learn best in a supportive [environment].","syn":["surroundings","setting","milieu"],"fam":["environmental (adj)","environmentalist (n)","environmentally (adv)"],"col":["learning environment","protect the environment"],"ko":{"kok":"environ","kok_anlam":"çevresinde, etrafında","dil":"Fransızca","parca":[["en-","içinde"],["viron","çevre, dönüş"],["-ment","isim eki"]],"yol":"Eski Fransızca environner → İngilizce","imge":"Bir şeyin çevresini halka gibi saran şey.","hikaye":"Eski Fransızca environner, 'çevrelemek' demektir. Environment, bir şeyi ya da birini çevreleyen şeylerin tümüdür. İnsanı saran koşullar onun ortamını oluşturur. Bugün sözcük hem 'ortam' hem de 'doğal çevre' anlamında kullanılır.","tr_bag":null,"tuzak":null,"emin":"yüksek"}},{"w":"establish","pos":"v","sub":1,"tr":"kurmak; saptamak, kanıtlamak","def":"to set up an organisation or system; to discover or prove facts","ex":"The university was [established] in 1933.","syn":["found","set up","determine"],"fam":["establishment (n)","established (adj)"],"col":["establish a link between","well established"],"ko":{"kok":"stabilire","kok_anlam":"sağlamlaştırmak","dil":"Latince","parca":[["e-","Fransızcada eklenen ön ses"],["stabl (stabilis)","sağlam, sabit"],["-ish","fiil eki"]],"yol":"Latince stabilire → Eski Fransızca establir → İngilizce","imge":"Yere sağlam biçimde dikilmiş, sarsılmayan bir direk.","hikaye":"Latince stabilire, 'sağlam kılmak' demektir. Bir kurumu sağlam temellere oturtmak onu kurmaktır. Bir olguyu şüpheye yer bırakmayacak biçimde ortaya koymak da onu 'sağlamlaştırmak', yani kanıtlamaktır. Akademik metinde establish bu iki anlamda da sık geçer.","tr_bag":"Türkçedeki 'stabil' aynı Latince stabilis 'sağlam' sözcüğünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"estimate","pos":"v","sub":1,"tr":"tahmin etmek, kestirmek","def":"to roughly calculate the value, size or amount of something","ex":"It is [estimated] that one billion people live in informal settlements.","syn":["approximate","calculate","gauge"],"fam":["estimate (n)","estimation (n)","overestimate (v)","underestimate (v)"],"col":["it is estimated that","a rough estimate"],"ko":{"kok":"aestimare","kok_anlam":"değer biçmek","dil":"Latince","parca":[["estim","değer biçmek"],["-ate","fiil eki"]],"yol":"Latince aestimare → İngilizce","imge":"Pazarda bir malı eline alıp gözle değerini biçen tüccar.","hikaye":"Latince aestimare, 'değer biçmek' demektir. Bir şeye değer biçerken kesin ölçüm yapmadan yaklaşık bir sonuca varırsınız. Akademik metinde estimate, eldeki veriye dayanan sayısal kestirimdir. Aynı kökten esteem ise birine yüksek değer biçmek, yani saygı duymaktır.","tr_bag":null,"tuzak":null,"emin":"yüksek"}},{"w":"evident","pos":"adj","sub":1,"tr":"açık, belli, apaçık","def":"clearly seen or understood; obvious","ex":"The effects of the reform were [evident] within two years.","syn":["obvious","apparent","clear"],"fam":["evidence (n)","evidently (adv)"],"col":["it is evident that","become evident"],"ko":{"kok":"videre","kok_anlam":"görmek","dil":"Latince","parca":[["e- (ex-)","dışarı, açığa"],["vid","görmek"],["-ent","sıfat eki (-en/-an)"]],"yol":"Latince evidens → Fransızca → İngilizce","imge":"Dışarıda, herkesin gözü önünde duran bir şey.","hikaye":"Latince evidens, 'açıkça görülen' demektir. Gözle görülen şeyden akılla açıkça kavranan şeye geçmek kısa bir adımdır. Akademik metinde evident, verinin kendini gösterdiği durumu anlatır: 'It is evident that...'. Aynı kökten evidence 'kanıt' da 'görünür kılınan şey'dir.","tr_bag":"Türkçedeki 'vizyon' ve 'video' da aynı videre kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"export","pos":"v","sub":1,"tr":"ihraç etmek","def":"to send goods to another country for sale","ex":"Turkey [exports] textiles to many European countries.","syn":["ship","sell abroad"],"fam":["export (n)","exporter (n)"],"col":["export goods to","export revenue"],"ko":{"kok":"portare","kok_anlam":"taşımak","dil":"Latince","parca":[["ex-","dışarı"],["port","taşımak"]],"yol":"Latince exportare → İngilizce","imge":"Yüklerin sınırın dışına taşınması.","hikaye":"Latince exportare, 'dışarı taşımak' demektir. Ülke içinde üretilen malları dışarıya taşıyıp satmak ihracattır. Karşıtı import, 'içeri taşımak', yani ithalattır. Aynı kökten transport 'taşımak, ulaşım' demektir.","tr_bag":"Türkçedeki 'portatif' (taşınabilir) aynı portare 'taşımak' kökünden gelir.","tuzak":"Vurgu değişir: isim EXport, fiil exPORT diye okunur.","emin":"yüksek"}},{"w":"factor","pos":"n","sub":1,"tr":"etken, etmen, faktör","def":"a circumstance or influence that contributes to a result","ex":"Education is a key [factor] in social mobility.","syn":["element","cause","determinant"],"fam":["factor (v: hesaba katmak)"],"col":["a key factor","risk factor"],"ko":{"kok":"facere","kok_anlam":"yapmak","dil":"Latince","parca":[["fac","yapmak"],["-tor","yapan (-ıcı)"]],"yol":"Latince factor → İngilizce","imge":"Bir sonucu ortaya çıkaran, onu 'yapan' el.","hikaye":"Latince factor, 'yapan, yapıcı' demektir. Bir sonucu ortaya çıkaran her unsur, o sonucun 'yapıcılarından' biridir. Matematikte factor, çarpımı oluşturan çarpanlardır. Sosyal bilimlerde ise bir sonuca katkıda bulunan etkenleri anlatır.","tr_bag":"Türkçedeki 'faktör' bu sözcükten alınmıştır.","tuzak":null,"emin":"yüksek"}},{"w":"finance","pos":"n","sub":1,"tr":"finans, maliye","def":"the management of money, especially by governments or large organisations","ex":"Public [finance] came under strain after the crisis.","syn":["funding","economics","capital"],"fam":["finance (v: finanse etmek)","financial (adj)","financially (adv)"],"col":["public finance","finance a project"],"ko":{"kok":"finis","kok_anlam":"son, sınır","dil":"Latince","parca":[["fin","son"],["-ance","isim eki"]],"yol":"Latince finis → Eski Fransızca finance → İngilizce","imge":"Bir borcun ödenip hesabın kapatılması.","hikaye":"Eski Fransızcada finer 'bitirmek' demekti; bir borcu bitirmek de onu ödemekti. Finance bu yüzden önce 'ödeme' anlamı taşıdı. Ödeme ve para işleri genişleyince sözcük para yönetiminin tümünü anlatır oldu. Bugün finance kamu maliyesi ve kurumların para yönetimi için kullanılır.","tr_bag":"Türkçedeki 'finans' bu sözcükten, 'final' ise aynı finis 'son' kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"formula","pos":"n","sub":1,"tr":"formül; kalıp, çözüm yolu","def":"a fixed method or plan for achieving something; a mathematical rule","ex":"There is no simple [formula] for reducing inequality.","syn":["method","recipe","blueprint"],"fam":["formulate (v)","formulation (n)"],"col":["a formula for success","peace formula"],"ko":{"kok":"forma","kok_anlam":"biçim, kalıp","dil":"Latince","parca":[["form","biçim, kalıp"],["-ula","küçültme eki"]],"yol":"Latince formula → İngilizce","imge":"İçine dökülen her şeye aynı biçimi veren küçük bir kalıp.","hikaye":"Latince formula, forma 'biçim' sözcüğünün küçültülmüş hali, yani 'küçük kalıp'tır. Kalıp, her seferinde aynı sonucu verir. Bu yüzden formula, bir şeyi elde etmek için izlenen sabit yöntem ya da kuraldır. Matematikte ve kimyada ise sabit simgesel ifadeleri anlatır.","tr_bag":"Türkçedeki 'formül' bu sözcükten, 'form' ise forma kökünden gelir.","tuzak":"Çoğulu formulas ya da formulae olur; 'formulaes' gibi biçimler yanlıştır.","emin":"yüksek"}},{"w":"function","pos":"n","sub":1,"tr":"işlev, görev","def":"the purpose or natural role of something","ex":"One [function] of rituals is to strengthen group identity.","syn":["role","purpose","task"],"fam":["function (v: işlemek)","functional (adj)","functionalism (n)"],"col":["perform a function","social function"],"ko":{"kok":"fungi","kok_anlam":"yerine getirmek, görev yapmak","dil":"Latince","parca":[["func","yerine getirmek"],["-tion","isim eki"]],"yol":"Latince functio → Fransızca fonction → İngilizce","imge":"Kendisine verilen işi yerine getiren bir görevli.","hikaye":"Latince functio, 'bir işi yerine getirme' demektir. Bir şeyin yerine getirdiği iş, onun işlevidir. Sosyolojide function, bir kurumun toplum içinde gördüğü iştir. Matematikte ise bir değişkenin başka bir değişkene bağlı olduğu ilişkiyi anlatır.","tr_bag":"Türkçedeki 'fonksiyon' Fransızca fonction yoluyla aynı sözcükten gelir.","tuzak":null,"emin":"yüksek"}},{"w":"identify","pos":"v","sub":1,"tr":"belirlemek, saptamak; özdeşleşmek (with)","def":"to recognise or establish who or what something is; to feel close to","ex":"The report [identifies] three main causes of unemployment.","syn":["recognise","pinpoint","determine"],"fam":["identification (n)","identity (n)","identifiable (adj)"],"col":["identify with","identify the causes of"],"ko":{"kok":"idem","kok_anlam":"aynı","dil":"Latince","parca":[["ident (idem)","aynı"],["-ify (facere)","yapmak, kılmak"]],"yol":"Ortaçağ Latincesi identificare → Fransızca identifier → İngilizce","imge":"İki şeyi yan yana koyup 'bunlar aynı' demek.","hikaye":"Geç Latince identificare, 'aynı kılmak' demektir. Bir şeyi tanımak, onu bilinen bir şeyle aynı olduğunu görmektir. Bu yüzden identify, 'belirlemek, saptamak' anlamı taşır. Identify with ise kişinin kendini başkasıyla aynı saymasıdır, yani özdeşleşmek.","tr_bag":null,"tuzak":"Identify with 'özdeşleşmek' anlamındadır; 'ile belirlemek' diye çevrilmez.","emin":"yüksek"}},{"w":"income","pos":"n","sub":1,"tr":"gelir","def":"money received regularly for work or from investments","ex":"Household [income] fell sharply during the recession.","syn":["earnings","revenue","wages"],"fam":[],"col":["low-income families","income inequality"],"ko":{"kok":"cuman","kok_anlam":"gelmek","dil":"Germen","parca":[["in","içeri"],["come","gelmek"]],"yol":"Eski İngilizce (Germen) kökenli","imge":"Kapıdan içeri giren para.","hikaye":"Income, İngilizcenin kendi sözcükleri in 'içeri' ve come 'gelmek' ile kurulmuştur. İçeri gelen para gelirdir. Ekonomi metinlerinde income, düzenli olarak elde edilen kazancı anlatır. Karşıtı outgoings ya da expenditure 'gider'dir.","tr_bag":null,"tuzak":"Income (gelir) ile outcome (sonuç) karıştırılmamalıdır.","emin":"yüksek"}},{"w":"indicate","pos":"v","sub":1,"tr":"göstermek, işaret etmek","def":"to point out or show something; to suggest","ex":"The data [indicate] a strong link between poverty and poor health.","syn":["show","suggest","signal"],"fam":["indication (n)","indicator (n)","indicative (adj)"],"col":["indicate that","social indicators"],"ko":{"kok":"dicare","kok_anlam":"ilan etmek, göstermek","dil":"Latince","parca":[["in-","üzerine"],["dic","göstermek, bildirmek"],["-ate","fiil eki"]],"yol":"Latince indicare → İngilizce","imge":"Parmakla bir şeyin üzerini göstermek.","hikaye":"Latince indicare, 'göstermek, işaret etmek' demektir. Bir şeyi göstermek, dikkati ona yöneltmektir. Akademik metinde indicate, verinin bir sonuca işaret ettiğini anlatır: 'The results indicate that...'. Aynı kökten gelen index 'gösterge, dizin' demektir.","tr_bag":"Türkçedeki 'endeks' aynı kökten gelen Latince index sözcüğünden alınmıştır.","tuzak":null,"emin":"yüksek"}},{"w":"interpret","pos":"v","sub":1,"tr":"yorumlamak; sözlü çevirmek","def":"to explain the meaning of something; to understand something in a particular way","ex":"Historians [interpret] the same events in very different ways.","syn":["explain","construe","read"],"fam":["interpretation (n)","interpreter (n)","interpretive (adj)"],"col":["interpret the results","be interpreted as"],"ko":{"kok":"interpres","kok_anlam":"aracı, çevirmen","dil":"Latince","parca":[["inter-","arasında"],["pret","kökeni kesin değildir"]],"yol":"Latince interpretari → Fransızca → İngilizce","imge":"İki taraf arasında durup birinin sözünü diğerine aktaran aracı.","hikaye":"Latince interpres, iki taraf arasında aracılık eden kişi, çevirmendir; sözcüğün ikinci parçasının kökeni kesin değildir. Aracı, bir tarafın sözünü diğerine anlaşılır kılar. Bu yüzden interpret hem 'sözlü çevirmek' hem de 'yorumlamak' anlamı taşır. Akademik metinde veriyi ya da metni anlamlandırmayı anlatır.","tr_bag":null,"tuzak":"Interpreter 'sözlü çevirmen'dir; yazılı çeviri yapan kişi translator'dır.","emin":"orta"}},{"w":"involve","pos":"v","sub":1,"tr":"içermek, gerektirmek; dahil etmek","def":"to include something as a necessary part; to cause someone to take part","ex":"The project [involved] interviews with 60 teachers.","syn":["include","entail","engage"],"fam":["involvement (n)","involved (adj)"],"col":["be involved in","involve risk"],"ko":{"kok":"volvere","kok_anlam":"yuvarlamak, sarmak","dil":"Latince","parca":[["in-","içine"],["volve","yuvarlamak, sarmak"]],"yol":"Latince involvere → İngilizce","imge":"Bir şeyi bir örtünün içine sarıp yuvarlamak.","hikaye":"Latince involvere, 'içine sarmak, dolamak' demektir. İçine sarılan şey, bütünün bir parçası olur. Bu yüzden involve, bir şeyin zorunlu olarak içerdiğini ya da gerektirdiğini anlatır. Birini bir işe 'sarmak' da onu o işe dahil etmektir.","tr_bag":"Türkçedeki 'revolver' aynı volvere 'döndürmek' kökünden gelen revolve fiilinden türemiştir.","tuzak":"Involve fiilden sonra -ing alır: The job involves travelling (to travel değil).","emin":"yüksek"}},{"w":"labour","pos":"n","sub":1,"tr":"emek, iş gücü, işçi sınıfı","def":"work, especially physical work; workers as a group","ex":"Cheap [labour] attracted foreign manufacturers to the region.","syn":["work","workforce","toil"],"fam":["labourer (n)","laborious (adj: zahmetli)","US: labor"],"col":["labour market","division of labour"],"ko":{"kok":"labor","kok_anlam":"emek, zahmet","dil":"Latince","parca":[["labour","emek, zahmet"]],"yol":"Latince labor → Eski Fransızca labour → İngilizce","imge":"Ağır bir yük altında çalışan biri.","hikaye":"Latince labor, 'zahmet, yorucu iş' demektir. Emek, bir şey üretmek için harcanan zahmettir. Ekonomi ve sosyolojide labour hem emek hem iş gücü hem de işçi sınıfı anlamında kullanılır. Division of labour 'iş bölümü' bu alanların temel kavramlarından biridir.","tr_bag":"Türkçedeki 'laboratuvar' aynı Latince labor kökünden, 'çalışılan yer' anlamından gelir.","tuzak":"İngiliz yazımı labour, Amerikan yazımı labor'dır; in labour ise 'doğum sancısı çeken' demektir.","emin":"yüksek"}},{"w":"legislate","pos":"v","sub":1,"tr":"yasa yapmak, yasayla düzenlemek","def":"to make laws","ex":"Parliament [legislated] to protect workers' rights.","syn":["enact laws","regulate"],"fam":["legislation (n)","legislative (adj)","legislator (n)","legislature (n)"],"col":["legislate for","legislate against"],"ko":{"kok":"lex","kok_anlam":"yasa","dil":"Latince","parca":[["legis (lex)","yasanın"],["lat (lator)","getiren, öneren"],["-e","fiil sonu"]],"yol":"Latince legis lator → İngilizce (legislator'dan türetilmiş)","imge":"Bir yasa önerisini halkın önüne getiren kişi.","hikaye":"Latince legis lator, 'yasayı getiren, öneren kişi' demektir. İngilizcede önce legislator ve legislation vardı; legislate fiili bunlardan geriye doğru türetildi. Yasa önermek ve çıkarmak, yasa yapmaktır. Siyaset metinlerinde legislature 'yasama organı' demektir.","tr_bag":"Türkçedeki 'legal' aynı lex 'yasa' kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"method","pos":"n","sub":1,"tr":"yöntem","def":"a particular procedure for doing something, especially a systematic one","ex":"Qualitative [methods] were used to explore participants' experiences.","syn":["technique","procedure","approach"],"fam":["methodology (n)","methodical (adj)","methodological (adj)"],"col":["research method","teaching method"],"ko":{"kok":"hodos","kok_anlam":"yol","dil":"Yunanca","parca":[["meta-","ardından, peşinden"],["hodos","yol"]],"yol":"Yunanca methodos → Latince methodus → Fransızca méthode → İngilizce","imge":"Belli bir yolu adım adım izleyen yolcu.","hikaye":"Yunanca methodos, 'bir yolun ardından gitmek' demektir. Bilgiye ulaşmak için rastgele değil, belli bir yolu izlemek gerekir. Bu yüzden method, sistemli bir çalışma yoludur. Methodology ise yöntemlerin kendisini inceleyen alandır.","tr_bag":"Türkçedeki 'metot' bu sözcükten, 'periyot' ise aynı hodos 'yol' kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"occur","pos":"v","sub":1,"tr":"meydana gelmek, olmak; (aklına) gelmek","def":"to happen; to exist or be found","ex":"Most road accidents [occur] in urban areas.","syn":["happen","take place","arise"],"fam":["occurrence (n)"],"col":["occur in","it occurred to me that"],"ko":{"kok":"currere","kok_anlam":"koşmak","dil":"Latince","parca":[["oc- (ob-)","karşı, önüne"],["cur","koşmak"]],"yol":"Latince occurrere → İngilizce","imge":"Birinin karşısına koşarak çıkmak.","hikaye":"Latince occurrere, 'karşısına koşmak, karşılaşmak' demektir. Bir olay, bizim önümüze çıktığında meydana gelmiş olur. Bir düşünce aklımızın önüne çıktığında da 'aklımıza gelir': It occurred to me that... Akademik metinde occur, 'görülmek, meydana gelmek' anlamındadır.","tr_bag":"Türkçedeki 'kurye' aynı currere 'koşmak' kökünden gelir.","tuzak":"Occur geçişsizdir, edilgen yapılmaz: 'was occurred' yanlıştır; geçmiş zamanı occurred (çift r) yazılır.","emin":"yüksek"}},{"w":"principle","pos":"n","sub":1,"tr":"ilke, prensip","def":"a fundamental truth or rule that serves as the basis of a system of belief or behaviour","ex":"Equality before the law is a basic [principle] of democracy.","syn":["rule","tenet","doctrine"],"fam":["principled (adj)"],"col":["in principle","the principle of"],"ko":{"kok":"princeps","kok_anlam":"ilk sırayı alan","dil":"Latince","parca":[["prin (primus)","ilk"],["cip (capere)","almak"],["-le","isim sonu"]],"yol":"Latince principium → Fransızca → İngilizce","imge":"Bir yapının en altına ilk konan temel taşı.","hikaye":"Latince principium, 'başlangıç, temel' demektir; princeps 'ilk sırayı alan' anlamındadır. Her şeyin dayandığı ilk nokta, onun temelidir. Principle bu yüzden bir düşünce ya da davranış sisteminin dayandığı temel kuraldır. In principle ise 'ilke olarak, kuramda' demektir.","tr_bag":"Türkçedeki 'prensip' bu sözcükten, 'prens' ise princeps sözcüğünden gelir.","tuzak":"Principle (ilke) ile principal (başlıca; okul müdürü) aynı okunur ama farklı sözcüklerdir.","emin":"yüksek"}},{"w":"proceed","pos":"v","sub":1,"tr":"devam etmek, ilerlemek","def":"to continue or move forward, especially after a pause","ex":"After the pilot study, the team [proceeded] with the main survey.","syn":["continue","carry on","advance"],"fam":["procedure (n)","process (n)","proceedings (n: işlemler, tutanak)"],"col":["proceed with","proceed to"],"ko":{"kok":"cedere","kok_anlam":"gitmek","dil":"Latince","parca":[["pro-","ileri"],["ceed","gitmek"]],"yol":"Latince procedere → Eski Fransızca → İngilizce","imge":"Bir yolda ileriye doğru yürümek.","hikaye":"Latince procedere, 'ileri gitmek' demektir. Durduğu yerden ileri giden, işine devam eder. Proceed bu yüzden 'devam etmek, ilerlemek' anlamı taşır. Aynı kökten procedure, bir işte adım adım ilerleme yoludur.","tr_bag":"Türkçedeki 'prosedür' aynı Latince procedere kökünden gelir.","tuzak":"Proceed (devam etmek) ile precede (önce gelmek) karıştırılır; çoğul isim proceeds ise 'hasılat' demektir.","emin":"yüksek"}},{"w":"require","pos":"v","sub":1,"tr":"gerektirmek; zorunlu kılmak","def":"to need something; to make something necessary or compulsory","ex":"The new policy will [require] significant investment.","syn":["need","demand","necessitate"],"fam":["requirement (n)","required (adj)"],"col":["be required to","require that"],"ko":{"kok":"quaerere","kok_anlam":"aramak, istemek","dil":"Latince","parca":[["re-","yeniden, üstüne basarak"],["quire","aramak, istemek"]],"yol":"Latince requirere → Eski Fransızca → İngilizce","imge":"Eksik olan bir şeyi arayıp duran biri.","hikaye":"Latince requirere, 'aramak, istemek, gerekli saymak' demektir. Aranan ve istenen şey, eksikliği duyulan şeydir. Bu yüzden require 'gerektirmek' anlamı taşır. Kurallar bağlamında ise 'zorunlu kılmak' demektir: Students are required to...","tr_bag":null,"tuzak":"Require (gerektirmek) ile aynı kökten gelen acquire (edinmek) ve inquire (sormak) sık karıştırılır.","emin":"yüksek"}},{"w":"respond","pos":"v","sub":1,"tr":"yanıt vermek, tepki göstermek","def":"to say or do something as a reaction","ex":"Governments [responded] to the crisis with emergency spending.","syn":["react","reply","answer"],"fam":["response (n)","respondent (n: katılımcı)","responsive (adj)"],"col":["respond to","respond positively"],"ko":{"kok":"spondere","kok_anlam":"söz vermek, güvence vermek","dil":"Latince","parca":[["re-","karşılık olarak"],["spond","söz vermek"]],"yol":"Latince respondere → Eski Fransızca → İngilizce","imge":"Verilen bir söze karşılık söz veren biri.","hikaye":"Latince respondere, 'karşılık olarak söz vermek' demektir. Bir söze karşılık söz vermek, ona yanıt vermektir. Respond bu yüzden 'yanıt vermek, tepki göstermek' anlamı taşır. Aynı kökten responsible, verdiği sözün karşılığını vermesi beklenen, yani sorumlu kişidir.","tr_bag":"Türkçedeki 'sponsor' aynı spondere 'güvence vermek' kökünden gelir.","tuzak":"Respond 'to' edatıyla kullanılır: respond to a question (respond a question değil).","emin":"yüksek"}},{"w":"sector","pos":"n","sub":1,"tr":"sektör, kesim","def":"a distinct part of an economy or society","ex":"The service [sector] now employs most of the workforce.","syn":["area","branch","field"],"fam":[],"col":["public sector","private sector"],"ko":{"kok":"secare","kok_anlam":"kesmek","dil":"Latince","parca":[["sec","kesmek"],["-tor","yapan (-ıcı)"]],"yol":"Latince sector → İngilizce","imge":"Bir daireden bıçakla kesilmiş bir dilim.","hikaye":"Latince sector, 'kesen' demektir. Geometride sector, iki yarıçap arasında kalan daire dilimidir. Bir bütünden kesilmiş dilim fikri, ekonominin bölümlerine aktarıldı. Bugün sector, ekonominin ya da toplumun ayrı bir kesimidir: public sector, service sector.","tr_bag":"Türkçedeki 'sektör' bu sözcükten, 'segment' ise aynı secare 'kesmek' kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"significant","pos":"adj","sub":1,"tr":"önemli, anlamlı, kayda değer","def":"large or important enough to have an effect or be noticed","ex":"There was a [significant] increase in youth unemployment.","syn":["considerable","substantial","notable"],"fam":["significance (n)","significantly (adv)","signify (v)"],"col":["statistically significant","a significant role"],"ko":{"kok":"signum","kok_anlam":"işaret","dil":"Latince","parca":[["sign","işaret"],["-ific (facere)","yapmak"],["-ant","sıfat eki (-an)"]],"yol":"Latince significare → İngilizce","imge":"Bir anlam taşıyan, dikkat çeken bir işaret.","hikaye":"Latince significare, 'işaret vermek, bir şey anlatmak' demektir. Bir işaret, ancak bir anlam taşıdığında dikkate değer. Significant bu yüzden 'anlamlı, önemli' demektir. İstatistikte statistically significant, sonucun rastlantıyla açıklanamayacağını anlatır.","tr_bag":"Türkçedeki 'sinyal' aynı signum 'işaret' kökünden gelir.","tuzak":"İstatistikte significant 'anlamlı' diye çevrilir; 'büyük, önemli' anlamına gelmez.","emin":"yüksek"}},{"w":"structure","pos":"n","sub":1,"tr":"yapı","def":"the arrangement of and relations between the parts of something complex","ex":"Family [structure] has changed considerably since the 1960s.","syn":["organisation","framework","system"],"fam":["structural (adj)","structure (v)","restructure (v)"],"col":["social structure","power structure"],"ko":{"kok":"struere","kok_anlam":"üst üste dizmek, inşa etmek","dil":"Latince","parca":[["struct","dizmek, inşa etmek"],["-ure","isim eki"]],"yol":"Latince structura → Fransızca → İngilizce","imge":"Taşların belli bir düzende üst üste dizilmesi.","hikaye":"Latince struere, 'üst üste dizmek, inşa etmek' demektir. Structura, parçaları belli bir düzende birleştirerek kurulan yapıdır. Bir binanın parçaları arasındaki düzen, her karmaşık bütüne aktarılabilir. Sosyal bilimlerde structure, toplumun parçaları arasındaki kalıcı ilişkiler düzenidir.","tr_bag":"Türkçedeki 'strüktür' bu sözcükten, 'enstrüman' ise aynı struere kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"theory","pos":"n","sub":1,"tr":"kuram, teori","def":"a system of ideas intended to explain something","ex":"According to modernisation [theory], societies develop in stages.","syn":["hypothesis","thesis","model"],"fam":["theoretical (adj)","theorist (n)","theorise (v)"],"col":["in theory","social theory"],"ko":{"kok":"theorein","kok_anlam":"seyretmek, gözlemek","dil":"Yunanca","parca":[["theor","seyretmek, bakmak"],["-y","isim eki"]],"yol":"Yunanca theoria → Latince theoria → İngilizce","imge":"Olup biteni dikkatle seyreden bir gözlemci.","hikaye":"Yunanca theoria, 'seyretme, bakış' demektir. Bir şeye uzun uzun bakan, onun üzerine düşünmeye başlar. Theory bu yüzden gözlemden doğan ve olguları açıklamaya çalışan düşünceler sistemidir. Akademik metinde çoğu zaman practice 'uygulama' ile karşıt olarak kullanılır.","tr_bag":"Türkçedeki 'teori' bu sözcükten gelir; 'tiyatro' da Yunancada 'seyretmek' anlamlı akraba bir sözcükten türemiştir.","tuzak":null,"emin":"yüksek"}},{"w":"vary","pos":"v","sub":1,"tr":"değişmek, farklılık göstermek","def":"to differ in size, amount or degree; to change","ex":"Attitudes to marriage [vary] widely across cultures.","syn":["differ","fluctuate","range"],"fam":["variation (n)","variable (n, adj)","variety (n)","various (adj)"],"col":["vary from ... to","vary widely"],"ko":{"kok":"varius","kok_anlam":"çeşitli, alacalı","dil":"Latince","parca":[["vari (varius)","çeşitli, alacalı"],["-y","fiil sonu"]],"yol":"Latince variare → Eski Fransızca varier → İngilizce","imge":"Farklı renklerde beneklerle kaplı bir yüzey.","hikaye":"Latince varius, 'alacalı, çeşitli' demektir; variare de 'çeşitlendirmek, değiştirmek'tir. Tek renkli olmayan bir yüzey, noktadan noktaya farklılık gösterir. Vary bu yüzden 'değişmek, farklılık göstermek' anlamı taşır. Araştırmada variable 'değişken', variation 'değişim, çeşitlilik' demektir.","tr_bag":"Türkçedeki 'varyasyon' ve 'varyant' aynı kökten gelir.","tuzak":null,"emin":"yüksek"}},{"w":"achieve","pos":"v","sub":2,"tr":"başarmak, elde etmek, ulaşmak","def":"to succeed in reaching a goal through effort","ex":"Few countries have [achieved] full gender equality in pay.","syn":["attain","accomplish","reach"],"fam":["achievement (n)","achievable (adj)"],"col":["achieve a goal","achieve success"],"ko":{"kok":"caput","kok_anlam":"baş","dil":"Latince","parca":[["a- (ad-)","-e doğru"],["chieve (caput)","baş, uç"]],"yol":"Latince caput → Eski Fransızca achever → İngilizce","imge":"Bir işi başına, yani ucuna ve sonuna kadar götürmek.","hikaye":"Eski Fransızca achever 'bitirmek, sona erdirmek' demekti; kökünde Latince caput 'baş' vardır. Bir işi 'başa getirmek', onu tamamlamaktır. İngilizcede anlam 'emek vererek bir hedefe ulaşmak' yönünde gelişti. Akademik metinde achieve, amaçla sonuç arasındaki mesafenin kapandığını anlatır: achieve a goal, achieve success.","tr_bag":"Türkçedeki 'şef' (Fr. chef 'baş') de aynı caput kökünden gelir.","tuzak":"achieve doğrudan nesne alır (achieve a goal); 'achieve to do' biçimi yanlıştır, onun yerine 'manage to do' ya da 'succeed in doing' kullanılır.","emin":"yüksek"}},{"w":"acquire","pos":"v","sub":2,"tr":"edinmek, kazanmak","def":"to gain or obtain something, especially knowledge or skills","ex":"Children [acquire] language through interaction with others.","syn":["obtain","gain","get"],"fam":["acquisition (n)","acquired (adj)"],"col":["acquire skills","language acquisition"],"ko":{"kok":"quaerere","kok_anlam":"aramak, istemek","dil":"Latince","parca":[["ac- (ad-)","-e doğru, üstüne"],["quire (quaerere)","aramak, istemek"]],"yol":"Latince acquirere → Fransızca → İngilizce","imge":"Aradığı şeyi bulup kendine katan biri.","hikaye":"Latince acquirere, 'arayıp bulmak, üstüne eklemek' anlamındaydı. Aranan şey ele geçince kişinin varlığına eklenir. Bugün acquire, özellikle bilgi, beceri ya da alışkanlığın zamanla edinilmesini anlatır. Dilbilimde language acquisition 'dil edinimi' bu kullanımın en bilinen örneğidir.","tr_bag":null,"tuzak":"acquire 'edinmek', require 'gerektirmek', inquire 'sormak' aynı kökten gelse de anlamları farklıdır; sınavda sık karıştırılır.","emin":"yüksek"}},{"w":"administrate","pos":"v","sub":2,"tr":"yönetmek, idare etmek","def":"to manage the operation of an organisation or system","ex":"The funds are [administrated] by a regional board.","syn":["manage","run","direct"],"fam":["administration (n)","administrative (adj)","administrator (n)","administer (v)"],"col":["public administration","administrative staff"],"ko":{"kok":"ministrare","kok_anlam":"hizmet etmek","dil":"Latince","parca":[["ad-","-e doğru"],["ministr (ministrare)","hizmet etmek"],["-ate","fiil eki"]],"yol":"Latince administrare → İngilizce","imge":"Birinin işlerini görmek için başında hizmet eden bir görevli.","hikaye":"Latince administrare, 'birine hizmet etmek, bir işi görmek' demektir; minister 'hizmetkâr' ile aynı kökü paylaşır. Başkasının işini görmek zamanla bir kurumun işlerini çekip çevirmeye dönüştü. Yönetim burada bir hizmet olarak düşünülür. Kamu yönetimi karşılığı olan public administration bu kökün akademik yüzüdür.","tr_bag":"Türkçede kullanılan 'admin' kısaltması, aynı kökten gelen administrator sözcüğündendir.","tuzak":"Günlük İngilizcede administer daha yaygındır ve 'uygulamak' anlamı da taşır (administer a test, administer a drug); administrate bu anlamda kullanılmaz.","emin":"yüksek"}},{"w":"affect","pos":"v","sub":2,"tr":"etkilemek","def":"to have an influence on someone or something","ex":"Rising rents mainly [affect] young and low-income tenants.","syn":["influence","impact","alter"],"fam":["affected (adj)","affective (adj: duygusal)"],"col":["be affected by","adversely affect"],"ko":{"kok":"facere","kok_anlam":"yapmak","dil":"Latince","parca":[["af- (ad-)","-e, üstüne"],["fect (facere)","yapmak"]],"yol":"Latince kökenli (afficere, affectus)","imge":"Birine bir şey yapıp onun üzerinde iz bırakmak.","hikaye":"Latince afficere, 'birine bir şey yapmak, onu bir duruma sokmak' anlamındaydı. Bir şeye dışarıdan yapılan etki onu değiştirir. İngilizcede affect, bir değişkenin başka bir değişken üzerindeki etkisini anlatan temel fiildir. Psikolojideki affect 'duygulanım' da kişinin bir şeyden etkilenmiş hâlini adlandırır.","tr_bag":"Türkçedeki 'efekt' ve 'faktör' de aynı facere 'yapmak' kökünden gelir.","tuzak":"affect çoğunlukla fiildir (etkilemek), effect çoğunlukla isimdir (etki); 'have an effect on' ile 'affect' aynı anlamı verir.","emin":"yüksek"}},{"w":"appropriate","pos":"adj","sub":2,"tr":"uygun, yerinde","def":"suitable or proper in a particular situation","ex":"Researchers must choose an [appropriate] sample size.","syn":["suitable","proper","fitting"],"fam":["appropriately (adv)","inappropriate (adj)","appropriate (v: el koymak)"],"col":["appropriate for","it is appropriate to"],"ko":{"kok":"proprius","kok_anlam":"kendine ait, özgü","dil":"Latince","parca":[["ap- (ad-)","-e doğru"],["propri (proprius)","kendine ait"],["-ate","sıfat/fiil eki"]],"yol":"Latince kökenli (Geç Latince appropriare)","imge":"Bir şeyi alıp kendine ait kılmak.","hikaye":"Geç Latince appropriare, 'bir şeyi kendine mal etmek' demekti; kökünde proprius 'kendine ait' vardır. Bir duruma ait olan, ona özgü olan şey o duruma uygun düşer. Sıfat olarak appropriate bu 'yerine ait olma' fikrinden 'uygun, yerinde' anlamına ulaşır. Fiil olarak ise hâlâ 'sahiplenmek, el koymak' anlamını taşır.","tr_bag":null,"tuzak":"Fiil olan appropriate 'el koymak, sahiplenmek' demektir (appropriate funds); sıfatla karıştırılınca cümle yanlış anlaşılır.","emin":"yüksek"}},{"w":"aspect","pos":"n","sub":2,"tr":"yön, boyut, açı","def":"a particular part or feature of something","ex":"Language is a central [aspect] of cultural identity.","syn":["facet","feature","dimension"],"fam":[],"col":["an important aspect of","in all aspects"],"ko":{"kok":"specere","kok_anlam":"bakmak","dil":"Latince","parca":[["a- (ad-)","-e doğru"],["spect (specere)","bakmak"]],"yol":"Latince aspectus → İngilizce","imge":"Bir şeye belli bir yerden bakan göz.","hikaye":"Latince aspectus, 'bakış, görünüş' anlamındadır ve aspicere 'bakmak' fiilinden gelir. Bir nesneye hangi yönden bakarsanız onun o yüzünü görürsünüz. Buradan aspect, bir konunun ayrı ayrı ele alınabilen yönlerinden biri oldu. Akademik metinde 'social aspects of...' gibi ifadeler bu bakış açısını taşır.","tr_bag":"Türkçedeki 'perspektif' de aynı specere 'bakmak' kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"assist","pos":"v","sub":2,"tr":"yardım etmek","def":"to help someone do something","ex":"Volunteers [assisted] refugees in finding accommodation.","syn":["help","aid","support"],"fam":["assistance (n)","assistant (n)"],"col":["assist in","assist with"],"ko":{"kok":"sistere","kok_anlam":"durmak, durdurmak","dil":"Latince","parca":[["as- (ad-)","yanında, -e"],["sist (sistere)","durmak"]],"yol":"Latince assistere → Fransızca → İngilizce","imge":"Birinin yanında durup ona destek olan biri.","hikaye":"Latince assistere, 'yanında durmak' demektir. Birinin yanında durmak, ona gerektiğinde el uzatmaya hazır olmaktır. İngilizcede assist 'yardım etmek' anlamına yerleşti. Bir işi asıl yapan kişiye destek veren kişiye assistant denmesi de bu yan yana duruş imgesinden gelir.","tr_bag":"Türkçedeki 'asistan' aynı kökten gelir.","tuzak":"assist nesneyi doğrudan alır: 'assist someone in/with something'; 'assist to someone' yanlıştır.","emin":"yüksek"}},{"w":"category","pos":"n","sub":2,"tr":"kategori, ulam","def":"a class or group of things with shared characteristics","ex":"Respondents were divided into three age [categories].","syn":["class","group","type"],"fam":["categorise (v)","categorical (adj: kesin)"],"col":["fall into a category"],"ko":{"kok":"kategoria","kok_anlam":"suçlama; bir şey hakkında ileri sürülen yüklem","dil":"Yunanca","parca":[["kata","karşı, aşağı"],["agoreuein","topluluk önünde konuşmak (agora 'meydan')"]],"yol":"Yunanca kategoria → Latince → İngilizce","imge":"Meydanda birine karşı bir şey ileri süren konuşmacı.","hikaye":"Yunanca kategorein, 'birine karşı meydanda konuşmak, suçlamak' anlamındaydı. Felsefede bu, bir şey hakkında 'söylenebilecek olan' yani yüklem anlamını kazandı. Bir varlık hakkında söylenebileceklerin temel türlerine kategoria dendi. Bugün category, ortak özellikleri olan şeylerin toplandığı sınıftır.","tr_bag":"Türkçedeki 'kategori' aynı kelimedir; 'agora' da aynı agoreuein fiiliyle ilişkilidir.","tuzak":null,"emin":"yüksek"}},{"w":"chapter","pos":"n","sub":2,"tr":"bölüm; (tarihte) dönem","def":"a main division of a book; a distinct period","ex":"The second [chapter] reviews the literature on migration.","syn":["section","part","period"],"fam":[],"col":["in chapter two","a new chapter in"],"ko":{"kok":"capitulum","kok_anlam":"küçük baş, başlık","dil":"Latince","parca":[["capit (caput)","baş"],["-ulum","küçültme eki"]],"yol":"Latince capitulum → Eski Fransızca chapitre → İngilizce","imge":"Bir metin bölümünün başına konmuş küçük bir başlık.","hikaye":"Latince capitulum, caput 'baş' kelimesinin küçültülmüş biçimidir ve 'küçük baş' demektir. Metinlerde bir bölümün başındaki başlığa bu ad verildi. Zamanla ad, başlığın yönettiği bölümün kendisine geçti. Tarih yazımında 'a new chapter' ifadesi, kitaptaki bölüm imgesini bir dönem için kullanır.","tr_bag":"Türkçedeki 'kapital' ve 'kaptan' da aynı caput 'baş' kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"commission","pos":"n","sub":2,"tr":"komisyon, kurul; görevlendirme","def":"an official group given a particular task; a formal request to do a piece of work","ex":"A [commission] was set up to investigate the causes of the riots.","syn":["committee","board","council"],"fam":["commission (v: sipariş etmek, görevlendirmek)","commissioner (n)"],"col":["set up a commission","European Commission"],"ko":{"kok":"mittere","kok_anlam":"göndermek","dil":"Latince","parca":[["com-","birlikte, tamamen"],["miss (mittere)","göndermek"],["-ion","isim eki"]],"yol":"Latince commissio → Fransızca → İngilizce","imge":"Bir işi yapması için birine yetki verip onu yola çıkarmak.","hikaye":"Latince committere, 'bir araya koymak, emanet etmek' anlamındadır ve mittere 'göndermek' fiilinden gelir. Bir işi birine emanet etmek, onu o işle görevlendirmektir. Bu görev bir kurula verildiğinde commission 'kurul, komisyon' anlamını aldı. Aracıya işi için verilen pay da aynı adla anılır.","tr_bag":"Türkçedeki 'komisyon' ve 'misyon' aynı mittere kökünden gelir.","tuzak":"'A study commissioned by the ministry' ifadesinde commission 'ısmarlamak, yaptırmak' demektir; çalışmayı bakanlık yapmamış, yaptırmıştır.","emin":"yüksek"}},{"w":"complex","pos":"adj","sub":2,"tr":"karmaşık, çok yönlü","def":"consisting of many connected parts; difficult to understand","ex":"Migration is a [complex] process shaped by many factors.","syn":["complicated","intricate","elaborate"],"fam":["complexity (n)","complex (n: kompleks)"],"col":["highly complex","a complex issue"],"ko":{"kok":"plectere","kok_anlam":"örmek","dil":"Latince","parca":[["com-","birlikte"],["plex (plectere)","örmek, bükmek"]],"yol":"Latince complexus → İngilizce","imge":"Birbirine örülmüş, iç içe geçmiş iplikler.","hikaye":"Latince complexus, complecti 'sarmak, kucaklamak' fiilinden gelir; içinde plectere 'örmek' vardır. Birbirine örülmüş parçalar kolayca ayrılmaz. Buradan complex, çok sayıda bağlantılı parçadan oluşan ve bu yüzden kavraması zor olan şeyi anlatır. Aynı ailedeki complexity 'karmaşıklık' sosyal bilimlerde sık geçen bir terimdir.","tr_bag":"Türkçedeki 'kompleks' aynı kelimedir.","tuzak":"Türkçede 'kompleks' çoğu zaman 'aşağılık kompleksi' gibi psikolojik anlamda düşünülür; sıfat olarak complex 'karmaşık, çok parçalı' demektir.","emin":"yüksek"}},{"w":"compute","pos":"v","sub":2,"tr":"hesaplamak","def":"to calculate a figure or amount","ex":"The index was [computed] using data from 30 countries.","syn":["calculate","work out","reckon"],"fam":["computation (n)","computational (adj)"],"col":["compute the average"],"ko":{"kok":"putare","kok_anlam":"hesaplamak, düşünmek","dil":"Latince","parca":[["com-","birlikte"],["pute (putare)","hesaplamak"]],"yol":"Latince computare → İngilizce","imge":"Sayıları bir araya getirip toplamı çıkaran biri.","hikaye":"Latince computare, 'birlikte hesaplamak, toplamak' demektir. Sayıları bir araya getirmek bir sonuca ulaşmanın en somut yoludur. Bugün compute, özellikle hesap yoluyla bir değer bulmayı anlatır. Hesap yapan makinelerin adı olan computer da bu fiilden türemiştir.","tr_bag":"Türkçedeki 'kontör' (Fr. compteur 'sayaç') aynı computare kökünden gelir; İngilizce count da öyledir.","tuzak":null,"emin":"yüksek"}},{"w":"conclude","pos":"v","sub":2,"tr":"sonuca varmak; sonuçlandırmak","def":"to arrive at a judgement by reasoning; to bring something to an end","ex":"The authors [conclude] that the policy had little effect.","syn":["infer","deduce","finish"],"fam":["conclusion (n)","conclusive (adj: kesin)"],"col":["conclude that","conclude an agreement"],"ko":{"kok":"claudere","kok_anlam":"kapamak","dil":"Latince","parca":[["con- (com-)","tamamen"],["clude (claudere)","kapamak"]],"yol":"Latince concludere → İngilizce","imge":"Açık kalan bir kapıyı sıkıca kapatmak.","hikaye":"Latince concludere, 'tamamen kapamak, kuşatmak' anlamındaydı. Bir tartışmayı kapatmak, onu bir sonuca bağlamaktır. Buradan conclude hem 'bitirmek' hem de 'akıl yürüterek bir yargıya varmak' anlamını taşır. Makalelerin son bölümüne conclusion denmesi bu kapanış imgesindendir.","tr_bag":null,"tuzak":null,"emin":"yüksek"}},{"w":"conduct","pos":"v","sub":2,"tr":"yürütmek, yapmak, yönetmek","def":"to organise and carry out an activity","ex":"The interviews were [conducted] in Turkish.","syn":["carry out","perform","undertake"],"fam":["conduct (n: davranış)","conductor (n)"],"col":["conduct research","conduct a survey"],"ko":{"kok":"ducere","kok_anlam":"yönetmek, götürmek","dil":"Latince","parca":[["con- (com-)","birlikte"],["duct (ducere)","götürmek, yönetmek"]],"yol":"Latince conducere → İngilizce","imge":"Bir topluluğu önüne katıp birlikte götüren kişi.","hikaye":"Latince conducere, 'bir araya getirip götürmek' demektir. Bir grubu yönlendiren kişi, işin nasıl yürüyeceğini de belirler. Bu yüzden conduct 'yürütmek, yönetmek' anlamını aldı: conduct a study, conduct research. Orkestra şefine conductor denmesi de aynı yönlendirme imgesindendir.","tr_bag":"Türkçedeki 'kondüktör' aynı ducere kökünden gelir.","tuzak":"İsim olan conduct 'davranış' demektir (code of conduct); fiilde vurgu ikinci hecede, isimde ilk hecededir.","emin":"yüksek"}},{"w":"consequent","pos":"adj","sub":2,"tr":"sonucunda ortaya çıkan, bundan doğan","def":"following as a result of something","ex":"The factory closed, with [consequent] job losses in the town.","syn":["resulting","ensuing","subsequent"],"fam":["consequence (n)","consequently (adv: sonuç olarak)"],"col":["as a consequence","consequently"],"ko":{"kok":"sequi","kok_anlam":"izlemek, ardından gelmek","dil":"Latince","parca":[["con- (com-)","birlikte"],["sequ (sequi)","izlemek"],["-ent","sıfat eki"]],"yol":"Latince consequens → İngilizce","imge":"Bir olayın hemen ardından ona eşlik ederek gelen başka bir olay.","hikaye":"Latince consequi, 'ardından gelmek, izlemek' demektir. Bir şeyin arkasından gelen şey, çoğu zaman ondan doğan şeydir. Buradan consequent 'sonucu olarak ortaya çıkan' anlamını kazandı. Aynı ailedeki consequence 'sonuç' ve consequently 'bu nedenle' akademik metinde neden-sonuç bağlantısı kurar.","tr_bag":"Türkçedeki 'sekans' (sıralı ardışıklık) aynı sequi kökünden gelir.","tuzak":"consequent 'bundan doğan' demektir, subsequent ise yalnızca 'sonraki'dir; subsequent neden-sonuç ilişkisi bildirmez.","emin":"yüksek"}},{"w":"construct","pos":"v","sub":2,"tr":"inşa etmek; kurmak, oluşturmak","def":"to build something; to form an idea or theory","ex":"Identity is socially [constructed] through interaction.","syn":["build","create","form"],"fam":["construction (n)","constructive (adj: yapıcı)","construct (n: yapı, kavram)"],"col":["socially constructed","construct a model"],"ko":{"kok":"struere","kok_anlam":"yığmak, dizmek","dil":"Latince","parca":[["con- (com-)","birlikte"],["struct (struere)","yığmak, dizmek"]],"yol":"Latince construere → İngilizce","imge":"Taşları üst üste dizerek bir yapı yükseltmek.","hikaye":"Latince construere, 'bir araya yığmak, inşa etmek' demektir. Somut olarak binaya uygulanan bu fikir, düşünceye de uygulanır: kavramlar da parça parça kurulur. Sosyal bilimlerde construct, doğrudan gözlenemeyen ve kuramla kurulan kavramı adlandırır (ör. zekâ, kaygı). Social constructionism de gerçekliğin toplumsal olarak kurulduğunu savunur.","tr_bag":"Türkçedeki 'strüktür' ve 'konstrüksiyon' aynı struere kökünden gelir.","tuzak":"İsim olan construct 'kuramsal yapı, kavram' demektir; 'inşaat' anlamına gelmez.","emin":"yüksek"}},{"w":"consume","pos":"v","sub":2,"tr":"tüketmek","def":"to use up resources; to eat or drink","ex":"Rich countries [consume] a disproportionate share of energy.","syn":["use up","deplete","exhaust"],"fam":["consumption (n)","consumer (n)","consumerism (n)"],"col":["consume resources","energy consumption"],"ko":{"kok":"sumere","kok_anlam":"almak","dil":"Latince","parca":[["con- (com-)","tamamen"],["sume (sumere)","almak"]],"yol":"Latince consumere → Fransızca → İngilizce","imge":"Bir şeyi alıp sonuna kadar bitirmek.","hikaye":"Latince consumere, 'tamamen almak, tüketip bitirmek' demektir. Bir kaynağı alıp kullandıkça o kaynak azalır. İngilizcede consume hem yiyecek-içecek tüketmeyi hem de zaman, enerji gibi kaynakların harcanmasını anlatır. Ekonomi ve sosyolojideki consumer 'tüketici' ve consumption 'tüketim' bu fiilden türemiştir.","tr_bag":null,"tuzak":null,"emin":"yüksek"}},{"w":"distinct","pos":"adj","sub":2,"tr":"belirgin; ayrı, farklı","def":"clearly noticeable; recognisably different","ex":"The study identified two [distinct] groups of voters.","syn":["separate","different","clear"],"fam":["distinction (n)","distinctive (adj: kendine özgü)","distinctly (adv)"],"col":["distinct from","a distinct possibility"],"ko":{"kok":"stinguere","kok_anlam":"(sivri uçla) işaretlemek","dil":"Latince","parca":[["di- (dis-)","ayrı"],["stinct (stinguere)","işaretlemek"]],"yol":"Latince distinctus → İngilizce","imge":"Karışmasınlar diye ayrı ayrı işaretlenmiş şeyler.","hikaye":"Latince distinguere, 'ayırmak, ayırt etmek' demektir; parçaları işaretleyerek birbirinden ayırma imgesi taşır. Ayrılmış olan şeyler artık açıkça fark edilir. Buradan distinct hem 'ayrı, farklı' hem de 'belirgin' anlamını aldı. Akademik metinde 'two distinct groups' gibi ifadeler bu ayrımı vurgular.","tr_bag":null,"tuzak":"distinct 'ayrı, belirgin' demektir; distinctive ise 'ayırt edici, kendine özgü' anlamındadır (a distinctive feature).","emin":"y
