)","oturmak"],["-y","isim eki"]],"yol":"Latince subsidium → Anglo-Fransızca → İngilizce","imge":"Arka safta oturup yardıma çağrılmayı bekleyen yedek kuvvet.","hikaye":"Latince subsidium 'yedek kuvvet, yardım' demektir; sub 'geride' ile sedere 'oturmak' kökünden gelir. Geride bekleyen yedek kuvvet gerektiğinde destek verir. Anlam 'destek, yardım'a, oradan da devletin verdiği mali desteğe geçmiştir. Türkçe karşılığı sübvansiyon ise farklı bir Latince kökten gelir.","tr_bag":"Türkçedeki 'seans', Fransızca séance üzerinden aynı sedere 'oturmak' kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"tape","pos":"n","sub":6,"tr":"bant, kaset","def":"a strip of material for recording sound or for fastening","ex":"The interviews were recorded on [tape] and transcribed.","syn":["recording","cassette"],"fam":["tape (v: kaydetmek)"],"col":["red tape (bürokratik engel)"],"ko":{"kok":"tæppe (eski i̇ngilizce)","kok_anlam":"şerit, bant","dil":"Germen","parca":[["tape","şerit"]],"yol":"Germen kökenli (Eski İngilizce)","imge":"Uzun, dar bir kumaş şeridi.","hikaye":"Tape, Eski İngilizcedeki 'şerit' anlamında bir kelimeden gelir; daha eski kökeni kesin değildir. Önce bağlamaya yarayan kumaş şeritti. Sonra yapışkan bant ve ses kaydedilen manyetik şerit anlamlarını kazanmıştır. 'Red tape' deyimi 'bürokratik engel' demektir.","tr_bag":"Türkçedeki 'teyp' İngilizce tape kelimesinden gelir.","tuzak":"'Red tape' kırmızı bant değil, bürokrasi ve kırtasiyecilik demektir.","emin":"orta"}},{"w":"trace","pos":"v","sub":6,"tr":"izini sürmek, kökenini bulmak","def":"to find the origin or development of something","ex":"The roots of the conflict can be [traced] back to the colonial era.","syn":["track","follow","find"],"fam":["trace (n: iz)"],"col":["trace back to"],"ko":{"kok":"trahere","kok_anlam":"çekmek","dil":"Latince","parca":[["trac (trahere)","çekmek, çizgi"]],"yol":"Latince trahere → Eski Fransızca tracier → İngilizce","imge":"Yerde sürüklenen bir şeyin bıraktığı çizgi.","hikaye":"Eski Fransızca tracier 'çizmek, izini sürmek', Latince tractus 'çekme, çizgi' üzerinden trahere 'çekmek' fiiline dayanır. Çekilen şey arkasında bir iz bırakır. O izi takip etmek bir şeyin kökenine ulaşmaktır. Akademik metinde trace, bir olgunun gelişimini geriye doğru izlemeyi anlatır: 'to trace the origins of'.","tr_bag":"Türkçedeki 'trase' (yol güzergâhı) ve 'traktör' aynı trahere kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"transform","pos":"v","sub":6,"tr":"dönüştürmek","def":"to make a marked change in form or character","ex":"Industrialisation [transformed] rural societies.","syn":["change","convert","alter"],"fam":["transformation (n)","transformative (adj)"],"col":["transform into"],"ko":{"kok":"forma","kok_anlam":"biçim","dil":"Latince","parca":[["trans-","öte, bir yandan öbür yana"],["form","biçim"]],"yol":"Latince transformare → Fransızca → İngilizce","imge":"Bir biçimden çıkıp başka bir biçime geçmek.","hikaye":"Latince transformare, trans 'öte' ile forma 'biçim' birleşimidir ve 'biçimini değiştirmek' demektir. Bir şeyin bir biçimden öbürüne geçmesi onun dönüşmesidir. Akademik metinde transform, toplumun, ekonominin ya da bir kurumun köklü değişimini anlatır. İsmi transformation 'dönüşüm'dür.","tr_bag":"Türkçedeki 'form' ve 'transformatör' (trafo) aynı kökten gelir.","tuzak":null,"emin":"yüksek"}},{"w":"transport","pos":"n","sub":6,"tr":"ulaşım, taşımacılık","def":"a system for carrying people or goods","ex":"Public [transport] is poor in many peripheral districts.","syn":["transportation","conveyance","transit"],"fam":["transport (v)"],"col":["public transport"],"ko":{"kok":"portare","kok_anlam":"taşımak","dil":"Latince","parca":[["trans-","öte, karşıya"],["port","taşımak"]],"yol":"Latince transportare → İngilizce","imge":"Bir yükü sırtlayıp karşı yakaya taşımak.","hikaye":"Latince transportare, trans 'karşıya' ile portare 'taşımak' birleşimidir. Bir şeyi bir yerden öbür yere taşımak demektir. İsim olarak insanları ve malları taşıyan sistemi, yani ulaşımı anlatır. Aynı kökten import 'ithal etmek' ve export 'ihraç etmek' gelir.","tr_bag":"Türkçedeki 'portatif' ve 'transport' aynı portare kökünden gelir.","tuzak":"İngiliz İngilizcesinde transport, Amerikan İngilizcesinde transportation daha yaygındır; anlamları aynıdır.","emin":"yüksek"}},{"w":"underlie","pos":"v","sub":6,"tr":"temelini oluşturmak, altında yatmak","def":"to be the cause or basis of something","ex":"Economic inequality [underlies] many social problems.","syn":["be the basis of","cause","support"],"fam":["underlying (adj: altta yatan)"],"col":["underlying causes"],"ko":{"kok":"under + lie","kok_anlam":"altında + yatmak","dil":"Germen","parca":[["under","altında"],["lie","yatmak, durmak"]],"yol":"Germen kökenli (Eski İngilizce)","imge":"Bir yapının altında yatan temel taşları.","hikaye":"Underlie, under 'altında' ile lie 'yatmak' birleşimidir. Bir şeyin altında yatan şey onun temelidir. Akademik metinde underlie, bir olgunun görünmeyen nedenini anlatır. En sık 'underlying' sıfatıyla görülür: 'the underlying causes of poverty'.","tr_bag":null,"tuzak":"Underlie düzensiz fiildir (underlay, underlain); underline 'altını çizmek' ile karıştırılmamalıdır.","emin":"yüksek"}},{"w":"utilise","pos":"v","sub":6,"tr":"kullanmak, yararlanmak","def":"to make practical and effective use of","ex":"The study [utilised] both qualitative and quantitative data.","syn":["use","employ","exploit"],"fam":["utilisation (n)","utility (n: fayda)","US: utilize"],"col":["utilise resources"],"ko":{"kok":"uti","kok_anlam":"kullanmak","dil":"Latince","parca":[["util (utilis)","yararlı"],["-ise","fiil eki (-leştirmek)"]],"yol":"Latince utilis → Fransızca utiliser → İngilizce","imge":"Bir aletin yararlı olduğu işte kullanılması.","hikaye":"Latince uti 'kullanmak' fiilinden utilis 'yararlı' türer. Fransızca utiliser üzerinden İngilizceye geçen utilise, bir şeyi yararlı biçimde kullanmak demektir. Akademik metinde use kelimesinin daha resmî karşılığıdır. Aynı kökten utility 'fayda' ve utilitarianism 'faydacılık' gelir.","tr_bag":null,"tuzak":"Amerikan yazımı utilize, İngiliz yazımı utilise'dır; ikisi aynı kelimedir.","emin":"yüksek"}}];

/* ================= Yardımcılar ================= */
const $ = s => document.querySelector(s);
const alan = $("#alan");
const POS = { n: "isim", v: "fiil", adj: "sıfat", adv: "zarf", conj: "bağlaç" };
const ARALIK = [0, 1, 3, 7, 16, 35];          // Leitner kutusuna göre gün
const KALICI_KUTU = 4;                        // 16+ gün aralığına ulaşan kelime "kalıcı"
const DEPO = "yokdil-kelime-v1";
const HARF = ["A", "B", "C", "D", "E"];

function kacis(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function ornekHtml(ex) { return kacis(ex).replace(/\[(.+?)\]/g, "<b>$1</b>"); }
function karistir(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function gun(d = new Date()) { return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); }
function gunEtiketi(g) { return new Date(g * 86400000).toLocaleDateString("tr-TR", { weekday: "short", timeZone: "UTC" }); }
const BUGUN = () => gun();
const sozluk = Object.fromEntries(KELIMELER.map(k => [k.w, k]));

/* ================= Durum ================= */
const VARSAYILAN = { srs: {}, fav: [], log: {}, yol: {}, cumle: {}, ayar: { yeniGunluk: 15, hedef: 30, alt: [1, 2, 3, 4, 5, 6] } };
let durum = JSON.parse(JSON.stringify(VARSAYILAN));
try {
  const k = JSON.parse(localStorage.getItem(DEPO));
  if (k) durum = { ...durum, ...k, ayar: { ...durum.ayar, ...(k.ayar || {}) } };
} catch (e) {}
function kaydet() { try { localStorage.setItem(DEPO, JSON.stringify(durum)); } catch (e) {} }

function kayit(w) { return durum.srs[w]; }
function kutu(w) { return durum.srs[w] ? durum.srs[w].b : -1; }
function durumu(w) { const b = kutu(w); return b < 0 ? "yeni" : b >= KALICI_KUTU ? "kalici" : "ogren"; }
function gunLog() { const g = BUGUN(); return durum.log[g] || (durum.log[g] = { rev: 0, yeni: 0, d: 0, y: 0 }); }

function aktifKelimeler() { return KELIMELER.filter(k => durum.ayar.alt.includes(k.sub)); }
function vadesiGelen() { const g = BUGUN(); return aktifKelimeler().filter(k => durum.srs[k.w] && durum.srs[k.w].due <= g); }
function yeniKelimeler() { return aktifKelimeler().filter(k => !durum.srs[k.w]); }
function bugunYeniHakki() { return Math.max(0, durum.ayar.yeniGunluk - gunLog().yeni); }

function puanla(w, sonuc) {
  // sonuc: 0 = tekrar, 1 = zor, 2 = bildim
  const g = BUGUN();
  const r = durum.srs[w] || { b: 0, due: g, dogru: 0, yanlis: 0, ilk: g };
  const yeniMi = !durum.srs[w];
  if (sonuc === 0) { r.b = 0; r.yanlis++; }
  else if (sonuc === 1) { r.b = Math.max(1, r.b); r.dogru++; }
  else { r.b = Math.min(ARALIK.length - 1, r.b + 1); r.dogru++; }
  r.due = g + ARALIK[r.b];
  r.son = g;
  durum.srs[w] = r;
  const l = gunLog();
  l.rev++; if (yeniMi) l.yeni++;
  if (sonuc === 0) l.y++; else l.d++;
  kaydet();
}
function testSonucu(w, dogruMu) {
  const g = BUGUN(), l = gunLog();
  if (dogruMu) l.d++; else l.y++;
  const r = durum.srs[w];
  if (!dogruMu) {
    const yeni = r || { b: 0, due: g, dogru: 0, yanlis: 0, ilk: g };
    yeni.b = 0; yeni.due = g; yeni.yanlis++;
    durum.srs[w] = yeni;
  } else if (r) { r.dogru++; }
  kaydet();
}
function seri() {
  let g = BUGUN(), n = 0;
  if (!(durum.log[g] && durum.log[g].rev + durum.log[g].d + durum.log[g].y > 0)) g--;
  while (durum.log[g] && (durum.log[g].rev + durum.log[g].d + durum.log[g].y) > 0) { n++; g--; }
  return n;
}

// Hedefle anlamca yakın kelimeleri çeldirici yapma: iki doğru cevaplı soru oluşmasın
function yakinMi(x, k) {
  const a = new Set([k.w, ...k.syn].map(s => s.toLowerCase()));
  return a.has(x.w.toLowerCase()) || x.syn.some(s => a.has(s.toLowerCase()));
}
function celdirici(k, alanAdi, sayi, havuz = KELIMELER) {
  const uygun = havuz.filter(x => x.w !== k.w && !yakinMi(x, k));
  const ayni = karistir(uygun.filter(x => x.pos === k.pos));
  const diger = karistir(uygun.filter(x => x.pos !== k.pos));
  const out = [];
  for (const x of ayni.concat(diger)) {
    if (out.length === sayi) break;
    const v = x[alanAdi];
    if (v !== k[alanAdi] && !out.includes(v)) out.push(v);
  }
  return out;
}
function soruUret(k, tip) {
  if (tip === "yokdil") {
    const cumle = kacis(k.ex).replace(/\[(.+?)\]/, '<span class="bosluk">&nbsp;</span>');
    const s = karistir([k.w, ...celdirici(k, "w", 4)]);
    return { k, tip, baslik: "Boşluğa en uygun kelimeyi seçin.", soru: cumle, secenekler: s, dogru: k.w, not: "Seçenekler sözlük biçimindedir; cümlede çekimli hâli gerekebilir." };
  }
  if (tip === "esanlam" && k.syn.length) {
    const hedef = k.syn[0];
    const yasak = new Set([k.w, ...k.syn].map(s => s.toLowerCase()));
    const aday = karistir(KELIMELER.filter(x => x.w !== k.w && x.pos === k.pos && x.syn.length && !yakinMi(x, k)))
      .map(x => x.syn[0]).filter(s => !yasak.has(s.toLowerCase()));
    const cel = [...new Set(aday)].slice(0, 4);
    if (cel.length === 4) {
      return { k, tip, baslik: "Anlamca en yakın olanı seçin.", soru: `<span class="anahtar">${kacis(k.w)}</span> <span class="etiket">${POS[k.pos]}</span>`, secenekler: karistir([hedef, ...cel]), dogru: hedef };
    }
  }
  if (tip === "en") {
    return { k, tip, baslik: "Türkçe karşılığı verilen kelimeyi seçin.", soru: `<span class="anahtar">${kacis(k.tr)}</span>`, secenekler: karistir([k.w, ...celdirici(k, "w", 3)]), dogru: k.w };
  }
  return { k, tip: "tr", baslik: "Türkçe karşılığını seçin.", soru: `<span class="anahtar">${kacis(k.w)}</span> <span class="etiket">${POS[k.pos]}</span>`, secenekler: karistir([k.tr, ...celdirici(k, "tr", 3)]), dogru: k.tr };
}
function testBaslat() {
  let havuz = aktifKelimeler();
  if (testAyar.kapsam === "calisilan") havuz = havuz.filter(k => durum.srs[k.w]);
  if (testAyar.kapsam === "fav") havuz = KELIMELER.filter(k => durum.fav.includes(k.w));
  if (havuz.length < 5) havuz = aktifKelimeler();
  const secim = karistir(havuz).slice(0, Math.min(testAyar.n, havuz.length));
  const tipler = ["yokdil", "esanlam", "tr", "en"];
  const sorular = secim.map((k, i) => soruUret(k, testAyar.mod === "karisik" ? tipler[i % 4] : testAyar.mod));
  test = { sorular, i: 0, cevaplar: [], basla: Date.now() };
  soruCiz();
}
function soruCiz() {
  if (test.i >= test.sorular.length) return testSonuc();
  const q = test.sorular[test.i];
  const dogruSay = test.cevaplar.filter(c => c.dogru).length;
  alan.innerHTML = `
    <div class="oturum-ust"><span class="etiket">Soru ${test.i + 1} / ${test.sorular.length}</span><span class="etiket">Doğru ${dogruSay}</span></div>
    <div class="cubuk"><span style="width:${test.i / test.sorular.length * 100}%"></span></div>
    <section class="kart">

        ${q.secenekler.map((s, j) => `<button class="secenek" type="button" data-j="${j}"><span class="harf">${HARF[j]})</span><span>${kacis(s)}</span></button>`).join("")}
      </div>

    </section>`;
  alan.querySelectorAll(".secenek").forEach(b => b.onclick = () => cevapla(+b.dataset.j));
}
function cevapla(j) {
  const q = test.sorular[test.i];
  if (test.cevaplar[test.i]) return;
  const dogru = q.secenekler[j] === q.dogru;
  test.cevaplar[test.i] = { dogru, secilen: q.secenekler[j] };
  testSonucu(q.k.w, dogru);
  alan.querySelectorAll(".secenek").forEach(b => {
    b.disabled = true;
    const s = q.secenekler[+b.dataset.j];
    if (s === q.dogru) b.classList.add("dogru");
    else if (+b.dataset.j === j) b.classList.add("yanlis");
  });
  $("#geri").innerHTML = `
    <p style="margin:0"><b style="color:${dogru ? "var(--dogru)" : "var(--yanlis)"}">${dogru ? "Doğru." : "Yanlış."}</b> <b>${kacis(q.k.w)}</b>: ${kacis(q.k.tr)}</p>
    <p class="ornek" style="font-size:16px;margin:8px 0 0">${ornekHtml(q.k.ex)}</p>
    <button class="btn ana genis" type="button" id="devam" style="margin-top:14px">${test.i + 1 < test.sorular.length ? "Sonraki soru" : "Sonucu gör"}</button>`;
  $("#devam").onclick = () => { test.i++; soruCiz(); };

}
function testSonuc() {
  const d = test.cevaplar.filter(c => c.dogru).length, n = test.sorular.length;
  const dk = Math.max(1, Math.round((Date.now() - test.basla) / 60000));

  $("#yeniden").onclick = testBaslat;

  alan.querySelectorAll("[data-kelime]").forEach(b => b.onclick = () => detayAc(b.dataset.kelime));

/* ================= Sözlük ================= */
let sozlukAyar = { q: "", filtre: "hepsi" };
function sozlukCiz() {

function normal(s) { return s.toLocaleLowerCase("tr-TR").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ı/g, "i"); }
function listeCiz() {
  const q = normal(sozlukAyar.q.trim());

    : `<div class="bos-durum">Aramana uyan kelime yok.</div>`;

/* ================= Alt sayfa: kelime ayrıntısı ================= */
function sayfaAc(html) {
  const arka = document.createElement("div");
  arka.className = "perde-arka";
  arka.innerHTML = `<div class="sayfa" role="dialog" aria-modal="true"><div class="tutamak"></div>${html}</div>`;
  arka.onclick = e => { if (e.target === arka) kapat(); };
  const kapat = () => { arka.remove(); document.removeEventListener("keydown", esc); if (ekran === "sozluk") listeCiz(); if (ekran === "bugun") bugunCiz(); };
  const esc = e => { if (e.key === "Escape") kapat(); };
  document.addEventListener("keydown", esc);
  document.body.appendChild(arka);
  return { kok: arka.querySelector(".sayfa"), kapat };
}
function detayAc(w) {
  const k = sozluk[w]; if (!k) return;
  const r = kayit(w);
  const { kok, kapat } = sayfaAc(`
    <article class="kart">${kelimeKarti(k, true, { ai: true })}</article>
    <div class="kart" style="margin-top:12px">
      <div class="satir" style="justify-content:space-between;margin-bottom:12px"><span class="seviye-rozet">${seviye(w) ? seviye(w) + ". basamak · " + BASAMAK[seviye(w) - 1].ad : "Henüz başlamadın"}</span>${k.ko ? `<button class="btn ana" type="button" data-yolculuk>${durum.cumle[w] ? "Yolculuğu yinele" : "Yolculuğa başla"}</button>` : ""}</div>

        <div><b>${r ? r.yanlis : 0}</b><span>yanlış</span></div>
        <div><b>${r ? (r.due <= BUGUN() ? "bugün" : (r.due - BUGUN()) + " gün") : "—"}</b><span>sonraki tekrar</span></div>
      </div>
      <div class="satir" style="margin-top:14px">
        <button class="btn" type="button" data-sifirla ${r ? "" : "disabled"}>Bu kelimeyi yeniden öğren</button>
        <button class="btn" type="button" data-kapat style="margin-left:auto">Kapat</button>
      </div>
    </div>`);
  kartBagla(kok, k);
  kok.querySelector("[data-kapat]").onclick = kapat;
  const yb = kok.querySelector("[data-yolculuk]");
  if (yb) yb.onclick = () => { kapat(); yolculukBasla(w); };
  kok.querySelector("[data-sifirla]").onclick = () => { durum.srs[w] = { ...(r || {}), b: 0, due: BUGUN(), dogru: r ? r.dogru : 0, yanlis: r ? r.yanlis : 0 }; kaydet(); toast("Kelime tekrar kutusuna alındı"); kapat(); };
  aiBagla(kok, k);
}

/* ================= İçselleştirme: basamaklar ================= */
const BASAMAK = [
  { ad: "Tanıma", acik: "ilk karşılaşma" },
  { ad: "Hatırlama", acik: "tekrarla geri çağırma" },
  { ad: "Anlamlandırma", acik: "kök, imge, hikâye" },
  { ad: "Bağlamda kullanma", acik: "doğru bağlamı seçme" },
  { ad: "Üretme", acik: "kendi cümlen" },
  { ad: "İçselleştirme", acik: "üretim + kalıcı bellek" }
];
function yolu(w) { return durum.yol[w] || (durum.yol[w] = {}); }
function seviye(w) {
  const r = durum.srs[w], y = durum.yol[w] || {}, c = durum.cumle[w];
  if (c && r && r.b >= KALICI_KUTU) return 6;
  if (c) return 5;
  if (y.baglam) return 4;
  if (y.anlam) return 3;
  if (r && r.b >= 2) return 2;
  if (r || y.gordu) return 1;
  return 0;
}
const KOKLER = {};
KELIMELER.forEach(k => { if (k.ko && k.ko.kok) (KOKLER[k.ko.kok] = KOKLER[k.ko.kok] || []).push(k.w); });
function akrabalar(k) { return k.ko ? (KOKLER[k.ko.kok] || []).filter(w => w !== k.w) : []; }
function parcaHtml(ko) {
  return `<div class="parcalar">${ko.parca.map((p, i) => `${i ? '<span class="parca-arti">+</span>' : ""}<div class="parca"><b>${kacis(p[0])}</b><span>${kacis(p[1])}</span></div>`).join("")}</div>`;
}
function kelimeGec(metin, w) {
  const kok = w.toLowerCase().slice(0, Math.max(4, w.length - 2));
  return new RegExp("\\b" + kok.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i").test(metin);
}
function merdivenHtml(liste) {
  const n = liste.length || 1;
  return `<div class="merdiven">${BASAMAK.map((b, i) => i).reverse().map(i => {
    const say = liste.filter(k => seviye(k.w) >= i + 1).length;
    return `<div class="basamak ${say ? "dolu" : ""}"><span class="no">${i + 1}</span><span class="ad">${BASAMAK[i].ad}<span>${BASAMAK[i].acik}</span></span><span class="say">${say}</span><span class="bar"><i style="width:${say / n * 100}%"></i></span></div>`;
  }).join("")}</div>`;
}
function gununKelimesi() {
  const aday = KELIMELER.filter(k => k.ko && durum.srs[k.w] && seviye(k.w) < 3);
  const havuz = aday.length ? aday : KELIMELER.filter(k => k.ko);
  return havuz[BUGUN() % havuz.length];
}

        ${ko.tr_bag ? `<div class="kutu-not"><b>Türkçeyle bağı</b>${kacis(ko.tr_bag)}</div>` : ""}
        ${akr.length ? `<div><div class="etiket">Aynı kökten, bu listede</div><div class="cipler" style="margin-top:8px">${akr.map(w => `<button class="cip" type="button" data-kelime="${kacis(w)}">${kacis(w)}</button>`).join("")}</div></div>` : ""}
        ${ko.emin === "orta" ? `<div class="kutu-not uyari"><b>Not</b>Bu kelimenin kökeniyle ilgili bazı ayrıntılar kaynaklar arasında tartışmalıdır. Yukarıdaki anlatım yerleşik olan kısmı özetler.</div>` : ""}
      </div>
      <button class="btn ana genis" type="button" id="ileri" style="margin-top:18px">Anladım, bağlama geç</button>`;
  } else if (a === 2) {
    if (!yolculuk.baglam) {
      const uygun = karistir(KELIMELER.filter(x => x.w !== k.w && x.pos !== k.pos && !yakinMi(x, k))).slice(0, 2);
      yolculuk.baglam = karistir([k, ...uygun]);
    }
    const c = yolculuk.cevap;
    govde = `
      <p class="ikincil" style="margin:0">Aşağıdaki cümlelerin hangisinde boşluğa <b>${kacis(k.w)}</b> (ya da çekimli hâli) gelmeli? Cümlenin geri kalanını tart.</p>
      <div class="secenekler" style="margin-top:14px">${yolculuk.baglam.map((x, j) => `<button class="secenek ${c !== null ? (x.w === k.w ? "dogru" : j === c ? "yanlis" : "") : ""}" type="button" data-b="${j}" ${c !== null ? "disabled" : ""} style="font-family:var(--serif);font-size:17px"><span class="harf">${HARF[j]})</span><span>${kacis(x.ex).replace(/\[(.+?)\]/, c !== null && x.w === k.w ? "<b>$1</b>" : "_____")}</span></button>`).join("")}</div>
      ${c !== null ? `
        <div class="bolumler" style="margin-top:14px">
          <div class="kutu-not"><b>${yolculuk.baglam[c].w === k.w ? "Doğru bağlam" : "Bu cümle başka bir kelimenin"}</b>${yolculuk.baglam[c].w === k.w ? "Cümlenin anlamı ve dil bilgisi kelimeyle örtüşüyor." : `Bu boşluğa <b>${kacis(yolculuk.baglam[c].w)}</b> (${kacis(POS[yolculuk.baglam[c].pos])}) gelir. ${kacis(k.w)} ise bir ${kacis(POS[k.pos])}.`}</div>
          ${k.col.length ? `<div><div class="etiket">Doğal kalıplar</div><p style="margin:4px 0 0">${k.col.map(kacis).join(" · ")}</p></div>` : ""}
          ${k.ko && k.ko.tuzak ? `<div class="kutu-not uyari"><b>Dikkat</b>${kacis(k.ko.tuzak)}</div>` : ""}
        </div>
        <button class="btn ana genis" type="button" id="ileri" style="margin-top:14px">Kendi cümleme geç</button>` : ""}`;
  } else if (a === 3) {
    const cer = {
      hayat: `Kendi hayatından bir durumu "${k.w}" ile anlat: bir karar, bir değişim ya da bir gözlem.`,
      alan: `Çalıştığın ya da ilgilendiğin alanda "${k.w}" nerede karşına çıkar? Bir cümleyle yaz.`,
      turkiye: `Türkiye'de gözlediğin bir toplumsal durumu "${k.w}" ile anlat.`
    };
    const eski = durum.cumle[k.w];
    govde = `
      <h2>Şimdi senin cümlen</h2>
      <p class="ikincil" style="margin-top:6px">Kendinle ilişkilendirdiğin bilgi daha iyi akılda kalır. İngilizce, kısa ve doğru bir cümle yeter.</p>
      <div class="cipler" style="margin-top:12px">${[["hayat", "Kendi hayatımdan"], ["alan", "Alanımdan"], ["turkiye", "Türkiye'den"]].map(([v, t]) => `<button class="cip" type="button" data-cer="${v}" aria-pressed="${yolculuk.cerceve === v}">${t}</button>`).join("")}</div>
      <p style="margin:12px 0 8px;font-weight:600">${kacis(cer[yolculuk.cerceve])}</p>
      <textarea id="cumle" placeholder="${kacis(k.ex.replace(/[\[\]]/g, ""))}">${eski ? kacis(eski.t) : ""}</textarea>
      <div style="margin-top:10px">
        <label class="kontrol"><input type="checkbox" id="k1"> <span>Kelimeyi doğru anlamda kullandım (${kacis(k.tr.split(";")[0])}).</span></label>
        <label class="kontrol"><input type="checkbox" id="k2"> <span>Cümle benimle, alanımla ya da çevremle ilgili.</span></label>
        ${k.col.length ? `<label class="kontrol"><input type="checkbox" id="k3"> <span>Doğal bir kalıp kullandım (ör. ${kacis(k.col[0])}).</span></label>` : ""}
      </div>
      <div id="aiGeri"></div>
      <div class="satir" style="margin-top:12px">
        <button class="btn ana" type="button" id="kaydetCumle">Cümlemi kaydet</button>
        <button class="btn" type="button" id="aiDegerlendir" hidden>Claude'a değerlendirt</button>
      </div>
      <p class="ikincil" id="cumleUyari" style="margin-top:8px"></p>`;
  } else {
    const sv = seviye(k.w), c = durum.cumle[k.w];
    govde = `
      <div class="etiket">Yolculuk tamam</div>
      <div class="kelime" style="margin-top:6px">${kacis(k.w)}</div>
      <p class="senin" style="margin-top:14px">${kacis(c ? c.t : "")}</p>
      <div class="kutu-not" style="margin-top:14px"><b>Şu anki basamak</b>${sv}. ${BASAMAK[sv - 1].ad}. ${sv < 6 ? "Kelime tekrarla kalıcı kutuya ulaştığında 6. basamağa, içselleştirmeye çıkar. Tekrarda kartın arkasında kendi cümlen görünecek." : "Bu kelime artık senin."}</div>
      <div class="satir" style="margin-top:16px">
        <button class="btn ana" type="button" id="sonraki">Sıradaki kelime</button>
        <button class="btn" type="button" id="donus">Derinleş'e dön</button>
      </div>`;
  }
  alan.innerHTML = `${adimUst()}<section class="kart">${govde}</section>`;
  $("#yolKapat").onclick = derinCiz;
  const ileri = $("#ileri");
  if (ileri) ileri.onclick = () => {
    if (a === 1) { yolu(k.w).anlam = true; kaydet(); }
    yolculuk.adim++; yolculuk.cevap = null; yolculukCiz(); window.scrollTo(0, 0);
  };
  alan.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { yolculuk.cevap = +b.dataset.t; yolculukCiz(); });
  alan.querySelectorAll("[data-b]").forEach(b => b.onclick = () => {
    yolculuk.cevap = +b.dataset.b;
    const dogru = yolculuk.baglam[yolculuk.cevap].w === k.w;
    if (dogru) { yolu(k.w).baglam = true; kaydet(); }
    yolculukCiz();
    if (!dogru) { const i = $("#ileri"); if (i) { i.textContent = "Bir daha dene"; i.onclick = () => { yolculuk.cevap = null; yolculuk.baglam = null; yolculukCiz(); }; } }
  });
  alan.querySelectorAll("[data-kelime]").forEach(b => b.onclick = () => detayAc(b.dataset.kelime));
  alan.querySelectorAll("[data-cer]").forEach(b => b.onclick = () => { const t = $("#cumle").value; yolculuk.cerceve = b.dataset.cer; yolculukCiz(); $("#cumle").value = t; });
  const kay = $("#kaydetCumle");
  if (kay) {
    kay.onclick = () => {
      const t = $("#cumle").value.trim(), uy = $("#cumleUyari");
      if (t.split(/\s+/).length < 4) { uy.textContent = "Biraz daha uzun bir cümle yaz (en az 4 sözcük)."; return; }
      if (!kelimeGec(t, k.w)) { uy.textContent = `Cümlende "${k.w}" ya da çekimli bir biçimi geçmiyor.`; return; }
      if (!$("#k1").checked) { uy.textContent = "Kaydetmeden önce kelimeyi doğru anlamda kullandığından emin ol ve ilk kutuyu işaretle."; return; }
      durum.cumle[k.w] = { t, tur: yolculuk.cerceve, g: BUGUN() };
      if (!durum.srs[k.w]) durum.srs[k.w] = { b: 0, due: BUGUN() + 1, dogru: 0, yanlis: 0, ilk: BUGUN() };
      kaydet(); yolculuk.adim = 4; yolculukCiz(); window.scrollTo(0, 0);
    };
    aiDegerlendirmeBagla(k);
  }
  const s = $("#sonraki");
  if (s) s.onclick = () => {
    const sir = aktifKelimeler().filter(x => x.ko && x.w !== k.w && seviye(x.w) >= 1 && seviye(x.w) < 5).sort((p, q) => seviye(q.w) - seviye(p.w));
    const n = sir[0] || aktifKelimeler().find(x => x.ko && seviye(x.w) < 3 && x.w !== k.w);
    n ? yolculukBasla(n.w) : derinCiz();
  };
  const d = $("#donus"); if (d) d.onclick = derinCiz;
}

/* Claude ile cümle değerlendirme (yalnız claude.ai içinde) */
function aiDegerlendirmeBagla(k) {
  const btn = $("#aiDegerlendir"), yer = $("#aiGeri");
  if (!btn || !sampleFn) return;
  btn.hidden = false;
  btn.onclick = async () => {
    const t = $("#cumle").value.trim();
    if (!t) { $("#cumleUyari").textContent = "Önce bir cümle yaz."; return; }
    btn.disabled = true; btn.textContent = "Değerlendiriliyor…";
    try {
      const r = await sampleFn.json(
`You are a supportive but precise EFL teacher. A Turkish learner preparing for the YÖKDİL social sciences exam wrote this sentence to practise the word "${k.w}" (${POS[k.pos]}; meaning: ${k.def}).
Sentence: """${t.slice(0, 500)}"""
Judge only: (1) is the target word used with the correct meaning and part of speech, (2) is the sentence grammatical and natural.
Reply with only JSON: {"uygun": true|false, "yorum": "1-2 short sentences in Turkish, concrete", "oneri": "one corrected or more natural English version of the learner's own sentence, keeping their idea"}`, { modelTier: "quick", cache: false });
      if (!r || typeof r.yorum !== "string") throw { code: "invalid_json" };
      yer.innerHTML = `<div class="kutu-not ${r.uygun ? "" : "uyari"}" style="margin-top:12px"><b>Claude'un geri bildirimi</b>${kacis(r.yorum)}${r.oneri ? `<p class="senin" style="margin-top:8px">${kacis(r.oneri)}</p>` : ""}</div>`;
    } catch (e) {
      const c = e && e.code;
      if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(c)) { btn.hidden = true; return; }
      toast(c === "rate_limited" ? "Çok sık istek gönderildi, biraz bekle." : "Değerlendirme yapılamadı, yeniden dene.");
    } finally { btn.disabled = false; btn.textContent = "Claude'a değerlendirt"; }
  };
}

/* ================= Claude ile yeni örnek cümle (yalnız claude.ai içinde) ================= */
let sampleFn = null;
(async () => {
  try { sampleFn = window.claude ? await window.claude.use("sample") : null; } catch (e) { sampleFn = null; }
})();
function aiBagla(kok, k) {
  const btn = kok.querySelector("[data-ai]"), yer = kok.querySelector("[data-ai-alan]");
  if (!btn || !sampleFn) return;
  btn.hidden = false;
  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = "Hazırlanıyor…";
    try {
      const veri = await sampleFn.json(
`Write 3 new, natural example sentences at CEFR C1 level that use the English word "${k.w}" (${POS[k.pos]}; meaning: ${k.def}).
Each sentence should read like a sentence from an academic social-science text (sociology, economics, history, politics, education or psychology), similar to reading passages in the Turkish YÖKDİL exam.
Avoid invented statistics and specific factual claims that could be false; keep sentences general and plausible.
Wrap the target word (in the form used) in square brackets exactly once per sentence.
Reply with only a JSON array of 3 strings.`, { modelTier: "quick" });
      const cumleler = (Array.isArray(veri) ? veri : []).filter(s => typeof s === "string" && /\[.+?\]/.test(s)).slice(0, 3);
      if (!cumleler.length) throw { code: "invalid_json" };
      yer.innerHTML = `<div class="etiket" style="margin-top:6px">Claude'un önerdiği örnekler</div>` + cumleler.map(s => `<p>${ornekHtml(s)}</p>`).join("");
      btn.textContent = "Başka örnekler üret";
    } catch (e) {
      const c = e && e.code;
      if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(c)) { btn.hidden = true; return; }
      toast(c === "rate_limited" ? "Çok sık istek gönderildi, biraz bekle." : "Örnekler hazırlanamadı, yeniden dene.");
      btn.textContent = "Yeni örnek cümleler üret";
    } finally { btn.disabled = false; }
  };
}

/* ================= Ayarlar ve kaynak ================= */
$("#ayarBtn").onclick = () => {

    </section>
    <section class="kart kaynak" style="margin-top:12px">
      <div class="etiket" style="margin-bottom:8px">Kaynak ve yöntem</div>
      <p><b>Bağımsız uygulama.</b> Bu uygulama bağımsız bir çalışma aracıdır. ÖSYM ya da YÖK ile bağlantısı yoktur; onlar tarafından onaylanmamıştır. YÖKDİL adı yalnızca hedeflenen sınavı belirtmek için kullanılır.</p>
      <p><b>Kelime havuzu.</b> Akademik Kelime Listesi (AWL), 28 konu alanından derlenen 3,5 milyon sözcüklük akademik bir derlemde sık geçen 570 kelime ailesini içerir. Alt listeler sıklığa göre sıralanır; 1. alt liste en sık olanlardır.</p>
      <p>Coxhead, A. (2000). A new academic word list. <i>TESOL Quarterly, 34</i>(2), 213–238. https://doi.org/10.2307/3587951</p>
      <p><b>Seçim.</b> İlk altı alt liste (360 aile) alındı. Günlük İngilizcede çok yaygın olan 47 kelime (ör. <i>area, data, research</i>) çıkarıldı. Ölçüt, wordfreq kütüphanesinde Zipf sıklığı ≥ 5,0 olmasıdır. Kalan 313 kelime uygulamadadır.</p>
      <p><b>Sınırlılık.</b> Liste, ÖSYM'nin YÖKDİL Sosyal sorularından yapılmış bir sıklık sayımı değildir. AWL akademik metinlerin genelini temsil eder. Çıkmış YÖKDİL kitapçıklarıyla sıklık sayımı yapıldığında sıralama güncellenecektir. AWL listesi resmî kaynaktan indirilemediği için elle derlendi. Tutarlılık denetimlerinden geçti, ama resmî listeyle karşılaştırılması önerilir.</p>
      <p><b>Türkçe karşılıklar, tanımlar, örnek cümleler, köken notları ve hikâyeler</b> bu uygulama için yazılmıştır; sınav sorularından alınmamıştır. Köken notları yerleşik etimolojik bilgiyle sınırlı tutuldu; tarih ve anekdot verilmedi. Tartışmalı kökenler kartta belirtilir.</p>
      <p><b>İçselleştirme basamakları.</b> Derinleş bölümü, kelimeyi hatırlamanın ötesine taşımak için dört adım kullanır: parçalardan anlam tahmini, kökteki imge ve hikâye, doğru bağlamı değerlendirme, kendi hayatından cümle kurma. Tasarım şu bulgulara dayanır: Anlam üzerinde daha derin işlenen bilgi daha kalıcıdır (Craik ve Lockhart, 1972). Görevin gerektirdiği değerlendirme ve üretim yükü kelime öğrenimini artırır (Laufer ve Hulstijn, 2001). 42 çalışmayı kapsayan bir meta-analizde en güçlü katkıyı değerlendirme bileşeni yapmıştır (Yanagisawa ve Webb, 2021). Kendiyle ilişkilendirilen bilgi daha iyi hatırlanır (Rogers vd., 1977). Tahmin ve köken notu, deyimlerde anlamın hatırlanmasını desteklemiştir (Wang vd., 2026). Bu son bulgu deyimlere dayanır; tek kelimelere genellenmesi bir varsayımdır. Altı basamak araştırmalardan esinlenen bir tasarım modelidir, geçerliği sınanmış bir ölçek değildir.</p>
      <p>Craik, F. I. M., &amp; Lockhart, R. S. (1972). Levels of processing: A framework for memory research. <i>Journal of Verbal Learning and Verbal Behavior, 11</i>(6), 671–684. https://doi.org/10.1016/S0022-5371(72)80001-X</p>
      <p>Laufer, B., &amp; Hulstijn, J. (2001). Incidental vocabulary acquisition in a second language: The construct of task-induced involvement. <i>Applied Linguistics, 22</i>(1), 1–26. https://doi.org/10.1093/applin/22.1.1</p>
      <p>Rogers, T. B., Kuiper, N. A., &amp; Kirker, W. S. (1977). Self-reference and the encoding of personal information. <i>Journal of Personality and Social Psychology, 35</i>(9), 677–688. https://doi.org/10.1037/0022-3514.35.9.677</p>

      <p>Yanagisawa, A., &amp; Webb, S. (2021). To what extent does the involvement load hypothesis predict incidental L2 vocabulary learning? A meta-analysis. <i>Language Learning, 71</i>(2), 487–536. https://doi.org/10.1111/lang.12444</p>

    durum = JSON.parse(JSON.stringify(VARSAYILAN)); kaydet(); toast("İlerleme silindi"); kapat(); git("bugun");
