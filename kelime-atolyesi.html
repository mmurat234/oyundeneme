]],"yol":"Latince facilis → Fransızca faciliter → İngilizce","imge":"Önündeki engelleri kaldırıp işi kolay yapılır hâle getirmek.","hikaye":"Latince facilis 'kolay' demektir ve facere 'yapmak' fiiline bağlanır: yapılması kolay olan. Facilitate, bir süreci kolaylaştırmaktır. Akademik metinde bir etkenin öğrenmeyi, iletişimi ya da ticareti kolaylaştırdığını anlatır. Aynı kökten facility 'tesis; kolaylık' gelir.","tr_bag":null,"tuzak":"Süreç nesne alır: 'facilitate learning' denir; 'facilitate students to learn' yanlıştır.","emin":"yüksek"}},{"w":"fundamental","pos":"adj","sub":5,"tr":"temel, esaslı","def":"forming a necessary base or core; of central importance","ex":"Freedom of speech is a [fundamental] right.","syn":["basic","essential","core"],"fam":["fundamentally (adv)","fundamentalism (n)"],"col":["fundamental change","fundamental rights"],"ko":{"kok":"fundus","kok_anlam":"dip, taban","dil":"Latince","parca":[["fund (fundus)","dip, taban"],["-ament","isim eki (fundamentum: temel)"],["-al","sıfat eki"]],"yol":"Latince fundamentum → Ortaçağ Latincesi fundamentalis → İngilizce","imge":"Bir binanın en altına dökülen temel.","hikaye":"Latince fundus 'dip, taban' demektir; fundare 'temel atmak', fundamentum ise 'temel'dir. Fundamental, binanın temeli gibi bir yapının üzerinde yükseldiği şeyi anlatır. Buradan 'temel, esaslı, en önemli' anlamı gelir. Akademik metinde fundamental rights 'temel haklar' ve fundamental change 'köklü değişim' kalıpları yaygındır.","tr_bag":"Türkçedeki 'fundamentalizm' aynı sözcükten gelir.","tuzak":null,"emin":"yüksek"}},{"w":"generate","pos":"v","sub":5,"tr":"üretmek, yaratmak","def":"to produce or create","ex":"Tourism [generates] a large share of national income.","syn":["produce","create","yield"],"fam":["generation (n)","generator (n)"],"col":["generate income","generate interest"],"ko":{"kok":"genus","kok_anlam":"soy, tür","dil":"Latince","parca":[["gener (genus)","soy, tür"],["-ate","fiil eki"]],"yol":"Latince generare → İngilizce","imge":"Bir soyun yeni bir kuşak doğurması.","hikaye":"Latince generare 'doğurmak, meydana getirmek' demektir ve genus 'soy' sözcüğüne bağlanır. Canlıların yavru vermesinden her türlü üretime geçilir. Akademik metinde generate data, generate revenue, generate hypotheses gibi kalıplarla 'üretmek, ortaya çıkarmak' anlamında kullanılır.","tr_bag":"Türkçedeki 'jeneratör' ve 'jenerasyon' aynı kökten gelir.","tuzak":null,"emin":"yüksek"}},{"w":"generation","pos":"n","sub":5,"tr":"kuşak, nesil; üretim","def":"all people born at about the same time; the production of something","ex":"The second [generation] of migrants is better educated.","syn":["age group","cohort","production"],"fam":["generational (adj)","intergenerational (adj)"],"col":["younger generation","future generations"],"ko":{"kok":"genus","kok_anlam":"soy, tür","dil":"Latince","parca":[["gener (genus)","soy, tür"],["-ation","isim eki"]],"yol":"Latince generatio → Fransızca → İngilizce","imge":"Aynı soydan aynı dönemde doğan bir halka.","hikaye":"Latince generatio 'doğurma, üreme' demekti. Bir soydaki her doğum halkası, aynı dönemde doğmuş insanlardan oluşan bir kuşağı anlatır hâle geldi. Bu yüzden generation hem 'kuşak' hem de 'üretim' anlamını taşır. Akademik metinde generational change 'kuşaklar arası değişim' ve electricity generation 'elektrik üretimi' kalıpları görülür.","tr_bag":"Türkçedeki 'jenerasyon' aynı sözcüktür.","tuzak":"generation yalnız 'kuşak' değildir; 'power generation' elektrik üretimi demektir.","emin":"yüksek"}},{"w":"image","pos":"n","sub":5,"tr":"imaj, görüntü; imge","def":"the general impression that a person or organisation presents; a picture","ex":"The media shapes the public [image] of refugees.","syn":["reputation","impression","picture"],"fam":["imagery (n)"],"col":["public image","self-image"],"ko":{"kok":"imago","kok_anlam":"suret, benzeri, heykel","dil":"Latince","parca":[["image (imago)","suret, benzer"]],"yol":"Latince imago → Eski Fransızca image → İngilizce","imge":"Bir yüzün taşa oyulmuş ya da boyayla çizilmiş sureti.","hikaye":"Latince imago, birinin sureti ya da benzeri demekti. Bir şeyin kopyası olan resimden, zihindeki kopya olan tasavvura geçilir. Buradan bir kişi ya da kurumun başkalarının zihninde bıraktığı izlenim, yani 'imaj' anlamı gelir. Akademik metinde imagination 'hayal gücü' de bu kökle ilişkilidir.","tr_bag":"Türkçedeki 'imaj' Fransızca yoluyla aynı sözcükten gelir.","tuzak":"Türkçedeki 'imaj' çoğunlukla dışa yansıyan izlenimi anlatır; İngilizce image ayrıca 'görüntü, resim' ve edebiyatta 'imge' demektir.","emin":"yüksek"}},{"w":"liberal","pos":"adj","sub":5,"tr":"liberal, özgürlükçü; hoşgörülü","def":"open to new ideas; favouring individual freedom","ex":"Attitudes to sexuality became more [liberal] over time.","syn":["tolerant","open-minded","progressive"],"fam":["liberalism (n)","liberalise (v)","liberalisation (n)"],"col":["liberal democracy"],"ko":{"kok":"liber","kok_anlam":"özgür","dil":"Latince","parca":[["liber","özgür"],["-al","sıfat eki"]],"yol":"Latince liberalis → Eski Fransızca → İngilizce","imge":"Köle olmayan, kendi kararını veren özgür bir insan.","hikaye":"Latince liberalis 'özgür insana yakışan' demekti. Artes liberales, özgür yurttaşa uygun görülen eğitim alanlarıydı; bugünkü liberal arts buradan gelir. Özgür ve cömert insan fikrinden 'hoşgörülü, açık fikirli' anlamı gelişti. Siyasette ise bireysel özgürlüğü öne çıkaran görüşü anlatır.","tr_bag":"Türkçedeki 'liberal' ve 'liberalizm' aynı sözcükten gelir.","tuzak":"ABD'de liberal çoğu zaman 'sol eğilimli' anlamındadır; Türkçedeki ekonomik liberal anlamıyla birebir örtüşmez.","emin":"yüksek"}},{"w":"licence","pos":"n","sub":5,"tr":"ruhsat, lisans, izin belgesi","def":"an official permit to do or own something","ex":"Street vendors need a [licence] to trade.","syn":["permit","authorisation","certificate"],"fam":["license (v)","US: license (n)"],"col":["driving licence","licence to"],"ko":{"kok":"licere","kok_anlam":"izin verilmek, serbest olmak","dil":"Latince","parca":[["lic (licere)","izinli olmak"],["-ence","isim eki"]],"yol":"Latince licentia → Eski Fransızca licence → İngilizce","imge":"Bir kapıdan geçmeye izin veren resmî bir belge.","hikaye":"Latince licere 'izin verilmek' fiilinden licentia 'serbestlik, izin' türemiştir. Bir işi yapma serbestliği, resmî izni belgeleyen kâğıda dönüştü. Bugün licence ruhsat ve lisans belgesi demektir. Aynı kökten gelen licentious 'ahlak sınırı tanımayan', sözcüğün eski 'aşırı serbestlik' anlamını korur.","tr_bag":"Türkçedeki 'lisans' (hem izin belgesi hem üniversite derecesi) aynı sözcükten gelir.","tuzak":"İngiliz İngilizcesinde isim licence, fiil license yazılır; Amerikan İngilizcesinde ikisi de license'tır.","emin":"yüksek"}},{"w":"logic","pos":"n","sub":5,"tr":"mantık","def":"reasoning conducted according to strict principles","ex":"The [logic] of the market does not always serve the public good.","syn":["reasoning","rationale","sense"],"fam":["logical (adj)","logically (adv)","illogical (adj)"],"col":["the logic of"],"ko":{"kok":"logos","kok_anlam":"söz, akıl, gerekçe","dil":"Yunanca","parca":[["log (logos)","söz, akıl"],["-ic","sıfat/isim eki"]],"yol":"Yunanca logike → Latince logica → Fransızca → İngilizce","imge":"Sözün arkasındaki gerekçeyi adım adım dizmek.","hikaye":"Yunanca logos hem 'söz' hem de 'akıl, gerekçe' demektir. Logike tekhne 'akıl yürütme sanatı' anlamındaydı. Doğru konuşma ile doğru düşünme arasındaki bu bağ, logic sözcüğünde 'kurallara uygun akıl yürütme' olarak kaldı. -logy ile biten bilim adları da aynı logos kökünü taşır.","tr_bag":"Türkçedeki 'lojik' ve '-loji' ile biten bilim adları (sosyoloji, psikoloji) aynı logos kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"margin","pos":"n","sub":5,"tr":"kenar, marj; fark","def":"the edge of something; an amount by which a thing is won or falls short","ex":"The party won by a narrow [margin].","syn":["edge","periphery","gap"],"fam":["marginal (adj)","marginalise (v: ötekileştirmek)"],"col":["by a narrow margin","on the margins of"],"ko":{"kok":"margo","kok_anlam":"kenar, sınır","dil":"Latince","parca":[["margin (margo)","kenar"]],"yol":"Latince margo → Eski Fransızca → İngilizce","imge":"Sayfanın yazısız kalan kenar şeridi.","hikaye":"Latince margo 'kenar, sınır' demektir. Sayfa kenarından, iki değer arasındaki boşluğa, yani farka geçilir. Ekonomide profit margin 'kâr marjı', seçimde ise by a narrow margin 'kıl payı' kalıbı bu anlamdandır. Marginal, kenarda kalan ve bu yüzden küçük ya da önemsiz olanı anlatır.","tr_bag":"Türkçedeki 'marj' ve 'marjinal' Fransızca yoluyla aynı kökten gelir.","tuzak":"Türkçede 'marjinal' çoğu zaman 'aykırı, uç' anlamında kullanılır; İngilizce marginal ise 'küçük, önemsiz, kenarda kalan' demektir.","emin":"yüksek"}},{"w":"mental","pos":"adj","sub":5,"tr":"zihinsel, akli, ruhsal","def":"relating to the mind","ex":"Unemployment has serious effects on [mental] health.","syn":["psychological","cognitive","intellectual"],"fam":["mentally (adv)","mentality (n: zihniyet)"],"col":["mental health"],"ko":{"kok":"mens","kok_anlam":"zihin, akıl","dil":"Latince","parca":[["ment (mens)","zihin"],["-al","sıfat eki"]],"yol":"Geç Latince mentalis → İngilizce","imge":"Düşüncelerin yer aldığı iç dünya.","hikaye":"Latince mens 'zihin, akıl' demektir. Mentalis 'zihne ait' anlamındadır. İngilizcede mental, bedensel olanın karşısında zihinsel süreçleri anlatır. Akademik metinde mental health 'ruh sağlığı' ve mental representation 'zihinsel temsil' kalıpları sık geçer.","tr_bag":"Türkçedeki 'mentalite' aynı kökten gelir.","tuzak":null,"emin":"yüksek"}},{"w":"modify","pos":"v","sub":5,"tr":"değiştirmek, uyarlamak","def":"to make partial changes to something","ex":"The questionnaire was [modified] after the pilot study.","syn":["alter","adjust","adapt"],"fam":["modification (n)"],"col":["modify behaviour"],"ko":{"kok":"modus","kok_anlam":"ölçü, biçim","dil":"Latince","parca":[["mod (modus)","ölçü, biçim"],["-ify (facere)","yapmak, kılmak"]],"yol":"Latince modificare → Fransızca modifier → İngilizce","imge":"Bir şeyi yeni bir ölçüye göre biraz kesip biçmek.","hikaye":"Latince modificare, modus 'ölçü' ile facere 'yapmak' parçalarından oluşur: ölçüye vurmak, sınırlamak. Bir şeyi ölçüye uydurmak, onu kısmen değiştirmektir. Bugünkü anlam budur: tümden değiştirmek değil, belli yerlerini uyarlamak. Model ve mode sözcükleri de modus ailesindendir.","tr_bag":"Türkçedeki 'modifiye' (modifiye araç) Fransızca modifier'den gelir.","tuzak":null,"emin":"yüksek"}},{"w":"monitor","pos":"v","sub":5,"tr":"izlemek, gözlemlemek","def":"to observe and check the progress of something over time","ex":"Independent observers [monitored] the elections.","syn":["observe","track","supervise"],"fam":["monitor (n)","monitoring (n)"],"col":["closely monitor"],"ko":{"kok":"monere","kok_anlam":"uyarmak, hatırlatmak","dil":"Latince","parca":[["moni (monere)","uyarmak"],["-tor","yapan kişi eki"]],"yol":"Latince monitor → İngilizce","imge":"Yanınızda durup gerektiğinde sizi uyaran bir gözcü.","hikaye":"Latince monitor 'uyaran, öğüt veren kişi' demekti ve monere 'uyarmak' fiilinden gelir. Uyarmak için önce izlemek gerekir; anlam buradan 'sürekli gözlemek'e kaydı. Fiil olarak monitor, bir sürecin gidişatını zaman içinde izleyip denetlemektir. Akademik metinde monitoring and evaluation 'izleme ve değerlendirme' kalıbı yaygındır.","tr_bag":"Türkçedeki 'monitör' (ekran) aynı sözcükten gelir.","tuzak":null,"emin":"yüksek"}},{"w":"notion","pos":"n","sub":5,"tr":"kavram, fikir, düşünce","def":"a concept or belief about something","ex":"The [notion] of childhood is historically specific.","syn":["idea","concept","belief"],"fam":["notional (adj)"],"col":["the notion that"],"ko":{"kok":"noscere","kok_anlam":"tanımak, bilmek","dil":"Latince","parca":[["no- (noscere)","tanımak, bilmek"],["-tion","isim eki"]],"yol":"Latince notio → Fransızca notion → İngilizce","imge":"Bir şeyle tanışınca zihinde oluşan ilk resim.","hikaye":"Latince notio, noscere 'tanımak' fiilinden gelir ve 'bir şeyi tanıma, kavram' demektir. Tanıdığımız şeyin zihnimizdeki karşılığı onun kavramıdır. Akademik metinde notion, çoğu zaman tam tanımlanmamış bir fikir ya da görüş için kullanılır: 'the notion that...'. Concept'e göre daha gevşek bir anlamı vardır.","tr_bag":"Türkçedeki 'nosyon' (nosyonu yok) Fransızca notion'dan gelir.","tuzak":"Türkçede 'nosyon' konuşma dilinde 'görgü' anlamı da taşır; İngilizce notion yalnız 'kavram, fikir' demektir.","emin":"yüksek"}},{"w":"objective","pos":"n","sub":5,"tr":"amaç, hedef","def":"a goal or aim","ex":"The main [objective] of the reform was to reduce inequality.","syn":["aim","goal","purpose"],"fam":["objective (adj: nesnel)","objectivity (n)","objectively (adv)"],"col":["achieve an objective"],"ko":{"kok":"iacere","kok_anlam":"atmak","dil":"Latince","parca":[["ob-","önüne, karşısına"],["ject (iacere)","atmak"],["-ive","sıfat eki"]],"yol":"Latince obiectum → Ortaçağ Latincesi obiectivus → İngilizce","imge":"Gözün önüne atılmış, karşıda duran bir şey.","hikaye":"Latince obiectum 'önüne atılmış şey' demektir: ob- 'önüne' ve iacere 'atmak'. Karşımızda duran nesneye bakan, kişisel duygudan bağımsız bakış objective 'nesnel' sıfatını verir. İsim olarak ise karşıda duran ve varılmak istenen nokta, yani 'amaç, hedef' anlamını taşır. Akademik metinde research objectives 'araştırmanın amaçları'dır.","tr_bag":"Türkçedeki 'obje' ve 'objektif' aynı kökten gelir.","tuzak":"İsim olarak objective 'amaç' demektir; Türkçedeki 'objektif' (nesnel ya da kamera merceği) anlamıyla karıştırılmamalı.","emin":"yüksek"}},{"w":"orient","pos":"v","sub":5,"tr":"yöneltmek, yönlendirmek","def":"to direct towards a particular aim","ex":"The economy was [oriented] towards exports.","syn":["direct","aim","focus"],"fam":["orientation (n)","oriented (adj)"],"col":["market-oriented","orient towards"],"ko":{"kok":"oriri","kok_anlam":"doğmak, yükselmek","dil":"Latince","parca":[["ori (oriri)","doğmak"],["-ent","sıfat/isim eki (oriens: doğan)"]],"yol":"Latince oriens → Fransızca orienter → İngilizce","imge":"Güneşin doğduğu yöne dönmek.","hikaye":"Latince oriens 'doğan', yani güneşin doğduğu yön, 'doğu' demektir. Fiil olarak orient, önce bir şeyi doğuya göre yerleştirmek, sonra genel olarak konumunu belirlemek anlamına geldi. Buradan birini bir amaca yöneltmek anlamı gelişti. Akademik metinde market-oriented 'piyasa odaklı' gibi kalıplar yaygındır.","tr_bag":"Türkçedeki 'oryantasyon' ve 'oryantalizm' aynı kökten gelir.","tuzak":null,"emin":"yüksek"}},{"w":"perspective","pos":"n","sub":5,"tr":"bakış açısı, perspektif","def":"a particular way of considering something","ex":"From a historical [perspective], the reforms were modest.","syn":["viewpoint","standpoint","outlook"],"fam":[],"col":["from a ... perspective","put into perspective"],"ko":{"kok":"specere","kok_anlam":"bakmak","dil":"Latince","parca":[["per-","içinden, boydan boya"],["spect (specere)","bakmak"],["-ive","sıfat eki"]],"yol":"Ortaçağ Latincesi perspectiva → Fransızca → İngilizce","imge":"Bir pencerenin içinden uzağa doğru bakmak.","hikaye":"Latince perspicere 'içinden bakmak, açıkça görmek' demektir. Perspectiva önce görme ve optik bilgisinin adıydı. Resimde derinlik yanılsaması anlamına, oradan da bir konuya bakılan konum, yani 'bakış açısı' anlamına geçildi. Akademik metinde from a sociological perspective 'sosyolojik açıdan' kalıbı çok yaygındır.","tr_bag":"Türkçedeki 'perspektif' aynı sözcükten gelir.","tuzak":null,"emin":"yüksek"}},{"w":"precise","pos":"adj","sub":5,"tr":"kesin, tam, doğru","def":"exact and accurate","ex":"The [precise] number of victims is unknown.","syn":["exact","accurate","specific"],"fam":["precisely (adv)","precision (n)"],"col":["precise definition"],"ko":{"kok":"caedere","kok_anlam":"kesmek","dil":"Latince","parca":[["pre- (prae-)","önden"],["cise (caedere)","kesmek"]],"yol":"Latince praecisus → Fransızca précis → İngilizce","imge":"Fazlalıkları önden kesip atılmış, tam ölçüsünde bir parça.","hikaye":"Latince praecidere, prae- 'önden' ve caedere 'kesmek' parçalarından oluşur; praecisus 'kesilip kısaltılmış' demektir. Fazlası kesilip atılan şey tam ölçüsünde kalır. Buradan 'tam, kesin, hassas' anlamı gelir. Akademik metinde precise measurement 'hassas ölçüm' ve precisely 'tam olarak' sık geçer.","tr_bag":null,"tuzak":"precise 'tam, hassas' demektir; 'emin olmak' anlamındaki 'kesin' için certain kullanılır.","emin":"yüksek"}},{"w":"prime","pos":"adj","sub":5,"tr":"başlıca, en önemli; birinci sınıf","def":"of first importance; main","ex":"Unemployment was the [prime] concern of voters.","syn":["main","chief","primary"],"fam":["prime (n: en verimli dönem)"],"col":["prime minister","prime example"],"ko":{"kok":"primus","kok_anlam":"birinci","dil":"Latince","parca":[["prime (primus)","birinci"]],"yol":"Latince primus → Fransızca → İngilizce","imge":"Sıranın en başında duran.","hikaye":"Latince primus 'birinci' demektir. Sırada birinci olmak, önem bakımından da birinci olmak anlamına kaydı. Prime minister 'başbakan' ve prime example 'en tipik örnek' bu anlamdandır. Aynı kökten primary 'birincil' ve primitive 'ilkel' gelir.","tr_bag":null,"tuzak":"Türkçedeki 'prim' (ikramiye) ile karıştırılmamalı; prime 'başlıca, birinci' demektir.","emin":"yüksek"}},{"w":"psychology","pos":"n","sub":5,"tr":"psikoloji","def":"the scientific study of the human mind and behaviour","ex":"Social [psychology] examines how groups influence individuals.","syn":[],"fam":["psychological (adj)","psychologist (n)","psychologically (adv)"],"col":["social psychology"],"ko":{"kok":"psykhe","kok_anlam":"nefes, can, ruh","dil":"Yunanca","parca":[["psycho- (psykhe)","ruh, zihin"],["-logy (logos)","bilim, söz"]],"yol":"Yunanca psykhe + logos → Yeni Latince psychologia → İngilizce","imge":"İnsanın içindeki canlılık soluğu.","hikaye":"Yunanca psykhe önce 'nefes, soluk', sonra 'can, ruh' demekti. Logos ise 'söz, akıl, bilim'dir. İki parça birleşince 'ruhun bilimi' anlamı çıkar. Bugün psychology zihni ve davranışı bilimsel yöntemle inceleyen alanın adıdır.","tr_bag":"Türkçedeki 'psikoloji' ve 'psişik' aynı kökten gelir.","tuzak":null,"emin":"yüksek"}},{"w":"pursue","pos":"v","sub":5,"tr":"peşinden koşmak, sürdürmek","def":"to follow or continue with a course of action","ex":"Many graduates [pursue] careers abroad.","syn":["follow","seek","strive for"],"fam":["pursuit (n)"],"col":["pursue a policy","pursue a career"],"ko":{"kok":"sequi","kok_anlam":"izlemek, arkasından gitmek","dil":"Latince","parca":[["pur- (pro-)","ileri"],["sue (sequi)","izlemek"]],"yol":"Latince prosequi → Eski Fransızca → İngilizce","imge":"Önde koşanın peşinden ileri doğru gitmek.","hikaye":"Latince prosequi, pro- 'ileri' ve sequi 'izlemek' parçalarından oluşur. Fransızca aracılığıyla İngilizceye 'kovalamak, peşine düşmek' anlamıyla geçti. Bir amacın peşine düşmek, onu sürdürmek demektir. Akademik metinde pursue a policy, pursue a career gibi kalıplarla 'izlemek, sürdürmek' anlamında kullanılır.","tr_bag":"Türkçede film dilinde kullanılan 'sekans' da aynı sequi kökünden gelir.","tuzak":"Doğrudan nesne alır: 'pursue a goal' denir; 'pursue for a goal' yanlıştır.","emin":"yüksek"}},{"w":"ratio","pos":"n","sub":5,"tr":"oran","def":"the quantitative relation between two amounts","ex":"The teacher-student [ratio] is 1 to 30.","syn":["proportion","rate","relation"],"fam":[],"col":["the ratio of A to B"],"ko":{"kok":"reri","kok_anlam":"hesaplamak, düşünmek","dil":"Latince","parca":[["ratio (reri)","hesap, akıl"]],"yol":"Latince ratio → İngilizce","imge":"İki miktarı yan yana koyup hesaplayan bir göz.","hikaye":"Latince ratio 'hesap, hesaplama' ve 'akıl' demektir; reri 'hesaplamak, düşünmek' fiilinden gelir. İngilizcede matematiksel anlamı öne çıktı: iki miktarın birbirine oranı. Akıl anlamı ise aynı kökten rational ve reason sözcüklerinde kaldı. Akademik metinde sex ratio 'cinsiyet oranı' gibi kalıplar sık görülür.","tr_bag":"Türkçedeki 'rasyonel' aynı ratio kökünden gelir.","tuzak":"ratio iki niceliğin oranıdır; rate ise çoğu zaman bir birime ya da zamana göre oranı (hız, sıklık) anlatır.","emin":"yüksek"}},{"w":"reject","pos":"v","sub":5,"tr":"reddetmek","def":"to refuse to accept or agree to","ex":"Voters [rejected] the proposed constitution.","syn":["refuse","turn down","dismiss"],"fam":["rejection (n)"],"col":["reject a proposal"],"ko":{"kok":"iacere","kok_anlam":"atmak","dil":"Latince","parca":[["re-","geri"],["ject (iacere)","atmak"]],"yol":"Latince reiectus → İngilizce","imge":"Önüne konan şeyi geri fırlatmak.","hikaye":"Latince reicere, re- 'geri' ve iacere 'atmak' parçalarından oluşur; reiectus 'geri atılmış' demektir. Bir şeyi geri atmak, onu kabul etmemektir. Akademik metinde reject the null hypothesis 'sıfır hipotezini reddetmek' kalıbı çok yaygındır. Aynı iacere kökü project, object ve subject sözcüklerinde de vardır.","tr_bag":"Türkçedeki 'proje' ve 'enjeksiyon' aynı iacere 'atmak' kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"revenue","pos":"n","sub":5,"tr":"gelir (özellikle devlet/kurum)","def":"income, especially of a government or company","ex":"Oil exports provide most of the state's [revenue].","syn":["income","earnings","proceeds"],"fam":[],"col":["tax revenue","revenue from"],"ko":{"kok":"venire","kok_anlam":"gelmek","dil":"Latince","parca":[["re-","geri"],["venue (venire)","gelmek"]],"yol":"Latince revenire → Eski Fransızca revenue → İngilizce","imge":"Yapılan yatırımdan geri dönen para.","hikaye":"Eski Fransızca revenue, revenir 'geri gelmek' fiilinin ortacıdır: 'geri gelen'. Kökü Latince re- 'geri' ve venire 'gelmek'tir. Mülkten ya da yatırımdan sahibine geri gelen şey, gelir demektir. Akademik metinde tax revenue 'vergi geliri' özellikle devletin gelirleri için kullanılır.","tr_bag":null,"tuzak":"revenue toplam gelirdir; giderler düşüldükten sonra kalan kâr profit'tir.","emin":"yüksek"}},{"w":"stable","pos":"adj","sub":5,"tr":"istikrarlı, dengeli, sağlam","def":"firmly established; not likely to change","ex":"A [stable] democracy requires strong institutions.","syn":["steady","secure","balanced"],"fam":["stability (n)","stabilise (v)","unstable (adj)"],"col":["politically stable"],"ko":{"kok":"stare","kok_anlam":"durmak, ayakta durmak","dil":"Latince","parca":[["sta (stare)","durmak"],["-ble (-bilis)","-ebilen"]],"yol":"Latince stabilis → Eski Fransızca estable → İngilizce","imge":"Sağlam biçimde ayakta duran, sarsılmayan bir direk.","hikaye":"Latince stabilis, stare 'durmak' fiilinden 'ayakta durabilen, sağlam' anlamında türemiştir. Yerinde sağlam duran şey kolay değişmez. Bu yüzden stable hem 'dengeli' hem de 'istikrarlı' demektir. Akademik metinde political stability 'siyasi istikrar' kalıbı çok yaygındır.","tr_bag":"Türkçedeki 'stabil' aynı kökten gelir.","tuzak":"İsim olarak stable 'ahır' demektir; sıfat anlamıyla karıştırılmamalı.","emin":"yüksek"}},{"w":"substitute","pos":"n","sub":5,"tr":"ikame, yerine geçen şey","def":"a person or thing that takes the place of another","ex":"There is no [substitute] for face-to-face teaching.","syn":["replacement","alternative","surrogate"],"fam":["substitute (v)","substitution (n)"],"col":["substitute for","a substitute for"],"ko":{"kok":"statuere","kok_anlam":"koymak, dikmek","dil":"Latince","parca":[["sub-","altına, yerine"],["stitute (statuere)","koymak, yerleştirmek"]],"yol":"Latince substitutus → İngilizce","imge":"Bir şeyin durduğu yere, onun altından başka bir şey yerleştirmek.","hikaye":"Latince substituere, sub- 'altına, yerine' ve statuere 'koymak' parçalarından oluşur. Bir şeyin yerine başka bir şeyi koymak demektir. Akademik metinde substitute goods 'ikame mallar' ekonomide sık geçer. Aynı statuere kökü institute ve constitute sözcüklerinde de vardır.","tr_bag":"Türkçedeki 'enstitü' aynı statuere kökünden gelir.","tuzak":"'substitute A for B' B'nin yerine A'yı koymak demektir; yön sık karıştırılır.","emin":"yüksek"}},{"w":"sustain","pos":"v","sub":5,"tr":"sürdürmek, devam ettirmek; (zarar) görmek","def":"to maintain over a period of time; to suffer damage","ex":"High growth rates cannot be [sustained] indefinitely.","syn":["maintain","continue","support"],"fam":["sustainable (adj)","sustainability (n)"],"col":["sustain growth","sustainable development"],"ko":{"kok":"tenere","kok_anlam":"tutmak","dil":"Latince","parca":[["sus- (sub-)","alttan"],["tain (tenere)","tutmak"]],"yol":"Latince sustinere → Eski Fransızca → İngilizce","imge":"Bir yükü alttan tutup ayakta kalmasını sağlamak.","hikaye":"Latince sustinere, sub- 'alttan' ve tenere 'tutmak' parçalarından oluşur. Bir şeyi alttan tutmak, düşmesini engellemek ve onu sürdürmektir. Yükü taşıyan kişi aynı zamanda ağırlığa katlanır; 'zarar görmek' anlamı buradan gelir. Akademik metinde sustainable development 'sürdürülebilir kalkınma' kalıbı çok yaygındır.","tr_bag":null,"tuzak":"'sustain an injury/damage' yarayı sürdürmek değil, yara ya da zarar görmek demektir.","emin":"yüksek"}},{"w":"symbol","pos":"n","sub":5,"tr":"sembol, simge","def":"a thing that represents something else","ex":"The wall became a [symbol] of the Cold War.","syn":["emblem","sign","icon"],"fam":["symbolic (adj)","symbolise (v)","symbolism (n)"],"col":["a symbol of"],"ko":{"kok":"symbolon","kok_anlam":"tanıma nişanı","dil":"Yunanca","parca":[["sym- (syn-)","birlikte"],["bol (ballein)","atmak, koymak"]],"yol":"Yunanca symbolon → Latince symbolum → İngilizce","imge":"İkiye bölünmüş bir nesnenin iki yarısını birbirine oturtmak.","hikaye":"Yunanca symbolon, syn- 'birlikte' ve ballein 'atmak, koymak' parçalarından oluşur. İkiye bölünmüş bir nesneydi; iki taraf parçalarını birleştirerek birbirini tanırdı. Bir parçanın öteki yarısını, yani başka bir şeyi temsil etmesi, bugünkü 'simge' anlamını verdi. Sosyal bilimlerde symbolic interactionism 'sembolik etkileşimcilik' bu anlamı kullanır.","tr_bag":"Türkçedeki 'sembol' ve aynı ballein kökünü taşıyan 'problem' bu aileden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"target","pos":"n","sub":5,"tr":"hedef","def":"an objective or result aimed at; a person or thing attacked","ex":"The government missed its inflation [target].","syn":["goal","aim","objective"],"fam":["target (v: hedef almak)"],"col":["meet a target","target group"],"ko":{"kok":"targe","kok_anlam":"hafif kalkan","dil":"Fransızca","parca":[["targ- (targe)","hafif kalkan"],["-et","küçültme eki"]],"yol":"Germen kökenli → Eski Fransızca targe → İngilizce","imge":"Okçuların nişan aldığı küçük, yuvarlak bir kalkan.","hikaye":"Target, Eski Fransızca targe 'hafif kalkan' sözcüğüne küçültme eki -et eklenerek oluşmuştur; targe Germen kökenlidir. Yuvarlak küçük kalkan, okçuluktaki yuvarlak nişan tahtasına benzer; anlam buradan 'hedef'e geçti. Akademik metinde target group 'hedef kitle' ve target population 'hedef nüfus' kalıpları yaygındır.","tr_bag":null,"tuzak":null,"emin":"yüksek"}},{"w":"transit","pos":"n","sub":5,"tr":"geçiş, transit; toplu taşıma","def":"the carrying of people or goods from one place to another","ex":"Turkey is a major [transit] country for migrants.","syn":["passage","transport","movement"],"fam":["transition (n: geçiş dönemi)","transitional (adj)"],"col":["in transit","transit country"],"ko":{"kok":"ire","kok_anlam":"gitmek","dil":"Latince","parca":[["trans-","öte yana"],["it (ire)","gitmek"]],"yol":"Latince transitus → İngilizce","imge":"Bir yerden öteki yakaya geçip giden yolcu.","hikaye":"Latince transire, trans- 'öte yana' ve ire 'gitmek' parçalarından oluşur; transitus 'geçiş' demektir. İnsanların ve malların bir yerden başka bir yere taşınması anlamı buradan gelir. Aynı kökten transition 'geçiş dönemi' sosyal bilimlerde çok kullanılır. Amerikan İngilizcesinde transit 'toplu taşıma' anlamına da gelir.","tr_bag":"Türkçedeki 'transit' (transit geçiş) aynı sözcüktür.","tuzak":"Amerikan İngilizcesinde 'public transit' toplu taşıma demektir; Türkçedeki 'transit' anlamıyla sınırlı değildir.","emin":"yüksek"}},{"w":"trend","pos":"n","sub":5,"tr":"eğilim, yönelim","def":"a general direction of change","ex":"There is a growing [trend] towards later marriage.","syn":["tendency","pattern","movement"],"fam":["trendy (adj)"],"col":["a trend towards","current trends"],"ko":{"kok":"trendan","kok_anlam":"dönmek, yuvarlanmak","dil":"Germen","parca":[["trend (trendan)","dönmek, yön almak"]],"yol":"Eski İngilizce trendan → İngilizce","imge":"Kıyı boyunca belli bir yöne kıvrılan bir nehir.","hikaye":"Eski İngilizce trendan 'dönmek, yuvarlanmak' demekti. Fiil, bir nehrin ya da kıyının belli bir yöne kıvrılması için kullanılır oldu. Buradan 'genel gidiş yönü' anlamında isim gelişti. Akademik metinde trend, verideki uzun dönemli değişim yönünü anlatır: an upward trend 'yükseliş eğilimi'.","tr_bag":"Türkçedeki 'trend' aynı sözcüktür.","tuzak":"Türkçede 'trend' çoğunlukla 'moda' anlamında kullanılır; akademik metinde ise verideki genel değişim yönü demektir.","emin":"yüksek"}},{"w":"welfare","pos":"n","sub":5,"tr":"refah; sosyal yardım","def":"health, happiness and fortunes; financial support from the state","ex":"The [welfare] state expanded after the Second World War.","syn":["well-being","social security","benefit"],"fam":[],"col":["welfare state","child welfare"],"ko":{"kok":"faran","kok_anlam":"gitmek, yol almak","dil":"Germen","parca":[["wel- (well)","iyi"],["fare (faran)","gitmek, yol almak"]],"yol":"Orta İngilizce wel faren → İngilizce","imge":"Yolculuğunu iyi geçiren, işleri yolunda giden bir kişi.","hikaye":"Welfare, well 'iyi' ile fare 'gitmek, yol almak' sözcüklerinden oluşur. Farewell 'yolun açık olsun' da aynı parçaları taşır. İşleri iyi gitmek, esenlik ve refah demektir. Sosyal politikada welfare state 'refah devleti', Amerikan İngilizcesinde ise yalnız welfare 'sosyal yardım' anlamına gelir.","tr_bag":null,"tuzak":"welfare (refah, esenlik) ile wealth (servet) karıştırılmamalı.","emin":"yüksek"}},{"w":"whereas","pos":"conj","sub":5,"tr":"oysa, -iken","def":"in contrast or comparison with the fact that","ex":"Men dominate politics, [whereas] women dominate unpaid care work.","syn":["while","although","on the other hand"],"fam":[],"col":["whereas"],"ko":{"kok":"where + as","kok_anlam":"nerede ki, -dığı hâlde","dil":"Germen","parca":[["where","nerede"],["as","olarak, -dığı gibi"]],"yol":"İngilizce where + as birleşimi","imge":"İki durumu yan yana koyup aradaki farkı gösteren bir terazi.","hikaye":"Whereas, İngilizce where ve as sözcüklerinin birleşmesiyle oluşmuştur. Hukuk metinlerinde, özellikle giriş bölümlerinde 'göz önünde bulundurularak, -dığından' anlamında kullanılır. Genel ve akademik yazıda ise iki durumu karşılaştırıp aradaki zıtlığı gösterir: 'X increased, whereas Y declined'. Türkçede 'oysa' ya da '-iken' ile karşılanır.","tr_bag":null,"tuzak":"whereas 'çünkü' değil 'oysa, -iken' demektir; 'whereby' (-dığı, aracılığıyla) ile de karıştırılmamalı.","emin":"yüksek"}},{"w":"abstract","pos":"adj","sub":6,"tr":"soyut","def":"existing in thought or as an idea but not having a physical existence","ex":"Justice is an [abstract] concept that is difficult to measure.","syn":["theoretical","conceptual","intangible"],"fam":["abstraction (n)","abstract (n: özet)"],"col":["abstract idea","in the abstract"],"ko":{"kok":"trahere","kok_anlam":"çekmek","dil":"Latince","parca":[["abs-","-den uzağa"],["tract","çekmek"]],"yol":"Latince kökenli","imge":"Bir şeyi somut bütünün içinden çekip ayırmak.","hikaye":"Latince abstrahere 'çekip ayırmak', abstractus ise 'çekilip ayrılmış' demektir. Somut nesnelerden ortak bir özelliği çekip ayırdığınızda elinizde elle tutulamayan bir fikir kalır. Bu yüzden abstract 'soyut' anlamına gelir. Akademide isim olarak makalenin başındaki 'özet'i de anlatır: metnin özü çekilip ayrılmıştır.","tr_bag":"Türkçedeki 'abstre' (abstre resim) ve 'traktör' aynı trahere kökünden gelir.","tuzak":"Akademik metinde 'abstract' isim olarak 'özet' demektir; her gördüğünüzde 'soyut' diye çevirmeyin.","emin":"yüksek"}},{"w":"accurate","pos":"adj","sub":6,"tr":"doğru, kesin, isabetli","def":"correct in all details; exact","ex":"Census data provide an [accurate] picture of the population.","syn":["precise","exact","correct"],"fam":["accuracy (n)","accurately (adv)","inaccurate (adj)"],"col":["accurate information"],"ko":{"kok":"cura","kok_anlam":"özen, dikkat","dil":"Latince","parca":[["ac- (ad-)","-e doğru"],["cur","özen"],["-ate","sıfat eki (-miş)"]],"yol":"Latince accuratus → İngilizce","imge":"Bir işin üzerine özenle eğilmek.","hikaye":"Latince accurare 'bir şeye özen göstermek', accuratus ise 'özenle yapılmış' demektir. Özenle yapılan iş hatasız olur. Anlam 'özenli'den 'doğru, kesin'e buradan geçer. Akademik metinde accurate, ölçümün ya da bilginin gerçeğe tam uyduğunu anlatır.","tr_bag":"Türkçedeki 'kür' (tedavi kürü) Fransızca cure üzerinden aynı cura 'özen, bakım' kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"acknowledge","pos":"v","sub":6,"tr":"kabul etmek, tanımak; teşekkür etmek","def":"to accept or admit the existence or truth of","ex":"The government [acknowledged] that the policy had failed.","syn":["admit","accept","recognise"],"fam":["acknowledgement (n)"],"col":["acknowledge that","widely acknowledged"],"ko":{"kok":"know","kok_anlam":"bilmek","dil":"Germen","parca":[["ac- (a-)","Eski İngilizce ön ek"],["know","bilmek"],["-ledge","isim eki (knowledge'daki)"]],"yol":"Germen kökenli (Eski İngilizce)","imge":"Bildiğini herkesin önünde açıkça söyleyen biri.","hikaye":"Acknowledge, knowledge 'bilgi' ile aynı yapıdan türemiştir ve kökünde know 'bilmek' vardır. Bir şeyi bildiğini açığa vurmak, onun varlığını ya da doğruluğunu kabul etmek demektir. Akademik metinde yazar bir sınırlılığı 'acknowledge' eder, yani kabul eder. Makale sonundaki 'Acknowledgements' bölümü ise katkıların tanınıp teşekkür edildiği yerdir.","tr_bag":null,"tuzak":"Acknowledge ağızdan kabul etmektir, 'bilmek' değildir; 'I acknowledge the problem' 'sorunu kabul ediyorum' demektir.","emin":"yüksek"}},{"w":"aggregate","pos":"adj","sub":6,"tr":"toplam, bütün","def":"formed by combining several elements","ex":"[Aggregate] demand fell during the recession.","syn":["total","combined","overall"],"fam":["aggregate (n, v)","aggregation (n)"],"col":["aggregate data","in aggregate"],"ko":{"kok":"grex","kok_anlam":"sürü","dil":"Latince","parca":[["ag- (ad-)","-e doğru"],["greg","sürü"],["-ate","sıfat/fiil eki"]],"yol":"Latince aggregatus → İngilizce","imge":"Tek tek hayvanları bir sürüye katmak.","hikaye":"Latince aggregare 'sürüye katmak, bir araya toplamak' demektir; kökte grex, gregis 'sürü' vardır. Tek tek öğeler bir sürü gibi toplandığında bir bütün oluşur. Aggregate bu yüzden 'toplam, bütün' anlamına gelir. Ekonomide 'aggregate demand' tek tek alıcıların talebinin toplamıdır.","tr_bag":"İnşaatta kum ve çakıl karışımına verilen 'agrega' adı aynı kelimeden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"allocate","pos":"v","sub":6,"tr":"tahsis etmek, ayırmak","def":"to distribute resources for a particular purpose","ex":"Only 3% of the budget is [allocated] to education.","syn":["assign","allot","distribute"],"fam":["allocation (n)"],"col":["allocate funds to"],"ko":{"kok":"locus","kok_anlam":"yer","dil":"Latince","parca":[["al- (ad-)","-e doğru"],["loc","yer"],["-ate","fiil eki"]],"yol":"Ortaçağ Latincesi allocare → İngilizce","imge":"Her şeyi kendi yerine koymak.","hikaye":"Latince locare 'yerleştirmek' fiili locus 'yer' kelimesinden gelir; allocare ise 'bir yere yerleştirmek' demektir. Kaynakları belirli yerlere koymak, onları belirli amaçlara ayırmak anlamına gelir. Akademik metinde allocate, bütçe, zaman ya da insan gücünün bölüştürülmesini anlatır: 'Funds were allocated to education.'","tr_bag":"Türkçedeki 'lokasyon' ve 'lokal' aynı locus kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"assign","pos":"v","sub":6,"tr":"görevlendirmek, atamak; vermek","def":"to give a task or role to someone; to allocate","ex":"Participants were randomly [assigned] to two groups.","syn":["allocate","appoint","designate"],"fam":["assignment (n: ödev, görev)"],"col":["assign to","randomly assigned"],"ko":{"kok":"signum","kok_anlam":"işaret","dil":"Latince","parca":[["as- (ad-)","-e doğru"],["sign","işaret"]],"yol":"Latince assignare → Fransızca → İngilizce","imge":"Bir şeyin üzerine 'bu senin' diye işaret koymak.","hikaye":"Latince assignare 'işaretleyip ayırmak, birine vermek' demektir; kökte signum 'işaret' vardır. Bir görevi ya da payı işaretleyip birine ayırmak, onu o kişiye vermek demektir. Bugün assign, görev atamayı ya da bir şeye bir değer, rol yüklemeyi anlatır. Aynı kökten assignment 'ödev, görev' gelir.","tr_bag":"Türkçedeki 'sinyal' de aynı signum 'işaret' kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"attach","pos":"v","sub":6,"tr":"iliştirmek, bağlamak; (önem) vermek","def":"to fasten or join; to regard as having importance","ex":"Voters [attach] great importance to economic stability.","syn":["fasten","connect","ascribe"],"fam":["attachment (n: bağlılık)","attached (adj)"],"col":["attach importance to","strings attached"],"ko":{"kok":"atachier","kok_anlam":"bağlamak, iliştirmek","dil":"Fransızca","parca":[["at- (a-)","-e doğru"],["tach","bağ, çivi (kökü tartışmalı)"]],"yol":"Eski Fransızca atachier → İngilizce","imge":"Bir şeyi başka bir şeye tutturmak.","hikaye":"Attach, Eski Fransızca atachier 'bağlamak, tutturmak' fiilinden gelir; bu fiilin daha eski kökeni kesin değildir. Somut 'tutturma' anlamından mecaz bir 'bağlanma'ya geçilir. Akademik metinde en sık 'attach importance to' kalıbıyla 'önem vermek' anlamında görülür. Karşıtı detach 'ayırmak'tır.","tr_bag":"Türkçedeki 'ataşe', Fransızca attaché 'iliştirilmiş, bağlı' kelimesinden gelir.","tuzak":"'Önem vermek' 'attach importance to' şeklindedir; 'give importance' ya da 'to' edatını düşürmek sık yapılan hatadır.","emin":"orta"}},{"w":"author","pos":"n","sub":6,"tr":"yazar","def":"a writer of a book or article; the originator of something","ex":"The [authors] argue that inequality undermines democracy.","syn":["writer","creator","originator"],"fam":["authorship (n)","author (v)"],"col":["co-author"],"ko":{"kok":"augere","kok_anlam":"artırmak, büyütmek","dil":"Latince","parca":[["auct","artırmak, var etmek"],["-or","yapan (-ıcı)"]],"yol":"Latince auctor → Fransızca → İngilizce","imge":"Bir şeyi büyütüp var eden, kuran kişi.","hikaye":"Latince auctor 'artıran, var eden, kurucu' demektir ve augere 'artırmak' fiiline dayanır. Bir şeyi var eden kişi onun kaynağıdır; yazıyı var eden de yazardır. Author bu yüzden hem 'yazar' hem 'bir şeyin sorumlusu, yaratıcısı' anlamını taşır. Aynı kökten authority 'yetki, otorite' gelir.","tr_bag":"Türkçedeki 'otorite', aynı auctor ailesinden Latince auctoritas kelimesinden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"bond","pos":"n","sub":6,"tr":"bağ; tahvil","def":"a relationship or connection; a certificate of debt issued by a government or company","ex":"Shared rituals strengthen social [bonds].","syn":["tie","link","connection"],"fam":["bond (v: bağ kurmak)","bonding (n)"],"col":["social bonds","government bonds"],"ko":{"kok":"band","kok_anlam":"bağ, bağlayan şey","dil":"Germen","parca":[["bond","bağ (bind 'bağlamak' ile akraba)"]],"yol":"Germen kökenli","imge":"İki şeyi birbirine bağlayan ip ya da zincir.","hikaye":"Bond, band kelimesinin bir biçimidir ve bind 'bağlamak' fiiliyle akrabadır. Önce insanı ya da nesneyi bağlayan somut bir bağdır. Buradan insanlar arasındaki 'bağ'a ve kişiyi bir yükümlülüğe bağlayan yazılı söze geçilir. Ekonomide 'tahvil', devletin ya da şirketin borcunu yazılı olarak bağladığı belgedir.","tr_bag":null,"tuzak":"Ekonomi metinlerinde 'bond' çoğunlukla 'tahvil' demektir; 'bağ' diye çevirmek anlamı bozar.","emin":"yüksek"}},{"w":"brief","pos":"adj","sub":6,"tr":"kısa, özlü","def":"of short duration; concise","ex":"The chapter ends with a [brief] summary of the main arguments.","syn":["short","concise","succinct"],"fam":["briefly (adv)","brief (n, v: bilgilendirmek)"],"col":["a brief overview"],"ko":{"kok":"brevis","kok_anlam":"kısa","dil":"Latince","parca":[["brief","kısa"]],"yol":"Latince brevis → Fransızca → İngilizce","imge":"Kısa tutulmuş bir söz ya da yazı.","hikaye":"Latince brevis 'kısa' demektir ve Fransızca bref üzerinden İngilizceye geçmiştir. Brief hem süre hem söz için 'kısa, özlü' anlamını taşır. İsim olarak birine verilen kısa bilgi ya da talimat özetidir. 'In brief' kalıbı 'kısaca' demektir.","tr_bag":"Türkçedeki 'brifing' İngilizce briefing üzerinden aynı kökten gelir.","tuzak":null,"emin":"yüksek"}},{"w":"capable","pos":"adj","sub":6,"tr":"yetenekli, muktedir (of)","def":"having the ability or capacity to do something","ex":"Few states were [capable] of controlling their borders.","syn":["able","competent","qualified"],"fam":["capability (n)","incapable (adj)"],"col":["capable of"],"ko":{"kok":"capere","kok_anlam":"almak, tutmak","dil":"Latince","parca":[["cap","almak, tutmak"],["-able","-ebilir"]],"yol":"Latince capabilis → Fransızca → İngilizce","imge":"İçine bir şey alabilen, tutabilen bir kap.","hikaye":"Latince capere 'almak, tutmak' demektir; capabilis ise 'alabilen, içine sığdırabilen' anlamındadır. İçine bir şey alabilen şeyin bir kapasitesi vardır. Buradan 'yetenekli, bir işi yapabilecek güçte' anlamı doğar. Akademik metinde capable hep 'of' ile kullanılır: 'capable of solving problems'.","tr_bag":"Türkçedeki 'kapasite' aynı capere kökünden gelir.","tuzak":"'Capable of + -ing' kullanılır; 'capable to do' yanlıştır (able to do ile karıştırılır).","emin":"yüksek"}},{"w":"cite","pos":"v","sub":6,"tr":"alıntı yapmak, atıfta bulunmak; örnek göstermek","def":"to quote as evidence or as an example","ex":"The study is widely [cited] in the literature.","syn":["quote","refer to","mention"],"fam":["citation (n)"],"col":["cite as","frequently cited"],"ko":{"kok":"citare","kok_anlam":"harekete geçirmek, çağırmak","dil":"Latince","parca":[["cit","çağırmak, harekete geçirmek"]],"yol":"Latince citare → Fransızca → İngilizce","imge":"Birini tanık olarak mahkemeye çağırmak.","hikaye":"Latince citare 'harekete geçirmek, çağırmak' demektir. Hukukta birini mahkemeye çağırmak anlamını kazanmıştır. Akademik yazıda bir yazarı ya da eseri kanıt olarak 'çağırırsınız': bu da atıf yapmaktır. Aynı kökten citation 'atıf' gelir.","tr_bag":"Akademik Türkçede kullanılan 'sitasyon' (atıf) aynı kökten gelir.","tuzak":"Cite 'atıf yapmak', site 'yer', sight 'görüş' demektir; okunuşları aynı olduğu için karıştırılır.","emin":"yüksek"}},{"w":"cooperate","pos":"v","sub":6,"tr":"işbirliği yapmak","def":"to work together towards the same goal","ex":"Neighbouring countries [cooperated] to manage water resources.","syn":["collaborate","work together","unite"],"fam":["cooperation (n)","cooperative (adj, n)"],"col":["cooperate with"],"ko":{"kok":"opus","kok_anlam":"iş","dil":"Latince","parca":[["co- (com-)","birlikte"],["oper","çalışmak, iş"],["-ate","fiil eki"]],"yol":"Geç Latince cooperari → İngilizce","imge":"Birkaç kişinin aynı işin başında birlikte çalışması.","hikaye":"Latince operari 'çalışmak' fiili opus 'iş' kelimesinden gelir; co- ön eki 'birlikte' anlamı katar. Cooperate kelimesi kelimesine 'birlikte çalışmak'tır. Akademik metinde ülkelerin, kurumların ya da bireylerin ortak amaç için güç birleştirmesini anlatır. İsmi cooperation 'işbirliği'dir.","tr_bag":"Türkçedeki 'kooperatif' ve 'operasyon' aynı kökten gelir.","tuzak":null,"emin":"yüksek"}},{"w":"discriminate","pos":"v","sub":6,"tr":"ayrımcılık yapmak; ayırt etmek","def":"to treat a group unfairly; to recognise a difference","ex":"Employers often [discriminate] against older applicants.","syn":["differentiate","distinguish","be biased"],"fam":["discrimination (n)","discriminatory (adj)"],"col":["discriminate against","discriminate between"],"ko":{"kok":"cernere","kok_anlam":"ayırmak, elemek","dil":"Latince","parca":[["dis-","ayrı"],["crimin","ayrım, ayırıcı çizgi"],["-ate","fiil eki"]],"yol":"Latince discriminare → İngilizce","imge":"Taneleri elekten geçirip birbirinden ayırmak.","hikaye":"Latince discrimen 'ayrım, ayırıcı çizgi', discernere 'ayırt etmek' fiiliyle ilgilidir; discriminare 'ayırmak' demektir. Asıl anlam tarafsızdır: iki şeyi birbirinden ayırt etmek. Toplumsal anlamda bir grubu ayırıp ona farklı ve haksız davranmaya dönüşmüştür. Bugün her iki anlam da kullanılır.","tr_bag":null,"tuzak":"'Discriminate against' ayrımcılık yapmak, 'discriminate between' ayırt etmek demektir; edatı karıştırmak anlamı değiştirir.","emin":"yüksek"}},{"w":"display","pos":"v","sub":6,"tr":"sergilemek, göstermek","def":"to show or exhibit","ex":"Participants [displayed] high levels of anxiety.","syn":["show","exhibit","reveal"],"fam":["display (n)"],"col":["display signs of"],"ko":{"kok":"plicare","kok_anlam":"katlamak","dil":"Latince","parca":[["dis-","ters, açma"],["play (plicare)","katlamak"]],"yol":"Latince displicare → Eski Fransızca despleier → İngilizce","imge":"Katlanmış bir kumaşı açıp herkesin önüne sermek.","hikaye":"Latince displicare 'katını açmak, yaymak' demektir; plicare 'katlamak' kökünden gelir. Katlı bir şeyi açtığınızda içindeki görünür olur. Buradan 'sergilemek, göstermek' anlamı doğar. Akademik metinde display, verinin ya da bir özelliğin ortaya konmasını anlatır: 'Children display different learning styles.'","tr_bag":"Türkçedeki 'pli' (kumaş kıvrımı), Fransızca pli üzerinden aynı plicare kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"diverse","pos":"adj","sub":6,"tr":"çeşitli, farklı, çok kültürlü","def":"showing a great deal of variety","ex":"London is one of the most culturally [diverse] cities in the world.","syn":["varied","different","heterogeneous"],"fam":["diversity (n)","diversify (v)","diversification (n)"],"col":["ethnically diverse"],"ko":{"kok":"vertere","kok_anlam":"çevirmek, döndürmek","dil":"Latince","parca":[["di- (dis-)","ayrı yönlere"],["vers","çevrilmiş"]],"yol":"Latince diversus → Fransızca → İngilizce","imge":"Farklı yönlere çevrilmiş yollar.","hikaye":"Latince divertere 'başka yöne çevirmek', diversus ise 'farklı yönlere dönmüş' demektir. Farklı yönlere dönen şeyler birbirinden ayrılır. Buradan 'farklı, çeşitli' anlamı doğar. Sosyal bilimlerde diverse ve diversity, bir toplulukta kültür, köken ya da görüş çeşitliliğini anlatır.","tr_bag":"Türkçedeki 'versiyon' aynı vertere 'çevirmek' kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"domain","pos":"n","sub":6,"tr":"alan; etki alanı","def":"an area of knowledge or activity; a territory","ex":"Politics was long seen as a male [domain].","syn":["field","area","sphere"],"fam":[],"col":["public domain","in the domain of"],"ko":{"kok":"dominus","kok_anlam":"efendi, ev sahibi","dil":"Latince","parca":[["domin","efendi, ev sahibi"],["-ium","isim eki"]],"yol":"Latince dominium → Fransızca domaine → İngilizce","imge":"Bir ev sahibinin söz sahibi olduğu toprak.","hikaye":"Latince dominus 'efendi, ev sahibi' domus 'ev' ile ilgilidir; dominium ise 'efendinin mülkü'dür. Birinin hükmettiği toprak onun alanıdır. Anlam topraktan bilgi ve etkinlik alanına genişlemiştir. Akademik metinde domain, bir disiplinin ya da kavramın kapsadığı bölgeyi anlatır: 'the domain of economics'.","tr_bag":"Türkçedeki 'dominant' aynı dominus kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"edit","pos":"v","sub":6,"tr":"düzenlemek, yayına hazırlamak","def":"to prepare text for publication by correcting or revising it","ex":"The volume was [edited] by two historians.","syn":["revise","correct","prepare"],"fam":["edition (n: baskı)","editor (n)","editorial (adj, n)"],"col":["edited volume"],"ko":{"kok":"dare","kok_anlam":"vermek","dil":"Latince","parca":[["e- (ex-)","dışarı"],["dit (dare)","vermek"]],"yol":"Latince edere → editor → İngilizce edit","imge":"Bir metni dışarı, halkın önüne vermek.","hikaye":"Latince edere 'dışarı vermek, yayımlamak' demektir; editor ise 'yayımlayan' kişidir. İngilizce edit fiili editor kelimesinden geriye doğru türetilmiştir. Yayına vermeden önce metin düzeltilip hazırlandığı için edit 'düzenlemek, yayına hazırlamak' anlamını almıştır. Aynı kökten edition 'baskı' gelir.","tr_bag":"Türkçedeki 'editör' ve 'edisyon' aynı kökten gelir.","tuzak":null,"emin":"yüksek"}},{"w":"enhance","pos":"v","sub":6,"tr":"artırmak, güçlendirmek, geliştirmek","def":"to improve the quality, value or extent of something","ex":"Education [enhances] employment opportunities.","syn":["improve","boost","strengthen"],"fam":["enhancement (n)"],"col":["enhance the quality of"],"ko":{"kok":"altus","kok_anlam":"yüksek","dil":"Latince","parca":[["en- (in-)","içine, -e"],["hance (altus)","yüksek"]],"yol":"Latince altus → Eski Fransızca enhaucier → İngilizce","imge":"Bir şeyi daha yukarıya kaldırmak.","hikaye":"Enhance, Eski Fransızca enhaucier 'yükseltmek' fiilinden gelir; bu fiilin temelinde Latince altus 'yüksek' vardır. Bir şeyi yükseltmek onun değerini ya da düzeyini artırmaktır. Akademik metinde enhance, kalite, performans ya da etkinliğin iyileştirilmesini anlatır: 'to enhance learning'.","tr_bag":null,"tuzak":"Enhance olumlu bir şeyi daha iyi yapmayı anlatır; 'enhance the problem' gibi olumsuz şeylerle kullanılmaz, onun yerine increase ya da worsen gelir.","emin":"yüksek"}},{"w":"estate","pos":"n","sub":6,"tr":"mülk, arazi; miras","def":"an area of land or property owned by a person or organisation","ex":"Large [estates] were redistributed during the land reform.","syn":["property","land","holdings"],"fam":[],"col":["real estate","housing estate"],"ko":{"kok":"stare","kok_anlam":"durmak","dil":"Latince","parca":[["e-","Fransızcada s önüne gelen ses"],["stat","duruş, durum"]],"yol":"Latince status → Eski Fransızca estat → İngilizce","imge":"Bir insanın ayakta durduğu yer ve konum.","hikaye":"Latince status 'duruş, durum' stare 'durmak' fiilinden gelir; Eski Fransızca estat üzerinden estate olmuştur. Önce kişinin toplumsal konumunu ve sahip olduklarını anlatıyordu. Anlam zamanla kişinin sahip olduğu mülke ve araziye daralmıştır. 'Real estate' gayrimenkul demektir.","tr_bag":"Türkçedeki 'statü' ve 'statik' aynı stare kökünden gelir.","tuzak":"Estate ile state aynı kökten gelir ama estate 'mülk, arazi', state 'devlet, durum' demektir.","emin":"yüksek"}},{"w":"exceed","pos":"v","sub":6,"tr":"aşmak, geçmek","def":"to be greater than a number or amount","ex":"Public debt [exceeded] 100% of GDP.","syn":["surpass","go beyond","outstrip"],"fam":["excess (n)","excessive (adj)","exceedingly (adv)"],"col":["exceed expectations"],"ko":{"kok":"cedere","kok_anlam":"gitmek","dil":"Latince","parca":[["ex-","dışarı, öteye"],["ceed","gitmek"]],"yol":"Latince excedere → Fransızca → İngilizce","imge":"Bir sınır çizgisinin ötesine yürüyüp gitmek.","hikaye":"Latince excedere 'dışarı çıkmak, öteye geçmek' demektir; kökte cedere 'gitmek' vardır. Bir sınırın ötesine gitmek onu aşmaktır. Akademik metinde exceed, bir sayının, miktarın ya da beklentinin aşılmasını anlatır: 'Demand exceeded supply.' Aynı kökten excess 'fazlalık' gelir.","tr_bag":"Türkçedeki 'prosedür' de aynı cedere 'gitmek' kökünden gelir.","tuzak":"Yazımı -ceed ile biter (exceed, proceed); precede ise -cede ile yazılır.","emin":"yüksek"}},{"w":"expert","pos":"n","sub":6,"tr":"uzman","def":"a person with specialised knowledge or skill","ex":"[Experts] disagree about the long-term effects of the policy.","syn":["specialist","authority","professional"],"fam":["expertise (n: uzmanlık)"],"col":["an expert on","expert opinion"],"ko":{"kok":"experiri","kok_anlam":"denemek","dil":"Latince","parca":[["ex-","dışarı, baştan sona"],["pert","denemek"]],"yol":"Latince expertus → Fransızca → İngilizce","imge":"Bir işi defalarca denemiş kişi.","hikaye":"Latince experiri 'denemek', expertus ise 'denemiş, tecrübeli' demektir. Bir işi çok kez deneyen kişi onu iyi bilir. Expert bu yüzden 'uzman' anlamına gelir. Aynı kökten experience 'deneyim' ve experiment 'deney' gelir.","tr_bag":"Türkçedeki 'eksper' ve 'ekspertiz' Fransızca expert üzerinden aynı kökten gelir.","tuzak":null,"emin":"yüksek"}},{"w":"explicit","pos":"adj","sub":6,"tr":"açık, net, belirgin","def":"stated clearly and in detail","ex":"The law makes [explicit] reference to gender equality.","syn":["clear","direct","specific"],"fam":["explicitly (adv)","implicit (adj: örtük)"],"col":["make explicit"],"ko":{"kok":"plicare","kok_anlam":"katlamak","dil":"Latince","parca":[["ex-","dışarı"],["plic","katlamak"],["-it","sıfat eki (-miş)"]],"yol":"Latince explicitus → İngilizce","imge":"Katları açılıp düzleştirilmiş, içi görünen bir kâğıt.","hikaye":"Latince explicare 'katını açmak, açıklamak', explicitus ise 'katları açılmış' demektir. Katları açılan şeyde gizli bir yer kalmaz. Explicit bu yüzden 'açıkça, ayrıntılı biçimde ifade edilmiş' anlamına gelir. Karşıtı implicit 'örtük'tür: katların içinde kalmış, söylenmeden anlaşılan.","tr_bag":null,"tuzak":"Explicit 'açıkça söylenmiş', implicit 'örtük, ima edilen' demektir; sınavda bu ikisi karşıt çift olarak sık sorulur.","emin":"yüksek"}},{"w":"fee","pos":"n","sub":6,"tr":"ücret, harç","def":"a payment for professional services or for the right to do something","ex":"In England, university tuition [fees] were introduced in 1998.","syn":["charge","payment","cost"],"fam":[],"col":["tuition fees"],"ko":{"kok":"fehu","kok_anlam":"mal, sığır","dil":"Germen","parca":[["fee","ücret (kökte mal, sığır)"]],"yol":"Germen kökenli, Anglo-Fransızca aracılığıyla","imge":"Bir hizmet karşılığında verilen mal.","hikaye":"Fee, Anglo-Fransızca fee 'karşılık olarak verilen şey' kelimesinden gelir. Bu kelimenin gerisinde Germen dillerinde 'mal, sığır' anlamındaki bir kök olduğu düşünülür, ancak ayrıntılı yolu kesin değildir. Bugün fee, bir uzmanın hizmetine ya da bir hakkın kullanımına ödenen parayı anlatır: 'tuition fee', 'registration fee'.","tr_bag":null,"tuzak":"Fee hizmet ya da hak ücretidir; maaş için salary, ulaşım bileti için fare kullanılır.","emin":"orta"}},{"w":"flexible","pos":"adj","sub":6,"tr":"esnek","def":"able to change or be changed easily","ex":"[Flexible] working hours help parents balance work and family.","syn":["adaptable","adjustable","versatile"],"fam":["flexibility (n)","inflexible (adj)"],"col":["flexible working"],"ko":{"kok":"flectere","kok_anlam":"bükmek","dil":"Latince","parca":[["flex","bükmek"],["-ible","-ebilir"]],"yol":"Latince flexibilis → İngilizce","imge":"Kırılmadan bükülebilen bir dal.","hikaye":"Latince flectere 'bükmek', flexibilis ise 'bükülebilir' demektir. Bükülebilen şey kırılmadan biçim değiştirir. Anlam fiziksel esneklikten plan, kural ya da düşüncedeki esnekliğe geçmiştir. Akademik metinde 'flexible working hours' ya da 'flexible policy' gibi kalıplarda görülür.","tr_bag":"Türkçedeki 'refleks' aynı flectere 'bükmek' kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"furthermore","pos":"adv","sub":6,"tr":"ayrıca, üstelik","def":"in addition; moreover","ex":"The policy was costly. [Furthermore], it failed to reduce poverty.","syn":["moreover","in addition","besides"],"fam":[],"col":["furthermore"],"ko":{"kok":"further + more","kok_anlam":"daha ileri + daha çok","dil":"Germen","parca":[["further","daha ileri"],["more","daha çok"]],"yol":"Germen kökenli (İngilizce birleşik kelime)","imge":"Söyleneni bir adım daha ileri taşımak.","hikaye":"Furthermore, further 'daha ileri' ile more 'daha çok' birleşiminden oluşur. Anlatılana bir adım daha ekleyip ilerlemeyi anlatır. Akademik metinde yeni bir argüman ya da kanıt eklerken kullanılır. Moreover ve in addition ile eş anlamlıdır.","tr_bag":null,"tuzak":"Furthermore ekleme bildirir, zıtlık bildirmez; boşluk doldurmada however ya da nevertheless ile karıştırılmamalıdır.","emin":"yüksek"}},{"w":"gender","pos":"n","sub":6,"tr":"toplumsal cinsiyet","def":"the social and cultural roles associated with being male or female","ex":"[Gender] differences in pay remain significant.","syn":[],"fam":["gendered (adj)"],"col":["gender equality","gender roles"],"ko":{"kok":"genus","kok_anlam":"tür, soy","dil":"Latince","parca":[["gen (genus)","tür, soy"]],"yol":"Latince genus → Eski Fransızca gendre → İngilizce","imge":"İnsanları ya da şeyleri türlere ayırmak.","hikaye":"Latince genus, generis 'tür, soy' demektir ve Eski Fransızca üzerinden gender olmuştur. Önce dilbilgisinde isimlerin 'türü'nü, yani dilbilgisel cinsiyetini anlatıyordu. Sosyal bilimlerde kadınlık ve erkekliğe yüklenen toplumsal ve kültürel rolleri anlatır hâle gelmiştir. Aynı kökten general ve generation gelir.","tr_bag":"Türkçedeki 'jenerasyon' ve 'jenerik' aynı genus kökünden gelir.","tuzak":"Sosyal bilimlerde gender toplumsal cinsiyettir, sex ise biyolojik cinsiyettir; ikisi aynı anlamda kullanılmaz.","emin":"yüksek"}},{"w":"ignorance","pos":"n","sub":6,"tr":"cehalet, bilgisizlik","def":"lack of knowledge or information","ex":"Prejudice is often rooted in [ignorance].","syn":["unawareness","lack of knowledge"],"fam":["ignorant (adj)","ignore (v)"],"col":["ignorance of"],"ko":{"kok":"gnarus","kok_anlam":"bilen","dil":"Latince","parca":[["i- (in-)","değil"],["gnor","bilmek"],["-ance","isim eki"]],"yol":"Latince ignorantia → Fransızca → İngilizce","imge":"Bilgi ışığının hiç ulaşmadığı bir yer.","hikaye":"Latince ignorare 'bilmemek', olumsuzluk ön eki ile 'bilen' anlamındaki gnarus kökünün birleşimine dayanır. Ignorantia 'bilmeme durumu'dur. İngilizce ignorance bu yüzden 'cehalet, bilgisizlik' demektir. Aynı ailede ignorant 'bilgisiz' ve ignore 'görmezden gelmek' bulunur.","tr_bag":null,"tuzak":"Ignore 'görmezden gelmek', ignorance ise 'bilgisizlik' demektir; ignorance 'görmezden gelme' diye çevrilmez.","emin":"yüksek"}},{"w":"incentive","pos":"n","sub":6,"tr":"teşvik, özendirici","def":"something that motivates or encourages someone to do something","ex":"Tax [incentives] attracted foreign investors.","syn":["motivation","stimulus","inducement"],"fam":[],"col":["an incentive to","financial incentives"],"ko":{"kok":"canere","kok_anlam":"şarkı söylemek, çalmak","dil":"Latince","parca":[["in-","içine, başlatma"],["cent (canere)","çalmak, söylemek"],["-ive","sıfat/isim eki"]],"yol":"Geç Latince incentivum → İngilizce","imge":"Bir ezgiyi başlatıp ötekileri harekete geçiren çalgıcı.","hikaye":"Latince incinere 'bir ezgiyi çalmaya başlamak' canere 'şarkı söylemek, çalmak' fiilinden gelir. Incentivus 'tonu veren, başlatan' demektir. Tonu veren şey başkalarını harekete geçirir; anlam buradan 'kışkırtıcı, özendirici'ye geçmiştir. Ekonomide incentive, davranışı yönlendiren teşvik ya da ödüldür: 'tax incentives'.","tr_bag":null,"tuzak":null,"emin":"yüksek"}},{"w":"incidence","pos":"n","sub":6,"tr":"görülme sıklığı, oran","def":"the frequency with which something occurs","ex":"The [incidence] of poverty is higher in rural areas.","syn":["rate","frequency","occurrence"],"fam":["incident (n: olay)","incidental (adj)"],"col":["high incidence of"],"ko":{"kok":"cadere","kok_anlam":"düşmek","dil":"Latince","parca":[["in-","üzerine"],["cid (cadere)","düşmek"],["-ence","isim eki"]],"yol":"Latince incidere → İngilizce","imge":"Bir şeyin birinin üzerine düşmesi.","hikaye":"Latince incidere 'üzerine düşmek, başa gelmek' demektir; kökte cadere 'düşmek' vardır. Bir olayın bir topluluğun üzerine ne sıklıkla düştüğü, onun görülme sıklığıdır. Akademik metinde incidence, bir hastalığın, suçun ya da olgunun belirli bir dönemdeki oranını anlatır: 'the incidence of poverty'.","tr_bag":"Tıp ve epidemiyolojide kullanılan 'insidans' aynı kelimeden gelir.","tuzak":"Incidence 'görülme sıklığı', incident ise 'olay' demektir; iki kelime sık karıştırılır.","emin":"yüksek"}},{"w":"incorporate","pos":"v","sub":6,"tr":"dahil etmek, bünyesine katmak","def":"to include something as part of a whole","ex":"The new curriculum [incorporates] environmental education.","syn":["include","integrate","absorb"],"fam":["incorporation (n)"],"col":["incorporate into"],"ko":{"kok":"corpus","kok_anlam":"beden","dil":"Latince","parca":[["in-","içine"],["corpor","beden"],["-ate","fiil eki"]],"yol":"Geç Latince incorporare → İngilizce","imge":"Bir parçayı bedenin içine katmak.","hikaye":"Latince incorporare 'bedene katmak, bir gövdeye dahil etmek' demektir; kökte corpus, corporis 'beden' vardır. Bir parçayı bedene katmak onu bütünün bir üyesi yapmaktır. Akademik metinde incorporate, bir öğeyi, veriyi ya da fikri bir bütüne dahil etmeyi anlatır: 'to incorporate feedback into the design'.","tr_bag":"Türkçedeki 'korporasyon' ve 'korpus' aynı corpus kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"index","pos":"n","sub":6,"tr":"endeks, dizin; gösterge","def":"a list of items; a number showing the level of something","ex":"The Human Development [Index] ranks countries by health, education and income.","syn":["indicator","measure","list"],"fam":["index (v)","indices (çoğul)"],"col":["price index"],"ko":{"kok":"indicare","kok_anlam":"göstermek","dil":"Latince","parca":[["in-","-e doğru"],["dex (dic)","göstermek"]],"yol":"Latince index → İngilizce","imge":"Bir şeyi gösteren işaret parmağı.","hikaye":"Latince index 'gösteren, işaret eden' demektir ve işaret parmağının da adıdır. Kitabın sonundaki dizin okura aradığı yeri gösterir. Ekonomideki endeks de bir düzeyi ya da değişimi gösteren sayıdır. Aynı kökten indicate 'göstermek' ve indicator 'gösterge' gelir.","tr_bag":"Türkçedeki 'endeks' aynı kelimeden gelir.","tuzak":"Çoğulu indexes ya da (özellikle bilimsel metinde) indices olur.","emin":"yüksek"}},{"w":"inhibit","pos":"v","sub":6,"tr":"engellemek, ketlemek","def":"to hinder or restrain an action or process","ex":"High interest rates [inhibit] investment.","syn":["hinder","restrain","impede"],"fam":["inhibition (n)","inhibitor (n)"],"col":["inhibit growth"],"ko":{"kok":"habere","kok_anlam":"tutmak, sahip olmak","dil":"Latince","parca":[["in-","içinde, üzerinde"],["hib (habere)","tutmak"]],"yol":"Latince inhibere → İngilizce","imge":"İlerlemek isteyen bir şeyi elle geri tutmak.","hikaye":"Latince inhibere 'tutmak, durdurmak' demektir; habere 'tutmak, sahip olmak' fiilinden türemiştir. Bir hareketi geri tutmak onu engellemektir. Akademik metinde inhibit, bir süreci ya da gelişmeyi yavaşlatan veya bastıran etkenleri anlatır: 'Poverty inhibits access to education.'","tr_bag":"Kimya ve biyolojide kullanılan 'inhibitör' aynı kökten gelir.","tuzak":null,"emin":"yüksek"}},{"w":"initiate","pos":"v","sub":6,"tr":"başlatmak","def":"to cause a process or action to begin","ex":"The government [initiated] a series of economic reforms.","syn":["begin","start","launch"],"fam":["initiative (n: girişim)","initiation (n)","initial (adj)"],"col":["initiate reforms"],"ko":{"kok":"ire","kok_anlam":"gitmek","dil":"Latince","parca":[["in-","içeri"],["it (ire)","gitmek"],["-ate","fiil eki"]],"yol":"Latince initiare → İngilizce","imge":"Bir kapıdan içeri ilk adımı atmak.","hikaye":"Latince inire 'içeri girmek' demektir; initium buradan 'başlangıç' anlamını alır. Initiare 'başlatmak' ve 'birini bir topluluğa kabul etmek' demektir. İçeri atılan ilk adım bir sürecin başlangıcıdır. Akademik metinde initiate, bir reformu, projeyi ya da süreci başlatmayı anlatır.","tr_bag":"Türkçedeki 'inisiyatif' aynı kökten gelir.","tuzak":null,"emin":"yüksek"}},{"w":"input","pos":"n","sub":6,"tr":"girdi, katkı","def":"what is put into a system; a contribution of information or ideas","ex":"Local residents had little [input] into the planning process.","syn":["contribution","involvement","data"],"fam":["input (v)"],"col":["input into"],"ko":{"kok":"in + put","kok_anlam":"içeri + koymak","dil":"Germen","parca":[["in","içeri"],["put","koymak"]],"yol":"Germen kökenli (İngilizce birleşik kelime)","imge":"Bir kabın içine konan malzeme.","hikaye":"Input, in 'içeri' ile put 'koymak' kelimelerinin birleşiminden oluşur. Bir sisteme ya da sürece içeri konan her şey onun girdisidir. Anlam ekonomideki üretim girdilerinden bilgi ve fikir katkısına genişlemiştir. Karşıtı output 'çıktı'dır.","tr_bag":null,"tuzak":null,"emin":"yüksek"}},{"w":"instruct","pos":"v","sub":6,"tr":"talimat vermek; öğretmek","def":"to direct or command; to teach","ex":"Participants were [instructed] to read the text carefully.","syn":["direct","order","teach"],"fam":["instruction (n)","instructor (n)","instructive (adj: öğretici)"],"col":["instruct someone to"],"ko":{"kok":"struere","kok_anlam":"yığmak, kurmak","dil":"Latince","parca":[["in-","içine, üzerine"],["struct","kurmak, dizmek"]],"yol":"Latince instruere → İngilizce","imge":"Taşları üst üste dizip bir yapı kurmak.","hikaye":"Latince instruere 'kurmak, düzenlemek, donatmak' demektir; kökte struere 'yığmak, kurmak' vardır. Birinin zihnini bilgiyle donatmak onu eğitmektir. Buradan 'öğretmek' ve 'talimat vermek' anlamları doğmuştur. Aynı kökten instruction 'talimat' ve instructor 'eğitmen' gelir.","tr_bag":"Türkçedeki 'strüktür' ve 'enstrüman' aynı kökten gelir.","tuzak":null,"emin":"yüksek"}},{"w":"intelligence","pos":"n","sub":6,"tr":"zekâ; istihbarat","def":"the ability to acquire and apply knowledge; secret information about enemies","ex":"Emotional [intelligence] predicts job performance.","syn":["intellect","cleverness","information"],"fam":["intelligent (adj)","intelligible (adj: anlaşılır)"],"col":["artificial intelligence","intelligence service"],"ko":{"kok":"legere","kok_anlam":"seçmek, toplamak, okumak","dil":"Latince","parca":[["intel- (inter-)","arasından"],["lig (legere)","seçmek"],["-ence","isim eki"]],"yol":"Latince intelligentia → Fransızca → İngilizce","imge":"Seçenekler arasından doğru olanı seçip almak.","hikaye":"Latince intellegere 'anlamak', inter 'arasından' ile legere 'seçmek' birleşimidir. Şeyler arasından seçim yapabilmek onları ayırt edip anlamaktır. Intelligentia bu yüzden 'anlama yetisi, zekâ'dır. Toplanıp anlamlandırılmış bilgi anlamında 'istihbarat' da aynı kelimeyle anlatılır.","tr_bag":"Türkçedeki 'entelektüel' aynı intellegere kökünden gelir.","tuzak":"Intelligence 'zekâ'nın yanında 'istihbarat' da demektir; 'intelligence service' zekâ hizmeti değil, istihbarat servisidir.","emin":"yüksek"}},{"w":"interval","pos":"n","sub":6,"tr":"aralık, ara","def":"a period of time between two events","ex":"Data were collected at six-month [intervals].","syn":["gap","period","break"],"fam":[],"col":["at regular intervals","confidence interval"],"ko":{"kok":"vallum","kok_anlam":"sur, kazıklı duvar","dil":"Latince","parca":[["inter-","arası"],["val (vallum)","kazıklı sur"]],"yol":"Latince kökenli","imge":"Surdaki iki kazık arasındaki boşluk.","hikaye":"Latince intervallum, kelimesi kelimesine 'surun kazıkları arası' demektir. İki kazık arasındaki boşluk anlamı genel olarak iki şey arasındaki aralığa genişlemiştir. Bugün interval hem zaman hem mekân aralığını anlatır. İstatistikte 'confidence interval' güven aralığıdır.","tr_bag":null,"tuzak":null,"emin":"yüksek"}},{"w":"lecture","pos":"n","sub":6,"tr":"ders (konferans şeklinde), konferans","def":"an educational talk to an audience, especially students","ex":"Attendance at [lectures] was not compulsory.","syn":["talk","speech","lesson"],"fam":["lecture (v)","lecturer (n: öğretim görevlisi)"],"col":["give a lecture on"],"ko":{"kok":"legere","kok_anlam":"okumak","dil":"Latince","parca":[["lect (legere)","okumak"],["-ure","isim eki"]],"yol":"Ortaçağ Latincesi lectura → Fransızca → İngilizce","imge":"Bir kürsüden metin okuyan öğretmen.","hikaye":"Ortaçağ Latincesi lectura 'okuma' legere 'okumak' fiilinden gelir. Üniversitelerde hoca metni okuyup yorumlayarak ders verirdi. Bu yüzden 'okuma' anlamı 'topluluğa verilen ders, konferans'a dönüşmüştür. Lecturer 'öğretim görevlisi' de aynı kökten gelir.","tr_bag":"Türkçedeki 'lektör' aynı legere kökünden gelir.","tuzak":"Lecture 'ders, konferans' demektir; Fransızcadaki lecture gibi 'okuma' anlamına gelmez.","emin":"yüksek"}},{"w":"migrate","pos":"v","sub":6,"tr":"göç etmek","def":"to move from one region or country to another","ex":"Millions [migrated] from rural areas to the cities.","syn":["move","relocate","emigrate"],"fam":["migration (n)","migrant (n)","migratory (adj)"],"col":["migrate to","migrate from"],"ko":{"kok":"migrare","kok_anlam":"yer değiştirmek, göçmek","dil":"Latince","parca":[["migr","göçmek"],["-ate","fiil eki"]],"yol":"Latince migrare → İngilizce","imge":"Bir yerden kalkıp başka bir yere taşınan topluluk.","hikaye":"Latince migrare 'yer değiştirmek, göçmek' demektir. İngilizcede de aynı anlamı korur: insanların ya da hayvanların bir bölgeden başka bir bölgeye taşınması. Sosyal bilimlerde migration 'göç' temel bir kavramdır. Ön eklerle emigrate 'dışarı göç etmek' ve immigrate 'içeri göç etmek' türer.","tr_bag":null,"tuzak":"Emigrate ülkeden ayrılmayı, immigrate ülkeye gelmeyi anlatır; migrate yön belirtmez.","emin":"yüksek"}},{"w":"minimum","pos":"n","sub":6,"tr":"asgari, en az","def":"the smallest amount possible or allowed","ex":"The [minimum] wage was raised by 15%.","syn":["lowest","least"],"fam":["minimal (adj)","minimise (v)"],"col":["minimum wage","at a minimum"],"ko":{"kok":"minimus","kok_anlam":"en küçük","dil":"Latince","parca":[["min","küçük"],["-imum","en (üstünlük eki)"]],"yol":"Latince minimum → İngilizce","imge":"Bir dizinin en küçük ucu.","hikaye":"Latince minimus 'en küçük' demektir; minimum bunun yansız biçimidir. Aynı ailede minor 'daha küçük' ve minus 'daha az' bulunur. Akademik metinde minimum, izin verilen ya da mümkün olan en düşük miktarı anlatır: 'a minimum of three years'.","tr_bag":"Türkçede 'minimum' aynen kullanılır; 'minör' de aynı aileden gelir.","tuzak":"Bilimsel metinde çoğulu minima olabilir; karşıtı maximum, çoğulu maxima'dır.","emin":"yüksek"}},{"w":"ministry","pos":"n","sub":6,"tr":"bakanlık","def":"a government department headed by a minister","ex":"The [Ministry] of Education announced a new curriculum.","syn":["department","office"],"fam":["minister (n)","ministerial (adj)"],"col":["Ministry of Health"],"ko":{"kok":"minister","kok_anlam":"hizmetkâr, yardımcı","dil":"Latince","parca":[["minist (minister)","hizmetkâr"],["-ry","isim eki"]],"yol":"Latince kökenli","imge":"Efendisinin yanında hizmet eden yardımcı.","hikaye":"Latince minister 'hizmetkâr, yardımcı' minus 'daha az' ile ilgilidir; karşıtı magister 'usta, efendi'dir. Ministerium 'hizmet' demektir. Devlete ve halka hizmet eden kişi minister, yani bakan olmuştur. Ministry ise bakanın yönettiği kurum, bakanlıktır.","tr_bag":null,"tuzak":"Ministry 'bakanlık', minister 'bakan' demektir; ikisi karıştırılmamalıdır.","emin":"yüksek"}},{"w":"motive","pos":"n","sub":6,"tr":"güdü, sebep","def":"a reason for doing something","ex":"Economic [motives] explain most labour migration.","syn":["reason","motivation","incentive"],"fam":["motivate (v)","motivation (n)"],"col":["motive for","ulterior motive"],"ko":{"kok":"movere","kok_anlam":"hareket ettirmek","dil":"Latince","parca":[["mot (movere)","hareket ettirmek"],["-ive","sıfat/isim eki"]],"yol":"Ortaçağ Latincesi motivus → Fransızca → İngilizce","imge":"İnsanı yerinden kaldıran bir itici güç.","hikaye":"Latince movere 'hareket ettirmek' demektir; motivus 'hareket ettiren' anlamına gelir. İnsanı bir eyleme doğru hareket ettiren şey onun güdüsüdür. Bu yüzden motive 'güdü, sebep' demektir. Aynı kökten motivation 'motivasyon' gelir.","tr_bag":"Türkçedeki 'motor', 'motivasyon' ve 'motif' aynı movere kökünden gelir.","tuzak":"Türkçedeki 'motif' süsleme deseni demektir; İngilizce motive ise 'güdü, sebep'tir.","emin":"yüksek"}},{"w":"neutral","pos":"adj","sub":6,"tr":"tarafsız, yansız","def":"not supporting either side in a conflict","ex":"Switzerland remained [neutral] during both world wars.","syn":["impartial","unbiased","non-aligned"],"fam":["neutrality (n)","neutralise (v)"],"col":["remain neutral"],"ko":{"kok":"neuter","kok_anlam":"ikisinden hiçbiri","dil":"Latince","parca":[["ne-","değil"],["utr (uter)","ikisinden biri"],["-al","sıfat eki"]],"yol":"Latince neutralis → İngilizce","imge":"İki taraf arasında ikisine de katılmadan duran biri.","hikaye":"Latince neuter, ne 'değil' ile uter 'ikisinden biri' birleşimidir ve 'ikisinden hiçbiri' demektir. İki taraftan hiçbirine ait olmayan kişi tarafsızdır. Neutral buradan 'tarafsız, yansız' anlamını alır. Akademik metinde 'neutral language' ya da 'value-neutral' gibi kalıplarda görülür.","tr_bag":"Türkçedeki 'nötr' aynı kökten gelir.","tuzak":null,"emin":"yüksek"}},{"w":"nevertheless","pos":"adv","sub":6,"tr":"yine de, buna rağmen","def":"in spite of that","ex":"The sample was small. [Nevertheless], the results are important.","syn":["nonetheless","however","even so"],"fam":[],"col":["nevertheless"],"ko":{"kok":"never + the + less","kok_anlam":"hiç + o kadar + daha az","dil":"Germen","parca":[["never","hiç, asla"],["the","o kadar"],["less","daha az"]],"yol":"Germen kökenli (İngilizce birleşik kelime)","imge":"Bir engele rağmen hiç eksilmeden devam eden bir şey.","hikaye":"Nevertheless, never, the ve less kelimelerinin birleşimidir: 'bu yüzden hiç de daha az değil'. Yani söylenen engel sonucu azaltmaz. Akademik metinde zıtlık bildirir: 'The sample was small; nevertheless, the results are significant.' However ve nonetheless ile yakın anlamlıdır.","tr_bag":null,"tuzak":"Nevertheless zıtlık bildirir, ekleme bildirmez; furthermore ya da moreover ile karıştırılmamalıdır.","emin":"yüksek"}},{"w":"overseas","pos":"adj","sub":6,"tr":"yurt dışı, denizaşırı","def":"relating to foreign countries, especially across the sea","ex":"[Overseas] students make up 20% of enrolments.","syn":["foreign","abroad","international"],"fam":["overseas (adv)"],"col":["overseas students","overseas aid"],"ko":{"kok":"over + sea","kok_anlam":"üstünden + deniz","dil":"Germen","parca":[["over","üstünden, ötesine"],["seas","denizler"]],"yol":"Germen kökenli (İngilizce birleşik kelime)","imge":"Denizin öbür yakasındaki topraklar.","hikaye":"Overseas, over 'ötesine' ile sea 'deniz' birleşimidir ve 'denizin ötesi' demektir. Deniz ötesindeki yerler yabancı ülkelerdir. Bu yüzden overseas 'yurt dışı' anlamında kullanılır: 'overseas students', 'overseas markets'. Deniz aşılmasa bile genel olarak 'yabancı ülke' anlamı taşır.","tr_bag":null,"tuzak":"Zarf olarak edatsız kullanılır: 'study overseas' doğru, 'study to overseas' yanlıştır.","emin":"yüksek"}},{"w":"precede","pos":"v","sub":6,"tr":"önce gelmek, öncesinde olmak","def":"to come before something in time or order","ex":"A long economic crisis [preceded] the revolution.","syn":["come before","antedate","lead up to"],"fam":["precedent (n: emsal)","preceding (adj)","unprecedented (adj: eşi görülmemiş)"],"col":["preceded by"],"ko":{"kok":"cedere","kok_anlam":"gitmek","dil":"Latince","parca":[["pre- (prae-)","önce, önde"],["cede","gitmek"]],"yol":"Latince praecedere → Fransızca → İngilizce","imge":"Bir yürüyüşte en önde giden kişi.","hikaye":"Latince praecedere 'önden gitmek' demektir; prae 'önde' ile cedere 'gitmek' birleşimidir. Önden giden şey zamanda ya da sırada önce gelir. Akademik metinde precede, bir olayın başka birinden önce geldiğini anlatır. Aynı kökten precedent 'emsal' ve unprecedented 'eşi görülmemiş' gelir.","tr_bag":"Türkçedeki 'presedan' (emsal) aynı kelime ailesinden gelir.","tuzak":"Precede 'önce gelmek', proceed 'devam etmek, ilerlemek' demektir; yazım ve anlam olarak karıştırılır.","emin":"yüksek"}},{"w":"presume","pos":"v","sub":6,"tr":"varsaymak, farz etmek","def":"to suppose that something is true without proof","ex":"Defendants are [presumed] innocent until proven guilty.","syn":["assume","suppose","take for granted"],"fam":["presumption (n)","presumably (adv)"],"col":["presume that"],"ko":{"kok":"sumere","kok_anlam":"almak","dil":"Latince","parca":[["pre- (prae-)","önceden"],["sume","almak"]],"yol":"Latince praesumere → Fransızca → İngilizce","imge":"Kanıt gelmeden bir şeyi önceden alıp elde tutmak.","hikaye":"Latince praesumere 'önceden almak' demektir; kökte sumere 'almak' vardır. Kanıt gelmeden bir şeyi önceden doğru diye almak onu varsaymaktır. Hukuktaki 'presumption of innocence', suçu kanıtlanana kadar masumiyetin önceden kabul edilmesidir. Aynı kökten assume ve consume gelir.","tr_bag":null,"tuzak":null,"emin":"yüksek"}},{"w":"rational","pos":"adj","sub":6,"tr":"akılcı, rasyonel, mantıklı","def":"based on reason or logic","ex":"[Rational] choice theory assumes that people maximise benefits.","syn":["logical","reasonable","sensible"],"fam":["rationality (n)","rationalise (v)","irrational (adj)"],"col":["rational choice"],"ko":{"kok":"ratio","kok_anlam":"hesap, akıl","dil":"Latince","parca":[["ration (ratio)","hesap, akıl"],["-al","sıfat eki"]],"yol":"Latince rationalis → İngilizce","imge":"Her adımı hesaplayarak ilerleyen bir zihin.","hikaye":"Latince ratio 'hesap, akıl yürütme' demektir; rationalis 'akla dayanan' anlamına gelir. Hesap ile akıl arasındaki bağ bu kelimede açıkça görülür. Akademik metinde rational, mantıklı ve akla dayalı karar ya da davranışı anlatır. Ekonomideki 'rational choice' kavramı buradan gelir.","tr_bag":"Türkçedeki 'rasyonel' ve 'rasyo' aynı ratio kökünden gelir.","tuzak":"Rational 'akılcı' bir sıfattır; rationale ise 'gerekçe' anlamında bir isimdir.","emin":"yüksek"}},{"w":"recover","pos":"v","sub":6,"tr":"toparlanmak, iyileşmek; geri almak","def":"to return to a normal state; to regain possession","ex":"The economy [recovered] slowly after the crisis.","syn":["recuperate","bounce back","regain"],"fam":["recovery (n)"],"col":["recover from"],"ko":{"kok":"recuperare","kok_anlam":"geri almak","dil":"Latince","parca":[["re-","geri"],["-cover","recuperare'nin Fransızcada aşınmış biçimi"]],"yol":"Latince recuperare → Eski Fransızca recovrer → İngilizce","imge":"Kaybedilen bir şeyi geri almak.","hikaye":"Latince recuperare 'geri almak, yeniden ele geçirmek' demektir ve Eski Fransızca üzerinden recover olmuştur. Kaybedilen sağlığı geri almak iyileşmektir. Ekonomide bir piyasanın eski düzeyine dönmesi de recovery 'toparlanma' diye anlatılır. İngilizce cover 'örtmek' ile anlam bağı yoktur.","tr_bag":null,"tuzak":"Recover 're-cover' (yeniden örtmek) değildir; 'recover from' iyileşmek, 'recover something' geri almak demektir.","emin":"yüksek"}},{"w":"reveal","pos":"v","sub":6,"tr":"ortaya koymak, açığa çıkarmak","def":"to make known something previously unknown","ex":"The interviews [revealed] deep distrust of politicians.","syn":["disclose","show","uncover"],"fam":["revelation (n)"],"col":["reveal that"],"ko":{"kok":"velum","kok_anlam":"örtü, perde","dil":"Latince","parca":[["re-","geri (açma)"],["veal (velum)","örtü"]],"yol":"Latince revelare → Fransızca → İngilizce","imge":"Bir şeyin üstündeki örtüyü geri çekmek.","hikaye":"Latince revelare 're-' ön eki ile velum 'örtü, perde' birleşimidir ve 'örtüsünü kaldırmak' demektir. Burada re- 'tekrar' değil, 'geri çekme' anlamı verir. Örtüsü kalkan şey görünür olur. Akademik metinde reveal, bir araştırmanın gizli kalmış bir bulguyu ortaya koymasını anlatır: 'The study revealed that...'.","tr_bag":"Türkçedeki 'vual' (ince perde kumaşı) Fransızca voile üzerinden aynı velum kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"scope","pos":"n","sub":6,"tr":"kapsam, alan","def":"the extent of the area or subject matter something deals with","ex":"The [scope] of the study is limited to urban areas.","syn":["range","extent","reach"],"fam":[],"col":["beyond the scope of","scope for"],"ko":{"kok":"skopos","kok_anlam":"gözcü, hedef","dil":"Yunanca","parca":[["scope (skopos)","bakılan hedef"]],"yol":"Yunanca skopos → İtalyanca scopo → İngilizce","imge":"Gözün nişan alıp baktığı hedef.","hikaye":"Yunanca skopos 'gözcü' ve 'bakılan hedef' demektir; skopein 'bakmak' fiiliyle ilgilidir. İtalyanca scopo 'hedef, amaç' üzerinden İngilizceye geçmiştir. Bakılan hedeften, gözün ve eylemin ulaşabildiği alana geçilir. Akademik metinde scope, bir çalışmanın kapsamını anlatır: 'beyond the scope of this study'.","tr_bag":"Türkçedeki 'teleskop' ve 'mikroskop' aynı Yunanca skopein 'bakmak' kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"subsidy","pos":"n","sub":6,"tr":"sübvansiyon, devlet desteği","def":"money granted by the state to help keep prices low or support an industry","ex":"Agricultural [subsidies] distort world trade.","syn":["grant","aid","support"],"fam":["subsidise (v)"],"col":["farm subsidies"],"ko":{"kok":"sedere","kok_anlam":"oturmak","dil":"Latince","parca":[["sub-","altta, geride"],["sid (sedere
