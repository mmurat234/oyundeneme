anlam":"yetmek, yerine koymak","dil":"Latince","parca":[["suf- (sub-)","altına"],["fic (facere)","yapmak, koymak"],["-ient","sıfat eki (-an/-en)"]],"yol":"Latince sufficere → Eski Fransızca → İngilizce","imge":"Eksik kalan yerin altına destek koymak.","hikaye":"Latince sufficere, sub- 'altına' ile facere 'koymak, yapmak' parçalarından oluşur. Bir şeyin altına gereken desteği koymak, onu yeterli kılmaktır. Bu yüzden sufficient 'yeterli' anlamındadır. Akademik metinde 'sufficient evidence' ve mantıktaki 'necessary and sufficient conditions' sık geçer.","tr_bag":null,"tuzak":"sufficient 'yeterli' ile efficient 'verimli' karıştırılır.","emin":"yüksek"}},{"w":"task","pos":"n","sub":3,"tr":"görev, iş","def":"a piece of work to be done","ex":"Participants completed a memory [task].","syn":["job","duty","assignment"],"fam":[],"col":["carry out a task","a difficult task"],"ko":{"kok":"taxare","kok_anlam":"değer biçmek, vergi koymak","dil":"Latince","parca":[["task","vergi, yüklenen iş"]],"yol":"Latince taxare → Ortaçağ Latincesi tasca → Eski Kuzey Fransızcası → İngilizce","imge":"Birine yüklenen ve yapılması zorunlu bir iş payı.","hikaye":"Kelime Ortaçağ Latincesi tasca 'vergi' kelimesine dayanır; bu da taxa ve taxare 'değer biçmek' ile ilgilidir. Vergi, birine yüklenen bir yüktür; buradan 'yapılması istenen iş' anlamı çıktı. Bugün task, yapılacak belirli bir görevdir. Araştırma dilinde 'experimental task' deneydeki görevi anlatır.","tr_bag":null,"tuzak":null,"emin":"yüksek"}},{"w":"technical","pos":"adj","sub":3,"tr":"teknik","def":"relating to a particular subject, art or craft, or its techniques","ex":"The report is written in highly [technical] language.","syn":["specialised","practical","mechanical"],"fam":["technically (adv)","technician (n)"],"col":["technical assistance"],"ko":{"kok":"tekhne","kok_anlam":"zanaat, beceri, sanat","dil":"Yunanca","parca":[["techn","zanaat, beceri"],["-ic","sıfat eki"],["-al","sıfat eki"]],"yol":"Yunanca tekhnikos → Latince → İngilizce","imge":"Ustanın elindeki aletle işini ustalıkla yapması.","hikaye":"Yunanca tekhne 'zanaat, beceri' demektir; tekhnikos 'zanaata ait' anlamındadır. Bir zanaat özel bilgi ve beceri ister. Technical bu yüzden belli bir alana ya da yönteme ait olanı anlatır: 'technical terms', 'technical assistance'. Sıfattır; isim karşılığı technique'tir.","tr_bag":"Türkçedeki 'teknik' ve 'teknoloji' aynı tekhne kökünden gelir.","tuzak":"Türkçede 'teknik' hem isim hem sıfattır; İngilizcede sıfat technical, isim technique'tir.","emin":"yüksek"}},{"w":"technique","pos":"n","sub":3,"tr":"teknik, yöntem","def":"a particular way of carrying out a task","ex":"Snowball sampling is a common [technique] in qualitative research.","syn":["method","procedure","approach"],"fam":[],"col":["research technique"],"ko":{"kok":"tekhne","kok_anlam":"zanaat, beceri, sanat","dil":"Yunanca","parca":[["techn","zanaat, beceri"],["-ique","Fransızca sıfat/isim eki"]],"yol":"Yunanca tekhnikos → Fransızca technique → İngilizce","imge":"Bir ustanın işini yaparken kullandığı özel yol.","hikaye":"Kelime Yunanca tekhne 'zanaat, beceri' kökünden gelir ve İngilizceye Fransızcadan geçmiştir. Her zanaatın kendine özgü bir yapma yolu vardır. Technique bugün bir işi yapmanın belirli yöntemidir: 'data collection techniques', 'sampling techniques'. Akademik metinde method ile yakın anlamlıdır.","tr_bag":"Türkçedeki 'teknik' aynı Fransızca kelimeden gelir.","tuzak":"technique 'yöntem' isimdir, technical ise sıfattır; Türkçedeki 'teknik' ikisini de karşılar.","emin":"yüksek"}},{"w":"valid","pos":"adj","sub":3,"tr":"geçerli; sağlam, mantıklı","def":"legally or officially acceptable; logically sound","ex":"The questionnaire was tested to ensure it was [valid].","syn":["sound","legitimate","well-founded"],"fam":["validity (n)","validate (v)","invalid (adj)"],"col":["a valid argument","statistically valid"],"ko":{"kok":"valere","kok_anlam":"güçlü olmak, değerli olmak","dil":"Latince","parca":[["val","güçlü olmak"],["-id","sıfat eki"]],"yol":"Latince validus → Fransızca → İngilizce","imge":"Ayakta sağlam duran, gücü yerinde bir beden.","hikaye":"Latince validus, valere 'güçlü olmak' fiilinden gelir ve 'güçlü, sağlam' demektir. Güçlü olan bir şey ayakta kalır; sağlam bir akıl yürütme de itiraza dayanır. Valid bugün hem hukuken geçerli olanı hem mantıksal olarak sağlam olanı anlatır. Araştırma yönteminde validity 'geçerlilik', reliability 'güvenirlik'ten ayrılır.","tr_bag":"Bankacılıktaki 'valör' aynı valere 'değerli olmak' kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"volume","pos":"n","sub":3,"tr":"hacim, miktar; cilt","def":"the amount of space something occupies; a quantity; a book in a series","ex":"The [volume] of trade between the two countries doubled.","syn":["amount","quantity","bulk"],"fam":["voluminous (adj)"],"col":["trade volume","volume two"],"ko":{"kok":"volvere","kok_anlam":"yuvarlamak, dürmek","dil":"Latince","parca":[["volu","dürmek, yuvarlamak"],["-men","isim eki (sonuç)"]],"yol":"Latince volumen → Fransızca → İngilizce","imge":"Silindir gibi dürülmüş bir yazı tomarı.","hikaye":"Latince volumen, volvere 'dürmek' fiilinden gelir ve 'dürülmüş yazı tomarı' demektir. Tomar kitap anlamına geçti; bugünkü 'cilt' anlamı buradan gelir. Bir cildin büyüklüğünden 'hacim, miktar' anlamı çıktı. Akademik metinde 'the volume of trade' ya da bir derginin cilt numarası (Vol.) için kullanılır.","tr_bag":"Türkçedeki 'revolver' aynı volvere 'döndürmek, yuvarlamak' kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"adequate","pos":"adj","sub":4,"tr":"yeterli, elverişli","def":"satisfactory or acceptable in quality or quantity","ex":"Many refugees lack [adequate] housing.","syn":["sufficient","satisfactory","acceptable"],"fam":["adequacy (n)","adequately (adv)","inadequate (adj)"],"col":["adequate for"],"ko":{"kok":"aequare","kok_anlam":"eşitlemek","dil":"Latince","parca":[["ad-","-e, -e doğru"],["aequ","eşit"],["-ate","sıfat eki"]],"yol":"Latince adaequatus → İngilizce","imge":"Bir şeyi ölçüye getirip ona eşit hâle getirmek.","hikaye":"Latince adaequare 'bir şeye eşitlemek' demektir; kökteki aequus 'eşit' anlamındadır. İhtiyaca eşit gelen şey, ihtiyacı karşılayan şeydir. Akademik metinde adequate, bir kaynağın ya da yöntemin işi görecek düzeyde olduğunu anlatır: 'adequate evidence', 'adequate resources'. Aynı kökten equal ve equation da gelir.","tr_bag":"Türkçedeki 'ekvator' da aynı aequare 'eşitlemek' kökünden gelir.","tuzak":"Adequate 'yeterli, kabul edilebilir' demektir; 'mükemmel, ideal' anlamı taşımaz.","emin":"yüksek"}},{"w":"annual","pos":"adj","sub":4,"tr":"yıllık","def":"occurring once every year; calculated over a year","ex":"The [annual] growth rate fell to 2%.","syn":["yearly","per annum"],"fam":["annually (adv)"],"col":["annual report","annual income"],"ko":{"kok":"annus","kok_anlam":"yıl","dil":"Latince","parca":[["ann","yıl"],["-ual (-alis)","sıfat eki (-lık/-lik)"]],"yol":"Latince annualis → Fransızca → İngilizce","imge":"Her yıl dönüp gelen bir takvim.","hikaye":"Latince annus 'yıl' demektir; annualis 'yıla ait, yıllık' anlamına gelir. Her yıl tekrarlanan ya da bir yılı kapsayan şey annual olur. Sosyal bilimlerde 'annual growth rate' ya da 'annual report' gibi kalıplarda sık geçer. Aynı kökten anniversary 'yıl dönümü' de gelir.","tr_bag":"Türkçedeki 'bienal' (iki yılda bir yapılan sergi) aynı annus köküne dayanır.","tuzak":null,"emin":"yüksek"}},{"w":"apparent","pos":"adj","sub":4,"tr":"açık, belli; görünürdeki","def":"clearly visible or understood; seeming real but not necessarily so","ex":"It soon became [apparent] that the plan would fail.","syn":["evident","obvious","seeming"],"fam":["apparently (adv: görünüşe göre)"],"col":["it is apparent that","for no apparent reason"],"ko":{"kok":"parere","kok_anlam":"görünmek, ortaya çıkmak","dil":"Latince","parca":[["ap- (ad-)","-e, -e doğru"],["par","görünmek"],["-ent","sıfat eki (-en/-an)"]],"yol":"Latince apparere → Fransızca → İngilizce","imge":"Göz önüne çıkıp beliren bir şey.","hikaye":"Latince apparere 'göz önüne çıkmak, görünmek' demektir. Görünen şey hem açıkça belli olandır hem de yalnızca öyle görünendir. Bu yüzden apparent iki yöne çekilir: 'for no apparent reason' (belli bir neden olmadan) ve 'apparent success' (görünürdeki başarı). Aynı kökten appear 'görünmek' gelir.","tr_bag":null,"tuzak":"Apparent 'görünürdeki, göründüğü kadarıyla' anlamında da kullanılır; apparently çoğu zaman 'görünüşe göre' demektir, 'açıkça' değil.","emin":"yüksek"}},{"w":"approximate","pos":"adj","sub":4,"tr":"yaklaşık","def":"close to the actual but not completely accurate","ex":"The [approximate] cost of the project is 2 million euros.","syn":["rough","estimated","close"],"fam":["approximately (adv)","approximation (n)","approximate (v)"],"col":["approximate number"],"ko":{"kok":"proximus","kok_anlam":"en yakın","dil":"Latince","parca":[["ap- (ad-)","-e, -e doğru"],["proxim","en yakın"],["-ate","sıfat/fiil eki"]],"yol":"Geç Latince approximare → İngilizce","imge":"Hedefe iyice yaklaşan ama tam üstüne basmayan bir adım.","hikaye":"Geç Latince approximare 'yaklaşmak, yakına getirmek' demektir; proximus 'en yakın' anlamındadır. Hedefe çok yaklaşan ama onunla tam çakışmayan değer yaklaşık değerdir. Araştırma metinlerinde approximate ve approximately, kesin olmayan ama gerçeğe yakın sayıları verir. Aynı kökten proximity 'yakınlık' gelir.","tr_bag":null,"tuzak":null,"emin":"yüksek"}},{"w":"attitude","pos":"n","sub":4,"tr":"tutum","def":"a settled way of thinking or feeling about something","ex":"Public [attitudes] towards divorce have become more liberal.","syn":["view","opinion","stance"],"fam":["attitudinal (adj)"],"col":["attitude towards","change in attitude"],"ko":{"kok":"aptus","kok_anlam":"uygun","dil":"Latince","parca":[["apt","uygun"],["-itude","isim eki (-lık/-lik)"]],"yol":"Latince aptitudo → İtalyanca attitudine → Fransızca attitude → İngilizce","imge":"Bir heykelin ya da resimdeki figürün duruşu.","hikaye":"Kelime İtalyancadan Fransızcaya bir sanat terimi olarak geçmiştir ve önce resimde ya da heykelde figürün duruşunu anlatıyordu. Bedenin duruşundan zihnin duruşuna geçilince 'tutum' anlamı doğdu. Sosyal psikolojide attitude, bir kişinin bir konuya karşı değerlendirici yönelimidir. Aynı Latince kökten aptitude 'yetenek, yatkınlık' gelir.","tr_bag":"Türkçedeki 'adaptasyon' da aptus 'uygun' köküyle ilişkilidir.","tuzak":"Attitude 'tutum', aptitude 'yetenek, yatkınlık' demektir; yazılışları yakın olduğu için karıştırılır.","emin":"yüksek"}},{"w":"attribute","pos":"v","sub":4,"tr":"atfetmek, (bir nedene) bağlamak","def":"to regard something as caused by something","ex":"The decline in crime is often [attributed] to better policing.","syn":["ascribe","credit","assign"],"fam":["attribute (n: nitelik, özellik)","attribution (n)"],"col":["attribute A to B"],"ko":{"kok":"tribuere","kok_anlam":"vermek, pay etmek","dil":"Latince","parca":[["at- (ad-)","-e, -e doğru"],["tribu","vermek, paylaştırmak"],["-te","fiil eki"]],"yol":"Latince attribuere → İngilizce","imge":"Bir payı ayırıp birine teslim etmek.","hikaye":"Latince attribuere 'birine ayırıp vermek' demektir. Bir sonucu bir nedene 'vermek', onu o nedene bağlamaktır. Akademik metinde 'attribute X to Y' kalıbı, bir olguyu bir etkene bağlamak için kullanılır: 'The decline is attributed to...'. İsim olarak attribute, bir şeye ait sayılan özelliktir.","tr_bag":"Türkçedeki 'distribütör' (dağıtıcı) aynı tribuere kökünden gelir.","tuzak":"Fiil 'attribute X to Y' kalıbıyla kullanılır ve vurgu ikinci hecededir; isim (özellik) olarak vurgu ilk hecededir.","emin":"yüksek"}},{"w":"civil","pos":"adj","sub":4,"tr":"sivil; medeni; kamusal","def":"relating to ordinary citizens rather than the military or church; polite","ex":"[Civil] society organisations played a key role in the reforms.","syn":["civic","public","courteous"],"fam":["civilian (n)","civilisation (n)","civility (n)"],"col":["civil war","civil rights","civil society"],"ko":{"kok":"civis","kok_anlam":"yurttaş","dil":"Latince","parca":[["civ","yurttaş"],["-il (-ilis)","sıfat eki"]],"yol":"Latince civilis → Fransızca → İngilizce","imge":"Şehrin meydanında bir arada yaşayan yurttaşlar.","hikaye":"Latince civis 'yurttaş', civilis 'yurttaşa ait' demektir. Yurttaşlar arası ilişkilerden hem 'askerî olmayan' hem 'kamusal' hem de 'nazik' anlamları çıkmıştır. Sosyal bilimlerde 'civil society' (sivil toplum), 'civil rights' (medeni haklar) ve 'civil war' (iç savaş) temel kavramlardır. Aynı kökten civilization gelir.","tr_bag":"Türkçedeki 'sivil' ve 'sivilizasyon' aynı civis kökünden gelir.","tuzak":"Civil yalnız 'askerî olmayan' demek değildir: civil war 'iç savaş', civil law 'medeni hukuk' anlamına gelir.","emin":"yüksek"}},{"w":"commit","pos":"v","sub":4,"tr":"işlemek (suç); taahhüt etmek, bağlanmak","def":"to carry out a crime or mistake; to pledge oneself","ex":"The government is [committed] to reducing child poverty.","syn":["perpetrate","pledge","devote"],"fam":["commitment (n)","committed (adj)","committee (n)"],"col":["be committed to","commit a crime"],"ko":{"kok":"mittere","kok_anlam":"göndermek, bırakmak","dil":"Latince","parca":[["com-","birlikte, tamamen"],["mit","göndermek, bırakmak"]],"yol":"Latince committere → İngilizce","imge":"Bir şeyi birinin eline bırakıp emanet etmek.","hikaye":"Latince committere 'bir araya koymak, emanet etmek' demektir. Kendini bir işe emanet eden ona bağlanır; bir eylemi 'ortaya koyan' da onu işlemiş olur. Bu yüzden commit hem 'taahhüt etmek' hem 'suç işlemek' anlamını taşır. Akademik metinde 'be committed to' kalıbı bir amaca bağlılığı anlatır.","tr_bag":"Türkçedeki 'komisyon' aynı committere fiilinden türeyen commissio'dan gelir.","tuzak":"'Be committed to' kalıbında to bir edattır; ardından fiil -ing alır: 'committed to improving'.","emin":"yüksek"}},{"w":"communicate","pos":"v","sub":4,"tr":"iletişim kurmak, iletmek","def":"to share or exchange information or ideas","ex":"Social media allows politicians to [communicate] directly with voters.","syn":["convey","transmit","express"],"fam":["communication (n)","communicative (adj)"],"col":["communicate with"],"ko":{"kok":"communis","kok_anlam":"ortak","dil":"Latince","parca":[["communic","ortak kılmak"],["-ate","fiil eki"]],"yol":"Latince communicare → İngilizce","imge":"Bir şeyi herkesin ortak malı hâline getirmek.","hikaye":"Latince communicare 'ortak kılmak, paylaşmak' demektir; kökteki communis 'ortak' anlamındadır. Bir bilgiyi iletmek, onu karşı tarafla paylaşıp ortak hâle getirmektir. Sosyal bilimlerde communication, anlamın insanlar arasında paylaşılma sürecini anlatır. Aynı kökten community 'topluluk' gelir.","tr_bag":"Türkçedeki 'komünikasyon' ve 'komün' aynı communis kökünden gelir.","tuzak":"Birine ulaşmak 'communicate with someone' diye kurulur; 'communicate someone' denmez.","emin":"yüksek"}},{"w":"concentrate","pos":"v","sub":4,"tr":"yoğunlaşmak; toplanmak","def":"to focus attention on; to gather in one place","ex":"Industry is [concentrated] in the western regions.","syn":["focus","centre","cluster"],"fam":["concentration (n)"],"col":["concentrate on","highly concentrated"],"ko":{"kok":"centrum","kok_anlam":"merkez (Yun. kentron: sivri uç)","dil":"Latince","parca":[["con-","birlikte"],["centr","merkez"],["-ate","fiil eki"]],"yol":"Latince con- + centrum ile kurulmuş türetme; centrum Yunanca kentron'dan","imge":"Dağınık noktaların tek bir merkeze doğru toplanması.","hikaye":"Kelime con- 'birlikte' ile centrum 'merkez' parçalarından kurulmuştur. Yunanca kentron, pergelin sivri ucu demektir; daire bu noktanın çevresinde çizilir. Bir şeyi tek merkezde toplamak, zihin için dikkati bir noktaya toplamaktır. Sosyal bilimlerde nüfusun ya da servetin belli bir yerde toplanması da concentration diye anlatılır.","tr_bag":"Türkçedeki 'konsantre' ve 'konsantrasyon' aynı kelimeden gelir.","tuzak":"Dikkat toplamak 'concentrate on' ile kurulur; 'concentrate to' denmez.","emin":"yüksek"}},{"w":"confer","pos":"v","sub":4,"tr":"vermek, bahşetmek; görüşmek","def":"to grant a title, right or benefit; to discuss","ex":"Citizenship [confers] certain rights and duties.","syn":["grant","bestow","consult"],"fam":["conference (n)"],"col":["confer on","confer with"],"ko":{"kok":"ferre","kok_anlam":"taşımak, getirmek","dil":"Latince","parca":[["con-","birlikte"],["fer","taşımak"]],"yol":"Latince conferre → İngilizce","imge":"Farklı şeyleri taşıyıp aynı yere getirmek.","hikaye":"Latince conferre 'bir araya getirmek; karşılaştırmak; vermek' demektir. İnsanları bir araya getirmek görüşmeyi, bir şeyi birine getirmek ise onu vermeyi anlatır. Bugün 'confer a degree on someone' (unvan vermek) ve 'confer with colleagues' (görüşmek) kalıplarında yaşar. Metinlerdeki 'cf.' kısaltması da bu fiilin 'karşılaştır' anlamına dayanır.","tr_bag":"Türkçedeki 'konferans' aynı conferre fiilinden gelir.","tuzak":"'Confer on/upon someone' vermek, 'confer with someone' görüşmek demektir; edat anlamı değiştirir.","emin":"yüksek"}},{"w":"contrast","pos":"n","sub":4,"tr":"karşıtlık, zıtlık","def":"a striking difference between things","ex":"In [contrast] to the north, the south remained largely rural.","syn":["difference","disparity","opposition"],"fam":["contrast (v)","contrasting (adj)"],"col":["in contrast to","by contrast"],"ko":{"kok":"stare","kok_anlam":"durmak","dil":"Latince","parca":[["contra-","karşı"],["st","durmak"]],"yol":"Ortaçağ Latincesi contrastare → İtalyanca contrasto → Fransızca contraste → İngilizce","imge":"Karşı karşıya dikilmiş iki şey.","hikaye":"Kelime contra 'karşı' ile stare 'durmak' parçalarından gelir; 'karşısında durmak' demektir. İki şey yan yana durduğunda farkları daha belirgin görünür. Akademik metinde 'in contrast to', 'by contrast' kalıpları karşılaştırma kurmak için kullanılır. Fiil olarak contrast, iki şeyi farklarını göstererek karşılaştırmaktır.","tr_bag":"Türkçedeki 'kontrast' aynı kelimeden gelir.","tuzak":"İsimde vurgu ilk hecede (CONtrast), fiilde ikinci hecededir (conTRAST).","emin":"yüksek"}},{"w":"cycle","pos":"n","sub":4,"tr":"döngü, devre","def":"a series of events that repeat regularly","ex":"Poverty can become a [cycle] passed from parents to children.","syn":["circle","pattern","round"],"fam":["cyclical (adj)","recycle (v)"],"col":["economic cycle","life cycle"],"ko":{"kok":"kyklos","kok_anlam":"çember, tekerlek","dil":"Yunanca","parca":[["cycl","çember, daire"]],"yol":"Yunanca kyklos → Geç Latince cyclus → Fransızca → İngilizce","imge":"Dönüp yeniden başladığı noktaya gelen bir tekerlek.","hikaye":"Yunanca kyklos 'çember, tekerlek' demektir. Çember üzerinde ilerleyen her nokta sonunda başladığı yere döner. Bu imge, kendini tekrarlayan süreçleri anlatmaya taşınmıştır: 'business cycle' (konjonktür dalgası), 'life cycle' (yaşam döngüsü). Aynı kökten encyclopedia da gelir: bilginin 'çemberi'.","tr_bag":"Türkçedeki 'bisiklet' ve 'siklon' aynı kyklos kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"debate","pos":"n","sub":4,"tr":"tartışma","def":"a formal discussion in which opposing arguments are put forward","ex":"The [debate] over headscarves divided public opinion.","syn":["discussion","dispute","controversy"],"fam":["debate (v)","debatable (adj)"],"col":["a heated debate","open to debate"],"ko":{"kok":"battuere","kok_anlam":"vurmak, dövmek","dil":"Latince","parca":[["de-","aşağı, tamamen"],["bate (batre)","vurmak"]],"yol":"Latince battuere → Eski Fransızca debatre → İngilizce","imge":"Karşılıklı darbelerin indiği bir kavga.","hikaye":"Eski Fransızca debatre 'dövüşmek' demektir; kökteki Latince battuere 'vurmak' anlamındadır. Yumrukla yapılan kavga, zamanla sözle yapılan çekişmeye dönüşmüştür. Akademik metinde debate, bir konuda karşıt görüşlerin çarpıştığı tartışmayı anlatır: 'an ongoing debate'. Aynı kökten battle 'savaş' da gelir.","tr_bag":null,"tuzak":null,"emin":"yüksek"}},{"w":"dimension","pos":"n","sub":4,"tr":"boyut","def":"an aspect or feature of a situation or problem","ex":"Poverty has economic, social and cultural [dimensions].","syn":["aspect","facet","element"],"fam":["dimensional (adj)"],"col":["a new dimension to"],"ko":{"kok":"metiri","kok_anlam":"ölçmek","dil":"Latince","parca":[["di- (dis-)","ayrı, her yöne"],["mens","ölçmek"],["-ion","isim eki"]],"yol":"Latince dimensio → Fransızca → İngilizce","imge":"Bir nesneyi her yönden ölçüp sınırlarını çizmek.","hikaye":"Latince dimensio 'ölçüm, ölçü' demektir; dimetiri 'ölçüp ayırmak' fiilinden gelir. Bir nesnenin ölçülebilen her yönü onun bir boyutudur. Sosyal bilimler kelimeyi soyut alanlara taşır: bir sorunun 'social dimension'ı, onun toplumsal yönüdür. Ölçeklerde de bir kavramın alt boyutları dimension diye anılır.","tr_bag":null,"tuzak":null,"emin":"yüksek"}},{"w":"domestic","pos":"adj","sub":4,"tr":"yerli, iç; ev içi, aileye ait","def":"relating to one's own country; relating to the home or family","ex":"[Domestic] demand fell as unemployment rose.","syn":["internal","national","household"],"fam":["domesticate (v: evcilleştirmek)"],"col":["domestic violence","domestic market"],"ko":{"kok":"domus","kok_anlam":"ev","dil":"Latince","parca":[["dom","ev"],["-estic (-esticus)","sıfat eki"]],"yol":"Latince domesticus → Fransızca → İngilizce","imge":"Bir evin duvarları içinde kalan yaşam.","hikaye":"Latince domus 'ev', domesticus 'eve ait' demektir. Evin içi dış dünyaya karşıtlık içinde düşünülür; ölçek büyüyünce 'ülkenin içi' anlamı çıkar. Bu yüzden domestic hem 'domestic violence' (aile içi şiddet) hem 'domestic market' (iç piyasa) kalıplarında geçer. Hayvanlar için domesticate 'evcilleştirmek' demektir.","tr_bag":null,"tuzak":"Ekonomi metinlerinde domestic 'ev içi' değil 'yurt içi' demektir: gross domestic product 'gayrisafi yurt içi hasıla'.","emin":"yüksek"}},{"w":"emerge","pos":"v","sub":4,"tr":"ortaya çıkmak","def":"to become known or visible; to come into existence","ex":"New middle classes [emerged] in the rapidly growing cities.","syn":["appear","arise","surface"],"fam":["emergence (n)","emerging (adj)","emergent (adj)"],"col":["emerge from","emerging economies"],"ko":{"kok":"mergere","kok_anlam":"dalmak, batırmak","dil":"Latince","parca":[["e- (ex-)","dışarı"],["merg","dalmak, batmak"]],"yol":"Latince emergere → İngilizce","imge":"Suyun altından yüzeye çıkan bir cisim.","hikaye":"Latince emergere 'suyun içinden çıkmak' demektir; mergere 'dalmak, batırmak' anlamındadır. Görünmezken birden ortaya çıkan her şey bu imgeyle anlatılır. Akademik metinde emerge, yeni bir eğilimin ya da bulgunun belirmesini anlatır: 'A new pattern emerged'. Aynı kökten emergency, 'aniden ortaya çıkan durum'dur.","tr_bag":null,"tuzak":"Emerge geçişsizdir, edilgen yapılmaz: 'was emerged' yanlış, 'emerged' doğrudur.","emin":"yüksek"}},{"w":"error","pos":"n","sub":4,"tr":"hata","def":"a mistake; the state of being wrong","ex":"The difference is within the margin of [error].","syn":["mistake","inaccuracy","fault"],"fam":["erroneous (adj: hatalı)"],"col":["margin of error","human error"],"ko":{"kok":"errare","kok_anlam":"dolaşmak, yolunu şaşırmak","dil":"Latince","parca":[["err","dolaşmak, sapmak"],["-or","isim eki"]],"yol":"Latince error → Eski Fransızca → İngilizce","imge":"Yolunu kaybedip başıboş dolaşan bir yolcu.","hikaye":"Latince errare 'dolaşmak, yolunu şaşırmak' demektir; error bu sapmanın adıdır. Doğru yoldan sapmak, doğru sonuçtan sapmaya benzetilmiştir. İstatistikte 'standard error' ve 'measurement error', gerçek değerden sapmayı anlatır. Aynı kökten erratic 'düzensiz' gelir.","tr_bag":null,"tuzak":"Hata yapmak 'make an error' diye kurulur; 'do an error' denmez.","emin":"yüksek"}},{"w":"ethnic","pos":"adj","sub":4,"tr":"etnik","def":"relating to a group sharing a common national or cultural tradition","ex":"The country is home to several [ethnic] minorities.","syn":["cultural","racial","national"],"fam":["ethnicity (n)","ethnically (adv)"],"col":["ethnic group","ethnic conflict"],"ko":{"kok":"ethnos","kok_anlam":"halk, topluluk","dil":"Yunanca","parca":[["ethn","halk, topluluk"],["-ic","sıfat eki"]],"yol":"Yunanca ethnikos → Geç Latince ethnicus → İngilizce","imge":"Ortak bir kimlikle bir arada yaşayan bir halk.","hikaye":"Yunanca ethnos 'halk, topluluk' demektir. Kilise Latincesinde ethnicus, Hristiyan ya da Yahudi olmayan 'öteki kavimler' için kullanılmıştır. Modern sosyal bilimlerde ethnic, ortak köken, dil ve kültür duygusu taşıyan grupları anlatır: 'ethnic identity', 'ethnic minority'. Aynı kökten ethnography gelir.","tr_bag":"Türkçedeki 'etnik' ve 'etnografya' aynı ethnos kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"grant","pos":"v","sub":4,"tr":"vermek, bahşetmek; kabul etmek","def":"to give or allow something officially; to agree that something is true","ex":"In Turkey, women were [granted] the right to vote in national elections in 1934.","syn":["award","give","concede"],"fam":["grant (n: hibe, burs)"],"col":["take for granted","grant permission"],"ko":{"kok":"credere","kok_anlam":"inanmak, güvenmek","dil":"Latince","parca":[["grant","güvence vermek"]],"yol":"Latince credere → Halk Latincesi (varsayılan biçim) → Eski Fransızca granter/creanter → İngilizce","imge":"Birine güvenip onun isteğine onay vermek.","hikaye":"Eski Fransızca granter 'güvence vermek, onaylamak' demektir ve Latince credere 'inanmak' fiiline dayanır. Birine güvenip isteğini onaylamaktan 'vermek, bahşetmek' anlamına geçilmiştir. İsim olarak grant, araştırmalar için verilen hibedir. 'Granted that...' ise karşı tarafın bir noktasını kabul ederek konuşmaya başlar.","tr_bag":"Türkçedeki 'kredi' aynı credere 'inanmak' kökünden gelir.","tuzak":"'Take something for granted' bir şeyi 'hibe almak' değil, 'olağan saymak, doğal kabul etmek' demektir.","emin":"yüksek"}},{"w":"hence","pos":"adv","sub":4,"tr":"bu nedenle, dolayısıyla","def":"as a consequence; for this reason","ex":"Wages are low and, [hence], many graduates move abroad.","syn":["therefore","thus","consequently"],"fam":[],"col":["hence the need for"],"ko":{"kok":"heonan","kok_anlam":"buradan","dil":"Germen","parca":[["heonan (hen-)","buradan"],["-s (-ce)","zarf eki"]],"yol":"Eski İngilizce heonan → Orta İngilizce hennes → İngilizce hence","imge":"Bulunulan yerden çıkan bir yol.","hikaye":"Eski İngilizcede heonan 'buradan' demekti. 'Buradan' yer bildirirken 'bundan' anlamına kaydı: bir noktadan çıkılan yol gibi bir önermeden de sonuç çıkar. Akademik metinde hence, önceki cümleden çıkan sonucu bağlar. Eski kullanımda 'şu andan itibaren' anlamı da vardır: 'two years hence'.","tr_bag":null,"tuzak":"Hence bir bağlaç değil zarftır; çoğu zaman fiilsiz bir isim öbeğiyle de gelir: 'hence the name'.","emin":"yüksek"}},{"w":"hypothesis","pos":"n","sub":4,"tr":"hipotez, varsayım","def":"a proposed explanation that is tested through research","ex":"The results support the [hypothesis] that contact reduces prejudice.","syn":["theory","proposition","assumption"],"fam":["hypothesise (v)","hypothetical (adj)"],"col":["test a hypothesis"],"ko":{"kok":"tithenai","kok_anlam":"koymak","dil":"Yunanca","parca":[["hypo-","alt"],["thesis","koyma, konan şey"]],"yol":"Yunanca hypothesis → Geç Latince → İngilizce","imge":"Bir yapının altına konan temel taşı.","hikaye":"Yunanca hypothesis 'alta konan şey, temel' demektir: hypo 'alt' ve thesis 'koyma'. Bir akıl yürütmenin altına, henüz kanıtlanmadan konan önerme odur. Araştırmada hipotez, verilerle sınanmak üzere öne sürülen ifadedir: 'test a hypothesis'. Aynı thesis parçası tez ve sentez kelimelerinde de bulunur.","tr_bag":"Türkçedeki 'hipotez' ve 'tez' aynı Yunanca kelimelerden gelir.","tuzak":"Çoğulu hypotheses'tir; 'hypothesises' yanlıştır.","emin":"yüksek"}},{"w":"implement","pos":"v","sub":4,"tr":"uygulamak, hayata geçirmek","def":"to put a plan or decision into effect","ex":"The reforms were [implemented] over a five-year period.","syn":["carry out","execute","apply"],"fam":["implementation (n)","implement (n: alet)"],"col":["implement a policy"],"ko":{"kok":"implere","kok_anlam":"doldurmak","dil":"Latince","parca":[["im- (in-)","içine"],["ple","doldurmak"],["-ment","isim eki"]],"yol":"Geç Latince implementum → İngilizce","imge":"Bir kabı ağzına kadar doldurmak.","hikaye":"Geç Latince implementum 'doldurma' demektir; implere 'içini doldurmak' fiilinden gelir. Bir planı doldurmak, onu eksiksiz yerine getirmek demektir. Bugün implement, bir kararı ya da politikayı uygulamaya koymayı anlatır: 'implement a policy'. İsim olarak implement 'alet, araç' anlamına da gelir.","tr_bag":"Türkçedeki 'komple' de aynı plere 'doldurmak' köküne dayanan completus'tan gelir.","tuzak":null,"emin":"yüksek"}},{"w":"implicate","pos":"v","sub":4,"tr":"(suça) karıştırmak; ilişkilendirmek","def":"to show that someone is involved in a crime; to show as a cause","ex":"Several officials were [implicated] in the scandal.","syn":["involve","incriminate","associate"],"fam":["implication (n: sonuç, ima)"],"col":["be implicated in"],"ko":{"kok":"plicare","kok_anlam":"katlamak, bükmek","dil":"Latince","parca":[["im- (in-)","içine"],["plic","katlamak"],["-ate","fiil eki"]],"yol":"Latince implicare → İngilizce","imge":"Bir ipin başka bir şeyin içine dolanıp sarılması.","hikaye":"Latince implicare 'içine dolamak, sarmak' demektir. Bir işin içine dolanan kişi ona karışmış olur. Akademik metinde implicate, bir etkenin bir süreçle ilişkili görülmesini de anlatır: 'genes implicated in the disease'. Aynı fiilden imply 'ima etmek' ve implication 'sonuç, ima' gelir.","tr_bag":"Türkçedeki 'komplike' aynı plicare 'katlamak' kökünden gelir.","tuzak":"Implicate 'karıştırmak, ilişkilendirmek', imply 'ima etmek' demektir; aynı kökten gelseler de birbirinin yerine kullanılmaz.","emin":"yüksek"}},{"w":"impose","pos":"v","sub":4,"tr":"dayatmak, uygulamak (vergi, yasak)","def":"to force something unwelcome to be accepted or put in place","ex":"The government [imposed] a curfew after the riots.","syn":["enforce","inflict","introduce"],"fam":["imposition (n)","imposing (adj: heybetli)"],"col":["impose a tax on","impose restrictions"],"ko":{"kok":"ponere","kok_anlam":"koymak","dil":"Latince","parca":[["im- (in-)","üstüne"],["pose","koymak"]],"yol":"Fransızca imposer üzerinden; Latince imponere 'üstüne koymak' ile bağlantılı","imge":"Birinin sırtına bir yük koymak.","hikaye":"Latince imponere 'üstüne koymak' demektir. Birinin üstüne yük koymak, ona bir yükümlülük dayatmaktır. Bugün impose, vergi, yasak ya da kural koymayı anlatır: 'impose sanctions on a country'. Aynı kökten position ve compose gibi kelimeler de gelir.","tr_bag":"Türkçedeki 'empoze etmek' aynı kelimeden gelir.","tuzak":"Kime dayatıldığı on ile verilir: 'impose a tax on imports'.","emin":"yüksek"}},{"w":"integrate","pos":"v","sub":4,"tr":"bütünleştirmek, uyum sağlamak","def":"to combine into a whole; to bring into equal participation in society","ex":"Language courses help migrants [integrate] into society.","syn":["incorporate","combine","assimilate"],"fam":["integration (n)","integrated (adj)","integral (adj)"],"col":["integrate into"],"ko":{"kok":"integer","kok_anlam":"bütün, dokunulmamış","dil":"Latince","parca":[["in-","değil"],["teg (tangere)","dokunmak"],["-rate","fiil eki"]],"yol":"Latince integrare → İngilizce","imge":"Hiç dokunulmamış, eksiksiz duran bir bütün.","hikaye":"Latince integer 'dokunulmamış, bütün' demektir; integrare ise 'bütün hâle getirmek' anlamına gelir. Parçaları bir araya getirip eksiksiz bir bütün kurmak bütünleştirmektir. Sosyolojide integration, göçmenlerin ya da grupların topluma katılmasını anlatır. Aynı kökten integrity 'bütünlük, dürüstlük' gelir.","tr_bag":"Türkçedeki 'entegre', 'entegrasyon' ve matematikteki 'integral' aynı kökten gelir.","tuzak":"Bir bütüne katmak 'integrate into' ya da 'integrate with' ile kurulur.","emin":"yüksek"}},{"w":"internal","pos":"adj","sub":4,"tr":"iç, dahili","def":"situated on the inside; relating to affairs within a country or organisation","ex":"[Internal] migration from villages to cities accelerated.","syn":["domestic","inner","interior"],"fam":["internally (adv)","internalise (v)"],"col":["internal affairs","internal migration"],"ko":{"kok":"internus","kok_anlam":"iç, içerideki","dil":"Latince","parca":[["intern (internus)","içerideki"],["-al","sıfat eki"]],"yol":"Latince internus temelinde kurulmuş, İngilizce -al ekiyle","imge":"Bir yapının duvarlarının iç tarafı.","hikaye":"Latince internus 'içerideki' demektir; in 'içinde' ile ilişkilidir. Kelime bir sınırın iç tarafında kalanı anlatır. Sosyal bilimlerde 'internal migration' (iç göç), araştırmada 'internal validity' (iç geçerlik) temel kalıplardır. Karşıtı external 'dış' kelimesidir.","tr_bag":null,"tuzak":null,"emin":"yüksek"}},{"w":"investigate","pos":"v","sub":4,"tr":"araştırmak, soruşturmak","def":"to carry out a systematic inquiry into something","ex":"This study [investigates] the causes of school dropout.","syn":["examine","explore","inquire into"],"fam":["investigation (n)","investigator (n)"],"col":["investigate the effect of"],"ko":{"kok":"vestigare","kok_anlam":"iz sürmek","dil":"Latince","parca":[["in-","içine, üzerine"],["vestig","iz sürmek"],["-ate","fiil eki"]],"yol":"Latince investigare → İngilizce","imge":"Toprağa düşmüş ayak izlerini adım adım takip etmek.","hikaye":"Latince investigare 'iz sürmek' demektir; vestigium 'ayak izi' anlamındadır. Ayak izlerinden giderek bir şeyin kaynağına ulaşmak, araştırmanın kendisine benzetilmiştir. Akademik metinde investigate, bir konuyu sistemli biçimde incelemeyi anlatır: 'This study investigates...'. Aynı kökten vestige 'iz, kalıntı' gelir.","tr_bag":null,"tuzak":"Investigate geçişli bir fiildir: 'investigate the issue' doğru, 'investigate about the issue' yanlıştır.","emin":"yüksek"}},{"w":"label","pos":"v","sub":4,"tr":"etiketlemek, damgalamak","def":"to describe or classify, often unfairly","ex":"Young people from poor areas are often [labelled] as troublemakers.","syn":["categorise","brand","stigmatise"],"fam":["label (n)","labelling theory (n)"],"col":["be labelled as"],"ko":{"kok":"label","kok_anlam":"şerit, kurdele","dil":"Fransızca","parca":[["label","şerit, bant"]],"yol":"Eski Fransızca label → İngilizce; daha önceki kökeni kesin değildir","imge":"Bir nesneye iliştirilmiş dar bir şerit.","hikaye":"Eski Fransızca label 'şerit, kurdele' demektir; daha gerisi kesin değildir, Germen kökenli olduğu düşünülür. Bir nesneye iliştirilen şerit, onun ne olduğunu gösteren etikete dönüşmüştür. Sosyolojide 'labelling theory', bir kişiye takılan adın onun kimliğini ve davranışını nasıl etkilediğini inceler. Fiil olarak label, birine bir sıfat yapıştırmayı anlatır.","tr_bag":null,"tuzak":null,"emin":"orta"}},{"w":"mechanism","pos":"n","sub":4,"tr":"mekanizma, işleyiş","def":"a process or system by which something takes place","ex":"Markets are seen as a [mechanism] for allocating resources.","syn":["process","means","system"],"fam":["mechanical (adj)","mechanistic (adj)"],"col":["a mechanism for","defence mechanism"],"ko":{"kok":"mekhane","kok_anlam":"düzenek, makine","dil":"Yunanca","parca":[["mechan","düzenek, makine"],["-ism","isim eki"]],"yol":"Yunanca mekhane → Yeni Latince mechanismus → İngilizce","imge":"Dişlileri birbirini döndüren bir düzenek.","hikaye":"Yunanca mekhane 'düzenek, araç' demektir. Mechanism, parçaları birbirine etki ederek iş gören bir düzeneğin adıdır. Sosyal bilimler kelimeyi soyut süreçlere taşır: bir etkinin 'hangi yolla' ortaya çıktığı onun mekanizmasıdır. 'Defense mechanism' ve 'market mechanism' bu kullanımın örnekleridir.","tr_bag":"Türkçedeki 'mekanizma', 'makine' ve 'mekanik' aynı Yunanca kökten gelir.","tuzak":null,"emin":"yüksek"}},{"w":"obvious","pos":"adj","sub":4,"tr":"açık, belli, aşikâr","def":"easily seen or understood","ex":"There is no [obvious] solution to the housing crisis.","syn":["evident","clear","apparent"],"fam":["obviously (adv)"],"col":["it is obvious that"],"ko":{"kok":"via","kok_anlam":"yol","dil":"Latince","parca":[["ob-","karşı, önüne"],["vi","yol"],["-ous","sıfat eki"]],"yol":"Latince obvius → İngilizce","imge":"Yolda insanın tam karşısına çıkan bir şey.","hikaye":"Latince obvius 'yolda karşıya çıkan' demektir: ob 'karşı' ve via 'yol'. Yolun ortasında karşınıza çıkan şeyi görmemek mümkün değildir. Bu imgeden 'apaçık, belli' anlamı doğmuştur. Akademik metinde obvious, açıklama gerektirmeyecek kadar belirgin olanı anlatır.","tr_bag":"Türkçedeki 'viyadük' de aynı via 'yol' kökünü taşır.","tuzak":null,"emin":"yüksek"}},{"w":"occupy","pos":"v","sub":4,"tr":"işgal etmek; kaplamak; meşgul etmek","def":"to take control of a place by force; to fill space or time","ex":"The city was [occupied] by foreign troops for two years.","syn":["seize","fill","inhabit"],"fam":["occupation (n: meslek; işgal)","occupant (n)"],"col":["occupy a position"],"ko":{"kok":"capere","kok_anlam":"almak, tutmak","dil":"Latince","parca":[["oc- (ob-)","üzerine"],["cup (capere)","almak, tutmak"]],"yol":"Latince occupare → Eski Fransızca occuper → İngilizce","imge":"Bir yeri önce davranıp ele geçirmek.","hikaye":"Latince occupare 'ele geçirmek, zapt etmek' demektir; capere 'almak' fiilinden gelir. Bir yeri ele geçirmek onu kaplamak, zamanı ele geçirmek ise birini meşgul etmektir. Bu yüzden occupy hem 'işgal etmek' hem 'yer kaplamak' hem 'meşgul etmek' anlamını taşır. Occupation ise bir kişinin zamanını dolduran meslektir.","tr_bag":"Türkçedeki 'kapasite' de aynı capere 'almak' kökünden gelir.","tuzak":"Occupation çoğu metinde 'işgal' değil 'meslek' demektir.","emin":"yüksek"}},{"w":"option","pos":"n","sub":4,"tr":"seçenek","def":"a thing that is or may be chosen","ex":"Emigration was the only [option] for many young graduates.","syn":["choice","alternative","possibility"],"fam":["optional (adj)"],"col":["have no option but to"],"ko":{"kok":"optare","kok_anlam":"seçmek, dilemek","dil":"Latince","parca":[["opt","seçmek"],["-ion","isim eki"]],"yol":"Latince optio → Fransızca → İngilizce","imge":"Önündeki şeylerden birini gösterip seçmek.","hikaye":"Latince optio 'seçme, seçim hakkı' demektir; optare 'seçmek, dilemek' fiilinden gelir. Seçme hakkının konusu olan her şey bir seçenektir. Akademik metinde option, olası yollardan birini anlatır: 'policy options'. Aynı kökten adopt 'benimsemek' gelir.","tr_bag":"Türkçedeki 'opsiyon' ve 'opsiyonel' aynı kelimeden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"output","pos":"n","sub":4,"tr":"çıktı, üretim","def":"the amount of something produced","ex":"Industrial [output] fell by 8% in 2009.","syn":["production","yield","product"],"fam":[],"col":["economic output"],"ko":{"kok":"out, put","kok_anlam":"dışarı; koymak","dil":"Germen","parca":[["out","dışarı"],["put","koymak"]],"yol":"İngilizce birleşik kelime","imge":"Bir makineden dışarı konan ürün.","hikaye":"Output, out 'dışarı' ile put 'koymak' parçalarından oluşan İngilizce bir birleşik kelimedir. Bir sistemden dışarı konan şey onun ürünüdür. Ekonomide output, belli bir sürede üretilen mal ve hizmet miktarını anlatır. Karşıtı input 'girdi' kelimesidir.","tr_bag":null,"tuzak":null,"emin":"yüksek"}},{"w":"overall","pos":"adj","sub":4,"tr":"genel, toplam","def":"taking everything into account","ex":"The [overall] rate of unemployment remained stable.","syn":["general","total","comprehensive"],"fam":["overall (adv)"],"col":["overall effect"],"ko":{"kok":"over, all","kok_anlam":"üzerinde; hepsi","dil":"Germen","parca":[["over","üzerinde, baştan başa"],["all","hepsi, tümü"]],"yol":"İngilizce birleşik kelime","imge":"Bir bütünün tamamının üzerinden bakan bir göz.","hikaye":"Overall, over 'üzerinde, baştan başa' ile all 'hepsi' parçalarından oluşur. Her şeyin üzerinden bakmak, parçaları tek tek değil toplamı görmektir. Akademik metinde overall, genel sonucu ya da toplamı anlatır: 'the overall effect'. Cümle başında 'Overall,' kalıbı genel bir değerlendirmeye geçer.","tr_bag":null,"tuzak":null,"emin":"yüksek"}},{"w":"parallel","pos":"adj","sub":4,"tr":"paralel, benzer, eşzamanlı","def":"similar and happening at the same time","ex":"The two countries followed [parallel] paths of economic development.","syn":["similar","analogous","simultaneous"],"fam":["parallel (n: benzerlik)"],"col":["draw a parallel between"],"ko":{"kok":"allelon","kok_anlam":"birbiri","dil":"Yunanca","parca":[["para-","yanında"],["allel","birbiri"]],"yol":"Yunanca parallelos → Latince parallelus → Fransızca → İngilizce","imge":"Yan yana, hiç birleşmeden uzanan iki çizgi.","hikaye":"Yunanca parallelos 'birbirinin yanında' demektir: para 'yanında' ve allelon 'birbiri'. Geometride hiç kesişmeyen iki çizgiyi anlatır. Sosyal bilimlerde parallel, birbirine benzeyen ya da aynı anda ilerleyen süreçler için kullanılır: 'parallel developments'. İsim olarak 'draw a parallel', iki durum arasında benzerlik kurmaktır.","tr_bag":"Türkçedeki 'paralel' aynı kelimeden gelir.","tuzak":"Yazımında ortadaki l ikizdir, sondaki tektir: parallel.","emin":"yüksek"}},{"w":"parameter","pos":"n","sub":4,"tr":"parametre, sınır, ölçüt","def":"a limit or boundary that defines the scope of something","ex":"The committee set clear [parameters] for the inquiry.","syn":["limit","boundary","framework"],"fam":[],"col":["within the parameters of"],"ko":{"kok":"metron","kok_anlam":"ölçü","dil":"Yunanca","parca":[["para-","yanında"],["meter","ölçü"]],"yol":"Yunanca para + metron → Yeni Latince parametrum → İngilizce","imge":"Asıl ölçünün yanına konan yardımcı bir ölçü.","hikaye":"Kelime, Yunanca para 'yanında' ve metron 'ölçü' parçalarından Yeni Latincede kurulmuş bir matematik terimidir. Bir hesabın sonucunu belirleyen yardımcı değeri anlatır. İstatistikte parameter, bir evrenin gerçek değeridir. Gündelik ve akademik dilde 'within the parameters of', bir şeyin sınırları içinde demektir.","tr_bag":"Türkçedeki 'parametre' ve 'metre' aynı Yunanca kökleri taşır.","tuzak":"Parameter 'ölçüt, sınır' demektir; perimeter ise 'çevre (uzunluğu)' anlamına gelir.","emin":"yüksek"}},{"w":"phase","pos":"n","sub":4,"tr":"evre, aşama","def":"a distinct period in a process of change","ex":"The second [phase] of the project focuses on rural schools.","syn":["stage","period","step"],"fam":["phase (v: aşamalı yapmak)"],"col":["phase out","the first phase"],"ko":{"kok":"phainein","kok_anlam":"göstermek, görünmek","dil":"Yunanca","parca":[["phas","görünme"]],"yol":"Yunanca phasis → Yeni Latince → İngilizce","imge":"Ayın her gece farklı biçimde görünmesi.","hikaye":"Yunanca phasis 'görünme, ortaya çıkış' demektir ve önce Ayın evrelerini anlatmıştır. Ay her gece başka bir yüzünü gösterir; her görünüş bir evredir. Bu imge, herhangi bir sürecin ardışık aşamalarına taşınmıştır. Araştırmada 'the first phase of the study' gibi kalıplarla kullanılır.","tr_bag":"Türkçedeki 'faz' aynı kelimeden, 'fenomen' ise aynı phainein kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"predict","pos":"v","sub":4,"tr":"tahmin etmek, öngörmek","def":"to say that something will happen in the future","ex":"Few economists [predicted] the 2008 crisis.","syn":["forecast","foresee","anticipate"],"fam":["prediction (n)","predictable (adj)","unpredictable (adj)"],"col":["predict that"],"ko":{"kok":"dicere","kok_anlam":"söylemek","dil":"Latince","parca":[["pre- (prae-)","önce"],["dict","söylemek"]],"yol":"Latince praedicere → İngilizce","imge":"Olay gerçekleşmeden önce sonucunu dile getirmek.","hikaye":"Latince praedicere 'önceden söylemek' demektir: prae 'önce' ve dicere 'söylemek'. Bir şeyi olmadan önce söylemek, onu öngörmektir. Araştırmada predict, bir değişkenin başka bir değişkeni tahmin etmesini anlatır: 'Income predicts health outcomes'. Aynı kökten dictionary ve contradict gelir.","tr_bag":"Türkçedeki 'dikte' ve 'diksiyon' aynı dicere kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"principal","pos":"adj","sub":4,"tr":"başlıca, temel, ana","def":"first in order of importance; main","ex":"Agriculture was the [principal] source of income.","syn":["main","chief","primary"],"fam":["principally (adv)","principal (n: müdür)"],"col":["principal cause"],"ko":{"kok":"princeps","kok_anlam":"ilk sırada olan","dil":"Latince","parca":[["prin- (primus)","ilk"],["cip (capere)","almak"],["-al","sıfat eki"]],"yol":"Latince principalis → Eski Fransızca → İngilizce","imge":"Sıranın en başında duran kişi.","hikaye":"Latince princeps 'ilk sırayı alan' demektir; primus 'ilk' ve capere 'almak' parçalarından oluşur. Principalis ise 'ilk, başlıca' anlamındadır. Akademik metinde principal, bir şeyin en önemli olanını anlatır: 'the principal cause'. İsim olarak principal 'okul müdürü' anlamına da gelir.","tr_bag":"Türkçedeki 'prens' princeps'ten, 'prensip' ise aynı köke bağlı principium'dan gelir.","tuzak":"Principal 'başlıca, ana' demektir; principle ise 'ilke' anlamındaki isimdir; telaffuzları aynıdır.","emin":"yüksek"}},{"w":"prior","pos":"adj","sub":4,"tr":"önceki","def":"existing or coming before in time or importance","ex":"Participants had no [prior] knowledge of the topic.","syn":["previous","earlier","preceding"],"fam":["priority (n: öncelik)","prioritise (v)"],"col":["prior to","prior knowledge"],"ko":{"kok":"prior","kok_anlam":"önceki, daha önde olan","dil":"Latince","parca":[["prior","daha önce olan (karşılaştırma biçimi)"]],"yol":"Latince prior → İngilizce","imge":"Sırada bir öncekinin önünde duran kişi.","hikaye":"Latince prior 'daha önde, daha önceki' demektir ve bir karşılaştırma biçimidir. Zaman ya da önem bakımından önde olanı anlatır. Akademik metinde 'prior research' önceki çalışmaları, 'prior to' ise 'den önce' anlamını verir. Aynı kökten priority 'öncelik' gelir.","tr_bag":null,"tuzak":"'Prior to' bir edat öbeğidir; ardından isim ya da -ing gelir: 'prior to the election', 'prior to collecting data'.","emin":"yüksek"}},{"w":"promote","pos":"v","sub":4,"tr":"teşvik etmek, desteklemek; terfi ettirmek","def":"to support or encourage; to raise to a higher position","ex":"The campaign aims to [promote] gender equality.","syn":["encourage","foster","advance"],"fam":["promotion (n)","promoter (n)"],"col":["promote equality"],"ko":{"kok":"movere","kok_anlam":"hareket ettirmek","dil":"Latince","parca":[["pro-","ileri"],["mote (movere)","hareket ettirmek"]],"yol":"Latince promovere → İngilizce","imge":"Bir şeyi arkasından ileri doğru itmek.","hikaye":"Latince promovere 'ileri itmek' demektir: pro 'ileri' ve movere 'hareket ettirmek'. Bir kişiyi ileri itmek ona terfi vermek, bir fikri ileri itmek onu desteklemektir. Sosyal bilimlerde promote, bir durumu teşvik etmeyi anlatır: 'promote social cohesion'. Aynı kökten motion ve motive gelir.","tr_bag":"Türkçedeki 'promosyon' aynı kelimeden, 'motor' ise aynı movere kökünden gelir.","tuzak":"Akademik metinde promote çoğunlukla 'reklam yapmak' değil 'teşvik etmek, desteklemek' demektir.","emin":"yüksek"}},{"w":"regime","pos":"n","sub":4,"tr":"rejim, yönetim; düzen","def":"a government, especially an authoritarian one; a system of rules","ex":"The military [regime] banned all political parties.","syn":["government","administration","system"],"fam":[],"col":["authoritarian regime","tax regime"],"ko":{"kok":"regere","kok_anlam":"yönetmek, doğru tutmak","dil":"Latince","parca":[["reg","yönetmek"],["-ime (-imen)","isim eki"]],"yol":"Latince regimen → Fransızca régime → İngilizce","imge":"Bir aracı dümenden tutup yönlendiren el.","hikaye":"Latince regimen 'yönetim, yön verme' demektir; regere 'yönetmek, doğru tutmak' fiilinden gelir. Yön veren bir düzen, siyasette bir yönetim biçimini anlatır. Siyaset biliminde regime, bir ülkenin yönetim düzenini, uluslararası ilişkilerde ise kurallar sistemini anlatır: 'trade regime'. Aynı kökten region ve regulate gelir.","tr_bag":"Türkçedeki 'rejim' Fransızca régime'den gelir.","tuzak":"Türkçedeki 'rejim yapmak' İngilizcede 'be on a diet' demektir; regime bu anlamda kullanılmaz.","emin":"yüksek"}},{"w":"resolve","pos":"v","sub":4,"tr":"çözmek; karar vermek","def":"to find a solution to a problem; to decide firmly","ex":"The conflict was eventually [resolved] through negotiation.","syn":["solve","settle","decide"],"fam":["resolution (n)","resolute (adj: kararlı)"],"col":["resolve a dispute"],"ko":{"kok":"solvere","kok_anlam":"çözmek, gevşetmek","dil":"Latince","parca":[["re-","geri, yeniden"],["solv","çözmek, gevşetmek"]],"yol":"Latince resolvere → İngilizce","imge":"Sıkıca bağlanmış bir düğümü çözmek.","hikaye":"Latince resolvere 'çözmek, gevşetmek' demektir; solvere 'çözmek' anlamındadır. Bir düğümü çözmek bir sorunu çözmeye, kafadaki bir düğümü çözmek de karara varmaya benzetilir. Bu yüzden resolve hem 'çözmek' hem 'karar vermek' anlamını taşır: 'resolve a conflict', 'resolve to act'. Aynı kökten solution gelir.","tr_bag":"Türkçedeki 'solüsyon' aynı solvere kökünden gelir.","tuzak":"Resolution 'çözüm' yanında 'karar (ör. BM kararı)' ve 'çözünürlük' anlamlarına da gelir.","emin":"yüksek"}},{"w":"retain","pos":"v","sub":4,"tr":"korumak, muhafaza etmek, elde tutmak","def":"to continue to have or keep","ex":"Many migrants [retain] strong ties with their home villages.","syn":["keep","preserve","maintain"],"fam":["retention (n)"],"col":["retain control"],"ko":{"kok":"tenere","kok_anlam":"tutmak","dil":"Latince","parca":[["re-","geri"],["tain (tenere)","tutmak"]],"yol":"Latince retinere → Eski Fransızca retenir → İngilizce","imge":"Elinden kaçmak isteyen bir şeyi geri çekip tutmak.","hikaye":"Latince retinere 'geri tutmak, alıkoymak' demektir: re 'geri' ve tenere 'tutmak'. Gitmek isteyeni geri tutmak, onu elde korumaktır. Akademik metinde retain, bir özelliği ya da kaynağı korumayı anlatır: 'retain control', 'retain employees'. Aynı kökten contain ve maintain de gelir.","tr_bag":null,"tuzak":null,"emin":"yüksek"}},{"w":"statistic","pos":"n","sub":4,"tr":"istatistik (veri)","def":"a fact or figure obtained from a study of numerical data","ex":"Official [statistics] underestimate the extent of poverty.","syn":["figure","data","number"],"fam":["statistical (adj)","statistically (adv)","statistician (n)"],"col":["official statistics"],"ko":{"kok":"status","kok_anlam":"durum; devlet","dil":"Latince","parca":[["stat","durum, devlet"],["-ist","kişi eki"],["-ic","sıfat eki"]],"yol":"Latince status temelinde → Yeni Latince statisticus → Almanca Statistik → İngilizce","imge":"Bir devletin nüfusunu ve varlığını sayan bir defter.","hikaye":"Kelime, Latince status 'durum' kelimesinin 'devlet' anlamıyla ilişkilidir. Almanca Statistik önce devletle ilgili bilgilerin incelenmesini anlatıyordu. Devletin durumunu sayılarla anlatmaktan, her türlü sayısal veriyi toplayıp çözümleme bilimine geçilmiştir. Bugün statistic tek bir sayısal veriyi, statistics ise bu bilimin kendisini anlatır.","tr_bag":"Türkçedeki 'istatistik' aynı kelimeden gelir.","tuzak":"Statistic tek bir sayısal veridir; bilim dalı olan statistics tekil fiil alır: 'Statistics is...'.","emin":"yüksek"}},{"w":"status","pos":"n","sub":4,"tr":"statü, konum; durum","def":"relative social or professional position; the situation at a particular time","ex":"Education is closely linked to social [status].","syn":["position","standing","rank"],"fam":[],"col":["social status","legal status"],"ko":{"kok":"stare","kok_anlam":"durmak","dil":"Latince","parca":[["sta","durmak"],["-tus","isim eki"]],"yol":"Latince status → İngilizce","imge":"Bir kişinin bir yerde dikilip durduğu konum.","hikaye":"Latince status 'duruş, durum' demektir; stare 'durmak' fiilinden gelir. Bir kişinin nerede durduğu, toplumdaki konumunu anlatır. Sosyolojide status, bir bireyin toplumsal konumudur: 'socioeconomic status'. 'Status quo' ise 'mevcut durum' demektir.","tr_bag":"Türkçedeki 'statü' aynı kelimeden, 'statik' ise aynı kökten gelir.","tuzak":"Status her zaman prestij demek değildir; 'marital status' 'medeni durum' anlamına gelir.","emin":"yüksek"}},{"w":"stress","pos":"v","sub":4,"tr":"vurgulamak","def":"to give particular emphasis to a point","ex":"The report [stresses] the need for early intervention.","syn":["emphasise","highlight","underline"],"fam":["stress (n: stres; vurgu)","stressful (adj)"],"col":["stress the importance of"],"ko":{"kok":"stringere","kok_anlam":"sıkmak, germek","dil":"Latince","parca":[["stress (distress)","sıkıntı, baskı"]],"yol":"Büyük olasılıkla Eski Fransızca destresse (distress) kısalmasıyla İngilizceye geçmiş; kökeni tam kesin değildir","imge":"Bir şeyi iki yandan sıkıştıran bir baskı.","hikaye":"Kelimenin kökeni kesin değildir; genellikle distress kelimesinin kısalması sayılır ve Latince stringere 'sıkmak' ile ilişkilendirilir. Temel imge baskıdır: bir cisme uygulanan basınç. Bir heceye ya da fikre ağırlık vermek de bir tür baskıdır, bu yüzden stress 'vurgulamak' anlamına gelir. Akademik metinde 'stress the importance of' kalıbı sık geçer.","tr_bag":"Türkçedeki 'stres' aynı kelimeden gelir.","tuzak":"Fiil olarak stress akademik metinde çoğu zaman 'strese sokmak' değil 'vurgulamak' demektir.","emin":"orta"}},{"w":"subsequent","pos":"adj","sub":4,"tr":"sonraki, ardından gelen","def":"coming after something in time","ex":"[Subsequent] studies confirmed these findings.","syn":["following","later","succeeding"],"fam":["subsequently (adv)"],"col":["subsequent to"],"ko":{"kok":"sequi","kok_anlam":"izlemek, ardından gitmek","dil":"Latince","parca":[["sub-","altında, hemen arkasında"],["sequ","izlemek"],["-ent","sıfat eki"]],"yol":"Latince subsequens → İngilizce","imge":"Birinin hemen arkasından yürüyen bir izleyici.","hikaye":"Latince subsequi 'hemen ardından gelmek' demektir; sequi 'izlemek' anlamındadır. Sırada birinin ardından gelen şey sonrakidir. Akademik metinde subsequent, bir olaydan sonra gelen dönemi ya da çalışmayı anlatır: 'subsequent studies'. Aynı kökten sequence ve consequence gelir.","tr_bag":"Türkçedeki 'sekans' aynı sequi kökünden gelir.","tuzak":"Subsequent 'sonraki' demektir; 'sonuç olarak doğan' anlamındaki consequent ile karıştırılmamalıdır.","emin":"yüksek"}},{"w":"sum","pos":"n","sub":4,"tr":"toplam; miktar","def":"a quantity of money; the total from adding numbers","ex":"A large [sum] was spent on the new airport.","syn":["amount","total","quantity"],"fam":["sum (v: özetlemek, sum up)","summation (n)"],"col":["a large sum of","sum up"],"ko":{"kok":"summus","kok_anlam":"en yüksek, en üst","dil":"Latince","parca":[["sum (summa)","toplam; en üst nokta"]],"yol":"Latince summa → Eski Fransızca somme → İngilizce","imge":"Bir yığının en tepesi.","hikaye":"Latince summa 'en üst nokta' ve 'toplam' demektir; summus 'en yüksek' sıfatından gelir. Bir şeyin tepesi onun bütününü özetler; buradan 'toplam' anlamı çıkar. Bugün sum, toplamı ya da bir para miktarını anlatır: 'a large sum of money'. 'In sum' kalıbı 'kısacası' demektir; summit 'zirve' de aynı köktendir.","tr_bag":null,"tuzak":null,"emin":"yüksek"}},{"w":"summary","pos":"n","sub":4,"tr":"özet","def":"a brief statement of the main points","ex":"A [summary] of the findings is presented in Table 2.","syn":["synopsis","overview","outline"],"fam":["summarise (v)"],"col":["in summary","executive summary"],"ko":{"kok":"summa","kok_anlam":"toplam, ana nokta","dil":"Latince","parca":[["summ","toplam, ana nokta"],["-ary","isim/sıfat eki"]],"yol":"Latince summarium → İngilizce","imge":"Uzun bir metnin tepesinden bakılınca görülen ana hatlar.","hikaye":"Latince summarium 'özet' demektir ve summa 'toplam, ana nokta' kelimesinden türemiştir. Bir metni toplamak, onun ana noktalarını bir araya getirmektir. Akademik yazımda summary, bir çalışmanın kısa özetidir; 'in summary' kalıbı sonuç cümlesine geçer. Aynı aileden summarize 'özetlemek' gelir.","tr_bag":null,"tuzak":null,"emin":"yüksek"}},{"w":"undertake","pos":"v","sub":4,"tr":"üstlenmek; girişmek, yapmak","def":"to commit oneself to and begin a task","ex":"The survey was [undertaken] by the national statistics office.","syn":["carry out","conduct","take on"],"fam":["undertaking (n)"],"col":["undertake research"],"ko":{"kok":"under, take","kok_anlam":"altında; almak","dil":"Germen","parca":[["under","altında, altına"],["take","almak"]],"yol":"Orta İngilizce birleşik fiil; take Eski İskandinavca taka'dan","imge":"Bir yükün altına girip onu üstlenmek.","hikaye":"Undertake, under 'altına' ile take 'almak' parçalarından oluşur. Burada under'ın neden kullanıldığı kesin değildir; 'bir işin altına girmek' diye düşünülebilir. Akademik metinde undertake, bir işi üstlenmeyi ya da yürütmeyi anlatır: 'undertake research'. İsim hâli undertaking 'girişim, üstlenilen iş' demektir.","tr_bag":null,"tuzak":"Undertaker 'üstlenici' değil 'cenaze levazımatçısı' demektir.","emin":"orta"}},{"w":"academy","pos":"n","sub":5,"tr":"akademi","def":"a place of study or training in a special field; a society of scholars","ex":"The [Academy] of Sciences funded the project.","syn":["institute","college","school"],"fam":["academic (adj, n)","academically (adv)"],"col":["military academy"],"ko":{"kok":"akademeia","kok_anlam":"Atina yakınındaki bir koru ve spor alanının adı","dil":"Yunanca","parca":[["academ-","Akademeia (yer adı)"],["-y","isim eki"]],"yol":"Yunanca Akademeia → Latince academia → Fransızca → İngilizce","imge":"Atina dışında, ağaçlar arasında sohbet eden bir öğretmen ve öğrencileri.","hikaye":"Akademeia, Atina yakınındaki bir korunun adıydı. Platon okulunu burada kurduğu için yerin adı okulun adı oldu. Zamanla sözcük, belli bir alanda öğretim yapan kurumları ve bilim insanlarının kurduğu dernekleri anlatır hâle geldi. Bugün academic sıfatı 'bilimsel, kuramsal' anlamını da taşır.","tr_bag":"Türkçedeki 'akademi', 'akademik' ve 'akademisyen' aynı sözcükten gelir.","tuzak":null,"emin":"yüksek"}},{"w":"adjust","pos":"v","sub":5,"tr":"ayarlamak; uyum sağlamak","def":"to alter slightly; to adapt to a new situation","ex":"Immigrant children often [adjust] quickly to a new school.","syn":["adapt","modify","accommodate"],"fam":["adjustment (n)","adjustable (adj)"],"col":["adjust to","adjusted for inflation"],"ko":{"kok":"iuxta","kok_anlam":"yanında, bitişiğinde","dil":"Latince","parca":[["ad-","-e doğru, yanına"],["just (iuxta)","yakınında, bitişik"]],"yol":"Latince kökenli → Eski Fransızca ajoster → İngilizce","imge":"İki parçayı yan yana getirip birbirine oturtmak.","hikaye":"Eski Fransızca ajoster 'yan yana koymak, birleştirmek' demekti ve genellikle Latince ad- 'yanına' ile iuxta 'bitişik' parçalarına bağlanır; ara biçim kesin olarak belgelenmemiştir. Bir parçayı ötekine tam oturana kadar biraz kaydırma fikri, 'ayarlamak' anlamını verir. Akademik metinde hem sayıları düzeltmeyi (adjusted for age) hem de yeni koşula uyum sağlamayı anlatır.","tr_bag":null,"tuzak":"Uyum anlamında 'adjust to' + isim/-ing kullanılır: 'adjust to living abroad', 'adjust to live' değil.","emin":"orta"}},{"w":"alter","pos":"v","sub":5,"tr":"değiştirmek","def":"to change in character or composition","ex":"Urbanisation [altered] traditional family roles.","syn":["change","modify","transform"],"fam":["alteration (n)"],"col":["alter the balance"],"ko":{"kok":"alter","kok_anlam":"öteki, ikisinden diğeri","dil":"Latince","parca":[["alter","öteki, başka"]],"yol":"Latince alter → Ortaçağ Latincesi alterare → Fransızca altérer → İngilizce","imge":"Bir şeyi kendisi olmaktan çıkarıp 'öteki' bir şeye dönüştürmek.","hikaye":"Latince alter 'ikisinden öteki' demektir. Ondan türeyen alterare 'başka kılmak' anlamını taşır. İngilizcede alter, bir şeyin niteliğini ya da bileşimini değiştirmeyi anlatır; change'e göre daha resmîdir. Aynı kökten alternative 'öteki seçenek' ve alter ego 'öteki ben' gelir.","tr_bag":"Türkçedeki 'alternatif' de aynı alter 'öteki' kökünden gelir.","tuzak":"alter (değiştirmek) ile altar (sunak) aynı okunur ama farklı sözcüklerdir.","emin":"yüksek"}},{"w":"amend","pos":"v","sub":5,"tr":"değiştirmek, düzeltmek (yasa, metin)","def":"to make minor changes to a text, especially a law","ex":"The constitution was [amended] in 2017.","syn":["revise","modify","change"],"fam":["amendment (n)"],"col":["amend a law"],"ko":{"kok":"emendare","kok_anlam":"kusurdan arındırmak, düzeltmek","dil":"Latince","parca":[["a- (e-, ex-)","dışarı, -den arındırma"],["mend (menda)","kusur, hata"]],"yol":"Latince emendare → Eski Fransızca amender → İngilizce","imge":"Bir metindeki hatayı kazıyıp dışarı atmak.","hikaye":"Latince emendare, ex- 'dışarı' ve menda 'kusur' parçalarından oluşur: kusuru çıkarmak. Eski Fransızcada ön ek a- biçimine dönüştü ve amender oldu. İngilizcede amend özellikle yasa ve metinlerde küçük düzeltmeler yapmayı anlatır. ABD anayasasına yapılan eklemelere amendment denmesi bu yüzdendir.","tr_bag":null,"tuzak":"amend (değiştirmek) ile 'make amends' (telafi etmek, gönül almak) karıştırılmamalı.","emin":"yüksek"}},{"w":"aware","pos":"adj","sub":5,"tr":"farkında, bilincinde","def":"having knowledge or perception of something","ex":"Few voters were [aware] of the new electoral rules.","syn":["conscious","informed","mindful"],"fam":["awareness (n)","unaware (adj)"],"col":["be aware of","raise awareness"],"ko":{"kok":"gewær","kok_anlam":"tetikte, dikkatli","dil":"Germen","parca":[["a- (ge-)","pekiştirme ön eki"],["ware","tetikte, sakınan"]],"yol":"Eski İngilizce gewær → İngilizce","imge":"Tehlikeye karşı gözleri açık bekleyen bir nöbetçi.","hikaye":"Eski İngilizce gewær 'tetikte, sakınan' demekti. Aynı aileden wary 'temkinli' ve beware 'sakın' sözcükleri bugün de bu anlamı korur. Tetikte olan kişi çevresinde olanı fark eder; anlam buradan 'farkında, bilincinde' olmaya kaydı. Akademik metinde awareness, bir konuya ilişkin bilinç düzeyini anlatır.","tr_bag":null,"tuzak":"Doğru edat 'aware of' dur ('aware of the risks'); cümleyle 'aware that' kullanılır.","emin":"yüksek"}},{"w":"capacity","pos":"n","sub":5,"tr":"kapasite; yeterlik, yeti","def":"the maximum amount something can contain or produce; the ability to do something","ex":"The state lacked the [capacity] to collect taxes effectively.","syn":["ability","capability","volume"],"fam":["capable (adj)"],"col":["capacity to","in one's capacity as"],"ko":{"kok":"capere","kok_anlam":"almak, tutmak, içine almak","dil":"Latince","parca":[["cap (capere)","almak, tutmak"],["-ac-","-abilen (capax: çok alabilen)"],["-ity","isim eki (-lik)"]],"yol":"Latince capacitas → Fransızca capacité → İngilizce","imge":"İçine ne kadar şey alabildiğine göre ölçülen bir kap.","hikaye":"Latince capere 'almak, tutmak' fiilinden capax 'çok şey alabilen' sıfatı doğar. Capacitas bir kabın içine alabildiği miktardır. Bu fiziksel ölçüden kişinin ya da kurumun 'kaldırabildiği' işe, yani yeterliğe geçilir. Akademik metinde capacity building 'kapasite geliştirme' kalıbıyla sık görülür.","tr_bag":"Türkçedeki 'kapasite' Fransızca capacité yoluyla aynı sözcükten gelir.","tuzak":null,"emin":"yüksek"}},{"w":"challenge","pos":"v","sub":5,"tr":"meydan okumak; sorgulamak, itiraz etmek","def":"to question the truth or legitimacy of; to test someone's abilities","ex":"Feminist scholars [challenged] traditional views of the family.","syn":["question","dispute","contest"],"fam":["challenge (n)","challenging (adj)"],"col":["challenge the view that"],"ko":{"kok":"calumnia","kok_anlam":"haksız suçlama, hile","dil":"Latince","parca":[["challenge (calumnia)","haksız suçlama"]],"yol":"Latince calumnia → Eski Fransızca chalenge → İngilizce","imge":"Birini suçlayıp karşısına dikilen ve hesap soran kişi.","hikaye":"Latince calumnia 'haksız suçlama, hile' demekti; Eski Fransızca chalenge 'suçlama, itiraz' anlamına geldi. Birini suçlamak onu hesap vermeye çağırmaktır; anlam 'meydan okumak' ve 'itiraz etmek'e buradan kaydı. Akademik metinde challenge a view, bir görüşün doğruluğunu sorgulamak demektir. İsim olarak ise 'zorlu sorun' anlamı yaygındır.","tr_bag":null,"tuzak":"Akademik metinde 'challenge an assumption' çoğu zaman 'meydan okumak' değil 'bir varsayımı sorgulamak, itiraz etmek' diye çevrilmelidir.","emin":"yüksek"}},{"w":"clause","pos":"n","sub":5,"tr":"madde, fıkra; yan cümle","def":"a particular article in a legal document; a unit of grammar","ex":"The treaty contained a [clause] on minority rights.","syn":["article","provision","section"],"fam":[],"col":["a clause in the contract"],"ko":{"kok":"claudere","kok_anlam":"kapamak","dil":"Latince","parca":[["claus- (claudere)","kapamak"],["-e","isim"]],"yol":"Latince claudere → Ortaçağ Latincesi clausa → Eski Fransızca clause → İngilizce","imge":"Bir düşünceyi başından sonuna kapatan, kendi içinde kapalı bir birim.","hikaye":"Latince claudere 'kapamak' fiilinden gelen clausa, bir cümle ya da bölümün 'kapanışı' anlamında kullanıldı. Kendi içinde tamamlanmış, sınırları belli metin parçası fikri iki anlamı da açıklar. Hukuk metninde clause bir sözleşme ya da yasanın maddesidir. Dil bilgisinde ise özne ve yüklemi olan birime, yani yan cümleye denir.","tr_bag":"Türkçedeki 'klostrofobi' (kapalı yer korkusu) aynı claudere kökünden gelen claustrum 'kapalı yer' sözcüğünü içerir.","tuzak":null,"emin":"yüksek"}},{"w":"compound","pos":"v","sub":5,"tr":"kötüleştirmek, ağırlaştırmak","def":"to make a problem worse; to combine","ex":"Poor transport links [compounded] the region's isolation.","syn":["worsen","aggravate","intensify"],"fam":["compound (n: bileşik; site)"],"col":["compound the problem"],"ko":{"kok":"componere","kok_anlam":"bir araya koymak","dil":"Latince","parca":[["com-","birlikte"],["pound (ponere)","koymak"]],"yol":"Latince componere → Eski Fransızca → İngilizce","imge":"Farklı parçaları üst üste koyup tek bir yığın hâline getirmek.","hikaye":"Latince componere, com- 'birlikte' ve ponere 'koymak' parçalarından oluşur. İngilizcede sözcüğün sonundaki -d sonradan eklenmiştir. Temel anlam 'birleştirmek'tir: compound, kimyada bileşik demektir. Fiil olarak bir soruna yeni bir etken eklemek onu büyüttüğü için 'kötüleştirmek, ağırlaştırmak' anlamı akademik metinde çok yaygındır.","tr_bag":"Türkçedeki 'kompozisyon' ve 'kompozitör' aynı componere fiilinden gelir.","tuzak":"'compound the problem' sorunu birleştirmek ya da çözmek değil, daha da kötüleştirmektir.","emin":"yüksek"}},{"w":"conflict","pos":"n","sub":5,"tr":"çatışma, anlaşmazlık","def":"a serious disagreement or armed struggle","ex":"The [conflict] displaced more than a million people.","syn":["dispute","clash","war"],"fam":["conflict (v: çelişmek)","conflicting (adj)"],"col":["in conflict with","armed conflict"],"ko":{"kok":"confligere","kok_anlam":"çarpışmak, birbirine vurmak","dil":"Latince","parca":[["con-","birlikte, karşılıklı"],["flict (fligere)","vurmak"]],"yol":"Latince conflictus → İngilizce","imge":"İki tarafın karşılıklı birbirine vurması.","hikaye":"Latince confligere, con- 'birbirine' ve fligere 'vurmak' parçalarından oluşur. Fiziksel çarpışmadan fikirlerin ve çıkarların çarpışmasına geçilir. Akademik metinde conflict silahlı çatışmadan rol çatışmasına kadar geniş bir alanı kapsar. Aynı fligere kökü inflict 'acı vermek' fiilinde de görülür.","tr_bag":null,"tuzak":"Fiil olarak vurgu ikinci hecededir (conFLICT) ve 'conflict with' kalıbıyla 'çelişmek' anlamı taşır.","emin":"yüksek"}},{"w":"consult","pos":"v","sub":5,"tr":"danışmak, başvurmak","def":"to seek information or advice from","ex":"Local communities were not [consulted] about the project.","syn":["ask","refer to","confer"],"fam":["consultation (n)","consultant (n)","consultancy (n)"],"col":["consult with","consult a source"],"ko":{"kok":"consulere","kok_anlam":"danışmak, birlikte düşünmek","dil":"Latince","parca":[["con-","birlikte"],["sult (consulere)","danışmak, öğüt almak"]],"yol":"Latince consultare → Fransızca consulter → İngilizce","imge":"Bir karara varmadan önce başkalarıyla oturup birlikte düşünmek.","hikaye":"Latince consulere 'danışmak, birlikte görüşmek' demektir; consultare bu fiilin sık yapılan eylemi anlatan biçimidir. Anlam, bilgi ya da öğüt almak için birine başvurmaktır. İngilizcede bu başvuru bir kişiye olabileceği gibi bir kaynağa da olabilir: consult a dictionary. Consultant 'danışman' da aynı fiilden gelir.","tr_bag":"Türkçede tıpta kullanılan 'konsültasyon' aynı kökten gelir.","tuzak":"'consult a source' kaynağa başvurmak, 'consult with someone' biriyle görüşmek anlamındadır; kaynak için 'with' kullanılmaz.","emin":"yüksek"}},{"w":"contact","pos":"n","sub":5,"tr":"temas, ilişki, iletişim","def":"communication or meeting with someone","ex":"Regular [contact] between groups can reduce prejudice.","syn":["interaction","communication","connection"],"fam":["contact (v)"],"col":["in contact with","contact hypothesis"],"ko":{"kok":"tangere","kok_anlam":"dokunmak","dil":"Latince","parca":[["con-","birlikte"],["tact (tangere)","dokunmak"]],"yol":"Latince contactus → İngilizce","imge":"İki şeyin birbirine değdiği an.","hikaye":"Latince contingere 'dokunmak, değmek' fiili, con- 'birlikte' ve tangere 'dokunmak' parçalarına dayanır. Contactus fiziksel değme anlamındaydı. Anlam, insanlar arasındaki 'temas'a, yani iletişim ve ilişkiye genişledi. Akademik metinde contact hypothesis, gruplar arası temasın önyargıyı azaltabileceği görüşüdür.","tr_bag":"Türkçedeki 'kontak' (elektrik, araç kontağı) ve geometrideki 'tanjant' aynı aileden gelir.","tuzak":"Fiil olarak 'contact someone' denir; 'contact with someone' fiil kullanımında yanlıştır.","emin":"yüksek"}},{"w":"decline","pos":"n","sub":5,"tr":"düşüş, gerileme","def":"a gradual decrease or deterioration","ex":"The [decline] of heavy industry hit northern towns hardest.","syn":["decrease","fall","deterioration"],"fam":["decline (v: azalmak; reddetmek)"],"col":["a decline in","in decline"],"ko":{"kok":"declinare","kok_anlam":"yana eğilmek, sapmak","dil":"Latince","parca":[["de-","aşağı, uzağa"],["cline (clinare)","eğmek, bükmek"]],"yol":"Latince declinare → Eski Fransızca decliner → İngilizce","imge":"Yolundan aşağıya doğru eğilen bir çizgi.","hikaye":"Latince declinare, de- 'aşağı, uzağa' ve clinare 'eğmek' parçalarından oluşur. Aşağı doğru eğilen bir çizgi, sayısı ya da gücü azalan bir şeyi anlatır; buradan 'düşüş, gerileme' anlamı gelir. Uzağa eğilmek, bir öneriden yüz çevirmektir; bu da 'kibarca reddetmek' anlamını verir. Akademik metinde çoğu zaman bir oranın ya da nüfusun düşüşünü anlatır.","tr_bag":null,"tuzak":"decline hem 'düşüş' hem de 'kibarca reddetmek' demektir; 'decline an invitation' daveti reddetmektir.","emin":"yüksek"}},{"w":"discrete","pos":"adj","sub":5,"tr":"ayrı, bağımsız, ayrık","def":"separate and distinct","ex":"The population can be divided into [discrete] groups.","syn":["separate","distinct","individual"],"fam":["discretely (adv)"],"col":["discrete categories"],"ko":{"kok":"discernere","kok_anlam":"ayırmak, elemek","dil":"Latince","parca":[["dis-","ayrı"],["cret (cernere)","elemek, ayırt etmek"]],"yol":"Latince discretus → İngilizce","imge":"Elekten geçirilip birbirinden ayrılmış taneler.","hikaye":"Latince discernere, dis- 'ayrı' ve cernere 'elemek' parçalarından oluşur; discretus 'ayrılmış' demektir. Birbirinden net çizgilerle ayrılan birimler fikri, bugünkü 'ayrık, bağımsız' anlamını verir. İstatistikte discrete variable sayılabilen değerler alan değişkendir. Matematikte discrete mathematics 'ayrık matematik' diye çevrilir.","tr_bag":null,"tuzak":"discrete (ayrık) ile discreet (ağzı sıkı, ölçülü) aynı okunur ve aynı kökten gelir ama anlamları farklıdır.","emin":"yüksek"}},{"w":"draft","pos":"n","sub":5,"tr":"taslak","def":"a preliminary version of a text","ex":"The first [draft] of the report was criticised by experts.","syn":["outline","version","sketch"],"fam":["draft (v: taslak hazırlamak)"],"col":["draft law","first draft"],"ko":{"kok":"dragan","kok_anlam":"çekmek","dil":"Germen","parca":[["draf- (dragan)","çekmek"],["-t","isim eki"]],"yol":"Eski İngilizce dragan → Orta İngilizce draht → İngilizce","imge":"Kalemi kâğıdın üstünde çekerek ilk çizgileri atmak.","hikaye":"Draft, draw 'çekmek' ile aynı Germen kökten gelir ve draught sözcüğünün bir yazım biçimidir. 'Çekme' anlamından kalemle çizgi çekmeye, yani çizime ve kabataslak plana geçildi. Bir metnin kesinleşmemiş ilk hâline de bu yüzden draft denir. Akademik metinde first draft ilk taslaktır.","tr_bag":null,"tuzak":"İngiliz İngilizcesinde draught (cereyan; fıçı bira) yazımı ayrıdır; taslak anlamında her iki varyantta da draft kullanılır.","emin":"yüksek"}},{"w":"enable","pos":"v","sub":5,"tr":"olanak sağlamak, mümkün kılmak","def":"to give someone the means or opportunity to do something","ex":"Microcredit [enables] poor women to start small businesses.","syn":["allow","permit","empower"],"fam":[],"col":["enable someone to"],"ko":{"kok":"habilis","kok_anlam":"elverişli, becerikli","dil":"Latince","parca":[["en-","kılmak, yapmak"],["able (habilis)","yapabilir, elverişli"]],"yol":"Latince habilis → Fransızca able → İngilizce (en- ön ekiyle)","imge":"Birinin eline işi yapabileceği aracı vermek.","hikaye":"Able, Latince habilis 'kolay tutulan, elverişli' sözcüğünden Fransızca yoluyla gelir. En- ön eki 'bir hâle getirmek' anlamı katar: enable, 'yapabilir kılmak'tır. Akademik metinde bir etkenin bir sonucu mümkün kıldığını anlatır. Enabling conditions 'olanak sağlayan koşullar' kalıbı sık görülür.","tr_bag":null,"tuzak":"'enable someone to do' kalıbı kullanılır; nesnesiz 'enable to do' yanlıştır.","emin":"yüksek"}},{"w":"enforce","pos":"v","sub":5,"tr":"uygulamak, yürürlüğe koymak","def":"to make sure a law or rule is obeyed","ex":"The ban on child labour was rarely [enforced].","syn":["impose","apply","implement"],"fam":["enforcement (n)","enforceable (adj)"],"col":["enforce the law","law enforcement"],"ko":{"kok":"fortis","kok_anlam":"güçlü","dil":"Latince","parca":[["en-","kılmak, içine koymak"],["force (fortis)","güç"]],"yol":"Latince fortis → Eski Fransızca enforcier → İngilizce","imge":"Bir kurala güç ekleyerek onu ayakta tutmak.","hikaye":"Force, Latince fortis 'güçlü' kökünden Fransızca yoluyla gelir. Enforce, bir şeye güç katmak demektir. Bir yasaya güç katmak, ona uyulmasını sağlamaktır; bugünkü anlam budur. Akademik metinde law enforcement 'kolluk, yasaların uygulanması' anlamındadır.","tr_bag":"Türkçedeki 'fors' (nüfuz, güç) sözcüğü Fransızca force'tan gelir.","tuzak":"enforce bir kişiyi değil kuralı nesne alır: 'enforce a law' denir; birini zorlamak için 'force someone to' kullanılır.","emin":"yüksek"}},{"w":"entity","pos":"n","sub":5,"tr":"varlık, birim, kuruluş","def":"a thing with distinct and independent existence","ex":"The EU is a political [entity] unlike any other.","syn":["body","unit","organisation"],"fam":[],"col":["legal entity","separate entity"],"ko":{"kok":"esse","kok_anlam":"olmak, var olmak","dil":"Latince","parca":[["ent- (ens)","var olan"],["-ity","isim eki (-lik)"]],"yol":"Geç Latince entitas → İngilizce","imge":"Kendi başına var olan, sınırları belli bir şey.","hikaye":"Latince ens, esse 'olmak' fiilinden 'var olan' anlamında türetilmiş felsefi bir sözcüktür. Entitas 'var olanlık, varlık' demektir. İngilizcede entity, bağımsız varlığı olan her birimi anlatır. Akademik ve hukuki metinde bir kuruluşu, devleti ya da tüzel kişiyi karşılar: legal entity 'tüzel kişi'.","tr_bag":"Türkçedeki 'esans' (öz) da essentia yoluyla aynı esse fiiline dayanır.","tuzak":null,"emin":"yüksek"}},{"w":"equivalent","pos":"adj","sub":5,"tr":"eşdeğer, denk","def":"equal in value, amount or meaning","ex":"There is no [equivalent] word in English.","syn":["equal","comparable","corresponding"],"fam":["equivalent (n)","equivalence (n)"],"col":["equivalent to"],"ko":{"kok":"valere","kok_anlam":"değerinde olmak, güçlü olmak","dil":"Latince","parca":[["equi- (aequus)","eşit"],["val (valere)","değerinde olmak"],["-ent","sıfat eki"]],"yol":"Geç Latince aequivalens → Fransızca équivalent → İngilizce","imge":"Terazinin iki kefesinde aynı değeri taşıyan iki şey.","hikaye":"Latince aequus 'eşit' ve valere 'değerinde olmak' birleşince 'eşit değerde olan' anlamı çıkar. Değer, miktar ya da anlam bakımından denk olan şeyler için kullanılır. Akademik metinde bir kavramın başka dildeki karşılığı ya da bir ölçümün başka birimdeki karşılığı için sık geçer. Value 'değer' de valere'den gelir.","tr_bag":"Türkçedeki 'ekvator' aequus 'eşit', 'valör' ise valere kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"evolve","pos":"v","sub":5,"tr":"evrimleşmek, gelişmek","def":"to develop gradually","ex":"Democratic institutions [evolved] over several centuries.","syn":["develop","progress","grow"],"fam":["evolution (n)","evolutionary (adj)"],"col":["evolve into"],"ko":{"kok":"volvere","kok_anlam":"yuvarlamak, döndürmek","dil":"Latince","parca":[["e- (ex-)","dışarı"],["volve (volvere)","yuvarlamak"]],"yol":"Latince evolvere → İngilizce","imge":"Rulo hâlinde sarılmış bir yazı tomarını yavaş yavaş açmak.","hikaye":"Latince evolvere 'dışarı doğru yuvarlamak', yani sarılı bir tomarı açmak demekti. Tomar açıldıkça içindeki yazı adım adım ortaya çıkar. Bu 'yavaş yavaş açılma' fikri, zamanla gelişme anlamını verdi. Biyolojide evolution 'evrim', sosyal bilimlerde ise kurumların ve fikirlerin kademeli değişimi için kullanılır.","tr_bag":"Türkçedeki 'volüm' (Latince volumen 'tomar') ve 'revolver' aynı volvere kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"expand","pos":"v","sub":5,"tr":"genişlemek, büyümek","def":"to become or make larger","ex":"Higher education [expanded] rapidly in the 1990s.","syn":["grow","enlarge","extend"],"fam":["expansion (n)","expansive (adj)"],"col":["expand into","rapidly expanding"],"ko":{"kok":"pandere","kok_anlam":"yaymak, açmak","dil":"Latince","parca":[["ex-","dışarı"],["pand (pandere)","yaymak"]],"yol":"Latince expandere → İngilizce","imge":"Katlanmış bir kumaşı dışa doğru açıp yaymak.","hikaye":"Latince expandere, ex- 'dışarı' ve pandere 'yaymak' parçalarından oluşur. Katlı bir şeyi açıp yaymak, kapladığı alanı büyütür. Buradan 'genişlemek, büyümek' anlamı gelir. Akademik metinde ekonominin, bir kentin ya da bir kuramın kapsamının genişlemesi için kullanılır.","tr_bag":null,"tuzak":"expand (genişlemek) ile expend (harcamak) yazım ve okunuşta karıştırılır.","emin":"yüksek"}},{"w":"expose","pos":"v","sub":5,"tr":"maruz bırakmak; açığa çıkarmak","def":"to leave someone unprotected; to reveal something hidden","ex":"Children in poor areas are [exposed] to higher levels of pollution.","syn":["subject to","reveal","uncover"],"fam":["exposure (n)","exposed (adj)"],"col":["be exposed to","expose corruption"],"ko":{"kok":"ponere","kok_anlam":"koymak","dil":"Latince","parca":[["ex-","dışarı"],["pose (ponere / Fr. poser)","koymak"]],"yol":"Latince exponere → Eski Fransızca exposer → İngilizce","imge":"Bir şeyi korunaklı yerinden çıkarıp açıkta bırakmak.","hikaye":"Latince exponere 'dışarı koymak, ortaya koymak' demektir; Fransızca exposer biçimini poser 'koymak' fiilinden alır. Dışarı konan şey hem görünür olur hem de korunmasız kalır. İlkinden 'açığa çıkarmak', ikincisinden 'maruz bırakmak' anlamı gelir. Akademik metinde exposure to violence gibi kalıplarda 'maruz kalma' anlamı çok yaygındır.","tr_bag":"Türkçedeki 'ekspoze' (bir konuyu ayrıntılı açıklama) ve 'poz' Fransızca yoluyla aynı aileden gelir.","tuzak":"'maruz kalmak' anlamında 'be exposed to' kalıbı kullanılır: 'children exposed to violence'.","emin":"yüksek"}},{"w":"external","pos":"adj","sub":5,"tr":"dış, harici","def":"belonging to or coming from outside","ex":"The economy is vulnerable to [external] shocks.","syn":["outside","foreign","outer"],"fam":["externally (adv)","externality (n)"],"col":["external debt","external factors"],"ko":{"kok":"exter","kok_anlam":"dışarıdaki","dil":"Latince","parca":[["ex- (exter)","dışarıdaki"],["-tern","yön bildiren ek"],["-al","sıfat eki"]],"yol":"Latince externus → İngilizce","imge":"Bir sınırın ya da duvarın dış tarafında duran şey.","hikaye":"Latince exter 'dışarıdaki' sözcüğünden externus 'dış' türemiştir. İngilizcede -al ekiyle sıfat hâline gelir. Akademik metinde internal/external karşıtlığı çok sık kullanılır: external factors 'dış etkenler', external validity 'dış geçerlilik'. Externality ekonomide 'dışsallık' anlamındadır.","tr_bag":null,"tuzak":null,"emin":"yüksek"}},{"w":"facilitate","pos":"v","sub":5,"tr":"kolaylaştırmak","def":"to make an action or process easier","ex":"Digital technology [facilitates] communication across borders.","syn":["ease","enable","assist"],"fam":["facilitator (n)","facilitation (n)"],"col":["facilitate access to"],"ko":{"kok":"facilis","kok_anlam":"kolay","dil":"Latince","parca":[["facil (facilis)","kolay"],["-ate","fiil eki"
