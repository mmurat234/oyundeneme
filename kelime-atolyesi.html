üksek"}},{"w":"element","pos":"n","sub":2,"tr":"öğe, unsur","def":"a basic part of something","ex":"Trust is an essential [element] of any stable society.","syn":["component","part","ingredient"],"fam":["elemental (adj)","elementary (adj: temel)"],"col":["a key element","an element of risk"],"ko":{"kok":"elementum","kok_anlam":"temel öğe; alfabenin harfi","dil":"Latince","parca":[["elementum","temel öğe, ilk ilke"]],"yol":"Latince elementum → Fransızca → İngilizce","imge":"Bir bütünü oluşturan, daha küçük parçalara ayrılamayan temel taş.","hikaye":"Latince elementum, 'temel öğe, ilk ilke' ve 'alfabenin harfi' anlamlarına geliyordu; kelimenin kendi kökeni kesin değildir. Harflerin kelimeleri kurması gibi, temel öğeler de bütünleri kurar. Bu yüzden element bir yapının temel parçası anlamını aldı. Aynı ailedeki elementary 'temel, ilk basamak' da buradan gelir.","tr_bag":"Türkçedeki 'element' ve 'eleman' aynı kelimeden (Fr. élément) gelir.","tuzak":"Türkçede 'eleman' çoğu zaman 'çalışan' demektir; element hiçbir zaman 'çalışan' anlamına gelmez.","emin":"orta"}},{"w":"equate","pos":"v","sub":2,"tr":"eşit saymak, bir tutmak","def":"to consider one thing as equal or equivalent to another","ex":"Many people wrongly [equate] wealth with happiness.","syn":["identify","associate","liken"],"fam":["equation (n)","equal (adj)","equality (n)"],"col":["equate A with B"],"ko":{"kok":"aequus","kok_anlam":"eşit, düz","dil":"Latince","parca":[["equ (aequare)","eşitlemek"],["-ate","fiil eki"]],"yol":"Latince aequare → İngilizce","imge":"İki kefesi aynı hizada duran bir terazi.","hikaye":"Latince aequare, 'eşitlemek, düzlemek' demektir ve aequus 'eşit' sıfatından gelir. İki şeyi aynı hizaya getirmek, onları denk saymaktır. Akademik metinde equate çoğu zaman bir yanlışı eleştirmek için kullanılır: 'Success should not be equated with wealth.' Aynı aileden equation 'denklem', equal ve equity de gelir.","tr_bag":"Türkçedeki 'ekvator' (dünyayı iki eşit yarıya bölen çizgi) aynı aequus kökündendir.","tuzak":"equate 'with' ile kullanılır (equate X with Y); 'equate X to Y' yaygın değildir.","emin":"yüksek"}},{"w":"evaluate","pos":"v","sub":2,"tr":"değerlendirmek","def":"to judge the value, quality or importance of something","ex":"The programme was [evaluated] after three years.","syn":["assess","appraise","judge"],"fam":["evaluation (n)","evaluative (adj)"],"col":["evaluate the effectiveness of"],"ko":{"kok":"valere","kok_anlam":"güçlü olmak, değerli olmak","dil":"Latince","parca":[["e- (ex-)","dışarı"],["valu (valere)","değer"],["-ate","fiil eki"]],"yol":"Latince valere → Fransızca évaluer → İngilizce","imge":"Bir şeyin değerini dışarı çıkarıp ortaya koymak.","hikaye":"Latince valere 'güçlü olmak, değer taşımak' anlamındadır; Fransızca évaluer 'değerini biçmek' bu kökten kurulmuştur. Bir şeyin değerini ortaya çıkarmak, onu tartıp yargılamaktır. Bugün evaluate, bir programın, kuramın ya da kanıtın niteliğini ölçüp yargıya varmayı anlatır. Eğitim bilimlerinde evaluation 'değerlendirme' temel bir terimdir.","tr_bag":"Türkçedeki 'valör' (Fr. valeur 'değer') aynı valere kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"feature","pos":"n","sub":2,"tr":"özellik","def":"a distinctive characteristic or attribute","ex":"A key [feature] of the Ottoman system was religious autonomy.","syn":["characteristic","trait","attribute"],"fam":["feature (v: yer vermek, öne çıkarmak)"],"col":["a common feature","a distinctive feature"],"ko":{"kok":"facere","kok_anlam":"yapmak","dil":"Latince","parca":[["feat (factura)","yapım, biçim"],["-ure","isim eki"]],"yol":"Latince factura → Eski Fransızca faiture → İngilizce","imge":"Bir yüzün yapılış biçimi, hatları.","hikaye":"Latince factura 'yapım, yapılış' demektir ve facere 'yapmak' fiilinden gelir. Eski Fransızca faiture bir şeyin biçimini, özellikle yüzün hatlarını anlatıyordu. Yüzü tanıtan hatlar gibi, bir şeyi tanıtan özellikler de feature oldu. Bugün feature, bir şeyi ötekilerden ayıran belirgin özelliktir.","tr_bag":"Türkçedeki 'fatura' (İt. fattura) aynı Latince factura kelimesinden gelir.","tuzak":"Fiil olarak feature 'yer vermek, öne çıkarmak' demektir (The report features new data); 'özelliklemek' gibi çevrilmez.","emin":"yüksek"}},{"w":"impact","pos":"n","sub":2,"tr":"etki","def":"a strong effect or influence","ex":"The internet has had a profound [impact] on political participation.","syn":["effect","influence","consequence"],"fam":["impact (v)"],"col":["have an impact on","environmental impact"],"ko":{"kok":"pangere","kok_anlam":"çakmak, sabitlemek","dil":"Latince","parca":[["im- (in-)","içine"],["pact (pangere)","çakmak"]],"yol":"Latince impactus → İngilizce","imge":"Bir yüzeye sertçe çarpıp içine gömülen bir cisim.","hikaye":"Latince impingere, 'çarpmak, içine itmek' demektir; geçmiş zaman ortacı impactus'tur. Çarpan cisim yüzeyde iz bırakır. Buradan impact önce fiziksel çarpmayı, sonra güçlü etkiyi anlatır oldu. Sosyal bilimlerde impact, bir politikanın ya da olayın toplum üzerinde bıraktığı izi ifade eder.","tr_bag":null,"tuzak":"impact isimken 'on' ile kullanılır: 'an impact on society'; 'impact to' yanlıştır.","emin":"yüksek"}},{"w":"injure","pos":"v","sub":2,"tr":"yaralamak, zarar vermek","def":"to harm or damage someone physically or their reputation","ex":"Hundreds of protesters were [injured] in the clashes.","syn":["hurt","harm","wound"],"fam":["injury (n)","injured (adj)","injurious (adj)"],"col":["seriously injured"],"ko":{"kok":"ius (iur-)","kok_anlam":"hak, hukuk","dil":"Latince","parca":[["in-","değil, karşı"],["jur (ius, iuris)","hak, hukuk"]],"yol":"Latince iniuria → Fransızca → İngilizce","imge":"Hakka aykırı olarak birine verilen zarar.","hikaye":"Latince iniuria, 'hakka aykırı olan, haksızlık' demektir. Haksız davranış karşıdakine zarar verir. İngilizcede injury 'zarar, yara' anlamına geçti ve injure fiili buna bağlandı. Bugün injure hem bedensel yaralanmayı hem de itibarın zedelenmesini anlatır.","tr_bag":"Türkçedeki 'jüri' de aynı ius kökünden türeyen iurare 'yemin etmek' fiiline dayanır.","tuzak":"injure canlılar için kullanılır; eşya ya da bina için damage denir.","emin":"yüksek"}},{"w":"institute","pos":"n","sub":2,"tr":"enstitü, kurum","def":"an organisation for research or education","ex":"The [institute] publishes an annual report on poverty.","syn":["institution","organisation","academy"],"fam":["institute (v: başlatmak, kurmak)","institution (n)","institutional (adj)"],"col":["research institute","institutional change"],"ko":{"kok":"statuere","kok_anlam":"dikmek, kurmak","dil":"Latince","parca":[["in-","içine, üstüne"],["stitute (statuere)","dikmek, kurmak"]],"yol":"Latince instituere → İngilizce","imge":"Yere sağlam bir direk dikip bir şeyi ayakta tutmak.","hikaye":"Latince instituere, 'dikmek, kurmak, düzenlemek' demektir ve statuere 'dikmek' fiilinden gelir. Kurulan şey kalıcıdır. Bu yüzden institute hem 'kurulmuş kuruluş' hem de 'başlatmak, yürürlüğe koymak' anlamını taşır. Sosyolojideki institution 'kurum' da toplumda yerleşmiş, ayakta duran yapıları anlatır.","tr_bag":"Türkçedeki 'enstitü' aynı kelimedir.","tuzak":"Fiil olarak institute 'başlatmak, yürürlüğe koymak' demektir (institute reforms); 'enstitü kurmak' anlamına gelmez.","emin":"yüksek"}},{"w":"invest","pos":"v","sub":2,"tr":"yatırım yapmak","def":"to put money, time or effort into something to gain an advantage","ex":"The government [invested] heavily in vocational training.","syn":["fund","spend on","finance"],"fam":["investment (n)","investor (n)"],"col":["invest in","foreign investment"],"ko":{"kok":"vestis","kok_anlam":"giysi","dil":"Latince","parca":[["in-","içine"],["vest (vestis)","giysi"]],"yol":"Latince investire → İtalyanca ve Fransızca → İngilizce","imge":"Birini bir giysinin içine sokmak, giydirmek.","hikaye":"Latince investire, 'giydirmek' demektir ve vestis 'giysi' kelimesinden gelir. Birine makam giysisi giydirmek, ona yetki vermek anlamına geliyordu; 'invest someone with power' bunu korur. Para anlamına nasıl geçtiği kesin değildir; İtalyanca aracılığıyla geldiği düşünülür. Bugün invest, kazanç umuduyla para, zaman ya da emek koymaktır.","tr_bag":"Türkçedeki 'vestiyer' (Fr. vestiaire) aynı vestis kökünden gelir.","tuzak":"invest 'in' ile kullanılır: 'invest in education'; 'invest to' yanlıştır.","emin":"orta"}},{"w":"item","pos":"n","sub":2,"tr":"madde, öğe, kalem","def":"a single article or unit in a list or collection","ex":"The questionnaire contained 25 [items] on political trust.","syn":["article","unit","entry"],"fam":["itemise (v)"],"col":["questionnaire items","an item of news"],"ko":{"kok":"item","kok_anlam":"aynı şekilde, ayrıca","dil":"Latince","parca":[["item","ayrıca, aynı biçimde"]],"yol":"Latince item → İngilizce","imge":"Bir listenin her satırının başına yazılan 'ayrıca' sözü.","hikaye":"Latince item bir zarftır ve 'ayrıca, aynı şekilde' demektir. Hesap ve envanter listelerinde her yeni kaydın başına bu sözcük yazılırdı. Zamanla sözcük, önünde durduğu kaydın kendisini adlandırdı. Bugün item bir listedeki tek madde, ölçme-değerlendirmede ise testteki tek soru maddesidir.","tr_bag":null,"tuzak":null,"emin":"yüksek"}},{"w":"journal","pos":"n","sub":2,"tr":"dergi (bilimsel); günlük","def":"a scholarly periodical; a daily record of events","ex":"The article was published in a leading sociology [journal].","syn":["periodical","publication","diary"],"fam":["journalism (n)","journalist (n)"],"col":["academic journal","peer-reviewed journal"],"ko":{"kok":"dies","kok_anlam":"gün","dil":"Latince","parca":[["journ (diurnus)","günlük"],["-al","sıfat eki"]],"yol":"Latince diurnalis → Eski Fransızca jurnal → İngilizce","imge":"Her günün olaylarının yazıldığı bir defter.","hikaye":"Latince diurnalis 'günlük' demektir ve dies 'gün' kelimesinden gelir. Fransızcada bu kelime her gün tutulan kayıt anlamını aldı. Düzenli aralıklarla yayımlanan yazılara da ad oldu. Akademide journal, hakemli bilimsel dergi anlamında kullanılır.","tr_bag":"Türkçedeki 'jurnal' (Fr. journal) aynı kelimeden gelir.","tuzak":"Akademik bağlamda journal bilimsel dergidir; magazine popüler dergi, newspaper gazetedir.","emin":"yüksek"}},{"w":"maintain","pos":"v","sub":2,"tr":"sürdürmek; savunmak, ileri sürmek","def":"to keep something in the same state; to claim that something is true","ex":"Weber [maintained] that ideas can shape economic behaviour.","syn":["preserve","sustain","assert"],"fam":["maintenance (n)"],"col":["maintain order","maintain that"],"ko":{"kok":"manus + tenere","kok_anlam":"el + tutmak","dil":"Latince","parca":[["main (manus)","el"],["tain (tenere)","tutmak"]],"yol":"Latince manu tenere → Fransızca maintenir → İngilizce","imge":"Bir şeyi elinde sıkıca tutup bırakmamak.","hikaye":"Fransızca maintenir, Latince manu tenere 'elde tutmak' ifadesinden gelir. Elde tutulan şey düşmez, olduğu gibi kalır; maintain 'sürdürmek, korumak' anlamı buradan gelir. Bir görüşü elden bırakmamak da onu savunmaktır. Bu yüzden maintain akademik metinde 'ileri sürmek, savunmak' demektir: 'Critics maintain that...'.","tr_bag":"Türkçedeki 'manüel' (elle yapılan) aynı manus 'el' kökünden gelir.","tuzak":"'Scholars maintain that...' cümlesinde maintain 'sürdürmek' değil 'ileri sürmek, savunmak' demektir.","emin":"yüksek"}},{"w":"obtain","pos":"v","sub":2,"tr":"elde etmek, sağlamak","def":"to get something, especially through effort","ex":"Permission was [obtained] from all participants.","syn":["acquire","gain","secure"],"fam":["obtainable (adj)"],"col":["obtain data","obtain consent"],"ko":{"kok":"tenere","kok_anlam":"tutmak","dil":"Latince","parca":[["ob-","üzerine, karşı"],["tain (tenere)","tutmak"]],"yol":"Latince obtinere → Fransızca → İngilizce","imge":"Uzanıp bir şeyi elinde tutmak.","hikaye":"Latince obtinere, 'elde tutmak, ele geçirmek' demektir. Bir şeyi elde tutmak, ona sahip olmaktır. İngilizcede obtain 'elde etmek' anlamına yerleşti; get sözcüğünün resmî karşılığıdır. Araştırma metinlerinde veri ve sonuçlar için sık kullanılır: 'The data were obtained from...'.","tr_bag":null,"tuzak":null,"emin":"yüksek"}},{"w":"participate","pos":"v","sub":2,"tr":"katılmak","def":"to take part in an activity or event","ex":"Only 40% of young people [participated] in the last election.","syn":["take part","engage","join in"],"fam":["participation (n)","participant (n)","participatory (adj)"],"col":["participate in","political participation"],"ko":{"kok":"pars + capere","kok_anlam":"parça + almak","dil":"Latince","parca":[["parti (pars, partis)","parça, pay"],["cip (capere)","almak"],["-ate","fiil eki"]],"yol":"Latince participare → İngilizce","imge":"Ortadaki bütünden kendi payını alan biri.","hikaye":"Latince participare, 'pay almak, ortak olmak' demektir; pars 'parça' ile capere 'almak' birleşir. Bir işten pay almak, o işin içinde yer almaktır. Bugün participate 'katılmak' demektir. Araştırmalarda participant 'katılımcı' sözcüğü bu fiilden gelir.","tr_bag":"Türkçedeki 'parti' aynı pars 'parça' kökünden gelir.","tuzak":"participate 'in' ile kullanılır: 'participate in a study'; Türkçedeki '-e katılmak' yüzünden 'participate to' yazmak yanlıştır.","emin":"yüksek"}},{"w":"perceive","pos":"v","sub":2,"tr":"algılamak, fark etmek","def":"to become aware of something; to regard in a particular way","ex":"Immigrants are often [perceived] as a threat to national identity.","syn":["regard","view","recognise"],"fam":["perception (n)","perceptive (adj)","perceptible (adj)"],"col":["be perceived as","perceived risk"],"ko":{"kok":"capere","kok_anlam":"almak","dil":"Latince","parca":[["per-","tamamen, baştan başa"],["ceive (capere)","almak"]],"yol":"Latince percipere → Fransızca → İngilizce","imge":"Dışarıdaki bir şeyi bütünüyle içeri almak.","hikaye":"Latince percipere, 'tamamen almak, kavramak' demektir. Duyular dünyayı bir anlamda içeri alır. Buradan perceive hem 'algılamak' hem de 'bir şeyi belli bir biçimde görmek' anlamını taşır. Sosyal bilimlerde perception 'algı' ve 'perceived risk' gibi ifadeler bireyin öznel bakışını anlatır.","tr_bag":"Türkçedeki 'resepsiyon' da aynı capere 'almak' kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"positive","pos":"adj","sub":2,"tr":"olumlu, pozitif; kesin","def":"good or useful; expressing agreement; certain","ex":"The reform had a [positive] effect on school attendance.","syn":["favourable","beneficial","constructive"],"fam":["positively (adv)","positivism (n)"],"col":["a positive correlation","positive effect"],"ko":{"kok":"ponere","kok_anlam":"koymak","dil":"Latince","parca":[["posit (ponere, positus)","koymak, konmuş"],["-ive","sıfat eki"]],"yol":"Latince positivus → Fransızca → İngilizce","imge":"Açıkça konmuş, yerine yerleştirilmiş bir şey.","hikaye":"Latince positivus, 'konmuş, belirlenmiş' demektir ve ponere 'koymak' fiilinden gelir. Konmuş olan şey açık ve kesindir; 'I am positive' 'eminim' anlamını bu yüzden taşır. Kesin ve olumlu olan arasındaki bağ buradan kurulur. Sosyal bilimlerde positivism, bilgiyi gözlemle belirlenmiş olgulara dayandırır.","tr_bag":"Türkçedeki 'pozitif', 'pozisyon' ve 'pozitivizm' aynı ponere kökünden gelir.","tuzak":"positive yalnızca 'olumlu' değildir; 'kesin, emin' anlamı da vardır (positive evidence = kesin kanıt).","emin":"yüksek"}},{"w":"primary","pos":"adj","sub":2,"tr":"temel, birincil; ilk (öğretim)","def":"main or most important; first in time or order","ex":"The [primary] aim of the study was to test this hypothesis.","syn":["main","principal","chief"],"fam":["primarily (adv: esas olarak)"],"col":["primary school","primary source"],"ko":{"kok":"primus","kok_anlam":"ilk, birinci","dil":"Latince","parca":[["prim (primus)","ilk"],["-ary","sıfat eki"]],"yol":"Latince primarius → İngilizce","imge":"Sırada en önde duran.","hikaye":"Latince primarius, 'birinci sırada olan, başta gelen' demektir ve primus 'ilk' sözcüğünden gelir. Sırada ilk olan çoğu zaman en önemli olandır. Bu yüzden primary hem 'ilk' hem de 'temel, başlıca' anlamını taşır. Akademide primary source 'birincil kaynak', primary education 'ilköğretim' demektir.","tr_bag":"Türkçedeki 'primitif' aynı primus kökünden gelir.","tuzak":"primarily 'başlıca, esas olarak' demektir; 'ilk önce' anlamında first ya da firstly kullanılır.","emin":"yüksek"}},{"w":"purchase","pos":"v","sub":2,"tr":"satın almak","def":"to buy something","ex":"Households [purchased] fewer durable goods during the crisis.","syn":["buy","acquire","procure"],"fam":["purchase (n)","purchaser (n)"],"col":["purchasing power"],"ko":{"kok":"captiare (capere)","kok_anlam":"yakalamak (almak)","dil":"Latince","parca":[["pur- (pro-)","için, öne"],["chase (Eski Fr. chacier)","kovalamak"]],"yol":"Latince capere → Eski Fransızca purchacier → İngilizce","imge":"Bir şeyin peşine düşüp onu yakalamak.","hikaye":"Eski Fransızca purchacier, 'peşine düşmek, elde etmeye çalışmak' demekti; içindeki chacier 'kovalamak' Latince capere 'almak' köküne dayanır. Kovalanan şey sonunda ele geçer. İngilizcede purchase 'elde etmek' anlamından 'satın almak' anlamına daraldı. Bugün buy sözcüğünün resmî karşılığıdır.","tr_bag":null,"tuzak":null,"emin":"yüksek"}},{"w":"regulate","pos":"v","sub":2,"tr":"düzenlemek, denetlemek","def":"to control something by means of rules","ex":"The state [regulates] the activities of private banks.","syn":["control","govern","supervise"],"fam":["regulation (n)","regulator (n)","regulatory (adj)","deregulate (v)"],"col":["strictly regulated","regulate the market"],"ko":{"kok":"regula","kok_anlam":"cetvel, kural","dil":"Latince","parca":[["regul (regula)","cetvel, kural"],["-ate","fiil eki"]],"yol":"Geç Latince regulare → İngilizce","imge":"Çizgileri düz tutmak için kullanılan bir cetvel.","hikaye":"Latince regula 'cetvel, düz çubuk' demektir ve regere 'yönetmek, düz tutmak' fiiliyle ilişkilidir. Cetvel çizgiyi düz tutar; kural da davranışı. Regulate, bir şeyi kurallarla düzen içinde tutmak demektir. Hukuk ve kamu yönetiminde regulation 'düzenleme, yönetmelik' anlamında kullanılır.","tr_bag":"Türkçedeki 'regülasyon' aynı kelimedir.","tuzak":null,"emin":"yüksek"}},{"w":"relevant","pos":"adj","sub":2,"tr":"ilgili, konuyla bağlantılı","def":"closely connected or appropriate to the matter in hand","ex":"Only studies [relevant] to the research question were included.","syn":["pertinent","applicable","related"],"fam":["relevance (n)","irrelevant (adj)"],"col":["relevant to","highly relevant"],"ko":{"kok":"levare","kok_anlam":"kaldırmak","dil":"Latince","parca":[["re-","yeniden, geri"],["lev (levare)","kaldırmak"],["-ant","sıfat eki"]],"yol":"Latince relevare → Ortaçağ Latincesi relevans → İngilizce","imge":"Yerden bir şeyi kaldırıp ele almak.","hikaye":"Latince relevare 'kaldırmak, hafifletmek' demektir; levare fiili levis 'hafif' ile ilişkilidir. Bu 'kaldırma' anlamından 'konuyla ilgili' anlamına nasıl geçildiği kesin değildir. Bugün relevant, eldeki konuyla doğrudan bağlantılı olanı anlatır. Akademik metinde 'relevant literature' 'ilgili alanyazın' demektir.","tr_bag":"Türkçedeki 'levye' (Fr. levier) aynı levare 'kaldırmak' kökünden gelir.","tuzak":"relevant 'to' ile kullanılır: 'relevant to the study'; relative ('göreli, akraba') ile karıştırılmamalıdır.","emin":"orta"}},{"w":"reside","pos":"v","sub":2,"tr":"ikamet etmek, oturmak; bulunmak (in)","def":"to live in a particular place; to be present in","ex":"Most of the participants [resided] in rural areas.","syn":["live","dwell","inhabit"],"fam":["residence (n)","resident (n)","residential (adj)"],"col":["reside in"],"ko":{"kok":"sedere","kok_anlam":"oturmak","dil":"Latince","parca":[["re-","geri"],["side (sedere)","oturmak"]],"yol":"Latince residere → Fransızca résider → İngilizce","imge":"Bir yerde geride kalıp oturan biri.","hikaye":"Latince residere, 'geride oturmak, yerleşmek' demektir. Bir yere yerleşip kalan kişi orada yaşar. Buradan reside 'ikamet etmek' anlamını aldı; resident 'sakin' de buradandır. Soyut kullanımda reside in 'bir şeyde bulunmak, ona ait olmak' demektir: 'Power resides in the people.'","tr_bag":"Türkçedeki 'rezidans' aynı kökten gelir.","tuzak":"'The problem resides in...' cümlesinde reside 'oturmak' değil 'bulunmak, kaynaklanmak' anlamındadır.","emin":"yüksek"}},{"w":"resource","pos":"n","sub":2,"tr":"kaynak","def":"a stock or supply of money, materials or people","ex":"Poorer schools lack the [resources] to hire specialist teachers.","syn":["asset","supply","means"],"fam":["resourceful (adj: becerikli)"],"col":["natural resources","allocate resources"],"ko":{"kok":"surgere","kok_anlam":"yükselmek, kalkmak","dil":"Latince","parca":[["re-","yeniden"],["source (surgere)","yükselmek, fışkırmak"]],"yol":"Latince resurgere → Fransızca ressource → İngilizce","imge":"Yerden yeniden fışkıran bir su kaynağı.","hikaye":"Fransızca ressource, Latince resurgere 'yeniden yükselmek' fiiline dayanır. Yeniden fışkıran kaynak, zor anda başvurulacak bir çaredir. Buradan resource, kullanılabilecek her türlü varlığı anlattı. Bugün natural resources 'doğal kaynaklar' ve human resources 'insan kaynakları' bu anlamı taşır.","tr_bag":null,"tuzak":"resource kullanılabilir varlıktır (para, emek, doğal kaynak); bir bilginin geldiği yer ya da kaynakça için source kullanılır.","emin":"yüksek"}},{"w":"restrict","pos":"v","sub":2,"tr":"kısıtlamak, sınırlamak","def":"to put a limit on something","ex":"The new law [restricts] the right to protest.","syn":["limit","constrain","curb"],"fam":["restriction (n)","restrictive (adj)"],"col":["restrict access to"],"ko":{"kok":"stringere","kok_anlam":"sıkmak, bağlamak","dil":"Latince","parca":[["re-","geri"],["strict (stringere)","sıkmak, bağlamak"]],"yol":"Latince restringere → İngilizce","imge":"Bir şeyi iple sıkıca geri bağlamak.","hikaye":"Latince restringere, 'geri bağlamak, sıkıştırmak' demektir; stringere 'sıkmak' fiilinden gelir. Bağlanan şeyin hareket alanı daralır. Buradan restrict 'sınırlamak, kısıtlamak' anlamını aldı. Aynı aileden strict 'katı' ve restriction 'kısıtlama' da gelir.","tr_bag":null,"tuzak":null,"emin":"yüksek"}},{"w":"secure","pos":"v","sub":2,"tr":"sağlamak, elde etmek; güvenceye almak","def":"to succeed in obtaining something; to make safe","ex":"The project [secured] funding from the European Union.","syn":["obtain","gain","protect"],"fam":["security (n)","secure (adj: güvenli)","insecure (adj)"],"col":["secure funding","job security"],"ko":{"kok":"cura","kok_anlam":"kaygı, özen","dil":"Latince","parca":[["se-","-sız, ayrı"],["cure (cura)","kaygı"]],"yol":"Latince securus → İngilizce","imge":"Kaygıdan uzak, rahat duran biri.","hikaye":"Latince securus, 'kaygısız' demektir; se- 'ayrı' ile cura 'kaygı' birleşir. Kaygı duymamak için tehlikeden korunmuş olmak gerekir; secure 'güvenli' buradan gelir. Bir şeyi güvenceye almak, onu kesin olarak elde etmek demektir. Bu yüzden fiil olarak secure 'sağlamak, elde etmek' anlamını da taşır: secure funding.","tr_bag":null,"tuzak":"Fiil olarak secure çoğu zaman 'elde etmek, sağlamak' demektir (secure a grant); yalnızca 'korumak' diye çevrilirse anlam kaçar.","emin":"yüksek"}},{"w":"seek","pos":"v","sub":2,"tr":"aramak; çabalamak (to)","def":"to try to find or obtain; to attempt","ex":"This study [seeks] to explain why turnout is declining.","syn":["look for","pursue","attempt"],"fam":["seeker (n)"],"col":["seek to","asylum seeker"],"ko":{"kok":"secan","kok_anlam":"aramak","dil":"Germen","parca":[["seek","aramak"]],"yol":"Germen kökenli (Eski İngilizce secan)","imge":"İzleri takip ederek bir şeyin peşine düşen biri.","hikaye":"Seek, Latince değil Germen kökenli eski bir İngilizce fiildir ve Eski İngilizcede secan biçimindeydi. Temel anlamı 'aramak'tır. Aranan şey henüz elde değildir; bu yüzden seek to do 'yapmaya çalışmak' anlamını da taşır. Akademik metinde 'This study seeks to...' kalıbı çalışmanın amacını bildirir.","tr_bag":null,"tuzak":"seek düzensiz fiildir: seek - sought - sought; 'seeked' yanlıştır.","emin":"yüksek"}},{"w":"select","pos":"v","sub":2,"tr":"seçmek","def":"to choose carefully from a group","ex":"Participants were randomly [selected] from the electoral register.","syn":["choose","pick","opt for"],"fam":["selection (n)","selective (adj)"],"col":["randomly selected","natural selection"],"ko":{"kok":"legere","kok_anlam":"toplamak, seçmek","dil":"Latince","parca":[["se-","ayrı"],["lect (legere)","toplamak, seçmek"]],"yol":"Latince seligere (selectus) → İngilizce","imge":"Bir yığının içinden iyilerini ayırıp toplamak.","hikaye":"Latince seligere, 'ayırıp toplamak, seçmek' demektir; se- 'ayrı' ile legere 'toplamak' birleşir. Toplarken ayırmak, dikkatle seçmek demektir. Select, özenle yapılan seçimi anlatır. Araştırmalarda örneklem seçimi için selection, biyolojide natural selection 'doğal seçilim' terimleri buradan gelir.","tr_bag":"Türkçedeki 'elit' (Fr. élite 'seçilmiş') aynı legere kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"strategy","pos":"n","sub":2,"tr":"strateji","def":"a plan of action designed to achieve a long-term aim","ex":"The government's anti-poverty [strategy] focused on education.","syn":["plan","approach","policy"],"fam":["strategic (adj)","strategist (n)"],"col":["adopt a strategy","coping strategy"],"ko":{"kok":"strategos","kok_anlam":"ordu komutanı","dil":"Yunanca","parca":[["stratos","ordu"],["agein","yönetmek, sürmek"]],"yol":"Yunanca strategia → Fransızca stratégie → İngilizce","imge":"Orduyu önünde yürüterek yöneten bir komutan.","hikaye":"Yunanca strategos 'ordu komutanı' demektir; stratos 'ordu' ile agein 'sürmek, yönetmek' birleşir. Strategia komutanın işi, yani savaşın genel planıydı. Anlam zamanla askerî alandan çıktı. Bugün strategy, uzun vadeli bir amaca ulaşmak için yapılan plandır; öğrenme stratejileri, pazarlama stratejisi gibi.","tr_bag":"Türkçedeki 'strateji' aynı kelimedir.","tuzak":null,"emin":"yüksek"}},{"w":"survey","pos":"n","sub":2,"tr":"anket, araştırma; inceleme","def":"an investigation of opinions or behaviour by questioning people","ex":"A national [survey] of 5,000 adults was carried out in 2019.","syn":["poll","study","questionnaire"],"fam":["survey (v)"],"col":["conduct a survey","survey data"],"ko":{"kok":"videre","kok_anlam":"görmek","dil":"Latince","parca":[["sur- (super-)","üstten"],["vey (videre)","görmek"]],"yol":"Ortaçağ Latincesi supervidere → Anglo-Fransızca surveier → İngilizce","imge":"Yüksek bir yerden aşağıdaki araziyi gözden geçiren biri.","hikaye":"Survey, 'üstten bakmak' anlamındaki Ortaçağ Latincesi supervidere'den Fransızca yoluyla gelir. Yukarıdan bakan kişi her şeyi bir bütün olarak görür. Buradan survey 'genel inceleme, gözden geçirme' anlamını aldı. Sosyal bilimlerde ise pek çok kişiye soru sorarak yapılan anket araştırmasının adıdır.","tr_bag":"Türkçedeki 'vizyon' aynı videre 'görmek' kökünden gelir.","tuzak":"survey yalnızca 'anket' değildir; 'a survey of the literature' 'alanyazın taraması' demektir.","emin":"yüksek"}},{"w":"tradition","pos":"n","sub":2,"tr":"gelenek","def":"a custom or belief passed from generation to generation","ex":"Oral [tradition] preserved the history of many nomadic groups.","syn":["custom","convention","heritage"],"fam":["traditional (adj)","traditionally (adv)"],"col":["a long tradition of","oral tradition"],"ko":{"kok":"dare","kok_anlam":"vermek","dil":"Latince","parca":[["tra- (trans-)","öte, karşıya"],["dit (dare)","vermek"],["-ion","isim eki"]],"yol":"Latince traditio → Fransızca → İngilizce","imge":"Elden ele verilerek taşınan bir emanet.","hikaye":"Latince traditio 'teslim etme, aktarma' demektir ve tradere 'teslim etmek' fiilinden gelir. Bir şey elden ele verilerek sonraki kuşağa ulaşır. Böylece tradition, kuşaktan kuşağa aktarılan inanç ve görenekleri anlattı. Aynı kökten gelen treason 'ihanet' ise 'düşmana teslim etme' anlamını taşır.","tr_bag":null,"tuzak":null,"emin":"yüksek"}},{"w":"transfer","pos":"v","sub":2,"tr":"aktarmak, nakletmek","def":"to move someone or something from one place to another","ex":"Knowledge is [transferred] from one generation to the next.","syn":["move","convey","transmit"],"fam":["transfer (n)","transferable (adj)"],"col":["transfer to","technology transfer"],"ko":{"kok":"ferre","kok_anlam":"taşımak","dil":"Latince","parca":[["trans-","öte, karşıya"],["fer (ferre)","taşımak"]],"yol":"Latince transferre → İngilizce","imge":"Bir yükü bir yakadan öbür yakaya taşımak.","hikaye":"Latince transferre, 'öte yana taşımak' demektir. Taşınan şey yük, para, kişi ya da bilgi olabilir. Transfer bu yüzden geniş bir kullanıma sahiptir. Eğitim bilimlerinde transfer of learning, bir durumda öğrenilenin başka bir duruma aktarılmasıdır.","tr_bag":"Türkçedeki 'transfer' aynı kelimedir; 'referans' da aynı ferre kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"alternative","pos":"n","sub":3,"tr":"alternatif, seçenek","def":"another possibility or choice","ex":"Cooperatives offer an [alternative] to traditional firms.","syn":["option","choice","substitute"],"fam":["alternative (adj)","alternatively (adv)"],"col":["an alternative to","there is no alternative"],"ko":{"kok":"alter","kok_anlam":"öteki (ikisinden biri)","dil":"Latince","parca":[["alter","öteki"],["-n-/-ate","fiil gövdesi (alternare: sırayla değiştirmek)"],["-ive","sıfat/isim eki"]],"yol":"Latince alternare → Ortaçağ Latincesi alternativus → Fransızca → İngilizce","imge":"İki şeyden biri dururken 'öteki'ni gösteren bir el.","hikaye":"Latince alter 'ikisinden öteki' demektir; alternare ise 'sırayla birini, sonra ötekini yapmak'. Alternative, elimizdekinin yerine konabilecek 'öteki' seçenektir. Akademik metinde mevcut bir model ya da politikaya karşı önerilen başka yolu anlatır: 'an alternative to market-based solutions'.","tr_bag":"Türkçedeki 'alternatif' bu kelimenin doğrudan alıntısıdır.","tuzak":"İsimle kullanılırken edat 'to' olur: 'an alternative to X' ('alternative of X' değil).","emin":"yüksek"}},{"w":"circumstance","pos":"n","sub":3,"tr":"durum, koşul","def":"a fact or condition connected with an event or action","ex":"Under no [circumstances] should participants be identified.","syn":["condition","situation","context"],"fam":["circumstantial (adj: dolaylı)"],"col":["under the circumstances","economic circumstances"],"ko":{"kok":"stare","kok_anlam":"durmak","dil":"Latince","parca":[["circum-","etrafında"],["sta","durmak"],["-ance","isim eki (-lık)"]],"yol":"Latince circumstantia → Eski Fransızca → İngilizce","imge":"Bir olayın çevresinde duran, onu kuşatan şeyler.","hikaye":"Latince circumstantia, 'etrafta duran şey' demektir. Bir olay tek başına olmaz; onu çevreleyen koşullar anlamını belirler. Bugün circumstance, bir durumu etkileyen koşulu ya da olguyu anlatır. Akademik dilde 'under these circumstances' ve 'socio-economic circumstances' sık geçer.","tr_bag":"Türkçedeki 'istasyon' da aynı stare 'durmak' kökündendir.","tuzak":"Kalıplarda 'under/in the circumstances' kullanılır; 'on the circumstances' yanlıştır.","emin":"yüksek"}},{"w":"comment","pos":"v","sub":3,"tr":"yorum yapmak","def":"to express an opinion or reaction","ex":"Several respondents [commented] on the lack of public transport.","syn":["remark","observe","note"],"fam":["comment (n)","commentary (n)","commentator (n)"],"col":["comment on","no comment"],"ko":{"kok":"comminisci","kok_anlam":"düşünüp tasarlamak, akılda kurmak","dil":"Latince","parca":[["com-","tamamen, birlikte"],["men","akıl, zihin"]],"yol":"Latince commentum → Eski Fransızca → İngilizce","imge":"Birinin bir metnin kenarına kendi düşüncesini not etmesi.","hikaye":"Latince commentum 'akılda kurulan şey, açıklama' demektir ve zihinle ilgili bir kökten gelir. Commentarius, bir metin ya da olay üzerine tutulan açıklayıcı notlardı. Buradan 'bir konu hakkında düşünce belirtmek' anlamı çıktı. Akademik metinde comment on, katılımcıların ya da yazarların bir konudaki görüşünü aktarır.","tr_bag":null,"tuzak":"Fiil 'on' edatıyla kullanılır: 'comment on the results' ('comment the results' yanlıştır).","emin":"yüksek"}},{"w":"compensate","pos":"v","sub":3,"tr":"telafi etmek; tazminat ödemek","def":"to make up for a loss or problem; to pay someone for loss or damage","ex":"Farmers were [compensated] for land taken for the dam.","syn":["make up for","offset","reimburse"],"fam":["compensation (n)","compensatory (adj)"],"col":["compensate for","compensate someone for"],"ko":{"kok":"pendere","kok_anlam":"asmak, tartmak","dil":"Latince","parca":[["com-","birlikte, karşılıklı"],["pens","tartmak"],["-ate","fiil eki"]],"yol":"Latince compensare → İngilizce","imge":"Terazinin iki kefesini karşılıklı tartıp denkleştirmek.","hikaye":"Latince compensare, 'bir şeyi başka bir şeyle karşılıklı tartmak' demektir. Bir kefedeki eksik, öteki kefeye ağırlık konarak dengelenir. Bugün compensate, bir kaybı ya da eksikliği başka bir şeyle karşılamayı, zarar için ödeme yapmayı anlatır. Akademik metinde 'compensate for the loss of income' gibi kullanılır.","tr_bag":"Türkçedeki 'kompanzasyon' bu kelimeden, 'pansiyon' da aynı pendere 'tartmak, ödemek' kökünden gelir.","tuzak":"Kayıp için kullanılırken 'for' gerekir: 'compensate for the loss' ('compensate the loss' yanlıştır).","emin":"yüksek"}},{"w":"component","pos":"n","sub":3,"tr":"bileşen, parça","def":"a part or element of a larger whole","ex":"Trust is a core [component] of social capital.","syn":["element","part","constituent"],"fam":[],"col":["a key component of"],"ko":{"kok":"ponere","kok_anlam":"koymak","dil":"Latince","parca":[["com-","birlikte"],["pon","koymak"],["-ent","sıfat/isim eki (-an/-en)"]],"yol":"Latince componere → İngilizce","imge":"Bir bütünü kurmak için yan yana konmuş parçalar.","hikaye":"Latince componere 'bir araya koymak, birleştirmek' demektir; componens 'bir araya konan' parçadır. Bir bütün, kendisini oluşturmak için bir araya konmuş parçalardan oluşur. Akademik metinde component, bir sistemin, modelin ya da ölçeğin öğesini anlatır: 'a key component of social capital'.","tr_bag":"Türkçedeki 'kompozisyon' da aynı componere 'bir araya koymak' fiilinden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"consent","pos":"n","sub":3,"tr":"onay, rıza, izin","def":"permission for something to happen or agreement to do something","ex":"Informed [consent] was obtained from all participants.","syn":["permission","approval","agreement"],"fam":["consent (v)"],"col":["informed consent","give consent"],"ko":{"kok":"sentire","kok_anlam":"hissetmek, duyumsamak","dil":"Latince","parca":[["con-","birlikte"],["sent","hissetmek"]],"yol":"Latince consentire → Eski Fransızca → İngilizce","imge":"İki kişinin aynı şeyi hissedip aynı yöne başını sallaması.","hikaye":"Latince consentire, 'birlikte hissetmek, aynı görüşte olmak' demektir. Başkasıyla aynı şeyi hissetmek, onun istediğine razı olmaya varır. Bugün consent, bir şeyin yapılmasına verilen onay ya da izindir. Sosyal bilim araştırmalarında 'informed consent' (bilgilendirilmiş onam) temel bir etik kavramdır.","tr_bag":"Türkçedeki 'sansasyon' da aynı sentire 'hissetmek' kökünden gelir.","tuzak":"consent 'onay, izin' ile consensus 'fikir birliği' karıştırılır; ikisi de consentire'den gelir ama anlamları farklıdır.","emin":"yüksek"}},{"w":"considerable","pos":"adj","sub":3,"tr":"hatırı sayılır, önemli ölçüde","def":"notably large in size, amount or extent","ex":"There is [considerable] debate about the causes of the decline.","syn":["substantial","significant","sizeable"],"fam":["considerably (adv)"],"col":["considerable amount of","to a considerable extent"],"ko":{"kok":"considerare","kok_anlam":"dikkatle bakmak, incelemek","dil":"Latince","parca":[["con-","tamamen"],["sider","(tartışmalı) yıldız"],["-able","-ebilir, -maya değer"]],"yol":"Latince considerare → Fransızca → İngilizce","imge":"Bir şeye uzun uzun, dikkatle bakmak.","hikaye":"Latince considerare 'dikkatle bakmak, incelemek' demektir. Bunun sidus 'yıldız' ile bağlantılı olduğu sık önerilir, ama kökeni kesin değildir. Considerable, ilk olarak 'dikkate alınmaya değer' anlamındadır; buradan 'hatırı sayılır, büyük' anlamı çıkar. Akademik metinde 'considerable variation' gibi miktar ve ölçüyü vurgular.","tr_bag":null,"tuzak":"considerable 'önemli ölçüde, büyük' ile considerate 'düşünceli, saygılı' karıştırılır.","emin":"orta"}},{"w":"constant","pos":"adj","sub":3,"tr":"sabit, değişmez; sürekli","def":"remaining the same; occurring continuously","ex":"The population remained relatively [constant] over the decade.","syn":["stable","steady","continuous"],"fam":["constantly (adv)","constancy (n)"],"col":["remain constant","constant pressure"],"ko":{"kok":"stare","kok_anlam":"durmak","dil":"Latince","parca":[["con-","tamamen, sıkıca"],["sta","durmak"],["-ant","sıfat eki (-an/-en)"]],"yol":"Latince constans → Eski Fransızca → İngilizce","imge":"Yerinden kıpırdamadan sıkıca duran bir şey.","hikaye":"Latince constans, constare 'sağlam durmak' fiilinden gelir. Yerinde sıkıca duran şey değişmez; değişmeyen şey de hep oradadır. Bu yüzden constant hem 'sabit' hem 'sürekli' anlamını taşır. Araştırma dilinde 'held constant' ifadesi, bir değişkenin sabit tutulduğunu anlatır.","tr_bag":"Türkçedeki 'istasyon' da aynı stare 'durmak' kökündendir.","tuzak":"constant 'sabit, sürekli' ile consistent 'tutarlı' karıştırılır.","emin":"yüksek"}},{"w":"constrain","pos":"v","sub":3,"tr":"kısıtlamak, sınırlamak; zorlamak","def":"to limit or restrict something; to force someone to act","ex":"Economic growth was [constrained] by a lack of skilled labour.","syn":["restrict","limit","restrain"],"fam":["constraint (n)"],"col":["be constrained by","budget constraints"],"ko":{"kok":"stringere","kok_anlam":"sıkmak, sıkıca bağlamak","dil":"Latince","parca":[["con-","birlikte, sıkıca"],["strain","sıkmak, germek"]],"yol":"Latince constringere → Eski Fransızca → İngilizce","imge":"Bir şeyi iple sıkıca bağlayıp hareketini daraltmak.","hikaye":"Latince constringere, 'sıkıca bağlamak, sıkıştırmak' demektir. Bağlanan bir şey ancak sınırlı biçimde hareket edebilir. Constrain bugün bir şeyi kısıtlamayı ya da birini bir şeye zorlamayı anlatır. Akademik metinde 'constrained by limited resources' ve isim hâli constraint 'kısıt' sık geçer.","tr_bag":null,"tuzak":null,"emin":"yüksek"}},{"w":"contribute","pos":"v","sub":3,"tr":"katkıda bulunmak; neden olmak (to)","def":"to give something to help achieve a result; to help cause something","ex":"Poor housing [contributes] to health inequalities.","syn":["add to","lead to","donate"],"fam":["contribution (n)","contributor (n)"],"col":["contribute to","make a contribution"],"ko":{"kok":"tribuere","kok_anlam":"vermek, paylaştırmak","dil":"Latince","parca":[["con-","birlikte"],["tribu","vermek, paylaştırmak"],["-te","fiil eki"]],"yol":"Latince contribuere → İngilizce","imge":"Herkesin ortak bir kaba kendi payını koyması.","hikaye":"Latince contribuere, 'birlikte vermek, ortak bir şeye pay katmak' demektir. Ortak kaba konan her pay, sonucun oluşmasına yardım eder. Bu yüzden contribute hem 'katkıda bulunmak' hem 'bir sonuca yol açmak' anlamındadır. Akademik metinde 'factors that contribute to inequality' sık görülür.","tr_bag":"Türkçedeki 'distribütör' de aynı tribuere 'vermek, dağıtmak' kökündendir.","tuzak":"'to' burada edattır, ardından isim ya da -ing gelir: 'contribute to reducing' ('contribute to reduce' yanlıştır).","emin":"yüksek"}},{"w":"convene","pos":"v","sub":3,"tr":"toplanmak, toplantıya çağırmak","def":"to come or bring together for a meeting","ex":"An expert panel was [convened] to review the evidence.","syn":["assemble","gather","summon"],"fam":["convention (n: sözleşme; toplantı; gelenek)"],"col":["convene a meeting"],"ko":{"kok":"venire","kok_anlam":"gelmek","dil":"Latince","parca":[["con-","birlikte"],["ven","gelmek"]],"yol":"Latince convenire → Eski Fransızca → İngilizce","imge":"İnsanların farklı yerlerden gelip aynı noktada buluşması.","hikaye":"Latince convenire, 'bir araya gelmek' demektir. Aynı yere gelenler bir toplantı oluşturur. Convene bugün bir kurulun toplanmasını ya da toplantıya çağrılmasını anlatır: 'The committee convened to review the policy'. Aynı fiilden gelen convention hem 'toplantı' hem 'uzlaşılmış kural' anlamı taşır.","tr_bag":"Türkçedeki 'konvansiyonel' de aynı convenire fiilinden türeyen convention kelimesine dayanır.","tuzak":null,"emin":"yüksek"}},{"w":"coordinate","pos":"v","sub":3,"tr":"koordine etmek, eşgüdüm sağlamak","def":"to organise different elements so that they work together","ex":"The ministry [coordinates] the work of regional offices.","syn":["organise","integrate","harmonise"],"fam":["coordination (n)","coordinator (n)"],"col":["coordinate efforts","closely coordinated"],"ko":{"kok":"ordinare","kok_anlam":"düzenlemek, sıraya koymak","dil":"Latince","parca":[["co-","birlikte"],["ordin","sıra, düzen"],["-ate","fiil eki"]],"yol":"Ortaçağ Latincesi coordinare → İngilizce","imge":"Farklı parçaların aynı sıraya birlikte dizilmesi.","hikaye":"Kelime co- 'birlikte' ile ordinare 'sıraya koymak' parçalarından oluşur; ordo 'sıra, düzen' demektir. Birlikte sıraya koymak, parçaları aynı düzen içinde çalıştırmak demektir. Bugün coordinate, farklı kişi ya da kurumların etkinliklerini uyumlu hâle getirmeyi anlatır. Kamu yönetimi metinlerinde 'coordinate policies across ministries' gibi geçer.","tr_bag":"Türkçedeki 'koordinasyon', 'koordine etmek' ve 'koordinat' bu kelimeyle aynı kökten gelir.","tuzak":null,"emin":"yüksek"}},{"w":"core","pos":"adj","sub":3,"tr":"temel, çekirdek, ana","def":"central or most important","ex":"Equality is a [core] value of the welfare state.","syn":["central","fundamental","key"],"fam":["core (n: öz, çekirdek)"],"col":["core values","core curriculum"],"ko":{"kok":"cor (?)","kok_anlam":"yürek (önerilen, kesin değil)","dil":"Kesin değil","parca":[["core","öz, orta kısım"]],"yol":"Kökeni kesin değildir","imge":"Bir elmanın ortasındaki, çekirdekleri taşıyan sert kısım.","hikaye":"Core'un kökeni kesin değildir; Latince cor 'yürek' ile ilişkilendirilir, ama bu kanıtlanmış değildir. Kelimenin somut anlamı meyvenin ortasındaki çekirdekli kısımdır. Bir şeyin en ortasındaki kısım, onun özüdür. Akademik metinde core, 'temel, ana' anlamında sıfat gibi kullanılır: 'core values', 'core curriculum'.","tr_bag":null,"tuzak":null,"emin":"orta"}},{"w":"corporate","pos":"adj","sub":3,"tr":"kurumsal, şirketlere ait","def":"relating to a large company or group","ex":"[Corporate] taxes were cut to attract foreign investment.","syn":["business","company","commercial"],"fam":["corporation (n)"],"col":["corporate social responsibility"],"ko":{"kok":"corpus","kok_anlam":"beden, gövde","dil":"Latince","parca":[["corpor","beden"],["-ate","sıfat eki"]],"yol":"Latince corporatus → İngilizce","imge":"Birçok kişinin tek bir beden gibi birleşmesi.","hikaye":"Latince corpus 'beden' demektir; corporare 'bedene dönüştürmek', corporatus 'tek bir beden hâline gelmiş' anlamındadır. Birçok kişinin hukuken tek bir gövde gibi davranması şirket ve kurum fikrini doğurur. Bugün corporate, büyük şirketlere ya da kurumlara ait olanı anlatır: 'corporate governance', 'corporate social responsibility'.","tr_bag":"Siyaset bilimindeki 'korporatizm' terimi aynı corpus 'beden' kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"correspond","pos":"v","sub":3,"tr":"karşılık gelmek, uyuşmak; yazışmak","def":"to match or be similar to; to exchange letters","ex":"The survey results [correspond] closely with census data.","syn":["match","tally","agree"],"fam":["correspondence (n)","corresponding (adj)","correspondent (n: muhabir)"],"col":["correspond to","correspond with"],"ko":{"kok":"respondere","kok_anlam":"karşılık vermek, cevap vermek","dil":"Latince","parca":[["cor- (com-)","birlikte, karşılıklı"],["re-","geri"],["spond","söz vermek"]],"yol":"Ortaçağ Latincesi correspondere → Fransızca → İngilizce","imge":"İki tarafın birbirine karşılıklı cevap vermesi.","hikaye":"Kelime com- 'karşılıklı' ile respondere 'cevap vermek' parçalarından kurulmuştur. İki şey birbirine karşılık veriyorsa uyuşur; iki kişi karşılıklı cevap veriyorsa yazışır. İki anlam da bu imgeden çıkar. Akademik metinde 'correspond to' bir şeyin ötekine denk geldiğini gösterir: 'Each code corresponds to a theme'.","tr_bag":"Türkçedeki 'korespondan' (muhabir) aynı kelimeden gelir.","tuzak":"correspond to 'karşılık gelmek' ile correspond with 'yazışmak; uyuşmak' karıştırılır.","emin":"yüksek"}},{"w":"criteria","pos":"n","sub":3,"tr":"ölçütler, kriterler (tekil: criterion)","def":"standards by which something is judged or decided","ex":"Studies were selected according to strict [criteria].","syn":["standards","measures","benchmarks"],"fam":["criterion (tekil)"],"col":["inclusion criteria","meet the criteria"],"ko":{"kok":"krinein","kok_anlam":"ayırmak, yargılamak","dil":"Yunanca","parca":[["kri","ayırmak, yargılamak"],["-terion","araç eki"],["-a","Yunanca çoğul eki"]],"yol":"Yunanca kriterion → Latince → İngilizce","imge":"Bir şeyleri iyiyle kötü diye ayırmaya yarayan bir alet.","hikaye":"Yunanca krinein 'ayırmak, yargılamak' demektir; kriterion ise 'yargılama aracı'dır. Neyin kabul edilip neyin ayrılacağına karar vermek için bir ölçüye ihtiyaç vardır. Bugün criteria, bir değerlendirmede kullanılan ölçütlerdir. Sistematik derlemelerde 'inclusion and exclusion criteria' temel bir ifadedir.","tr_bag":"Türkçedeki 'kriter', 'kritik' ve 'kriz' aynı krinein kökünden gelir.","tuzak":"criteria çoğuldur; tekili criterion'dur: 'a criteria' ve 'this criteria' yanlıştır.","emin":"yüksek"}},{"w":"deduce","pos":"v","sub":3,"tr":"sonuç çıkarmak, çıkarsamak","def":"to reach a conclusion by reasoning from evidence","ex":"From the records, historians [deduced] that the town was abandoned.","syn":["infer","conclude","derive"],"fam":["deduction (n)","deductive (adj)"],"col":["deduce from"],"ko":{"kok":"ducere","kok_anlam":"götürmek, yönetmek","dil":"Latince","parca":[["de-","aşağı, -den"],["duc","götürmek"]],"yol":"Latince deducere → İngilizce","imge":"Bir sonucu genel bir ilkeden aşağıya doğru çekip çıkarmak.","hikaye":"Latince deducere, 'aşağı götürmek, bir yerden çekip çıkarmak' demektir. Mantıkta bu, genel bir öncülden tek bir sonuca inmeyi anlatır. Deduce bugün eldeki kanıttan akıl yoluyla sonuç çıkarmaktır: 'From these data we can deduce that...'. İsim hâli deduction 'tümdengelim'dir.","tr_bag":"Türkçedeki 'dedüksiyon' (tümdengelim) bu kelimeyle aynı kökten gelir.","tuzak":"deduce 'sonuç çıkarmak' ile deduct 'bir miktarı düşmek, kesmek' karıştırılır.","emin":"yüksek"}},{"w":"demonstrate","pos":"v","sub":3,"tr":"göstermek, kanıtlamak; gösteri yapmak","def":"to show clearly with evidence; to take part in a public protest","ex":"The study [demonstrates] a clear link between income and life expectancy.","syn":["show","prove","illustrate"],"fam":["demonstration (n)","demonstrator (n)","demonstrable (adj)"],"col":["demonstrate that"],"ko":{"kok":"monstrare","kok_anlam":"göstermek","dil":"Latince","parca":[["de-","tamamen, açıkça"],["monstr","göstermek"],["-ate","fiil eki"]],"yol":"Latince demonstrare → İngilizce","imge":"Parmakla bir şeyi açıkça işaret edip göstermek.","hikaye":"Latince demonstrare, 'açıkça göstermek, işaret etmek' demektir. Bir şeyi göstermek, onu herkesin görebileceği hâle getirmektir. Akademik metinde demonstrate, bir bulgunun kanıtla ortaya konduğunu anlatır: 'The study demonstrates a clear link...'. Kalabalığın düşüncesini açıkça göstermesi de 'gösteri yapmak' anlamını verir.","tr_bag":"Türkçedeki 'demonstrasyon' (gösteri) bu kelimeyle aynı kökten gelir.","tuzak":null,"emin":"yüksek"}},{"w":"document","pos":"n","sub":3,"tr":"belge","def":"a written or printed record of information","ex":"Official [documents] reveal the extent of the famine.","syn":["record","paper","file"],"fam":["document (v: belgelemek)","documentation (n)","documentary (n, adj)"],"col":["historical documents","well documented"],"ko":{"kok":"docere","kok_anlam":"öğretmek","dil":"Latince","parca":[["doc","öğretmek"],["-ment","isim eki (araç, sonuç)"]],"yol":"Latince documentum → Fransızca → İngilizce","imge":"Bir şeyi öğreten, kanıt olarak gösterilen bir yazı.","hikaye":"Latince documentum, docere 'öğretmek' fiilinden gelir ve 'ders, örnek, kanıt' demektir. Bir şeyi öğreten ya da kanıtlayan en güvenilir araç yazılı kayıttır. Bu yüzden kelime zamanla 'kanıt olarak kullanılan yazı' anlamına geçti. Tarih ve sosyal bilimlerde belge analizi (document analysis) bir araştırma yöntemidir.","tr_bag":"Türkçedeki 'doküman', 'doktor' ve 'doktrin' aynı docere 'öğretmek' kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"dominate","pos":"v","sub":3,"tr":"egemen olmak, hâkim olmak","def":"to have control over; to be the most important or noticeable","ex":"A few large firms [dominate] the media market.","syn":["control","prevail","govern"],"fam":["dominant (adj)","domination (n)","dominance (n)"],"col":["dominate the market","male-dominated"],"ko":{"kok":"dominus","kok_anlam":"ev sahibi, efendi","dil":"Latince","parca":[["domin","efendi"],["-ate","fiil eki"]],"yol":"Latince dominari → İngilizce","imge":"Evin efendisinin her şeye söz geçirmesi.","hikaye":"Latince dominus, domus 'ev' ile ilgilidir ve 'evin efendisi' demektir. Dominari 'efendilik etmek, hükmetmek' anlamındadır. Efendinin evde söz sahibi olması gibi, dominate bir şeyin ötekiler üzerinde hâkim olmasını anlatır. Akademik metinde hem güç ilişkileri hem de 'baskın olmak' için kullanılır: 'Men dominated the labour market'.","tr_bag":"Türkçedeki 'domine etmek' ve 'dominant' aynı kökten gelir.","tuzak":null,"emin":"yüksek"}},{"w":"emphasis","pos":"n","sub":3,"tr":"vurgu, önem","def":"special importance or attention given to something","ex":"The curriculum places great [emphasis] on critical thinking.","syn":["stress","focus","weight"],"fam":["emphasise (v)","emphatic (adj)"],"col":["place emphasis on","with emphasis on"],"ko":{"kok":"phainein","kok_anlam":"göstermek, görünür kılmak","dil":"Yunanca","parca":[["em- (en-)","içinde"],["pha","göstermek"],["-sis","isim eki"]],"yol":"Yunanca emphasis → Latince → İngilizce","imge":"Bir sözün içinde parlayıp görünen ek anlam.","hikaye":"Yunanca emphasis, emphainein 'göstermek' fiilinden gelir. Retorikte bir sözün içinde açıkça söylenmeden gösterilen anlama denirdi. Bir şeyi öne çıkarıp görünür kılmak da ona önem vermektir. Bugün emphasis, bir noktaya verilen özel önem ya da vurgudur: 'place emphasis on prevention'.","tr_bag":"Türkçedeki 'fenomen' de aynı phainein 'göstermek' kökünden gelir.","tuzak":"İsimde 'emphasis on' doğrudur, ama fiilde edat kullanılmaz: 'emphasize the point' ('emphasize on' yanlıştır).","emin":"yüksek"}},{"w":"ensure","pos":"v","sub":3,"tr":"sağlamak, garanti etmek","def":"to make certain that something happens","ex":"Anonymity was [ensured] by removing all names.","syn":["guarantee","secure","make sure"],"fam":[],"col":["ensure that"],"ko":{"kok":"securus","kok_anlam":"kaygısız, güvende","dil":"Latince","parca":[["en-","yapmak, getirmek"],["sure","emin, güvende"]],"yol":"Latince securus → Eski Fransızca seur → Anglo-Fransızca → İngilizce","imge":"Bir şeyi kaygı duyulmayacak kadar sağlama almak.","hikaye":"Latince securus 'kaygısız, güvende' demektir; Fransızcada seur 'emin' biçimini aldı. Ensure, bir şeyi 'emin hâle getirmek' demektir. Akademik metinde bir sonucun kesin olarak gerçekleşmesini sağlamayı anlatır: 'to ensure the anonymity of participants'. Aynı kökten sure ve secure de gelir.","tr_bag":"Türkçedeki 'sigorta' da aynı securus kökünden türeyen İtalyanca bir kelimeden alınmıştır.","tuzak":"ensure 'sağlamak', insure 'sigortalamak' ve assure 'birine güvence vermek' karıştırılır.","emin":"yüksek"}},{"w":"exclude","pos":"v","sub":3,"tr":"dışlamak, hariç tutmak","def":"to deny access to; to leave out","ex":"Incomplete questionnaires were [excluded] from the analysis.","syn":["omit","leave out","bar"],"fam":["exclusion (n)","exclusive (adj)","exclusively (adv)"],"col":["exclude from","social exclusion"],"ko":{"kok":"claudere","kok_anlam":"kapamak","dil":"Latince","parca":[["ex-","dışarı"],["clud","kapamak"]],"yol":"Latince excludere → İngilizce","imge":"Birini dışarıda bırakıp kapıyı kapamak.","hikaye":"Latince excludere, 'dışarıda bırakarak kapamak' demektir. Kapı kapanınca dışarıdaki içeri giremez. Exclude bugün hem birini bir gruptan dışlamayı hem bir şeyi hesaba katmamayı anlatır. Sosyal bilimlerde 'social exclusion' (toplumsal dışlanma) temel bir kavramdır.","tr_bag":"Türkçedeki 'eksklüzif' aynı excludere fiilinden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"framework","pos":"n","sub":3,"tr":"çerçeve","def":"a basic structure of ideas or rules","ex":"The study uses Bourdieu's theory as its conceptual [framework].","syn":["structure","model","scheme"],"fam":[],"col":["theoretical framework","legal framework"],"ko":{"kok":"frame + work","kok_anlam":"çatı, iskelet + yapı","dil":"Germen","parca":[["frame","çatı, iskelet"],["work","iş, yapı"]],"yol":"Germen kökenli İngilizce birleşik kelime","imge":"Bir binayı ayakta tutan kirişlerden kurulmuş iskelet.","hikaye":"Framework, frame 'çatı, iskelet' ile work 'yapı' kelimelerinden oluşur. Somut anlamı, bir yapıyı taşıyan iskelettir. İskelet nasıl binaya biçim verirse, kuramsal çerçeve de araştırmaya biçim verir. Akademik metinde 'theoretical framework' ve 'legal framework' çok sık geçer.","tr_bag":null,"tuzak":null,"emin":"yüksek"}},{"w":"fund","pos":"n","sub":3,"tr":"fon, kaynak, ödenek","def":"a sum of money saved or made available for a purpose","ex":"The International Monetary [Fund] provided emergency loans.","syn":["finance","capital","resources"],"fam":["fund (v: finanse etmek)","funding (n)"],"col":["public funds","raise funds"],"ko":{"kok":"fundus","kok_anlam":"dip, taban; arazi","dil":"Latince","parca":[["fund","dip, taban"]],"yol":"Latince fundus → Fransızca fonds → İngilizce","imge":"Bir kabın dibinde biriken, üzerine dayanılan taban.","hikaye":"Latince fundus 'dip, taban' ve 'arazi' demektir. Bir işin tabanını oluşturan, ona dayanak olan şey, zamanla biriktirilmiş para anlamına geldi. Bugün fund, belli bir amaç için ayrılmış paradır; fiil olarak 'finanse etmek' demektir. Akademik metinde 'research funds' ve 'publicly funded' sık geçer.","tr_bag":"Türkçedeki 'fon' ve 'fundamental' aynı fundus kökünden gelir.","tuzak":"fund 'finanse etmek' ile found 'kurmak' karıştırılır: 'funded by' ile 'founded in' farklıdır.","emin":"yüksek"}},{"w":"illustrate","pos":"v","sub":3,"tr":"örneklerle açıklamak, göstermek; resimlemek","def":"to explain or make clear by using examples","ex":"This case [illustrates] the limits of market reform.","syn":["demonstrate","exemplify","show"],"fam":["illustration (n)","illustrative (adj)"],"col":["illustrate the point"],"ko":{"kok":"lustrare","kok_anlam":"aydınlatmak, parlatmak","dil":"Latince","parca":[["il- (in-)","üzerine"],["lustr","aydınlatmak"],["-ate","fiil eki"]],"yol":"Latince illustrare → İngilizce","imge":"Karanlıktaki bir şeyin üzerine ışık tutmak.","hikaye":"Latince illustrare, 'aydınlatmak, ışık tutmak' demektir. Bir konuyu örnekle açıklamak, üzerine ışık tutup görünür kılmaktır. Bir metne resim eklemek de onu görsel olarak aydınlatır. Akademik metinde illustrate, genellikle bir örnek ya da tabloyla açıklamayı anlatır: 'The table illustrates the trend'.","tr_bag":"Türkçedeki 'illüstrasyon' ve 'illüstratör' bu kelimeyle aynı kökten gelir.","tuzak":null,"emin":"yüksek"}},{"w":"immigrate","pos":"v","sub":3,"tr":"göç etmek (bir ülkeye gelmek)","def":"to come to live permanently in a foreign country","ex":"Many families [immigrated] to Germany in the 1960s.","syn":["migrate","settle","move"],"fam":["immigration (n)","immigrant (n)"],"col":["immigrate to"],"ko":{"kok":"migrare","kok_anlam":"göç etmek, yer değiştirmek","dil":"Latince","parca":[["im- (in-)","içeri"],["migr","göç etmek"],["-ate","fiil eki"]],"yol":"Latince immigrare → İngilizce","imge":"Bir ülkenin kapısından içeri doğru göç eden insanlar.","hikaye":"Latince migrare 'göç etmek, yer değiştirmek' demektir; in- eki yönü 'içeri' olarak belirler. Immigrate, gelinen ülkenin bakış açısından göçtür: bir ülkeye yerleşmek için gelmek. Göç çalışmalarında immigrant 'gelen göçmen', emigrant 'giden göçmen' ayrımı önemlidir.","tr_bag":null,"tuzak":"immigrate 'bir ülkeye göç etmek' ile emigrate 'bir ülkeden göç etmek' karıştırılır.","emin":"yüksek"}},{"w":"imply","pos":"v","sub":3,"tr":"ima etmek; anlamına gelmek, gerektirmek","def":"to suggest something without saying it directly; to involve as a consequence","ex":"The findings [imply] that early intervention is effective.","syn":["suggest","indicate","entail"],"fam":["implication (n)","implicit (adj)"],"col":["imply that"],"ko":{"kok":"plicare","kok_anlam":"katlamak","dil":"Latince","parca":[["im- (in-)","içine"],["ply","katlamak"]],"yol":"Latince implicare → Eski Fransızca → İngilizce","imge":"Bir şeyi başka bir şeyin içine katlayıp sarmak.","hikaye":"Latince implicare, 'içine katlamak, sarmak' demektir. İçine katlanmış bir anlam açıkça görünmez ama oradadır. Imply de bir şeyi doğrudan söylemeden ima etmeyi ya da mantıksal olarak gerektirmeyi anlatır. Akademik metinde isim hâli implication, bir bulgunun 'doğurduğu sonuç'tur: 'policy implications'.","tr_bag":"Türkçedeki 'komplike' de aynı plicare 'katlamak' kökündendir.","tuzak":"imply 'ima etmek' (konuşan yapar) ile infer 'çıkarım yapmak' (dinleyen yapar) karıştırılır.","emin":"yüksek"}},{"w":"initial","pos":"adj","sub":3,"tr":"ilk, başlangıçtaki","def":"existing or occurring at the beginning","ex":"[Initial] results suggest that the policy is working.","syn":["first","early","preliminary"],"fam":["initially (adv)","initiate (v)"],"col":["initial stage","initial findings"],"ko":{"kok":"inire","kok_anlam":"içeri girmek, başlamak","dil":"Latince","parca":[["in-","içeri"],["i","gitmek"],["-tial","sıfat eki"]],"yol":"Latince initialis → Fransızca → İngilizce","imge":"Bir kapıdan içeri atılan ilk adım.","hikaye":"Latince initium 'başlangıç' demektir ve inire 'içeri girmek' fiilinden gelir. Bir işe girmek, ona başlamaktır. Initial, bir sürecin başındaki durumu anlatır: 'initial findings', 'initial stage'. İsim olarak bir adın baş harfi anlamına da gelir.","tr_bag":"Türkçedeki 'inisiyatif' aynı initium 'başlangıç' kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"instance","pos":"n","sub":3,"tr":"örnek, durum","def":"an example or single occurrence of something","ex":"There were several [instances] of electoral fraud.","syn":["example","case","occurrence"],"fam":[],"col":["for instance","in this instance"],"ko":{"kok":"instare","kok_anlam":"üzerinde durmak, ısrar etmek","dil":"Latince","parca":[["in-","üzerinde"],["sta","durmak"],["-ance","isim eki"]],"yol":"Latince instantia → Eski Fransızca → İngilizce","imge":"Tartışmada birinin karşı örnekle ısrarla üstüne gitmesi.","hikaye":"Latince instantia, instare 'üzerinde durmak, ısrar etmek' fiilinden gelir. Ortaçağ Latincesinin tartışma dilinde bir savı çürütmek için öne sürülen karşı örnek anlamını kazandı. Buradan genel olarak 'örnek, tek bir durum' anlamı çıktı. Akademik metinde 'for instance' ve 'in this instance' sık geçer.","tr_bag":"Türkçedeki 'enstantane' de aynı instare kökünden gelen instant kelimesine dayanır.","tuzak":null,"emin":"yüksek"}},{"w":"interact","pos":"v","sub":3,"tr":"etkileşimde bulunmak","def":"to communicate or act with each other; to influence each other","ex":"Children learn norms by [interacting] with their peers.","syn":["communicate","engage","relate"],"fam":["interaction (n)","interactive (adj)"],"col":["interact with","social interaction"],"ko":{"kok":"agere","kok_anlam":"yapmak, harekete geçirmek","dil":"Latince","parca":[["inter-","arasında"],["act","yapmak, eylem"]],"yol":"Latince kökenli parçalarla İngilizcede kurulmuş","imge":"İki tarafın arasında gidip gelen eylemler.","hikaye":"Kelime inter- 'arasında' ile act 'eylem' parçalarından oluşur; act, Latince agere 'yapmak' fiilinden gelir. İki taraf arasında karşılıklı eylem olduğunda biri ötekini etkiler. Interact bugün insanların iletişim kurmasını ya da değişkenlerin birbirini etkilemesini anlatır. İstatistikte 'interaction effect' (etkileşim etkisi) önemli bir terimdir.","tr_bag":"Türkçedeki 'interaktif', 'aktif' ve 'aksiyon' aynı agere kökünden gelir.","tuzak":"Karşılıklılık zaten fiilin içindedir: 'interact with each other' doğrudur, 'interact each other' yanlıştır.","emin":"yüksek"}},{"w":"justify","pos":"v","sub":3,"tr":"haklı çıkarmak, gerekçelendirmek","def":"to show or prove to be right or reasonable","ex":"The government struggled to [justify] the cuts.","syn":["defend","vindicate","warrant"],"fam":["justification (n)","justifiable (adj)","unjustified (adj)"],"col":["justify the decision"],"ko":{"kok":"justus","kok_anlam":"doğru, haklı","dil":"Latince","parca":[["just","doğru, haklı"],["-ify (facere)","yapmak"]],"yol":"Latince justificare → Fransızca → İngilizce","imge":"Bir davranışın önüne 'doğru' damgası basıp onu haklı kılmak.","hikaye":"Latince justificare, justus 'doğru, haklı' ile facere 'yapmak' parçalarından oluşur ve 'haklı kılmak' demektir. Bir kararı haklı kılmak için gerekçe göstermek gerekir. Bugün justify, bir seçimin ya da iddianın makul olduğunu gerekçelerle göstermektir. Akademik metinde 'justify the choice of method' sık geçer.","tr_bag":null,"tuzak":null,"emin":"yüksek"}},{"w":"layer","pos":"n","sub":3,"tr":"katman, tabaka","def":"a level of something that lies over or under another","ex":"Society is made up of several [layers] of social class.","syn":["level","stratum","tier"],"fam":["layer (v)"],"col":["a layer of","multi-layered"],"ko":{"kok":"lay","kok_anlam":"koymak, sermek, yatırmak","dil":"Germen","parca":[["lay","koymak, sermek"],["-er","isim eki"]],"yol":"Germen kökenli İngilizce","imge":"Üst üste serilmiş kat kat örtüler.","hikaye":"Layer, lay 'koymak, sermek' fiilinden -er ekiyle türemiştir. Üst üste serilen her şey bir kat oluşturur. Bugün layer, somut olarak katmanı, soyut olarak bir yapının düzeylerinden birini anlatır. Sosyal bilimlerde 'layers of meaning' ya da 'a layer of bureaucracy' gibi mecazlı kullanılır.","tr_bag":null,"tuzak":null,"emin":"yüksek"}},{"w":"link","pos":"n","sub":3,"tr":"bağlantı, bağ","def":"a relationship or connection between things","ex":"Researchers found a strong [link] between education and voting.","syn":["connection","relationship","association"],"fam":["link (v)"],"col":["a link between","linked to"],"ko":{"kok":"hlenkr","kok_anlam":"zincir halkası","dil":"Germen (İskandinav)","parca":[["link","zincir halkası"]],"yol":"Eski İskandinav dilinden → İngilizce","imge":"Bir zincirde iki halkayı birbirine bağlayan halka.","hikaye":"Link, İskandinav kökenli bir kelimedir ve somut anlamı 'zincir halkası'dır. Halka iki parçayı birbirine bağlar; buradan 'bağ, bağlantı' anlamı çıkar. Akademik metinde link, iki olgu arasındaki ilişkiyi anlatır: 'a link between poverty and health'. Bu ilişki her zaman nedensel değildir.","tr_bag":"Türkçede internet bağlamında kullanılan 'link' bu kelimenin alıntısıdır.","tuzak":null,"emin":"yüksek"}},{"w":"locate","pos":"v","sub":3,"tr":"yerini bulmak; yerleştirmek","def":"to find the exact position of; to situate in a place","ex":"The archive is [located] in the city centre.","syn":["find","position","situate"],"fam":["location (n)"],"col":["be located in"],"ko":{"kok":"locus","kok_anlam":"yer","dil":"Latince","parca":[["loc","yer"],["-ate","fiil eki"]],"yol":"Latince locare → İngilizce","imge":"Haritada bir şeyin yerini parmakla göstermek.","hikaye":"Latince locus 'yer' demektir; locare ise 'bir yere koymak, yerleştirmek' anlamındadır. İngilizcede önce 'yerleştirmek', sonra 'yerini bulmak' anlamı öne çıktı. Bugün iki anlam da kullanılır: 'The school is located in a rural area' ve 'locate relevant sources'.","tr_bag":"Türkçedeki 'lokal' ve 'lokasyon' aynı locus 'yer' kökünden gelir.","tuzak":"'Bir yerde bulunmak' için edilgen kullanılır: 'The city is located in the east' ('The city locates in' yanlıştır).","emin":"yüksek"}},{"w":"maximise","pos":"v","sub":3,"tr":"en üst düzeye çıkarmak","def":"to make something as large or great as possible","ex":"Firms aim to [maximise] profits.","syn":["increase","optimise","boost"],"fam":["maximum (n, adj)","maximisation (n)","US: maximize"],"col":["maximise profit"],"ko":{"kok":"maximus","kok_anlam":"en büyük","dil":"Latince","parca":[["maxim","en büyük"],["-ise","fiil eki (-leştirmek)"]],"yol":"Latince maximus → İngilizce","imge":"Bir şeyi olabilecek en büyük boyuta şişirmek.","hikaye":"Latince maximus, magnus 'büyük' kelimesinin en üstünlük biçimidir ve 'en büyük' demektir. Maximise, bir şeyi en büyük hâline getirmektir. Ekonomide ve karar kuramında temel bir fiildir: 'Firms seek to maximise profit'. Amerikan yazımında maximize biçimindedir.","tr_bag":"Türkçedeki 'maksimum' aynı maximus 'en büyük' kelimesinden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"minor","pos":"adj","sub":3,"tr":"küçük, önemsiz; ikincil","def":"lesser in importance, seriousness or size","ex":"Only [minor] changes were made to the questionnaire.","syn":["slight","small","secondary"],"fam":["minority (n: azınlık)","minor (n: reşit olmayan)"],"col":["a minor role","ethnic minority"],"ko":{"kok":"minor","kok_anlam":"daha küçük","dil":"Latince","parca":[["min","küçük"],["-or","karşılaştırma eki (daha)"]],"yol":"Latince minor → İngilizce","imge":"Yan yana konmuş iki şeyden daha küçük olanı.","hikaye":"Latince minor 'daha küçük' demektir ve karşılaştırma bildirir. Karşısındakinden küçük olan şey, genellikle daha az önemli sayılır. Minor bu yüzden 'küçük, önemsiz, ikincil' anlamındadır: 'minor changes'. Hukuk dilinde isim olarak 'reşit olmayan kişi' anlamına da gelir.","tr_bag":"Türkçedeki 'minör' (müzik) ve 'minimum' aynı kökten gelir.","tuzak":"Hukuk metinlerinde isim olarak geçen minor 'reşit olmayan kişi' anlamındadır, 'önemsiz' diye çevrilmemelidir.","emin":"yüksek"}},{"w":"negate","pos":"v","sub":3,"tr":"geçersiz kılmak, etkisiz hâle getirmek; inkâr etmek","def":"to cancel the effect of; to deny the existence of","ex":"Rising prices [negated] the benefits of the wage increase.","syn":["cancel out","nullify","invalidate"],"fam":["negation (n)","negative (adj)"],"col":["negate the effect of"],"ko":{"kok":"negare","kok_anlam":"hayır demek, inkâr etmek","dil":"Latince","parca":[["neg","hayır demek"],["-ate","fiil eki"]],"yol":"Latince negare → İngilizce","imge":"Bir şeye başını sallayıp 'hayır' demek.","hikaye":"Latince negare 'hayır demek, inkâr etmek' demektir. Bir şeye hayır demek, onun varlığını ya da geçerliliğini reddetmektir. Negate bugün bir şeyin etkisini ortadan kaldırmayı da anlatır: 'Rising costs negated the benefits of the reform'. Mantıkta 'negation' olumsuzlamadır.","tr_bag":"Türkçedeki 'negatif' aynı negare kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"outcome","pos":"n","sub":3,"tr":"sonuç","def":"the way something turns out; a consequence","ex":"Educational [outcomes] vary widely between regions.","syn":["result","consequence","effect"],"fam":[],"col":["the outcome of","health outcomes"],"ko":{"kok":"out + come","kok_anlam":"dışarı + gelmek","dil":"Germen","parca":[["out","dışarı"],["come","gelmek"]],"yol":"Germen kökenli İngilizce birleşik kelime","imge":"Bir sürecin sonunda dışarı çıkıp görünen şey.","hikaye":"Outcome, out 'dışarı' ile come 'gelmek' kelimelerinden oluşur. Bir süreç işledikten sonra dışarı çıkan şey onun sonucudur. Akademik metinde outcome, bir müdahalenin ya da olayın sonucunu anlatır: 'educational outcomes', 'health outcomes'. Araştırma tasarımında 'outcome variable' bağımlı değişken anlamına gelir.","tr_bag":null,"tuzak":null,"emin":"yüksek"}},{"w":"partner","pos":"n","sub":3,"tr":"ortak, eş","def":"a person or organisation that shares in an activity","ex":"Germany is one of Turkey's largest trading [partners].","syn":["associate","ally","collaborator"],"fam":["partnership (n)","partner (v)"],"col":["trading partner","social partners"],"ko":{"kok":"pars","kok_anlam":"parça, pay","dil":"Latince","parca":[["part","pay, parça"],["-ner","kişi eki"]],"yol":"Latince pars → Anglo-Fransızca parcener → İngilizce (part etkisiyle)","imge":"Bir mirası ya da işi paylaşan iki kişi.","hikaye":"Partner, Anglo-Fransızca parcener 'mirasa ortak olan' kelimesinin part etkisiyle değişmiş biçimi olarak açıklanır. Kök, Latince pars 'pay, parça'dır. Payı olan kişi, işe ortak olan kişidir. Bugün partner, bir etkinliği paylaşan kişi ya da kurumu anlatır: 'social partners', 'trading partners'.","tr_bag":"Türkçedeki 'partner' ve 'parti' aynı pars kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"philosophy","pos":"n","sub":3,"tr":"felsefe; yaklaşım","def":"the study of the nature of knowledge and existence; a set of guiding beliefs","ex":"The school's [philosophy] emphasises learning through play.","syn":["thinking","ideology","principles"],"fam":["philosopher (n)","philosophical (adj)"],"col":["political philosophy"],"ko":{"kok":"sophia","kok_anlam":"bilgelik","dil":"Yunanca","parca":[["philo-","seven"],["soph","bilgelik"],["-y","isim eki"]],"yol":"Yunanca philosophia → Latince → Fransızca → İngilizce","imge":"Bilgeliğe tutkun, onu arayan bir insan.","hikaye":"Yunanca philosophia, philos 'seven' ile sophia 'bilgelik' kelimelerinden oluşur ve 'bilgelik sevgisi' demektir. Bilgeliği seven, varlık ve bilgi üzerine düşünür. Bugün philosophy hem bir bilim dalını hem bir yol gösterici yaklaşımı anlatır: 'the philosophy of the welfare state'.","tr_bag":"Türkçedeki 'felsefe' Arapça aracılığıyla bu Yunanca kelimeden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"physical","pos":"adj","sub":3,"tr":"fiziksel, bedensel","def":"relating to the body or to material things","ex":"Poverty affects both [physical] and mental health.","syn":["bodily","material","tangible"],"fam":["physically (adv)"],"col":["physical activity","physical environment"],"ko":{"kok":"physis","kok_anlam":"doğa","dil":"Yunanca","parca":[["phys","doğa"],["-ic","sıfat eki"],["-al","sıfat eki"]],"yol":"Yunanca physis → Latince → İngilizce","imge":"Büyüyen, var olan somut doğa.","hikaye":"Yunanca physis, phyein 'büyümek, var olmak' fiilinden gelir ve 'doğa' demektir. Doğaya ait olan şey maddedir, dokunulabilir. Physical bu yüzden hem 'maddi' hem 'bedensel' anlamındadır. Akademik metinde 'physical health' ve 'physical environment' sık geçer; mental ya da sosyal olanın karşısına konur.","tr_bag":"Türkçedeki 'fizik' ve 'fizyoloji' aynı physis 'doğa' kökünden gelir.","tuzak":"physician 'doktor' demektir, 'fizikçi' ise physicist'tir.","emin":"yüksek"}},{"w":"proportion","pos":"n","sub":3,"tr":"oran, pay; orantı","def":"a part or share of a whole; the relationship between quantities","ex":"A large [proportion] of the population lives in cities.","syn":["share","percentage","ratio"],"fam":["proportional (adj)","proportionate (adj)","disproportionate (adj)"],"col":["in proportion to","a high proportion of"],"ko":{"kok":"portio","kok_anlam":"pay, hisse","dil":"Latince","parca":[["pro-","göre, için"],["port","pay"],["-ion","isim eki"]],"yol":"Latince pro portione → proportio → Fransızca → İngilizce","imge":"Herkese payına göre bölüştürülmüş bir yemek.","hikaye":"Latince pro portione 'paya göre, payına düşen oranda' demektir; buradan proportio 'oran' oluştu. Bir bütünün payına düşen kısmı, onun oranıdır. Bugün proportion hem bir bütünün payını hem nicelikler arası ilişkiyi anlatır: 'a large proportion of respondents', 'in proportion to income'.","tr_bag":"Türkçedeki 'porsiyon' aynı portio 'pay' kelimesinden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"publish","pos":"v","sub":3,"tr":"yayımlamak","def":"to prepare and issue a book, article or report for the public","ex":"The findings were [published] in 2021.","syn":["issue","release","print"],"fam":["publication (n)","publisher (n)"],"col":["publish results"],"ko":{"kok":"publicus","kok_anlam":"halka ait","dil":"Latince","parca":[["publ","halk"],["-ish","fiil eki (Fransızca -iss- gövdesinden)"]],"yol":"Latince publicare → Eski Fransızca → İngilizce","imge":"Bir yazıyı halkın görebileceği meydana asmak.","hikaye":"Latince publicare, publicus 'halka ait' kelimesinden gelir ve 'halka açmak, herkese duyurmak' demektir. Bir metni basıp dağıtmak da onu halka açmaktır. Bugün publish, kitap, makale ya da rapor yayımlamayı anlatır. Akademide 'publish or perish' deyimi yayın baskısını özetler.","tr_bag":null,"tuzak":null,"emin":"yüksek"}},{"w":"react","pos":"v","sub":3,"tr":"tepki vermek","def":"to respond to something in a particular way","ex":"Markets [reacted] nervously to the election result.","syn":["respond","reply","behave"],"fam":["reaction (n)","reactive (adj)","reactionary (adj: gerici)"],"col":["react to","react against"],"ko":{"kok":"agere","kok_anlam":"yapmak, harekete geçirmek","dil":"Latince","parca":[["re-","geri, karşı"],["act","yapmak, eylem"]],"yol":"Latince kökenli parçalarla kurulmuş","imge":"Bir itişe karşı geri itmek.","hikaye":"Kelime re- 'geri, karşı' ile act 'eylem' parçalarından oluşur; act, Latince agere 'yapmak' fiilinden gelir. Bir eyleme karşı geri dönen eylem, tepkidir. React bugün bir olaya belli bir biçimde karşılık vermeyi anlatır: 'How did voters react to the reform?'. Kimyada 'tepkimeye girmek' anlamındadır.","tr_bag":"Türkçedeki 'reaksiyon' ve 'reaktör' aynı kökten gelir.","tuzak":"Nesne 'to' ile gelir: 'react to the news' ('react the news' yanlıştır).","emin":"yüksek"}},{"w":"register","pos":"v","sub":3,"tr":"kaydolmak, kaydetmek","def":"to enter one's name on an official list","ex":"Only 60% of eligible voters were [registered].","syn":["enrol","record","sign up"],"fam":["register (n)","registration (n)","registry (n)"],"col":["register for","registered voters"],"ko":{"kok":"gerere","kok_anlam":"taşımak, yürütmek","dil":"Latince","parca":[["re-","geri"],["gest/gist","taşımak"],["-er","isim eki"]],"yol":"Latince regerere → Ortaçağ Latincesi registrum → Eski Fransızca → İngilizce","imge":"Olup biteni geri getirip deftere geçiren bir kâtip.","hikaye":"Latince regerere 'geri getirmek, kaydetmek' demektir; regesta 'kayıtlar' bu fiilden gelir. Ortaçağ Latincesinde registrum 'kayıt defteri' oldu. Fiil olarak register, bir adı resmî bir listeye geçirmek, kaydolmaktır. Dilbilimde isim olarak 'dil düzeyi, üslup' anlamına da gelir.","tr_bag":null,"tuzak":null,"emin":"yüksek"}},{"w":"rely","pos":"v","sub":3,"tr":"güvenmek, bel bağlamak (on)","def":"to depend on someone or something with trust","ex":"Many rural households [rely] on remittances from abroad.","syn":["depend","count on","trust"],"fam":["reliable (adj)","reliability (n)","reliance (n)"],"col":["rely on","heavily rely on"],"ko":{"kok":"religare","kok_anlam":"sıkıca bağlamak","dil":"Latince","parca":[["re-","geri, sıkıca"],["ly (ligare)","bağlamak"]],"yol":"Latince religare → Eski Fransızca relier → İngilizce","imge":"Bir şeye iple sıkıca bağlanmak.","hikaye":"Kelime Eski Fransızca relier 'bağlamak' üzerinden Latince religare 'sıkıca bağlamak' fiiline dayanır. Bir şeye bağlı olan, ona dayanır. 'Güvenmek' anlamına nasıl geçtiği tam açık değildir. Bugün rely on, birine ya da bir şeye bel bağlamaktır: 'Many households rely on remittances'.","tr_bag":"Türkçedeki 'lig' de aynı ligare 'bağlamak' kökünden gelir.","tuzak":"Fiil 'on/upon' ile kullanılır: 'rely on data' ('rely to' ya da 'rely data' yanlıştır).","emin":"orta"}},{"w":"remove","pos":"v","sub":3,"tr":"kaldırmak, çıkarmak","def":"to take something away from a place; to get rid of","ex":"Trade barriers were gradually [removed].","syn":["eliminate","take away","abolish"],"fam":["removal (n)"],"col":["remove barriers"],"ko":{"kok":"movere","kok_anlam":"hareket ettirmek","dil":"Latince","parca":[["re-","geri, uzağa"],["move","hareket ettirmek"]],"yol":"Latince removere → Eski Fransızca → İngilizce","imge":"Bir şeyi yerinden alıp uzağa taşımak.","hikaye":"Latince removere, 'uzağa hareket ettirmek, geri çekmek' demektir. Bir şeyi yerinden uzaklaştırmak, onu ortadan kaldırmaktır. Remove bugün bir şeyi çıkarmayı ya da gidermeyi anlatır: 'remove barriers to education'. Veri analizinde 'remove outliers' uç değerleri çıkarmak demektir.","tr_bag":"Türkçedeki 'motor', 'mobil' ve 'motivasyon' aynı movere 'hareket ettirmek' kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"scheme","pos":"n","sub":3,"tr":"plan, program, düzen","def":"a systematic plan or arrangement for achieving a purpose","ex":"A pension [scheme] was introduced for agricultural workers.","syn":["plan","programme","system"],"fam":["scheme (v: entrika çevirmek)"],"col":["pension scheme","government scheme"],"ko":{"kok":"skhema","kok_anlam":"biçim, şekil, duruş","dil":"Yunanca","parca":[["skhem","biçim"]],"yol":"Yunanca skhema → Latince schema → İngilizce","imge":"Bir şeyin ana hatlarını gösteren kaba bir çizim.","hikaye":"Yunanca skhema 'biçim, şekil, duruş' demektir. Bir şeyin genel biçimini çizmek, onun planını yapmaktır. Scheme bugün bir amaca ulaşmak için düzenlenmiş plan ya da programdır: 'a pension scheme'. Aynı Yunanca kelime schema olarak psikolojide 'şema' terimini verir.","tr_bag":"Türkçedeki 'şema' aynı skhema kelimesinden gelir.","tuzak":"İngiliz İngilizcesinde scheme tarafsız 'program' anlamındadır; Amerikan kullanımında sık sık 'entrika, dolap' çağrışımı taşır.","emin":"yüksek"}},{"w":"sequence","pos":"n","sub":3,"tr":"sıra, dizi","def":"a particular order in which related events follow each other","ex":"Events are presented in chronological [sequence].","syn":["order","series","succession"],"fam":["sequential (adj)","sequence (v)"],"col":["in sequence","a sequence of events"],"ko":{"kok":"sequi","kok_anlam":"izlemek, arkasından gitmek","dil":"Latince","parca":[["sequ","izlemek"],["-ence","isim eki"]],"yol":"Latince sequentia → Fransızca → İngilizce","imge":"Birbirinin arkasından yürüyen bir sıra insan.","hikaye":"Latince sequi 'arkasından gitmek, izlemek' demektir; sequentia 'ardı ardına gelen' anlamındadır. Birbirini izleyen şeyler bir sıra oluşturur. Sequence bugün olayların ya da öğelerin belli bir sıradaki dizisini anlatır: 'the sequence of events'. Aynı kökten consequence 'sonuç' ve subsequent 'sonraki' gelir.","tr_bag":"Türkçedeki 'sekans' (sinemada) aynı kelimeden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"shift","pos":"n","sub":3,"tr":"değişim, kayma; vardiya","def":"a change in position, direction or tendency; a period of work","ex":"There has been a [shift] in public attitudes towards immigration.","syn":["change","move","transition"],"fam":["shift (v)"],"col":["a shift in","night shift"],"ko":{"kok":"sciftan","kok_anlam":"düzenlemek, bölüştürmek","dil":"Germen","parca":[["shift","düzenlemek, bölüştürmek"]],"yol":"Eski İngilizce sciftan → İngilizce","imge":"Bir işin zamanını parçalara bölüp sırayla dağıtmak.","hikaye":"Eski İngilizce sciftan 'düzenlemek, bölüştürmek' demektir. 'Vardiya' anlamı, işin zaman dilimlerine bölünmesine uyar. 'Değişim, kayma' anlamına nasıl geçtiğinin ayrıntıları açık değildir. Akademik metinde shift, bir eğilim ya da yaklaşımdaki değişimi anlatır: 'a paradigm shift', 'a shift in public opinion'.","tr_bag":null,"tuzak":null,"emin":"orta"}},{"w":"specify","pos":"v","sub":3,"tr":"belirtmek, açıkça belirlemek","def":"to identify clearly and definitely","ex":"The law [specifies] the conditions for citizenship.","syn":["state","define","stipulate"],"fam":["specification (n)","specific (adj)"],"col":["unless otherwise specified"],"ko":{"kok":"species","kok_anlam":"görünüş, tür","dil":"Latince","parca":[["speci","tür, görünüş"],["-fy (facere)","yapmak"]],"yol":"Ortaçağ Latincesi specificare → Fransızca → İngilizce","imge":"Bir şeyin hangi türden olduğunu tek tek adını koyarak göstermek.","hikaye":"Latince species, specere 'bakmak' fiilinden gelir ve 'görünüş, tür' demektir. Specificare, bir şeyin türünü belirlemek, onu ayırt edilebilir kılmaktır. Specify bugün bir şeyi açık ve kesin olarak belirtmektir: 'specify the research question'. İstatistikte 'model specification' modelin kurulmasıdır.","tr_bag":"Türkçedeki 'spesifik' aynı species kökünden gelir.","tuzak":null,"emin":"yüksek"}},{"w":"sufficient","pos":"adj","sub":3,"tr":"yeterli","def":"enough for a particular purpose","ex":"There was not [sufficient] evidence to support the claim.","syn":["adequate","enough","ample"],"fam":["sufficiency (n)","insufficient (adj)","sufficiently (adv)"],"col":["sufficient evidence"],"ko":{"kok":"sufficere","kok_
